# One fixture instance per pod. The pod needs nothing from its node: no host
# namespace, hostPath, NET_ADMIN or BPF. galactic-edge creates its packet
# devices in the pod's own network namespace; the lab's device plugin gives
# it /dev/net/tun.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masque-provider
  labels:
    app.kubernetes.io/name: masque-provider
spec:
  replicas: 1
  # Two live instances of one pod template would claim the same routes in
  # turn, so the old pod stops before its replacement starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: masque-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: masque-provider
    spec:
      serviceAccountName: edge-provider
      # SIGTERM ends the sessions, releases the routes and deletes the
      # attachments; the fixture gives that 20 seconds.
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: galactic.datumapis.com/node
                    operator: In
                    values:
                      - edge
                  - key: galactic.datumapis.com/edge
                    operator: In
                    values:
                      - enabled
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: masque-provider
          image: masque-provider:latest
          imagePullPolicy: Never
          ports:
            - name: connect-ip
              containerPort: 8443
              protocol: UDP
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            limits:
              devic.es/tun: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/masque
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: masque-config
            items:
              - key: config.yaml
                path: config.yaml
              - key: tls.crt
                path: tls/tls.crt
              - key: tls.key
                path: tls/tls.key
