# Privileges the rendered manifests beside this file grant, checked by
# hack/check-privileges in task test:manifests. Review every change.
# Regenerate with check-privileges -write, then task lint-fix.
#
# galactic-worker with routed links: NET_ADMIN and BPF as in the other
# placements, plus what a routed link's pod end needs. SYS_PTRACE lets
# Worker open a pod's /proc/<pid>/ns/net, which the kernel's ptrace access
# check refuses for another user's process; SYS_ADMIN lets it enter that
# namespace (setns) to set the pod end up. The API refuses
# allowPrivilegeEscalation: false beside SYS_ADMIN, so the container allows
# it.
bindings:
  ClusterRoleBinding/galactic-cni:
    - ServiceAccount/galactic-system/galactic-cni -> ClusterRole/galactic-cni
  ClusterRoleBinding/galactic-gateway:
    - ServiceAccount/galactic-system/galactic-gateway -> ClusterRole/galactic-gateway
  ClusterRoleBinding/galactic-nat:
    - ServiceAccount/galactic-system/galactic-nat -> ClusterRole/galactic-nat
  ClusterRoleBinding/galactic-router:
    - ServiceAccount/galactic-system/galactic-router -> ClusterRole/galactic-router
  ClusterRoleBinding/galactic-worker:
    - ServiceAccount/galactic-system/galactic-worker -> ClusterRole/galactic-worker
  RoleBinding/galactic-system/galactic-worker:
    - ServiceAccount/galactic-system/galactic-worker -> Role/galactic-worker
