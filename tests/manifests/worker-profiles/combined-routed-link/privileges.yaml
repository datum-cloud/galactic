workerAllowlist:
  galactic-system/galactic-gateway:
    - fabric.srv6
    - local.tap
  galactic-system/galactic-nat:
    - fabric.srv6
    - local.veth_pair
  galactic-system/galactic-router:
    - fabric.routes
workloads:
  DaemonSet/galactic-system/galactic-cni:
    containers:
      credential-refresh:
        capabilities:
          - BPF
          - NET_ADMIN
          - NET_RAW
          - PERFMON
          - SYS_ADMIN
        dropsAll: true
        hostPaths:
          - /etc/cni/net.d:rw
          - /run/galactic:rw
          - /sys/fs/bpf:rw
          - /var/lib/cni/galactic-vrf:rw
          - /var/lib/cni/ra:rw
          - /var/lib/galactic-edge/ownership:rw
          - /var/lib/galactic:rw
          - /var/log/galactic:rw
        runAsGroup: image
        runAsUser: "0"
      install-cni:
        dropsAll: true
        hostPaths:
          - /etc/cni/net.d:rw
          - /opt/cni/bin:rw
          - /var/lib/galactic:rw
          - /var/log/galactic:rw
        runAsGroup: image
        runAsUser: "0"
    hostNetwork: true
  DaemonSet/galactic-system/galactic-gateway:
    containers:
      galactic-gateway:
        capabilities:
          - BPF
          - NET_ADMIN
          - PERFMON
        dropsAll: true
        hostPaths:
          - /proc/sys/net:rw
          - /run/galactic-worker:rw
          - /sys/fs/bpf:rw
        runAsGroup: image
        runAsUser: "0"
    hostNetwork: true
  DaemonSet/galactic-system/galactic-nat:
    containers:
      galactic-nat:
        capabilities:
          - BPF
          - NET_ADMIN
          - PERFMON
        dropsAll: true
        hostPaths:
          - /proc/sys/net:rw
          - /sys/fs/bpf:rw
        runAsGroup: image
        runAsUser: "0"
    hostNetwork: true
  DaemonSet/galactic-system/galactic-router:
    containers:
      galactic-router:
        capabilities:
          - BPF
          - NET_ADMIN
        dropsAll: true
        hostPaths:
          - /run/galactic-router:rw
          - /run/galactic-worker:rw
          - /sys/fs/bpf:rw
          - /var/lib/cni:rw
          - /var/lib/galactic-edge/ownership:rw
          - /var/run/netns
        runAsGroup: image
        runAsUser: "0"
    hostNetwork: true
  DaemonSet/galactic-system/galactic-router-rr:
    containers:
      galactic-router:
        capabilities:
          - BPF
          - NET_ADMIN
        dropsAll: true
        hostPaths:
          - /run/galactic-router:rw
          - /run/galactic-worker:rw
          - /sys/fs/bpf:rw
          - /var/lib/cni:rw
          - /var/lib/galactic-edge/ownership:rw
          - /var/run/netns
        runAsGroup: image
        runAsUser: "0"
    hostNetwork: true
  DaemonSet/galactic-system/galactic-worker:
    containers:
      galactic-worker:
        allowPrivilegeEscalation: true
        capabilities:
          - BPF
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_PTRACE
        dropsAll: true
        hostPaths:
          - /run/galactic-worker:rw
          - /run/galactic:rw
          - /sys/fs/bpf:rw
          - /var/lib/cni/galactic-vrf:rw
          - /var/lib/galactic-edge/ownership:rw
          - /var/lib/galactic-worker:rw
          - /var/run/netns
        runAsGroup: "65441"
        runAsUser: "0"
    hostNetwork: true
    hostPID: true
