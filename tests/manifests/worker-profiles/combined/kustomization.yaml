# The combined Worker placement, config/galactic-worker/base with the
# combined Component, composed with the components it runs beside and pinned
# to the integration branch's moving image tag. A deployment pins
# v0.0.0-<short-sha> instead (docs/worker/branch-workflow.md) and sets its own
# uplink names. task test:manifests renders it, and hack/check-privileges
# compares every container and role it grants with privileges.yaml beside it.
resources:
  - ../../../../config/galactic-system
  - ../../../../config/galactic-cni
  - ../../../../config/galactic-router
  - ../../../../config/galactic-worker
  - ../../../../config/galactic-worker/base
  - ../../../../config/galactic-nat
  - ../../../../config/galactic-nat/base
  - ../../../../config/galactic-gateway
  - ../../../../config/galactic-gateway/base
components:
  - ../../../../config/galactic-worker/profiles/combined
patches:
  # The gateway's public uplink is per deployment; the fixture names one.
  - target:
      kind: DaemonSet
      name: galactic-gateway
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: GALACTIC_GATEWAY_PUBLIC_INTERFACE
          value: bond0
images:
  - name: ghcr.io/datum-cloud/galactic-cni
    newTag: v0.0.0-integration-galactic-worker
  - name: ghcr.io/datum-cloud/galactic-router
    newTag: v0.0.0-integration-galactic-worker
  - name: ghcr.io/datum-cloud/galactic-worker
    newTag: v0.0.0-integration-galactic-worker
  - name: ghcr.io/datum-cloud/galactic-nat
    newTag: v0.0.0-integration-galactic-worker
  - name: ghcr.io/datum-cloud/galactic-gateway
    newTag: v0.0.0-integration-galactic-worker
