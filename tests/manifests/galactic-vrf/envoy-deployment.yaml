apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: envoy-gateway-system
  labels:
    galactic.datumapis.com/galactic-vrf: enabled
spec:
  selector:
    matchLabels:
      app: envoy
  template:
    metadata:
      labels:
        app: envoy
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.33.0
