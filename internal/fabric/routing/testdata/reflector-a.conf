! Synthetic fabric route reflector: IPv6 only, reflector clients, no
! upstream sessions, no log file and the IPv4 unicast default left on.

frr defaults traditional
hostname reflector-a

router bgp 64500
 bgp router-id 192.0.2.20

 neighbor V6-CLIENTS peer-group
 neighbor V6-CLIENTS remote-as 64500

 neighbor fd00:db8::5 peer-group V6-CLIENTS
 neighbor fd00:db8::6 peer-group V6-CLIENTS

 address-family ipv6 unicast
  neighbor V6-CLIENTS activate
  neighbor V6-CLIENTS route-reflector-client
  neighbor V6-CLIENTS send-community
  neighbor V6-CLIENTS route-map ALLOW in
  neighbor V6-CLIENTS route-map ALLOW out
 exit-address-family

route-map ALLOW permit 10
exit
