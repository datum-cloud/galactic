! Synthetic fabric edge router. Documentation ranges only (RFC 5737,
! RFC 3849, RFC 5398 ASNs); it exercises every construct the conformance
! matrix maps, including constructs the matrix maps but few routers use.

frr defaults traditional
hostname edge-a-fabric
log file /var/log/frr/frr.log informational

ipv6 route 2001:db8:100:1::/64 Null0
ip route 192.0.2.0/24 Null0
ip route 198.51.100.128/25 203.0.113.1

ipv6 forwarding

router bgp 64500
 bgp router-id 192.0.2.10
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 bgp allow-martian-nexthop

 neighbor UPSTREAM peer-group
 neighbor UPSTREAM remote-as 64496
 neighbor UPSTREAM ebgp-multihop 2
 neighbor UPSTREAM advertisement-interval 30

 neighbor V6-UPSTREAM peer-group
 neighbor V6-UPSTREAM remote-as 64496
 neighbor V6-UPSTREAM ebgp-multihop 2
 neighbor V6-UPSTREAM advertisement-interval 30

 neighbor V6-MESH peer-group
 neighbor V6-MESH remote-as 64500
 neighbor V6-MESH advertisement-interval 5

 neighbor UNUSED-GROUP peer-group
 neighbor UNUSED-GROUP remote-as 64500

 neighbor 203.0.113.1 peer-group UPSTREAM
 neighbor 203.0.113.1 description UPSTREAM-TOR1
 neighbor 203.0.113.1 update-source 192.0.2.10

 neighbor 2001:db8:ffff::1 peer-group V6-UPSTREAM
 neighbor 2001:db8:ffff::1 description V6-UPSTREAM-TOR1
 neighbor 2001:db8:ffff::1 update-source 2001:db8:ffff::2

 neighbor 2001:db8:ffff::9 peer-group V6-UPSTREAM
 neighbor 2001:db8:ffff::9 description V6-UPSTREAM-TOR2: second path
 neighbor 2001:db8:ffff::9 update-source 2001:db8:ffff::2
 neighbor 2001:db8:ffff::9 ebgp-multihop 3

 neighbor fd00:db8::5 peer-group V6-MESH
 neighbor fd00:db8::5 description V6 mesh: edge-b
 neighbor fd00:db8::5 update-source fd00:db8::6

 neighbor 2001:db8:eeee::1 remote-as 64511
 neighbor 2001:db8:eeee::1 description standalone peer

 address-family ipv4 unicast
  network 192.0.2.0/24 route-map ORIGINATE
  aggregate-address 198.51.100.0/24 summary-only as-set route-map ORIGINATE
  redistribute connected route-map REDIST-CONNECTED
  redistribute static route-map REDIST-CONNECTED
  neighbor UPSTREAM activate
  neighbor UPSTREAM soft-reconfiguration inbound
  neighbor UPSTREAM maximum-prefix 100 80 warning-only
  neighbor UPSTREAM send-community both
  neighbor UPSTREAM allowas-in 1
  neighbor UPSTREAM route-map DENY in
  neighbor UPSTREAM route-map UPSTREAM-OUT out
 exit-address-family

 address-family ipv6 unicast
  network 2001:db8:100:1::/64 route-map V6-ORIGINATE
  network 2001:db8:0100::/48 route-map V6-ORIGINATE
  aggregate-address 2001:db8:200::/48 route-map V6-ORIGINATE
  redistribute kernel route-map V6-REDIST
  neighbor V6-UPSTREAM activate
  neighbor V6-UPSTREAM soft-reconfiguration inbound
  neighbor V6-UPSTREAM maximum-prefix 200 restart 5
  neighbor V6-UPSTREAM send-community both
  neighbor V6-UPSTREAM route-map DENY in
  neighbor V6-UPSTREAM route-map V6-UPSTREAM-OUT out
  neighbor V6-MESH activate
  neighbor V6-MESH soft-reconfiguration inbound
  neighbor V6-MESH next-hop-self
  neighbor V6-MESH send-community both
  neighbor V6-MESH route-map MESH-IN in
  neighbor V6-MESH route-map V6-MESH-OUT out
  neighbor fd00:db8::5 weight 100
  neighbor 2001:db8:ffff::9 maximum-prefix 300 90
  neighbor 2001:db8:eeee::1 activate
  neighbor 2001:db8:eeee::1 send-community large
  neighbor 2001:db8:eeee::1 route-map DENY in
  neighbor 2001:db8:eeee::1 route-map V6-UPSTREAM-OUT out
 exit-address-family

 bmp targets collector
  bmp connect 127.0.0.1 port 9348 min-retry 1000 max-retry 10000
  bmp monitor ipv4 unicast loc-rib
  bmp monitor ipv6 unicast pre-policy
  bmp monitor ipv6 unicast post-policy
 exit

ip prefix-list DEFAULT-ONLY seq 5 permit 0.0.0.0/0
ip prefix-list EDGE-SERVICES seq 5 permit 192.0.2.0/24
ip prefix-list EDGE-SERVICES seq 10 deny 198.51.100.0/24 ge 25 le 32
ipv6 prefix-list V6-LOCATOR seq 5 permit 2001:db8:0100::/48 ge 49
ipv6 prefix-list V6-LOCATOR seq 4294967295 permit 2001:db8:200::/48 le 64
ipv6 prefix-list V6-UNUSED seq 5 permit ::/0

bgp community-list standard GSHUT-COMM permit graceful-shutdown
bgp community-list standard NO-EXPORT-COMM permit no-export
bgp community-list standard INTERNAL permit 64500:302
bgp community-list standard INTERNAL permit 64500:310
bgp community-list standard STRIP-ME permit 64496:666
bgp community-list standard UNUSED-COMM permit 64500:999
bgp large-community-list standard SITE permit 64500:1011:302
bgp large-community-list standard STRIP-LARGE permit 64496:1:1

route-map DENY deny 1
exit
!
route-map ORIGINATE permit 10
 description ORIGINATE-EDGE
 match ip address prefix-list EDGE-SERVICES
 set community 64500:202
 set large-community 64500:1011:202
exit
!
route-map ORIGINATE deny 500
 description DENY-EVERYTHING-ELSE
exit
!
route-map V6-ORIGINATE permit 10
 match ipv6 address prefix-list V6-LOCATOR
 set community 64500:310 64500:302 additive
 set large-community 64500:1011:310 additive
exit
!
route-map REDIST-CONNECTED deny 5
 match ip address prefix-list DEFAULT-ONLY
exit
!
route-map REDIST-CONNECTED permit 10
 match interface lo
exit
!
route-map V6-REDIST permit 10
 match interface lo
 match ipv6 address prefix-list V6-LOCATOR
 set community 64500:310
exit
!
route-map UPSTREAM-OUT deny 10
 description NO-EXPORT-ROUTES
 match community NO-EXPORT-COMM
exit
!
route-map UPSTREAM-OUT permit 35
 match ip address prefix-list EDGE-SERVICES
 match community INTERNAL
 set community 64496:2030 0:64511 additive
 set as-path prepend 64500 64500 64500
exit
!
route-map UPSTREAM-OUT deny 500
exit
!
route-map V6-UPSTREAM-OUT permit 10
 match large-community SITE
 set comm-list STRIP-ME delete
 set large-comm-list STRIP-LARGE delete
 set as-path prepend 64510 64510
exit
!
route-map V6-UPSTREAM-OUT deny 500
exit
!
route-map MESH-IN permit 10
 description GSHUT
 match community GSHUT-COMM
 set local-preference 0
exit
!
route-map MESH-IN permit 20
exit
!
route-map V6-MESH-OUT permit 10
 match community INTERNAL
exit
!
route-map V6-MESH-OUT deny 500
exit
!
route-map UNUSED-MAP permit 10
 description retained while unreferenced
 set community 64500:666
exit
