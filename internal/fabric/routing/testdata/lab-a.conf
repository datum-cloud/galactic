! Synthetic lab-shaped fabric router. Documentation ranges only (RFC 5737,
! RFC 3849, RFC 5398 ASNs). It is shaped like the containerlab lab's edge
! nodes, with interface addressing left to the host: hash comments, syslog,
! sessions with no export policy under `no bgp ebgp-requires-policy`,
! network and aggregate statements with no route-map, next-hop-self force,
! a route-map setting a source address, and a BMP target sourced from an
! interface with statistics reports.

frr defaults traditional
hostname lab-a-fabric
log syslog informational

# Discard routes backing the network statements below.
ipv6 route 2001:db8:ff01::/48 Null0
ipv6 route 2001:db8:6060:1::/64 Null0
ip route 198.51.100.1/32 Null0
!
route-map SET-SRC permit 10
 # The reflector's loopback, as the source of routes installed from it.
 set src 2001:db8:ff00::1
!
route-map SET-SRC-V4 permit 10
 set src 192.0.2.4
exit
!

# An edge node: eBGP to the transit, iBGP to the node behind it.
router bgp 64500
 bgp router-id 192.0.2.6
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 # eBGP to the transit, with no policy in either direction.
 neighbor 2001:db8:1:11::1 remote-as 64510
 neighbor 203.0.113.1 remote-as 64510
 #
 # iBGP to the compute node behind this one.
 neighbor 2001:db8:1:10::2 remote-as 64500
 neighbor 198.51.100.10 remote-as 64500
 neighbor 2001:db8:1:31::2 remote-as 64500
 !
 address-family ipv6 unicast
  neighbor 2001:db8:1:11::1 activate
  neighbor 2001:db8:1:11::1 allowas-in 1
  neighbor 2001:db8:1:10::2 activate
  # force: plain next-hop-self leaves reflected routes alone.
  neighbor 2001:db8:1:10::2 next-hop-self force
  neighbor 2001:db8:1:10::2 route-reflector-client
  neighbor 2001:db8:1:31::2 activate
  neighbor 2001:db8:1:31::2 route-map SET-SRC in
  network 2001:db8:ff00::1/128
  network 2001:db8:6060:1::/64
  aggregate-address 2001:db8:ff01::/48 summary-only
 exit-address-family
 !
 address-family ipv4 unicast
  neighbor 203.0.113.1 activate
  neighbor 203.0.113.1 allowas-in 1
  neighbor 198.51.100.10 activate
  neighbor 198.51.100.10 next-hop-self force
  neighbor 198.51.100.10 route-reflector-client
  neighbor 198.51.100.10 route-map SET-SRC-V4 in
  network 192.0.2.6/32
  network 198.51.100.1/32
 exit-address-family
 # The collector, reached over the loopback.
 bmp targets collector
  bmp connect 2001:db8:ff00::8 port 5000 min-retry 1000 max-retry 30000 source-interface lo
  bmp monitor ipv4 unicast pre-policy
  bmp monitor ipv4 unicast loc-rib
  bmp monitor ipv6 unicast pre-policy
  bmp monitor ipv6 unicast loc-rib
  bmp stats interval 60000
 exit
 bmp targets fabric-api
  bmp connect 127.0.0.1 port 9348 min-retry 1000 max-retry 10000
  bmp monitor ipv4 unicast loc-rib
  bmp monitor ipv6 unicast loc-rib
 exit
!

ip forwarding
ipv6 forwarding
