apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
nodes:
  - role: control-plane
  # Kind names workers sequentially by declaration order: dfw-worker,
  # dfw-worker2, dfw-worker3. Those names are used as-is -- no
  # kubeadmConfigPatches rename and no post-deploy `docker rename` -- so a
  # node's role is carried entirely by its labels, and the container name,
  # the Kubernetes node name, and the frr.conf.<nodename> ConfigMap key all
  # agree by construction. See docs/node-labels.md.
  - role: worker
    labels:
      topology.kubernetes.io/region: dfw
      galactic.datumapis.com/node: compute
      galactic.datumapis.com/galactic: router
      galactic.datumapis.com/fabric: router
  # Two edge nodes, each running its own egress shard: dfw's compute node
  # lists both in its shard list, so this is the only site where a tenant's
  # egress has a second shard to fall back to. sjc and iad each run a single
  # edge node. Every shard runs from the node's XDP dispatcher
  # (GALACTIC_NAT_XDP_ATTACH=dispatch).
  - role: worker
    labels:
      topology.kubernetes.io/region: dfw
      galactic.datumapis.com/node: edge
      galactic.datumapis.com/nat: enabled
      galactic.datumapis.com/galactic: router
      galactic.datumapis.com/fabric: router
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: galactic.datumapis.com/nat
              value: enabled
              effect: NoSchedule
  - role: worker
    labels:
      topology.kubernetes.io/region: dfw
      galactic.datumapis.com/node: edge
      galactic.datumapis.com/nat: enabled
      galactic.datumapis.com/galactic: router
      galactic.datumapis.com/fabric: router
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: galactic.datumapis.com/nat
              value: enabled
              effect: NoSchedule
networking:
  ipFamily: ipv6
  disableDefaultCNI: true
  podSubnet: fd00:100::/48
  serviceSubnet: fd00:200::/108
