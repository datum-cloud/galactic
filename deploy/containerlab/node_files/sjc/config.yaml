apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
nodes:
  - role: control-plane
  # Sequential Kind names (sjc-worker, sjc-worker2) used as-is -- see
  # node_files/dfw/config.yaml's comment.
  - role: worker
    labels:
      topology.kubernetes.io/region: sjc
      galactic.datumapis.com/node: compute
      galactic.datumapis.com/galactic: router
      galactic.datumapis.com/fabric: router
  - role: worker
    labels:
      topology.kubernetes.io/region: sjc
      galactic.datumapis.com/node: edge
      galactic.datumapis.com/galactic: router
      galactic.datumapis.com/fabric: router
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: galactic.datumapis.com/node
              value: edge
              effect: NoSchedule
networking:
  ipFamily: ipv6
  disableDefaultCNI: true
  podSubnet: fd00:100::/48
  serviceSubnet: fd00:200::/108
