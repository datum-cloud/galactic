frr defaults traditional
hostname tr4
log syslog informational

interface lo
 ip address 10.255.255.103/32
 ipv6 address fc00:0:7::1/128
!
interface eth1
 description tr1-facing
 ip address 10.0.14.4/24
 ipv6 address 2001:db8:0:14::4/64
!
interface eth2
 description tr2-facing
 ip address 10.0.24.4/24
 ipv6 address 2001:db8:0:24::4/64
!
interface eth3
 description tr3-facing
 ip address 10.0.34.4/24
 ipv6 address 2001:db8:0:34::4/64
!
interface eth4
 description remote-host-facing
 ip address 11.1.40.1/24
 ipv6 address 2001:db8:1:40::1/64
 ipv6 address 2c0f:40::1/64
!

! A probe sink for verify:looking-glass: global prefixes tr4 originates and
! drops without an ICMP error, so a probe toward them is lost and a
! traceroute ends in silent hops, keeping its routers busy for about 20 s.
ip route 11.1.42.0/24 blackhole
ipv6 route 2c0f:42::/64 blackhole

ipv6 prefix-list MIN48 seq 5 permit ::/0 le 47
route-map FILTER_PREFIX deny 10
 match ipv6 address prefix-list MIN48
route-map FILTER_PREFIX permit 20

! IPv4 counterpart of MIN48/FILTER_PREFIX -- see node_files/tr1/frr.conf for
! the shared rationale.
ip prefix-list MIN24 seq 5 permit 0.0.0.0/0 le 23
route-map FILTER_PREFIX_V4 deny 10
 match ip address prefix-list MIN24
route-map FILTER_PREFIX_V4 permit 20

router bgp 65100
 bgp router-id 10.255.255.103
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 neighbor eth1 interface remote-as 65100
 neighbor eth2 interface remote-as 65100
 neighbor eth3 interface remote-as 65100
 neighbor 10.0.14.1 remote-as 65100
 neighbor 10.0.24.2 remote-as 65100
 neighbor 10.0.34.3 remote-as 65100
 !
 address-family ipv6 unicast
  neighbor eth1 activate
  neighbor eth1 next-hop-self
  neighbor eth1 route-map FILTER_PREFIX in
  neighbor eth2 activate
  neighbor eth2 next-hop-self
  neighbor eth2 route-map FILTER_PREFIX in
  neighbor eth3 activate
  neighbor eth3 next-hop-self
  neighbor eth3 route-map FILTER_PREFIX in
  network fc00:0:7::1/128
  ! The off-fabric host's own subnet (remote-host, eth4 above). tr4 is the
  ! only router with a path to it, and the host speaks no BGP of its own,
  ! so tr4 originates the connected link prefix on its behalf. This is what
  ! makes nginx on 2001:db8:1:40::2 reachable from a tenant pod's egress
  ! path through the NAT66 shard tier, and from every other site's nodes.
  network 2001:db8:1:40::/64
  ! The host's probe destination (2c0f:40::2), outside 2001:db8::/32: the
  ! fabric-api public probe policy refuses documentation and other
  ! special-use space, so only a global address can be pinged or traced
  ! through the Looking Glass service (verify:looking-glass). Like
  ! 11.1.40.0/24, it is never announced beyond the lab.
  network 2c0f:40::/64
  ! The probe sink, dropped here (see the blackhole routes above).
  network 2c0f:42::/64
 exit-address-family
 !
 ! One numbered session per address family -- see node_files/tr1/frr.conf.
 address-family ipv4 unicast
  neighbor 10.0.14.1 activate
  neighbor 10.0.14.1 next-hop-self
  neighbor 10.0.14.1 route-map FILTER_PREFIX_V4 in
  neighbor 10.0.24.2 activate
  neighbor 10.0.24.2 next-hop-self
  neighbor 10.0.24.2 route-map FILTER_PREFIX_V4 in
  neighbor 10.0.34.3 activate
  neighbor 10.0.34.3 next-hop-self
  neighbor 10.0.34.3 route-map FILTER_PREFIX_V4 in
  network 10.255.255.103/32
  ! The off-fabric host's IPv4 subnet -- see the IPv6 network statement
  ! above. A /24 passes FILTER_PREFIX_V4 on every receiving transit router.
  network 11.1.40.0/24
  network 11.1.42.0/24
 exit-address-family
!

ip forwarding
ipv6 forwarding
