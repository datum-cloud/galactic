apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
nodes:
  - role: control-plane
  # Sequential Kind names (iad-worker, iad-worker2, iad-worker3) used as-is
  # -- see node_files/dfw/config.yaml's comment.
  - role: worker
    labels:
      topology.kubernetes.io/region: iad
      galactic.datumapis.com/node: compute
      galactic.datumapis.com/galactic: router
      galactic.datumapis.com/fabric: router
  - role: worker
    labels:
      topology.kubernetes.io/region: iad
      galactic.datumapis.com/node: edge
      galactic.datumapis.com/galactic: router
      galactic.datumapis.com/fabric: router
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: galactic.datumapis.com/node
              value: edge
              effect: NoSchedule
  # The EVPN route reflector for the whole lab -- every galactic-router in
  # every cluster peers with this one node (fc00:0:8::1 port 1790). It is
  # the only node carrying galactic.datumapis.com/galactic=control, and it
  # deliberately carries no galactic.datumapis.com/node value at all: that
  # key's compute/edge roles both imply galactic=router (galactic-cni plus
  # plain-mode galactic-router), and galactic's router/control values are
  # mutually exclusive by construction -- one key, one value. So a
  # reflector cannot also be a compute or edge node, and
  # config/galactic-router/overlays/control/ additionally excludes
  # Kubernetes control-plane nodes outright, which is why this role needs a
  # worker of its own rather than sharing one. See docs/node-labels.md.
  - role: worker
    labels:
      topology.kubernetes.io/region: iad
      galactic.datumapis.com/galactic: control
      galactic.datumapis.com/fabric: router
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: galactic.datumapis.com/galactic
              value: control
              effect: NoSchedule
networking:
  ipFamily: ipv6
  disableDefaultCNI: true
  podSubnet: fd00:100::/48
  serviceSubnet: fd00:200::/108
