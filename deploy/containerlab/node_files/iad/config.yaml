apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
nodes:
  - role: control-plane
  - role: worker
    labels:
      topology.kubernetes.io/region: iad
      galactic.datumapis.com/node: compute
      galactic.datumapis.com/fabric: "true"
  - role: worker
    labels:
      topology.kubernetes.io/region: iad
      galactic.datumapis.com/galactic-route-reflector: "true"
      galactic.datumapis.com/fabric: "true"
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: iad-worker-rr
          taints:
            - key: galactic.datumapis.com/galactic-route-reflector
              value: "true"
              effect: NoSchedule
  # Dedicated edge XDP NAT+LB gateway nodes -- canary for
  # config/galactic-gateway/base/. Two nodes, active-active, matching the design's
  # own topology requirement (see
  # internal/gateway/doc.go): a single gateway node would still work but
  # would never actually exercise the primary/secondary BGP local-pref
  # failover path. Tainted the same way the route-reflector node is above, to
  # keep ordinary tenant pods (resources/tenants/*/base/pod.yaml's
  # netshoot Deployments) off these dedicated nodes -- only DaemonSets
  # with a blanket toleration (config/galactic-router/base/daemonset.yaml,
  # config/fabric-router/daemonset.yaml) tolerate it.
  - role: worker
    labels:
      topology.kubernetes.io/region: iad
      galactic.datumapis.com/node: edge
      galactic.datumapis.com/fabric: "true"
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: iad-gateway1
          taints:
            - key: galactic.datumapis.com/node
              value: edge
              effect: NoSchedule
  - role: worker
    labels:
      topology.kubernetes.io/region: iad
      galactic.datumapis.com/node: edge
      galactic.datumapis.com/fabric: "true"
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: iad-gateway2
          taints:
            - key: galactic.datumapis.com/node
              value: edge
              effect: NoSchedule
networking:
  ipFamily: ipv6
  disableDefaultCNI: true
  podSubnet: fd00:100::/48
  serviceSubnet: fd00:200::/108
