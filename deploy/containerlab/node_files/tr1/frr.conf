frr defaults traditional
hostname tr1
log syslog informational

interface lo
 ip address 10.255.255.100/32
 ipv6 address fc00:0:1::1/128
!
interface eth1
 description dfw-worker2-facing (edge)
 ip address 10.1.11.1/24
 ipv6 address 2001:db8:1:11::1/64
!
interface eth2
 description tr2-facing
 ip address 10.0.12.1/24
 ipv6 address 2001:db8:0:12::1/64
!
interface eth3
 description tr3-facing
 ip address 10.0.13.1/24
 ipv6 address 2001:db8:0:13::1/64
!
interface eth4
 description tr4-facing
 ip address 10.0.14.1/24
 ipv6 address 2001:db8:0:14::1/64
!
interface eth5
 description dfw-worker3-facing (edge)
 ip address 10.1.12.1/24
 ipv6 address 2001:db8:1:12::1/64
!

ipv6 prefix-list MIN48 seq 5 prefix ::/0 le 48 permit
ipv6 prefix-list MIN48 seq 10 deny
route-map FILTER_PREFIX deny 10
 match ipv6 address prefix-list MIN48
route-map FILTER_PREFIX permit 20

! IPv4 counterpart of MIN48/FILTER_PREFIX above: the transit carries only
! per-node loopbacks (/32) over IPv4, so anything shorter than /24 is a site
! aggregate and gets dropped inbound -- same intent as MIN48's on the IPv6
! side. Note the different (correct) prefix-list syntax: the MIN48 lines above
! are not accepted by FRR 10.2 at all ("action before prefix, no `prefix`
! keyword"), so FILTER_PREFIX currently matches nothing and permits
! everything. That is a pre-existing bug, deliberately left alone here --
! correcting it would drop the site /48s the fabric nodes originate over IPv6.
ip prefix-list MIN24 seq 5 permit 0.0.0.0/0 le 23
route-map FILTER_PREFIX_V4 deny 10
 match ip address prefix-list MIN24
route-map FILTER_PREFIX_V4 permit 20

router bgp 65100
 bgp router-id 10.255.255.100
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 neighbor 2001:db8:1:11::2 remote-as 65000
 neighbor 2001:db8:1:12::2 remote-as 65000
 neighbor 10.1.11.2 remote-as 65000
 neighbor 10.1.12.2 remote-as 65000
 neighbor eth2 interface remote-as 65100
 neighbor eth3 interface remote-as 65100
 neighbor eth4 interface remote-as 65100
 neighbor 10.0.12.2 remote-as 65100
 neighbor 10.0.13.3 remote-as 65100
 neighbor 10.0.14.4 remote-as 65100
 !
 address-family ipv6 unicast
  neighbor 2001:db8:1:11::2 activate
  neighbor 2001:db8:1:11::2 route-map FILTER_PREFIX in
  neighbor 2001:db8:1:12::2 activate
  neighbor 2001:db8:1:12::2 route-map FILTER_PREFIX in
  neighbor eth2 activate
  neighbor eth2 next-hop-self
  neighbor eth2 route-map FILTER_PREFIX in
  neighbor eth3 activate
  neighbor eth3 next-hop-self
  neighbor eth3 route-map FILTER_PREFIX in
  neighbor eth4 activate
  neighbor eth4 next-hop-self
  neighbor eth4 route-map FILTER_PREFIX in
  network fc00:0:1::1/128
 exit-address-family
 !
 ! IPv4 unicast rides its own numbered session per link rather than sharing
 ! the IPv6 session via extended next-hop (RFC 8950): one session per address
 ! family keeps `show bgp ipv4 unicast summary` readable and avoids depending
 ! on IPv4-over-IPv6-next-hop resolution in the kernel FIB.
 address-family ipv4 unicast
  neighbor 10.1.11.2 activate
  neighbor 10.1.11.2 route-map FILTER_PREFIX_V4 in
  neighbor 10.1.12.2 activate
  neighbor 10.1.12.2 route-map FILTER_PREFIX_V4 in
  neighbor 10.0.12.2 activate
  neighbor 10.0.12.2 next-hop-self
  neighbor 10.0.12.2 route-map FILTER_PREFIX_V4 in
  neighbor 10.0.13.3 activate
  neighbor 10.0.13.3 next-hop-self
  neighbor 10.0.13.3 route-map FILTER_PREFIX_V4 in
  neighbor 10.0.14.4 activate
  neighbor 10.0.14.4 next-hop-self
  neighbor 10.0.14.4 route-map FILTER_PREFIX_V4 in
  network 10.255.255.100/32
 exit-address-family
!

ip forwarding
ipv6 forwarding
