frr defaults traditional
hostname tr3
log syslog informational

interface lo
 ip address 10.255.255.102/32
 ipv6 address fc00:0:6::1/128
!
interface eth1
 description tr1-facing
 ip address 10.0.13.3/24
 ipv6 address 2001:db8:0:13::3/64
!
interface eth2
 description tr2-facing
 ip address 10.0.23.3/24
 ipv6 address 2001:db8:0:23::3/64
!
interface eth3
 description tr4-facing
 ip address 10.0.34.3/24
 ipv6 address 2001:db8:0:34::3/64
!
interface eth4
 description iad-worker2-facing (edge)
 ip address 10.1.32.1/24
 ipv6 address 2001:db8:1:32::1/64
!

ipv6 prefix-list MIN48 seq 5 prefix ::/0 le 48 permit
ipv6 prefix-list MIN48 seq 10 deny
route-map FILTER_PREFIX deny 10
 match ipv6 address prefix-list MIN48
route-map FILTER_PREFIX permit 20

! IPv4 counterpart of MIN48/FILTER_PREFIX -- see node_files/tr1/frr.conf for
! why its syntax differs from the IPv6 lines above.
ip prefix-list MIN24 seq 5 permit 0.0.0.0/0 le 23
route-map FILTER_PREFIX_V4 deny 10
 match ip address prefix-list MIN24
route-map FILTER_PREFIX_V4 permit 20

router bgp 65100
 bgp router-id 10.255.255.102
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 neighbor 2001:db8:1:32::2 remote-as 65000
 neighbor 10.1.32.2 remote-as 65000
 neighbor eth1 interface remote-as 65100
 neighbor eth2 interface remote-as 65100
 neighbor eth3 interface remote-as 65100
 neighbor 10.0.13.1 remote-as 65100
 neighbor 10.0.23.2 remote-as 65100
 neighbor 10.0.34.4 remote-as 65100
 !
 address-family ipv6 unicast
  neighbor 2001:db8:1:32::2 activate
  neighbor 2001:db8:1:32::2 route-map FILTER_PREFIX in
  neighbor eth1 activate
  neighbor eth1 next-hop-self
  neighbor eth1 route-map FILTER_PREFIX in
  neighbor eth2 activate
  neighbor eth2 next-hop-self
  neighbor eth2 route-map FILTER_PREFIX in
  neighbor eth3 activate
  neighbor eth3 next-hop-self
  neighbor eth3 route-map FILTER_PREFIX in
  network fc00:0:6::1/128
 exit-address-family
 !
 ! One numbered session per address family -- see node_files/tr1/frr.conf.
 address-family ipv4 unicast
  neighbor 10.1.32.2 activate
  neighbor 10.1.32.2 route-map FILTER_PREFIX_V4 in
  neighbor 10.0.13.1 activate
  neighbor 10.0.13.1 next-hop-self
  neighbor 10.0.13.1 route-map FILTER_PREFIX_V4 in
  neighbor 10.0.23.2 activate
  neighbor 10.0.23.2 next-hop-self
  neighbor 10.0.23.2 route-map FILTER_PREFIX_V4 in
  neighbor 10.0.34.4 activate
  neighbor 10.0.34.4 next-hop-self
  neighbor 10.0.34.4 route-map FILTER_PREFIX_V4 in
  network 10.255.255.102/32
 exit-address-family
!

ip forwarding
ipv6 forwarding
