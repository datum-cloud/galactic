---
name: gvpc

mgmt:
  network: mgmt
  ipv6-subnet: fc00:10::/64

topology:
  defaults:
    kind: linux
    binds:
      - group_files/common/vtysh.conf:/etc/frr/vtysh.conf:ro
      - group_files/common/startup-lib.sh:/opt/lab/startup-lib.sh:ro
      - group_files/common/hosts:/etc/hosts:ro

  kinds:
    linux:
      image: fabric-router:latest

  nodes:
    dfw-control-plane:
      kind: ext-container
      labels:
        cluster: dfw
        graph-group: kind-control-plane
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
      mgmt-ipv6: fc00:10::102
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"

    dfw-worker:
      kind: ext-container
      labels:
        cluster: dfw
        graph-group: kind-worker
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
        worker-index: "1"
      mgmt-ipv6: fc00:10::103
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
      exec:
        - ip -6 route add blackhole 2001:db8:ff01:100::/56 metric 2048
        - /galactic/scripts/install.sh

    sjc-control-plane:
      kind: ext-container
      labels:
        cluster: sjc
        graph-group: kind-control-plane
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
      mgmt-ipv6: fc00:10::122
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"

    sjc-worker:
      kind: ext-container
      labels:
        cluster: sjc
        graph-group: kind-worker
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
        worker-index: "1"
      mgmt-ipv6: fc00:10::123
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
      exec:
        - ip -6 route add blackhole 2001:db8:ff02:100::/56 metric 2048
        - /galactic/scripts/install.sh

    iad-control-plane:
      kind: ext-container
      labels:
        cluster: iad
        graph-group: kind-control-plane
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
      mgmt-ipv6: fc00:10::112
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"

    iad-worker:
      kind: ext-container
      labels:
        cluster: iad
        graph-group: kind-worker
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
        worker-index: "1"
      mgmt-ipv6: fc00:10::113
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
      exec:
        - ip -6 route add blackhole 2001:db8:ff03:100::/56 metric 2048
        - /galactic/scripts/install.sh

    iad-worker2:
      kind: ext-container
      labels:
        cluster: iad
        graph-group: kind-worker
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
        worker-index: "2"
      mgmt-ipv6: fc00:10::114
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
      exec:
        - /galactic/scripts/install.sh

    # Kind names these two containers iad-worker3/iad-worker4 (sequential,
    # matching declaration order in node_files/iad/config.yaml) even though
    # their Kubernetes node names are iad-gateway1/iad-gateway2 (set via
    # that file's kubeadmConfigPatches, same indirection iad-worker2/
    # iad-worker-control already uses) -- Taskfile.yaml's deploy:rename-*
    # step renames both to match after cluster creation, purely cosmetic
    # (doesn't affect the links below, which are wired to the container
    # before the rename happens). No blackhole route in `exec`: unlike
    # iad-worker, these nodes never run galactic-veth's usid.c decap
    # program at all (config/galactic-cni's DaemonSet only targets the edge role),
    # so the blackhole-route workaround it needs doesn't apply here.
    iad-worker3:
      kind: ext-container
      labels:
        cluster: iad
        graph-group: kind-worker
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
        worker-index: "3"
      mgmt-ipv6: fc00:10::115
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
      exec:
        - /galactic/scripts/install.sh

    iad-worker4:
      kind: ext-container
      labels:
        cluster: iad
        graph-group: kind-worker
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
        worker-index: "4"
      mgmt-ipv6: fc00:10::116
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
      exec:
        - /galactic/scripts/install.sh

    tr1:
      group: transit
      labels:
        graph-group: transit
        graph-level: 2
        graph-icon: router
      entrypoint: /node_files/startup.sh
      binds:
        - group_files/transit/daemons:/etc/frr/daemons:ro
        - node_files/tr1/startup.sh:/node_files/startup.sh:ro
        - node_files/tr1/frr.conf:/etc/frr/frr.conf:ro

    tr2:
      group: transit
      labels:
        graph-group: transit
        graph-level: 2
        graph-icon: router
      entrypoint: /node_files/startup.sh
      binds:
        - group_files/transit/daemons:/etc/frr/daemons:ro
        - node_files/tr2/startup.sh:/node_files/startup.sh:ro
        - node_files/tr2/frr.conf:/etc/frr/frr.conf:ro

    tr3:
      group: transit
      labels:
        graph-group: transit
        graph-level: 2
        graph-icon: router
      entrypoint: /node_files/startup.sh
      binds:
        - group_files/transit/daemons:/etc/frr/daemons:ro
        - node_files/tr3/startup.sh:/node_files/startup.sh:ro
        - node_files/tr3/frr.conf:/etc/frr/frr.conf:ro

    tr4:
      group: transit
      labels:
        graph-group: transit
        graph-level: 2
        graph-icon: router
      entrypoint: /node_files/startup.sh
      binds:
        - group_files/transit/daemons:/etc/frr/daemons:ro
        - node_files/tr4/startup.sh:/node_files/startup.sh:ro
        - node_files/tr4/frr.conf:/etc/frr/frr.conf:ro

  links:
    # Cluster worker uplinks
    - endpoints: ["dfw-worker:eth1", "tr1:eth1"]
    - endpoints: ["sjc-worker:eth1", "tr2:eth1"]
    - endpoints: ["iad-worker:eth1", "tr3:eth5"]
    - endpoints: ["iad-worker2:eth1", "tr3:eth4"]

    # Gateway node uplinks (edge XDP Maglev/DSR DaemonSet; see
    # config/galactic-gateway/base/ and deploy/containerlab/resources/
    # galactic-gateway/). tr3 (iad's transit router) already
    # consumed eth1/eth2/eth3 for the TR mesh and eth4/eth5 for
    # iad-worker/iad-worker2, so these take the next free ports. BGP
    # peering on these links is configured (node_files/tr3/frr.conf, plus
    # two BGPPeer objects in resources/galactic-control/iad/ for the route
    # reflector side), the fabric converges over them, and real
    # end-to-end ingress traffic through the datapath is now
    # live-validated (docs/plans/dsr-maglev-nptv6-nat66-gateway-redesign.md's
    # §8) -- three stacked issues found and fixed along the way, not one:
    # (1) IPv6 forwarding sysctls weren't enabled (fixed,
    # sysctl.ConfigureFIBLookupUplinkSysctls); (2) veth's native XDP_TX
    # fast path does not deliver a frame to the peer interface's normal
    # receive stack at all unless the peer *also* runs an XDP program --
    # confirmed live via a real destination-side packet counter, not just
    # tcpdump invisibility (a stronger finding than this comment used to
    # carry: "invisible to tcpdump, no delivery impact" was wrong, not
    # merely imprecise) -- worked around for this lab specifically by
    # `task deploy:lab-xdp-passthrough` loading a trivial pass-through XDP
    # program on tr3's eth6/eth7 (node_files/common/xdp-passthrough.c),
    # rather than converting edgedsr.c's own production datapath from XDP
    # to TC, since a real gateway's public uplink is a physical NIC where
    # this veth-specific behavior doesn't apply and native XDP_TX's
    # throughput advantage is exactly why that datapath uses XDP at all;
    # (3) `vip_xlat_table`'s veth-kind delivery gap and its identical-port
    # key collision, both fixed in galactic (see that redesign plan's §8
    # for the full account, including the still-separate, still-open
    # NAT66/default-egress gap this validation surfaced but did not fix).
    #
    # mtu: 1500 on both ends, unlike every other link in this topology
    # (which gets containerlab's jumbo-frame veth default, ~9500) --
    # required, not cosmetic: galactic-router's edge NAT+LB datapath
    # attaches its XDP program to this link's gateway-side interface in
    # native/driver mode (edgeattach.go, XDPDriverMode; generic/SKB mode
    # is deliberately not attempted, see that package's doc comment), and
    # the kernel's veth_xdp_set() rejects native XDP with -ERANGE
    # whenever the *peer's* MTU exceeds what fits in one page-sized
    # buffer (SKB_WITH_OVERHEAD(PAGE_SIZE - VETH_XDP_HEADROOM), ~3.5-3.8KB
    # on a 4K-page host) -- 9500 blows well past that regardless of which
    # end asks. Confirmed live: galactic-gateway{1,2} crash-looped
    # with exactly this ERANGE until both ends of these two links were
    # dropped to 1500.
    - endpoints: ["iad-worker3:eth1", "tr3:eth6"]
      mtu: 1500
    - endpoints: ["iad-worker4:eth1", "tr3:eth7"]
      mtu: 1500

    # TR full mesh (iBGP within AS 65100)
    - endpoints: ["tr1:eth2", "tr2:eth2"]
    - endpoints: ["tr1:eth3", "tr3:eth1"]
    - endpoints: ["tr1:eth4", "tr4:eth1"]
    - endpoints: ["tr2:eth3", "tr3:eth2"]
    - endpoints: ["tr2:eth4", "tr4:eth2"]
    - endpoints: ["tr3:eth3", "tr4:eth3"]
