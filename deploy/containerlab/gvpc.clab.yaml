---
name: gvpc

mgmt:
  network: mgmt
  ipv6-subnet: fc00:10::/64

topology:
  defaults:
    kind: linux
    binds:
      - group_files/common/vtysh.conf:/etc/frr/vtysh.conf:ro
      - group_files/common/startup-lib.sh:/opt/lab/startup-lib.sh:ro
      - group_files/common/hosts:/etc/hosts:ro

  kinds:
    linux:
      image: fabric-router:latest

  nodes:
    dfw-control-plane:
      kind: ext-container
      labels:
        cluster: dfw
        graph-group: kind-control-plane
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
      mgmt-ipv6: fc00:10::102
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"

    dfw-worker:
      kind: ext-container
      labels:
        cluster: dfw
        graph-group: kind-worker
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
        worker-index: "1"
      mgmt-ipv6: fc00:10::103
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
      exec:
        - ip -6 route add blackhole 2001:db8:ff01:1001::/64 metric 2048
        - /galactic/scripts/mkbond.sh bond0 eth1 eth3
        - /galactic/scripts/mkbond.sh bond1 eth2 eth4
        - /galactic/scripts/install.sh

    dfw-worker2:
      kind: ext-container
      labels:
        cluster: dfw
        graph-group: kind-worker
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
        worker-index: "2"
      mgmt-ipv6: fc00:10::104
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
      exec:
        - ip -6 route add blackhole 2001:db8:ff01:1002::/64 metric 2048
        - ip -6 route add blackhole 2001:db8:ff01:3002::/64 metric 2048
        - /galactic/scripts/mkbond.sh bond0 eth1 eth3
        - /galactic/scripts/mkbond.sh bond1 eth2 eth4
        - /galactic/scripts/install.sh

    dfw-worker3:
      kind: ext-container
      labels:
        cluster: dfw
        graph-group: kind-worker
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
        worker-index: "3"
      mgmt-ipv6: fc00:10::105
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
      exec:
        - ip -6 route add blackhole 2001:db8:ff01:1003::/64 metric 2048
        - ip -6 route add blackhole 2001:db8:ff01:3003::/64 metric 2048
        - /galactic/scripts/mkbond.sh bond0 eth1 eth3
        - /galactic/scripts/mkbond.sh bond1 eth2 eth4
        - /galactic/scripts/install.sh

    sjc-control-plane:
      kind: ext-container
      labels:
        cluster: sjc
        graph-group: kind-control-plane
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
      mgmt-ipv6: fc00:10::122
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"

    sjc-worker:
      kind: ext-container
      labels:
        cluster: sjc
        graph-group: kind-worker
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
        worker-index: "1"
      mgmt-ipv6: fc00:10::123
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
      exec:
        - ip -6 route add blackhole 2001:db8:ff02:1001::/64 metric 2048
        - /galactic/scripts/mkbond.sh bond0 eth1 eth2
        - /galactic/scripts/install.sh

    sjc-worker2:
      kind: ext-container
      labels:
        cluster: sjc
        graph-group: kind-worker
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
        worker-index: "2"
      mgmt-ipv6: fc00:10::124
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
      exec:
        - ip -6 route add blackhole 2001:db8:ff02:1002::/64 metric 2048
        - ip -6 route add blackhole 2001:db8:ff02:3002::/64 metric 2048
        - /galactic/scripts/mkbond.sh bond0 eth1 eth3
        - /galactic/scripts/mkbond.sh bond1 eth2 eth4
        - /galactic/scripts/install.sh

    iad-control-plane:
      kind: ext-container
      labels:
        cluster: iad
        graph-group: kind-control-plane
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
      mgmt-ipv6: fc00:10::112
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"

    iad-worker:
      kind: ext-container
      labels:
        cluster: iad
        graph-group: kind-worker
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
        worker-index: "1"
      mgmt-ipv6: fc00:10::113
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
      exec:
        - ip -6 route add blackhole 2001:db8:ff03:1001::/64 metric 2048
        - /galactic/scripts/mkbond.sh bond0 eth1 eth2
        - /galactic/scripts/install.sh

    iad-worker2:
      kind: ext-container
      labels:
        cluster: iad
        graph-group: kind-worker
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
        worker-index: "2"
      mgmt-ipv6: fc00:10::114
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
      exec:
        - ip -6 route add blackhole 2001:db8:ff03:1002::/64 metric 2048
        - ip -6 route add blackhole 2001:db8:ff03:3002::/64 metric 2048
        - /galactic/scripts/mkbond.sh bond0 eth1 eth4
        - /galactic/scripts/mkbond.sh bond1 eth2 eth5
        - /galactic/scripts/install.sh

    iad-worker3:
      kind: ext-container
      labels:
        cluster: iad
        graph-group: kind-worker
        graph-level: 1
        graph-icon: server
        platform: kind
        reload: disabled
        worker-index: "3"
      mgmt-ipv6: fc00:10::115
      sysctls:
        fs.inotify.max_user_instances: "256"
        net.ipv4.conf.all.arp_announce: "2"
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
      exec:
        - /galactic/scripts/install.sh

    tr1:
      group: transit
      labels:
        graph-group: transit
        graph-level: 2
        graph-icon: router
      entrypoint: /node_files/startup.sh
      binds:
        - group_files/transit/daemons:/etc/frr/daemons:ro
        - node_files/tr1/startup.sh:/node_files/startup.sh:ro
        - node_files/tr1/frr.conf:/etc/frr/frr.conf:ro
        - group_files/common/mkbond.sh:/opt/lab/mkbond.sh:ro

    tr2:
      group: transit
      labels:
        graph-group: transit
        graph-level: 2
        graph-icon: router
      entrypoint: /node_files/startup.sh
      binds:
        - group_files/transit/daemons:/etc/frr/daemons:ro
        - node_files/tr2/startup.sh:/node_files/startup.sh:ro
        - node_files/tr2/frr.conf:/etc/frr/frr.conf:ro
        - group_files/common/mkbond.sh:/opt/lab/mkbond.sh:ro

    tr3:
      group: transit
      labels:
        graph-group: transit
        graph-level: 2
        graph-icon: router
      entrypoint: /node_files/startup.sh
      binds:
        - group_files/transit/daemons:/etc/frr/daemons:ro
        - node_files/tr3/startup.sh:/node_files/startup.sh:ro
        - node_files/tr3/frr.conf:/etc/frr/frr.conf:ro
        - group_files/common/mkbond.sh:/opt/lab/mkbond.sh:ro

    tr4:
      group: transit
      labels:
        graph-group: transit
        graph-level: 2
        graph-icon: router
      entrypoint: /node_files/startup.sh
      binds:
        - group_files/transit/daemons:/etc/frr/daemons:ro
        - node_files/tr4/startup.sh:/node_files/startup.sh:ro
        - node_files/tr4/frr.conf:/etc/frr/frr.conf:ro

    # A plain host out on the transit, deliberately outside every Kind
    # cluster and running no Galactic component at all: it exists to be the
    # far end of traffic that leaves the fabric. nginx serves on its transit
    # addresses (both families), so a tenant pod's egress path through the
    # NAT66 shard tier has a real destination to reach, and the host itself
    # is a real off-fabric client for curling an edge gateway's ingress VIP.
    # It hangs off tr4, the one transit router with no site attached to it.
    # No BGP: a host doesn't speak it -- tr4 originates the link subnets
    # (node_files/tr4/frr.conf) and the host just keeps a default route
    # toward tr4 on each family.
    remote-host:
      group: transit
      labels:
        graph-group: transit
        graph-level: 3
        graph-icon: server
      image: remote-host:latest
      entrypoint: /node_files/startup.sh
      binds:
        - group_files/common/startup-lib.sh:/opt/lab/startup-lib.sh:ro
        - node_files/remote-host/startup.sh:/node_files/startup.sh:ro

  links:
    # Bonding. Every link below that carries a datapath -- each edge node's
    # transit uplink and each compute node's uplink to its edge node -- is a
    # pair of veths, not one, and both ends aggregate the pair into an 802.3ad
    # (LACP) bond: each Kind node's exec above runs mkbond.sh (baked into
    # the node image from group_files/common/), and node_files/tr*/startup.sh
    # runs the same script on the transit routers. Production gateway uplinks are bonds, and
    # galactic-gateway, galactic-nat and galactic-cni each resolve a bond to
    # its members before attaching (XDP to the members only, TC to the master
    # and its members), so the lab has to present them one to exercise that.
    #
    # Every addressed interface is the bond, never a member: FRR configs and
    # every datapath env var name bond0/bond1 (Kind nodes) or bondN (transit
    # routers). Naming is uniform per role on the Kind nodes, which is what
    # lets one cluster-wide galactic-cni DaemonSet name the same interfaces on
    # every node in a site:
    #   bond0  the node's first uplink -- the transit uplink on an edge node,
    #          the uplink to the site's first edge node on a compute node
    #   bond1  an edge node's compute-facing link; on dfw-worker, its uplink
    #          to the second edge node
    #
    # A bond's members go to one peer, never two -- LACP aggregates links
    # between two systems, and splitting one across two edge nodes would need
    # MLAG or EVPN multihoming. dfw-worker's dual-homing is therefore two
    # bonds, one per edge node, with ECMP across them exactly as before.
    #
    # Member numbering: the original single link keeps its interface number
    # and the second member takes the next free one, so eth1 is still the
    # transit-facing member on every edge node.

    # Edge uplinks to the transit. Edge nodes are the only transit-facing
    # ("fabric") nodes in this lab: they alone hold eBGP sessions to their
    # site's transit router, and every other worker in the site sits behind
    # them. dfw has two, an active-active pair; sjc and iad one each.
    #
    # mtu: 1500 on both ends, unlike containerlab's jumbo-frame veth default
    # (~9500) -- required, not cosmetic: galactic-gateway attaches its XDP
    # program to every member of bond0 in native/driver mode (edgeattach.go,
    # XDPDriverMode; generic/SKB mode is deliberately not attempted, see that
    # package's doc comment), and the kernel's veth_xdp_set() rejects native
    # XDP with -ERANGE whenever the *peer's* MTU exceeds what fits in one
    # page-sized buffer (SKB_WITH_OVERHEAD(PAGE_SIZE - VETH_XDP_HEADROOM),
    # ~3.5-3.8KB on a 4K-page host) -- 9500 blows well past that regardless
    # of which end asks. Confirmed live: the gateway crash-looped with
    # exactly this ERANGE until both ends were dropped to 1500.
    - endpoints: ["dfw-worker2:eth1", "tr1:eth1"]    # dfw-worker2 bond0 / tr1 bond1
      mtu: 1500
    - endpoints: ["dfw-worker2:eth3", "tr1:eth6"]
      mtu: 1500
    - endpoints: ["dfw-worker3:eth1", "tr1:eth5"]    # dfw-worker3 bond0 / tr1 bond2
      mtu: 1500
    - endpoints: ["dfw-worker3:eth3", "tr1:eth7"]
      mtu: 1500
    - endpoints: ["sjc-worker2:eth1", "tr2:eth1"]    # sjc-worker2 bond0 / tr2 bond1
      mtu: 1500
    - endpoints: ["sjc-worker2:eth3", "tr2:eth5"]
      mtu: 1500
    - endpoints: ["iad-worker2:eth1", "tr3:eth4"]    # iad-worker2 bond0 / tr3 bond1
      mtu: 1500
    - endpoints: ["iad-worker2:eth4", "tr3:eth5"]
      mtu: 1500

    # Site-internal links. Each compute node hangs off its own site's first
    # edge node, which routes for it: a compute node has no transit uplink
    # and no eBGP session anywhere. It reaches the rest of the fabric over a
    # single iBGP session to that edge node across this bond (see
    # resources/fabric-router/*/frr.conf.*).
    #
    # mtu: 1500 for the same -ERANGE reason as the edge uplinks above. The
    # edge end runs galactic-gateway's return program (edge_return), with
    # the egress shard chained behind it, on every member of these bonds,
    # and the compute end runs the lab's pass-through XDP program on its
    # members (Taskfile.yaml's deploy:lab-xdp-passthrough) so that
    # edge_lb's redirects toward a backend are received at all. Both native
    # XDP, both subject to the peer-MTU limit. (galactic-nat used to attach
    # here from the compute end, while its shards ran on the compute nodes;
    # it crash-looped with this ERANGE until these links were dropped to
    # 1500.)
    #
    # Accepted trade-off, not risk-free: a packet whose SRv6-encapsulated
    # size would land between 1500 and 9500 bytes now needs source
    # fragmentation/PMTU handling instead of transiting whole. Every
    # scenario test uses small ping payloads well under 1500.
    #
    # dfw's compute node is dual-homed, one bond to each of the site's two
    # edge nodes, so losing an edge node does not take the site's compute
    # node off the fabric with it. sjc and iad have a single edge node each
    # and so have nothing to dual-home to.
    #
    # Both bonds are equal paths. The uSID decap hook attaches to both
    # (GALACTIC_CNI_EBPF_INTERFACES="bond0,bond1"), and the node's egress
    # leaves through dfw's edge shards, which run on the edge nodes, so
    # nothing on this node prefers either uplink and the pair runs plain
    # ECMP.
    - endpoints: ["dfw-worker:eth1", "dfw-worker2:eth2"]   # dfw-worker bond0 / dfw-worker2 bond1
      mtu: 1500
    - endpoints: ["dfw-worker:eth3", "dfw-worker2:eth4"]
      mtu: 1500
    - endpoints: ["dfw-worker:eth2", "dfw-worker3:eth2"]   # dfw-worker bond1 / dfw-worker3 bond1
      mtu: 1500
    - endpoints: ["dfw-worker:eth4", "dfw-worker3:eth4"]
      mtu: 1500
    - endpoints: ["sjc-worker:eth1", "sjc-worker2:eth2"]   # sjc-worker bond0 / sjc-worker2 bond1
      mtu: 1500
    - endpoints: ["sjc-worker:eth2", "sjc-worker2:eth4"]
      mtu: 1500
    - endpoints: ["iad-worker:eth1", "iad-worker2:eth2"]   # iad-worker bond0 / iad-worker2 bond1
      mtu: 1500
    - endpoints: ["iad-worker:eth2", "iad-worker2:eth5"]
      mtu: 1500

    # The route reflector sits behind iad's edge node exactly the way a
    # compute node does -- one iBGP session to it, no transit uplink of its
    # own. It keeps the jumbo default: it runs neither galactic-nat nor
    # galactic-gateway, so no XDP program ever attaches to its eth1. Nor is
    # it bonded -- with no datapath on it, a bond would exercise nothing.
    - endpoints: ["iad-worker3:eth1", "iad-worker2:eth3"]

    # The off-fabric host on tr4, the one transit router with no site behind
    # it. 1500 to match a realistic internet-facing link rather than the veth
    # jumbo default, so an egress path's PMTU behaviour looks like the real
    # thing.
    - endpoints: ["remote-host:eth1", "tr4:eth4"]
      mtu: 1500

    # TR full mesh (iBGP within AS 65100)
    - endpoints: ["tr1:eth2", "tr2:eth2"]
    - endpoints: ["tr1:eth3", "tr3:eth1"]
    - endpoints: ["tr1:eth4", "tr4:eth1"]
    - endpoints: ["tr2:eth3", "tr3:eth2"]
    - endpoints: ["tr2:eth4", "tr4:eth2"]
    - endpoints: ["tr3:eth3", "tr4:eth3"]
