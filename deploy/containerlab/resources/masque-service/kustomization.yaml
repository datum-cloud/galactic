# The MASQUE connector service on dfw: config/masque's cell-wide
# prerequisites plus the lab's tenant bindings. The authority and provider
# Deployments are the overlays in authority/ and provider/, applied after
# this one. TestMASQUEService (task verify:masque-service) applies all three
# with kubectl from the host, creates the TLS Secrets and the authority's CA
# ConfigMap first, approves the EdgeProvider, and removes everything in the
# reverse order when it ends.
resources:
  - ../../../../config/masque
  - tenant-bindings.yaml
