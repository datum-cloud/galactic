# Lets ns60/backend on iad-worker answer TCP for the VIP: its node
# rewrites the VIP to the backend's address on the way in, and back on the
# way out.
apiVersion: network.datumapis.com/v1alpha1
kind: ServiceVIPBinding
metadata:
  name: ns60-tcp-backend
  namespace: galactic-system
spec:
  targetRef:
    kind: Node
    name: iad-worker
  vipAddress: 2001:db8:6060:3::1
  port: 80
  protocol: tcp
  backendAddress: fd20:60:ff03:a::100
  backendPort: 80
  egressKind: veth
---
# Lets ns60/backend on iad-worker answer UDP for the VIP: its node
# rewrites the VIP to the backend's address on the way in, and back on the
# way out.
apiVersion: network.datumapis.com/v1alpha1
kind: ServiceVIPBinding
metadata:
  name: ns60-udp-backend
  namespace: galactic-system
spec:
  targetRef:
    kind: Node
    name: iad-worker
  vipAddress: 2001:db8:6060:3::1
  port: 80
  protocol: udp
  backendAddress: fd20:60:ff03:a::100
  backendPort: 80
  egressKind: veth
