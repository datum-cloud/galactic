apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-gateway
spec:
  template:
    spec:
      # Hostname pin: one DaemonSet instance per edge node.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: galactic.datumapis.com/node
                    operator: In
                    values:
                      - edge
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - sjc-worker2
      containers:
        - name: galactic-gateway
          env:
            # Transit-fabric-facing uplink (underlay BGP + ingress): an
            # LACP bond, so edge_lb attaches to each of its members in turn,
            # waiting for each to rejoin the aggregate before the next.
            - name: GALACTIC_GATEWAY_PUBLIC_INTERFACE
              value: bond0
            # Compute-facing link, also a bond; edge_return attaches to its
            # members the same way.
            - name: GALACTIC_GATEWAY_INTERNAL_INTERFACES
              value: bond1
            # This node's SRv6 address: DSR outer-header encap source.
            # nodeID=0x3002 (service 3 = edge gateway, node index 002)
            - name: GALACTIC_GATEWAY_SRV6_ADDRESS
              value: "2001:db8:ff02:3002:e000::"
