# ns60 live web service exposed on a routable IPv6 ingress VIP.
apiVersion: network.datumapis.com/v1alpha1
kind: NetworkRule
metadata:
  name: ns60-web
  namespace: galactic-system
spec:
  vpcRef: "60"
  vpcAttachmentRef: "60"
  vipAddresses:
    - 2001:db8:6060::1
  protocol: tcp
  port: 80
  backends:
    - address: fd20:60:ff02::100:0
      port: 80
