apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-gateway
spec:
  template:
    spec:
      # kubernetes.io/hostname pins this DaemonSet instance to exactly one
      # node: GALACTIC_GATEWAY_SRV6_ADDRESS below must be unique per
      # gateway node (see config/gateway/base/kustomization.yaml's doc
      # comment), so galactic-gateway1/galactic-gateway2 are two separate
      # DaemonSets rather than one DaemonSet matching both gateway-labeled
      # nodes with identical env.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: galactic.datumapis.com/node
                    operator: In
                    values:
                      - gateway
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - iad-gateway1
      containers:
        - name: galactic-gateway
          env:
            # eth1 is this lab's dedicated transit-fabric-facing uplink on
            # every node (see resources/galactic-cni/daemonset-patch.yaml's
            # comment) -- the same interface edgenat's XDP program attaches
            # to for both underlay BGP and (once wired) ingress traffic.
            - name: GALACTIC_GATEWAY_PUBLIC_INTERFACE
              value: eth1
            # uFMT 48+16 uSID over this PoP's shared locator
            # (2001:db8:ff03::/48, see bgprouter.yaml's srv6Locator).
            # nodeID=2, Function=End.DT46 (arbitrary -- Argument 0 always
            # misses vrf_table, so no Function value is ever consulted for
            # it; see internal/plumbing/ebpf/prog/usid.c's Step 5-6
            # comment), Argument=0 (reserved, PR #740). Computed via
            # internal/plumbing/ebpf/uformat.Encode directly, bypassing
            # srv6.ComputeSID's argument==0 guard (that guard exists for
            # tenant-VRF SID derivation specifically -- see
            # internal/controller/networkgateway_controller.go's
            # publishSelfAddress doc comment for why this value is
            # supplied statically rather than computed by that
            # reconciler today).
            - name: GALACTIC_GATEWAY_SRV6_ADDRESS
              value: "2001:db8:ff03:2:e000::"
            # datum-cloud/enhancements#865 (egress masquerade): a real,
            # publicly-routable IPv6 address in production (design plan
            # §7.5, no in-cluster derivation mechanism yet); this lab has
            # no real internet uplink, so it reuses a second dedicated
            # loopback address on this node's own fabric-router
            # (resources/fabric-router/iad/frr.conf.iad-gateway1),
            # redistributed the same way that file's own
            # fc00:0:9::1 (this node's BGP session address) already is.
            - name: GALACTIC_GATEWAY_EGRESS_ADDRESS
              value: "fc00:0:9::2"
            # Same locator (Block+Node-ID) as GALACTIC_GATEWAY_SRV6_ADDRESS
            # above -- edgenat.c's egress dispatch only ever compares the
            # top 64 bits (locator_eq, design plan §3.1), so egress_sid
            # can safely share gw_addr's own locator; the low bits shown
            # here (e0ff) are a distinct, obviously-placeholder value only
            # so the two env vars don't look like a copy-paste of each
            # other, not because they carry any meaning of their own (the
            # Argument bits are never read from this configured value at
            # all -- only from each packet's own destination address, at
            # runtime, as that flow's tenant_arg).
            - name: GALACTIC_GATEWAY_EGRESS_SID
              value: "2001:db8:ff03:2:e0ff::"
