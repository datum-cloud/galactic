# The lab's galactic-edge node agent: config/galactic-edge/base, copied in
# as agent/ by scripts/deploy-galactic-edge.sh, with the lab image and
# --mtu=1460, the 1500-byte uplink less the 40-byte encapsulation header.
resources:
  - agent
patches:
  - path: agent-lab-patch.yaml
    target:
      kind: DaemonSet
      name: galactic-edge
