# The sjc lab cluster's FabricTopology; see endpoints.yaml.
apiVersion: galactic.datumapis.com/v1alpha1
kind: FabricTopology
metadata:
  name: lab
  namespace: galactic-system
spec:
  routingDomain: lab
  cell: sjc
  members:
    routers:
      - name: sjc-worker
      - name: sjc-worker2
  reflection:
    # Each edge node reflects for the compute node at the other end of its
    # link, rewriting the next hop to itself; the compute node accepts
    # paths carrying its own AS, which the transit reflects between sites.
    - name: edge-hub
      transports: [link-20]
      families: [ipv4, ipv6]
      updateSource: None
      reflectorSelector:
        matchLabels:
          lab.galactic.datumapis.com/role: hub
      clientSelector:
        matchLabels:
          lab.galactic.datumapis.com/role: spoke
      reflector:
        familySettings:
          - {afi: ipv4, safi: unicast, nextHopMode: SelfForce}
          - {afi: ipv6, safi: unicast, nextHopMode: SelfForce}
      client:
        familySettings:
          - {afi: ipv4, safi: unicast, allowASIn: 1}
          - {afi: ipv6, safi: unicast, allowASIn: 1}
  external:
    # sjc-worker2's transit router, which is not a cluster node.
    - name: transit-sjc-worker2
      routers:
        routers:
          - name: sjc-worker2
      updateSource: None
      peers:
        - {address: 10.1.21.1, asn: 65100}
        - {address: 2001:db8:1:21::1, asn: 65100}
      settings:
        familySettings:
          - {afi: ipv4, safi: unicast, allowASIn: 1}
          - {afi: ipv6, safi: unicast, allowASIn: 1}
