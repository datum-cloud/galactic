namespace: galactic-system
resources:
  - ../base
patches:
  - path: fabric-api-patch.yaml
    target:
      kind: DaemonSet
      name: fabric-api-certs

# One fabric-router.<nodename> ConfigMap per fabric-carrying node (iad: compute, edge, route reflector),
# each carrying that node's frr.conf. Names must match exactly what
# fabric-config-agent looks up, so no hash suffix; a change is applied live
# by the agent's config-agent sidecar instead of by a rollout.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: fabric-router
configMapGenerator:
  - name: fabric-router.iad-worker
    files:
      - frr.conf=frr.conf.iad-worker
  - name: fabric-router.iad-worker2
    files:
      - frr.conf=frr.conf.iad-worker2
  - name: fabric-router.iad-worker3
    files:
      - frr.conf=frr.conf.iad-worker3
  # The fabric-api node sidecar reads site and cell from this ConfigMap once,
  # at start, so it ships with the DaemonSet. The gateway (deploy:fabric-api)
  # reads it too. The lab's cell, site and member cluster name are all the
  # site name.
  - name: fabric-api
    literals:
      - site=iad
      - cell=iad
      - cluster-name=iad
