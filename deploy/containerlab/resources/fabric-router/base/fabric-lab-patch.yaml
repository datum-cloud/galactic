apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fabric-router
spec:
  template:
    spec:
      # Narrower than config/fabric-router/'s default (edge, control, or gateway):
      # iad's control-node fabric pod is deployed separately by
      # resources/fabric-control/iad/, with its own frr.conf for that
      # node's distinct peering — so this per-site overlay sticks to edge
      # and gateway, or the control node would get two competing fabric
      # pods. edge and gateway share this one DaemonSet because both just
      # need an underlay eBGP session brought up before galactic-router
      # starts (config/fabric-router/daemonset.yaml's own doc comment) — nothing
      # about FRR itself differs by role, only the per-node frr.conf key
      # each pod selects via NODE_NAME (../iad/kustomization.yaml's
      # configMapGenerator carries both iad-worker's and iad-gateway1/2's
      # keys in the same fabric-config ConfigMap). dfw/sjc have no
      # gateway-labeled nodes, so this widening is a no-op there.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: galactic.datumapis.com/node
                    operator: In
                    values:
                      - edge
                      - gateway
      initContainers:
        - name: frr-init
          image: fabric-router:latest
          imagePullPolicy: Never
      containers:
        - name: frr
          image: fabric-router:latest
          imagePullPolicy: Never
