# Reflector-side session toward dfw-worker2 (dfw edge)
apiVersion: galactic.datumapis.com/v1alpha1
kind: BGPPeer
metadata:
  name: galactic-router-dfw-worker2
  namespace: galactic-system
spec:
  routerRef:
    name: galactic-control
  peerASN: 65000
  address: "fc00:0:a::1"
  # An edge node's session: when its galactic-router stops, the reflector
  # withdraws the node's Galactic Edge routes within the 9 s hold time.
  holdTime: 9s
  keepaliveTime: 3s
  addressFamilies:
    - afi: l2vpn
      safi: evpn
