apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fabric-router
spec:
  template:
    spec:
      # Narrower than config/fabric-router/'s default (galactic.datumapis.com/fabric=router,
      # matching any role): this is the route-reflector-node-only
      # fabric pod (iad-worker-rr), which needs its own frr.conf distinct
      # from iad's regular per-worker fabric (resources/fabric-router/iad/)
      # — so this overlay sticks to galactic.datumapis.com/galactic=control,
      # or the two would double-schedule onto the same node. This matches
      # against the *other* family's mode value (galactic, not fabric) --
      # iad-worker-rr is still an ordinary fabric=router underlay
      # participant, not itself the underlay's own reflector (see
      # docs/node-labels.md's fabric=control entry, not yet implemented).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: galactic.datumapis.com/galactic
                    operator: In
                    values:
                      - control
      initContainers:
        - name: frr-init
          image: fabric-router:latest
          imagePullPolicy: Never
      containers:
        - name: frr
          image: fabric-router:latest
          imagePullPolicy: Never
