frr defaults traditional
hostname iad-fabric-control
log syslog informational

interface lo
 ! /128 provides a reachable address for galactic-router peers to connect to on port 1790.
 ipv6 address fc00:0:8::1/128
!
interface eth1
 description tr3-facing
 ipv6 address 2001:db8:1:31::2/64
!

ipv6 route fc00:0:8::/48 Null0
!
route-map SET_SRC permit 10
 set src fc00:0:8::1
!
router bgp 65000
 bgp router-id 10.255.255.4
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 neighbor 2001:db8:1:31::1 remote-as 65100
 !
 address-family ipv6 unicast
  neighbor 2001:db8:1:31::1 activate
  neighbor 2001:db8:1:31::1 allowas-in 1
  neighbor 2001:db8:1:31::1 route-map SET_SRC in
  network fc00:0:8::/48
 exit-address-family
!

ipv6 forwarding
