apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-nat
spec:
  template:
    spec:
      containers:
        - name: galactic-nat
          env:
            # dual-homed node: two uplinks, one LACP bond to each edge node;
            # the shard attaches to every member of both. Named explicitly
            # rather than auto-detected: Kind's eth0 carries this node's IPv6
            # default route, so detection would also claim the management
            # bridge. The same override galactic-cni's
            # GALACTIC_CNI_EBPF_INTERFACES carries here.
            - name: GALACTIC_NAT_UPLINK_INTERFACES
              value: bond0,bond1
