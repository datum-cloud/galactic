# One shard per edge node: dfw has two, an active-active pair. Compute
# lists dfw-worker2's first (resources/galactic-cni/dfw/).
apiVersion: network.datumapis.com/v1alpha1
kind: EgressShard
metadata:
  name: dfw-worker2-egress
  namespace: galactic-system
spec:
  targetRef:
    kind: Node
    name: dfw-worker2
  # uFMT uSID over dfw's locator (2001:db8:ff01::/48), nodeID=0x2002
  # (service 2 = NAT shard, node index 002, the edge node's own index --
  # its router is 0x1002 and its gateway 0x3002). Write-once, like every
  # identity field below.
  shardSID: "2001:db8:ff01:2002:e001::"
  # NAT66 masquerade source address, docs-range 2001:db8:9966::/32 block
  shardAddressIPv6: "2001:db8:9966:1::1"
  # NAT64 masquerade source address (RFC 5737 TEST-NET-1) and the
  # fabric-wide /96 it translates for
  shardAddressIPv4: "192.0.2.1"
  nat64Prefix: "2001:db8:64::/96"
---
apiVersion: network.datumapis.com/v1alpha1
kind: EgressShard
metadata:
  name: dfw-worker3-egress
  namespace: galactic-system
spec:
  targetRef:
    kind: Node
    name: dfw-worker3
  # uFMT uSID over dfw's locator (2001:db8:ff01::/48), nodeID=0x2003
  # (service 2 = NAT shard, node index 003, the edge node's own index --
  # its router is 0x1003 and its gateway 0x3003). Write-once, like every
  # identity field below.
  shardSID: "2001:db8:ff01:2003:e001::"
  # NAT66 masquerade source address, docs-range 2001:db8:9966::/32 block
  shardAddressIPv6: "2001:db8:9966:4::1"
  # NAT64 masquerade source address (RFC 5737 TEST-NET-1) and the
  # fabric-wide /96 it translates for
  shardAddressIPv4: "192.0.2.4"
  nat64Prefix: "2001:db8:64::/96"
