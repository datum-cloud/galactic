apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-nat
spec:
  template:
    spec:
      containers:
        - name: galactic-nat
          env:
            # single-homed node: one uplink, an LACP bond the shard attaches
            # to through its members. Named explicitly rather than
            # auto-detected: Kind's eth0 carries this node's IPv6 default
            # route, so detection would also claim the management bridge. The
            # same override galactic-cni's GALACTIC_CNI_EBPF_INTERFACES
            # carries here.
            - name: GALACTIC_NAT_UPLINK_INTERFACES
              value: bond0
