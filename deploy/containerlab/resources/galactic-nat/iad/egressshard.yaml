apiVersion: network.datumapis.com/v1alpha1
kind: EgressShard
metadata:
  name: iad-worker-egress
  namespace: galactic-system
spec:
  targetRef:
    kind: Node
    name: iad-worker
  # uFMT uSID over iad's locator (2001:db8:ff03::/48), nodeID=0x2001
  # (service 2 = NAT shard, node index 001). Write-once, like every
  # identity field below.
  shardSID: "2001:db8:ff03:2001:e001::"
  # NAT66 masquerade source address, docs-range 2001:db8:9966::/32 block
  shardAddressIPv6: "2001:db8:9966:2::1"
  # NAT64 masquerade source address (RFC 5737 TEST-NET-1) and the
  # fabric-wide /96 it translates for
  shardAddressIPv4: "192.0.2.2"
  nat64Prefix: "2001:db8:64::/96"
