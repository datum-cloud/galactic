apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-nat
spec:
  template:
    spec:
      containers:
        - name: galactic-nat
          image: galactic-nat:latest
          imagePullPolicy: Never
          # dispatch, not the base's default direct: the lab runs the shards
          # from the node's shared XDP dispatcher, the mode production edges
          # move to, so every lab deploy exercises it.
          env:
            - name: GALACTIC_NAT_XDP_ATTACH
              value: dispatch
