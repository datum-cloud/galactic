# Lab-only image override, same idea as resources/galactic-gateway/base/
# router-lab-patch.yaml: Kind loads locally-built images by tag, so the
# real ghcr.io/datum-cloud/galactic-nat:<version> reference
# config/galactic-nat/base/daemonset.yaml ships is swapped for the
# locally-tagged image with imagePullPolicy: Never so the kubelet never
# tries to pull it from GHCR.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-nat
spec:
  template:
    spec:
      containers:
        - name: galactic-nat
          image: galactic-nat:latest
          imagePullPolicy: Never
