apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-nat
spec:
  template:
    spec:
      containers:
        - name: galactic-nat
          image: galactic-nat:latest
          imagePullPolicy: Never
          env:
            # Every edge node also runs galactic-gateway
            # (resources/galactic-gateway/), and an interface takes one
            # native XDP program, so the shard runs from its own slot of the
            # node's XDP dispatcher alongside the gateway's. Either can then
            # restart without detaching the other.
            - name: GALACTIC_NAT_XDP_ATTACH
              value: dispatch
