apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-nat
spec:
  template:
    spec:
      containers:
        - name: galactic-nat
          image: galactic-nat:latest
          imagePullPolicy: Never
          # GALACTIC_NAT_XDP_ATTACH stays at the base's default, direct: no
          # lab node runs galactic-gateway, so nothing else holds the uplinks'
          # XDP hook and the shard attaches its own program.
