# Mirrors resources/galactic-gateway/base/'s pattern exactly, pointed at
# config/galactic-nat/base instead of config/galactic-gateway/base:
# "nat" is copied onto the node at deploy time by
# scripts/deploy-galactic-nat.sh's copy_nat_config helper (mirroring
# scripts/deploy-galactic-router.sh's copy_router_gateway_config), nested
# here so this kustomization's "nat" resource reference resolves.
# config/galactic-nat/base is self-contained (its own full
# single-container DaemonSet spec, not a patch onto some other config/
# base), so there is no separate "base" resource to nest alongside it here
# -- same as config/galactic-gateway/base's own equivalent note.
resources:
  - nat
patches:
  - path: nat-lab-patch.yaml
    target:
      kind: DaemonSet
      name: galactic-nat
