apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-nat66
spec:
  template:
    spec:
      # config/galactic-nat66/base/daemonset.yaml's own affinity requires
      # galactic.datumapis.com/node: compute -- iad-worker
      # (node_files/iad/config.yaml, worker-index 1) carries it, reusing
      # that existing compute worker as this site's shard rather than
      # introducing a dedicated node, per the redesign plan's own §8
      # suggestion. iad-worker2/iad-worker-rr (the route reflector,
      # galactic.datumapis.com/galactic-route-reflector, not a
      # galactic.datumapis.com/node value at all) and iad-gateway1/
      # iad-gateway2 (the tainted galactic.datumapis.com/node=edge nodes,
      # see gvpc.clab.yaml and README.md's node table) never carry the
      # compute label, so no affinity override or hostname pin is needed
      # here: iad-worker is the only node in this cluster carrying it,
      # and the base's own affinity already resolves to exactly it --
      # unlike resources/galactic-gateway/iad-gateway1/, which needs a
      # kubernetes.io/hostname pin because iad has *two* edge-labeled
      # nodes needing different per-node env. GALACTIC_NAT66_SHARD_SID/
      # _SHARD_PUB_ADDR below must be unique per shard node (see
      # config/galactic-nat66/kustomization.yaml's doc comment), so
      # dfw/iad/sjc are three separate per-node overlays rather than one
      # overlay matching all three site workers with identical env.
      containers:
        - name: galactic-nat66
          env:
            # eth1 is this lab's dedicated transit-fabric-facing uplink on
            # every node (see resources/galactic-cni/daemonset-patch.yaml's
            # comment) -- the same interface internal/plumbing/ebpf/
            # nat66prog's XDP program attaches to.
            - name: GALACTIC_NAT66_UPLINK_INTERFACE
              value: eth1
            # uFMT 48+16 uSID over iad's own locator (2001:db8:ff03::/48,
            # see resources/galactic-router/iad/bgprouter.yaml's
            # srv6Locator), nodeID=9 -- a dedicated Node-ID reserved for
            # this shard, deliberately NOT iad-worker's own real nodeID=1
            # (an earlier version of this file reused it, on the theory
            # that this shard "runs on that exact physical node, not a
            # separate dedicated node"). That reuse was a real bug, found
            # live: internal/plumbing/ebpf/nat66prog/nat66.c's own
            # locator_matches only checks the top 64 bits (Block+Node-ID)
            # of a packet's outer destination against shard_sid -- see
            # that function's own doc comment -- so reusing iad-worker's
            # Node-ID meant this shard's XDP program silently hijacked
            # *every* ordinary tenant ingress packet addressed to
            # iad-worker's own real delivery uSIDs (same Block+Node-ID,
            # nexthdr also 41) before usid_ingress's TC hook ever saw
            # them. Physical co-location (which node this pod is
            # scheduled to) and uSID identity (which Node-ID a shard's own
            # address claims) are independent; nodeID=9 is free at this
            # site (iad-worker=1, iad-worker-rr=1, iad-gateway1=2,
            # iad-gateway2=3 -- see resources/galactic-router/iad/,
            # resources/galactic-control/iad/, and resources/
            # galactic-gateway/iad-gateway{1,2}/'s own bgprouter.yaml
            # files). Function=End.DT46 (0xE), matching resources/
            # galactic-gateway/iad-gateway1/node-patch.yaml's convention,
            # even though this address is never actually looked up
            # through function_table/vrf_table the way a real uSID is --
            # NAT66ShardStatus.ShardSID's own doc comment says it's
            # advertised as a plain /128 node-reachability route "no
            # VRFID/Function" -- the uFMT encoding here only keeps the
            # address inside iad's locator block. Argument=1 is otherwise
            # unremarkable now that Node-ID alone already guarantees no
            # collision -- kept for continuity with the other two sites'
            # identical choice, still a lab-only placeholder needing real
            # allocation logic (the same gap GALACTIC_GATEWAY_SRV6_ADDRESS
            # and EnvNAT66ShardSID's own doc comment both flag today)
            # before production.
            - name: GALACTIC_NAT66_SHARD_SID
              value: "2001:db8:ff03:9:e001::"
            # Lab-only placeholder masquerade source address, same
            # "operator-supplied, no in-cluster derivation yet" status as
            # GALACTIC_GATEWAY_SRV6_ADDRESS (see
            # internal/config/gateway.go's doc comment). 2001:db8:9966::/32
            # is a new documentation-range (RFC 3849) block reserved here
            # for NAT66 shard public addresses specifically, picked to
            # avoid colliding with any address already in use elsewhere
            # in this topology (transit mesh: 2001:db8:0:*::/64 and
            # 2001:db8:1:*::/64; SRv6 locators: 2001:db8:ff0X::/48; the
            # ns60 ingress VIP: 2001:db8:6060::1) -- "9966" as a mnemonic
            # for "NAT66". ::2 here is iad's shard (shard 2 of 3).
            - name: GALACTIC_NAT66_SHARD_PUB_ADDR
              value: "2001:db8:9966:2::1"
