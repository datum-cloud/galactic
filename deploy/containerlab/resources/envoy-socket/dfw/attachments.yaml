# The proxy's own VPCAttachments, one per ns80 VPC on dfw-worker, which NSO
# creates in production. Both hold the same gateway address on purpose: the
# VPCs overlap, and each VPC's routed link carries it in its own VRF. The
# sidecar selects them by the proxy label and status.node;
# scripts/envoy-socket.sh writes their status (vpc, a vpcAttachment no ns80
# attachment uses, node) as publish-attachments.sh writes a guest's.
apiVersion: galactic.datumapis.com/v1alpha1
kind: VPCAttachment
metadata:
  name: proxy-80
  labels:
    galactic.datumapis.com/proxy: envoy
spec:
  vpc:
    name: "80"
  interface:
    name: envoy
    mode: Netns
    addresses:
      - fd20:80:ff04::1/128
---
apiVersion: galactic.datumapis.com/v1alpha1
kind: VPCAttachment
metadata:
  name: proxy-81
  labels:
    galactic.datumapis.com/proxy: envoy
spec:
  vpc:
    name: "81"
  interface:
    name: envoy
    mode: Netns
    addresses:
      - fd20:80:ff04::1/128
