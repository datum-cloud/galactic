# dfw's second compute node. Same site locator as dfw-worker, its own
# delivery Node-ID (0x1004), so Worker resolves a destination on this node
# to Local here and to Fabric on dfw-worker, and the reverse.
apiVersion: galactic.datumapis.com/v1alpha1
kind: BGPRouter
metadata:
  name: galactic-router-dfw-worker4
  namespace: galactic-system
spec:
  targetRef:
    kind: Node
    name: dfw-worker4
  localASN: 65000
  routerID: "10.0.1.4"
  srv6Locator: "2001:db8:ff01::/48"
  nodeID: 4100
  addressFamilies:
    - afi: l2vpn
      safi: evpn
