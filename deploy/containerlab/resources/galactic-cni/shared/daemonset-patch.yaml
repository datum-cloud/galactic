apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-cni
spec:
  template:
    spec:
      initContainers:
        - name: install-cni
          image: galactic-cni:latest
          imagePullPolicy: Never
          env:
            # GALACTIC_CNI_EGRESS_SHARD_SIDS is per site, not here: each
            # site's compute node egresses only through that site's own edge
            # shards (<site>/egress-shards-patch.yaml).
            # Fabric-wide NAT64 prefix
            - name: GALACTIC_CNI_NAT64_PREFIX
              value: "2001:db8:64::/96"
            # Fabric uplink the eBPF hook attaches to: bond0, the first
            # uplink on every node (see gvpc.clab.yaml's links comment). A
            # bond expands to its master plus members.
            - name: GALACTIC_CNI_EBPF_INTERFACES
              value: bond0
      containers:
        - name: credential-refresh
          image: galactic-cni:latest
          imagePullPolicy: Never
          env:
            # Fabric uplink the eBPF hook attaches to
            - name: GALACTIC_CNI_EBPF_INTERFACES
              value: bond0
