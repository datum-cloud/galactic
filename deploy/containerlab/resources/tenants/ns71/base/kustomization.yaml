# ns71 exists to exercise one specific datapath property: two different
# tenants whose pods hold the *same* ULA, on the *same* worker node,
# egressing through the same shard.
#
# It is the same-node counterpart to ns70. ns70 puts its two pods on
# different nodes, where the connection key's encapsulation source tells
# them apart on its own; here both flows arrive at the shard from one node
# and carry an identical encapsulation source, so the SRv6 Argument is the
# only field left that can separate them. That is what #538 was about: the
# CNI registered the operator-configured shard SID verbatim, every VRF on a
# node encapsulated toward a byte-identical destination, and two tenants
# whose inner tuples also matched shared one connection row and one
# masquerade port -- the second tenant's replies delivered to the first.
#
# The two attachments are two distinct VPCs (71 and 72), not two
# attachments of one VPC: a shared VRF would be one tenant, which is not
# the case under test.
#
# Both pods take their address from ipam.addresses rather than a pool,
# which is what makes the collision exist by construction. The pool path
# cannot produce it: internal/cni/ipam keys its on-disk allocation state by
# the pool CIDR alone (node-local, not per-VPC), so two VPCs configured
# with the same subnet on one node are handed two *different* /96s and
# never collide. The values here are byte-for-byte what that pool path
# would hand the first pod out of fd20:71:ffff::/48 -- gateway at the
# pool's first address, pod in the first /96 after the reserved one -- so
# nothing downstream of IPAM behaves differently from any other tenant in
# this lab.
namespace: ns71
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: netshoot
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: netshoot
      spec:
        template:
          metadata:
            annotations:
              v1.multus-cni.io/default-network: ns71/private
          spec:
            nodeSelector:
              galactic.datumapis.com/node: compute
