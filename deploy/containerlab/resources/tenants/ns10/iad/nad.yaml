---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: private
  namespace: ns10
spec:
  config: |-
    {
      "cniVersion": "1.0.0",
      "name": "private",
      "plugins": [
        {
          "type": "galactic-veth",
          "vpc": "10",
          "vpcattachment": "10",
          "namespace": "galactic-system",
          "ipam": {
            "type": "galactic-ipam",
            "ipv6_subnet": "fd20:10:ff03::/48",
            "address_families": ["ipv6"]
          }
        },
        {
          "type": "galactic-bgp",
          "vpc": "10",
          "vpcattachment": "10",
          "namespace": "galactic-system"
        }
      ]
    }
