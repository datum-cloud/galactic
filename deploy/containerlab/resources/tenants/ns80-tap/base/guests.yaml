# Stands in for an Envoy pod. The handoff run gives it a VRF per VPC and a
# routed link from each to the host's VRF, and opens VRF-bound sockets in it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-standin
  labels:
    app: envoy-standin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-standin
  template:
    metadata:
      labels:
        app: envoy-standin
    spec:
      nodeSelector:
        galactic.datumapis.com/node: compute
      terminationGracePeriodSeconds: 1
      containers:
        - name: envoy
          image: ghcr.io/datum-cloud/galactic-debug@sha256:b64e338f845d06f82f2575ae6bb6855da330af7551a8816b7ade2602a85722f2
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
