# dfw: one TAP attachment in each of ns80's VPCs, with the same address,
# fd20:80:ff03::1:0:0, as secondary attachments of the TAP guests.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vpc-a-tap
  namespace: ns80-tap
spec:
  config: |-
    {
      "cniVersion": "1.0.0",
      "name": "vpc-a-tap",
      "plugins": [
        {
          "type": "galactic-tap",
          "vpc": "80",
          "vpcattachment": "82",
          "namespace": "galactic-system",
          "ipam": {
            "type": "galactic-ipam",
            "addresses": [
              {
                "address": "fd20:80:ff03:0:0:1::/96",
                "gateway": "fd20:80:ff03::1"
              }
            ]
          }
        },
        {
          "type": "galactic-bgp",
          "vpc": "80",
          "vpcattachment": "82",
          "namespace": "galactic-system"
        }
      ]
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vpc-b-tap
  namespace: ns80-tap
spec:
  config: |-
    {
      "cniVersion": "1.0.0",
      "name": "vpc-b-tap",
      "plugins": [
        {
          "type": "galactic-tap",
          "vpc": "81",
          "vpcattachment": "82",
          "namespace": "galactic-system",
          "ipam": {
            "type": "galactic-ipam",
            "addresses": [
              {
                "address": "fd20:80:ff03:0:0:1::/96",
                "gateway": "fd20:80:ff03::1"
              }
            ]
          }
        },
        {
          "type": "galactic-bgp",
          "vpc": "81",
          "vpcattachment": "82",
          "namespace": "galactic-system"
        }
      ]
    }
