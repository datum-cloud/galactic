# The VPCAttachments for ns80's four dfw guests, with the address each
# guest's NAD fixes. Worker takes a destination's addresses only from
# spec.interface.addresses (docs/worker/contract.md, trusted sources), so a
# claim toward a guest whose attachment records none reports
# DestinationAddressUnknown. In production the attachment controller writes
# these; the lab has none, so deploy:ns80 applies them and
# scripts/publish-attachments.sh, which creates only attachments that do not
# exist, writes their status from where each pod runs.
---
apiVersion: galactic.datumapis.com/v1alpha1
kind: VPCAttachment
metadata:
  name: vpc-a
  namespace: ns80
spec:
  vpc:
    name: "80"
  interface:
    name: eth0
    mode: Netns
    addresses:
      - fd20:80:ff01::1:0:0/96
---
apiVersion: galactic.datumapis.com/v1alpha1
kind: VPCAttachment
metadata:
  name: vpc-b
  namespace: ns80
spec:
  vpc:
    name: "81"
  interface:
    name: eth0
    mode: Netns
    addresses:
      - fd20:80:ff01::1:0:0/96
---
apiVersion: galactic.datumapis.com/v1alpha1
kind: VPCAttachment
metadata:
  name: vpc-a2
  namespace: ns80
spec:
  vpc:
    name: "80"
  interface:
    name: eth0
    mode: Netns
    addresses:
      - fd20:80:ff01::2:0:0/96
---
apiVersion: galactic.datumapis.com/v1alpha1
kind: VPCAttachment
metadata:
  name: vpc-b2
  namespace: ns80
spec:
  vpc:
    name: "81"
  interface:
    name: eth0
    mode: Netns
    addresses:
      - fd20:80:ff01::2:0:0/96
