# Lab stand-in for the per-cell fabric-api issuer that infra owns in
# production: the cell's fabric-api CA backs the fabric-api Issuer
# csi-driver requests node and gateway certificates from. The CA is the
# fabric-api-ca Secret, which deploy-fabric-api.sh creates before applying
# this file and never replaces. It also issues the lab's operator
# certificate, used by verify:fabric-api to call nodes and the gateway
# directly. CELL_NAME is replaced with the site name by deploy-fabric-api.sh.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: fabric-api
  namespace: galactic-system
spec:
  ca:
    secretName: fabric-api-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fabric-api-operator
  namespace: galactic-system
spec:
  secretName: fabric-api-operator
  duration: 24h
  renewBefore: 8h
  uris:
    - spiffe://fabric-api.datumapis.com/cell/CELL_NAME/operator/lab-verify
  usages:
    - digital signature
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: fabric-api
    kind: Issuer
