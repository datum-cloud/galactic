# dfw's fabric-api gateway. Its fabric-api ConfigMap comes with the site's
# fabric-router overlay (deploy:fabric); NSO pins a FabricQuery to cluster dfw
# for this cell.
namespace: galactic-system
resources:
  - ../base
patches:
  - target:
      kind: Deployment
      name: fabric-api-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/csi/volumeAttributes/csi.cert-manager.io~1uri-sans
        value: spiffe://fabric-api.datumapis.com/cell/dfw/gateway
