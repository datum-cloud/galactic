# sjc's fabric-api gateway. The lab's cell, site and member cluster name are
# all the site name; NSO pins a FabricQuery to cluster sjc for this cell.
namespace: galactic-system
resources:
  - ../base
configMapGenerator:
  - name: fabric-api
    literals:
      - site=sjc
      - cell=sjc
      - cluster-name=sjc
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Deployment
      name: fabric-api-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/csi/volumeAttributes/csi.cert-manager.io~1uri-sans
        value: spiffe://fabric-api.datumapis.com/cell/sjc/gateway
