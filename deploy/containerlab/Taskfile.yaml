version: '3'

vars:
  LAB:
    sh: awk '/^name:/ {print $2; exit}' *.clab.yaml
  TOPO:
    sh: echo *.clab.yaml
  FRR_VERSION: "10.2.0"
  FABRIC_ROUTER_IMAGE: fabric-router:latest

tasks:
  default:
    silent: true
    cmds:
      - task --list

  build:
    desc: Build all container images
    deps:
      - "build:node"
      - "build:fabric-router"
      - "build:galactic-router"
      - "build:galactic-gateway"
      - "build:galactic-cni"
      - "build:galactic-nat66"

  "build:node":
    desc: Build the Kind node image
    cmds:
      - docker build --network=host -t kindest/node:galactic -f containers/kindest-node-galactic/Dockerfile ../..

  "build:fabric-router":
    desc: Build the fabric-router image (FRR v{{.FRR_VERSION}} + debug tooling)
    cmds:
      - docker build --network=host --build-arg FRR_VERSION={{.FRR_VERSION}} -t {{.FABRIC_ROUTER_IMAGE}} -f ../../containers/fabric-router/Dockerfile ../..

  # --build-context network=../../../network satisfies go.mod's local
  # `replace go.datum.net/network => ../network` (see that line's own
  # comment) inside each Dockerfile's "network" build stage -- see
  # containers/galactic-{router,gateway,cni}/Dockerfile's own comment on
  # that stage for the full mechanism. ../../../network is this Taskfile's
  # own cwd (deploy/containerlab) relative to the network repo checked out
  # as galactic's sibling; harmless to pass even once that replace
  # directive is eventually removed, since the Dockerfile's "network"
  # stage is unused by go.mod at that point regardless of what's passed
  # here.
  "build:galactic-router":
    desc: Build the galactic-router container image
    cmds:
      - docker build --network=host --build-context network=../../../network -t galactic-router:latest -f ../../containers/galactic-router/Dockerfile ../..

  "build:galactic-gateway":
    desc: Build the galactic-gateway container image
    cmds:
      - docker build --network=host --build-context network=../../../network -t galactic-gateway:latest -f ../../containers/galactic-gateway/Dockerfile ../..

  "build:galactic-cni":
    desc: Build the galactic-cni installer image
    cmds:
      - docker build --network=host --build-context network=../../../network -t galactic-cni:latest -f ../../containers/galactic-cni/Dockerfile ../..

  "build:galactic-nat66":
    desc: Build the galactic-nat66 sharded egress datapath image
    cmds:
      - docker build --network=host --build-context network=../../../network -t galactic-nat66:latest -f ../../containers/galactic-nat66/Dockerfile ../..

  deploy:
    desc: Build images and deploy the full lab end-to-end
    deps: [build, host-setup]
    cmds:
      - task: "deploy:clusters"
      - task: "deploy:topology"
      - task: "deploy:lab-xdp-passthrough"
      - task: "deploy:rename-control"
      - task: "deploy:images"
      - task: "deploy:system"
      - task: "deploy:cni"
      - task: "deploy:fabric"
      - task: "deploy:galactic-router"
      - task: "deploy:galactic-nat66"
      - task: "deploy:scenarios"

  "deploy:clusters":
    desc: Create Kind clusters
    cmds:
      - kind create cluster --name dfw --config node_files/dfw/config.yaml --image kindest/node:galactic
      - kind create cluster --name sjc --config node_files/sjc/config.yaml --image kindest/node:galactic
      - kind create cluster --name iad --config node_files/iad/config.yaml --image kindest/node:galactic
      - kind export kubeconfig --name dfw --kubeconfig dfw.kubeconfig
      - kind export kubeconfig --name sjc --kubeconfig sjc.kubeconfig
      - kind export kubeconfig --name iad --kubeconfig iad.kubeconfig

  "deploy:topology":
    desc: Deploy the ContainerLab topology
    cmds:
      - sudo containerlab deploy -t {{.TOPO}}

  "deploy:rename-control":
    desc: Rename iad worker nodes
    cmds:
      - docker rename iad-worker2 iad-worker-control
      - docker rename iad-worker3 iad-gateway1
      - docker rename iad-worker4 iad-gateway2

  require-clang:
    internal: true
    run: once
    cmds:
      - |
        if ! command -v clang >/dev/null 2>&1; then
          echo "ERROR: clang not found on PATH." >&2
          echo "node_files/common/xdp-passthrough.o is compiled from" >&2
          echo "xdp-passthrough.c via clang -target bpf, not committed to" >&2
          echo "git (matching this repo's own bpf2go-output convention) --" >&2
          echo "clang is required to deploy this lab. Install, e.g.:" >&2
          echo "  Fedora/RHEL: sudo dnf install clang llvm" >&2
          echo "  Debian/Ubuntu: sudo apt install clang llvm" >&2
          exit 1
        fi

  "build:lab-xdp-passthrough":
    desc: Compile the lab-only pass-through XDP program (see node_files/common/xdp-passthrough.c)
    deps: [require-clang]
    cmds:
      - clang -O2 -g -target bpf -c node_files/common/xdp-passthrough.c -o node_files/common/xdp-passthrough.o

  "deploy:lab-xdp-passthrough":
    desc: >-
      Load the pass-through XDP program on tr3's gateway-facing links
      (eth6/eth7) -- makes those veth links behave like a real gateway's
      physical NIC uplink for edgedsr.c's XDP_TX redirect (see
      xdp-passthrough.c's own doc comment). Idempotent: `ip link set ...
      xdp obj` replaces whatever program (if any) is already attached.
    deps: [build:lab-xdp-passthrough]
    vars:
      # tr3 is a real containerlab-managed node (kind: linux), unlike the
      # Kind-cluster nodes elsewhere in this Taskfile (kind: ext-container,
      # which keep their bare Kind-assigned names) -- containerlab prefixes
      # its own nodes' container names with "clab-{{.LAB}}-".
      TR3_CONTAINER: "clab-{{.LAB}}-tr3"
    cmds:
      - docker cp node_files/common/xdp-passthrough.o {{.TR3_CONTAINER}}:/xdp-passthrough.o
      # -force: without it, `ip link set ... xdp obj` errors "XDP program
      # already attached" on any re-run instead of replacing it (verified
      # live) -- needed for this task to actually be idempotent.
      - docker exec {{.TR3_CONTAINER}} ip -force link set dev eth6 xdp obj /xdp-passthrough.o sec xdp
      - docker exec {{.TR3_CONTAINER}} ip -force link set dev eth7 xdp obj /xdp-passthrough.o sec xdp

  "load-image":
    internal: true
    desc: Load a docker image into a kind node via ctr (workaround for containerd v2 incompatibility)
    requires:
      vars: [IMAGE, NODE]
    cmds:
      - docker save {{.IMAGE}} | docker exec -i {{.NODE}} ctr --namespace k8s.io images import -

  "deploy:images":
    desc: Load all container images into the Kind clusters
    cmds:
      - task: load-image
        vars: {IMAGE: "{{.FABRIC_ROUTER_IMAGE}}", NODE: iad-worker}
      - task: load-image
        vars: {IMAGE: "{{.FABRIC_ROUTER_IMAGE}}", NODE: iad-worker-control}
      # iad-gateway1/2 need fabric-router (the underlay eBGP session the
      # gateway XDP datapath's uplink depends on -- see config/fabric-router/'s
      # affinity, extended to the gateway role), galactic-router (tenant
      # BGP only, one container in config/galactic-gateway/base's two-container
      # pod), and galactic-gateway (the edge XDP NAT+LB engine, the other
      # container in that pod), but NOT galactic-cni: they never run the
      # CNI DaemonSet at all (it only
      # targets the edge role).
      - task: load-image
        vars: {IMAGE: "{{.FABRIC_ROUTER_IMAGE}}", NODE: iad-gateway1}
      - task: load-image
        vars: {IMAGE: "{{.FABRIC_ROUTER_IMAGE}}", NODE: iad-gateway2}
      - task: load-image
        vars: {IMAGE: galactic-router:latest, NODE: iad-gateway1}
      - task: load-image
        vars: {IMAGE: galactic-router:latest, NODE: iad-gateway2}
      - task: load-image
        vars: {IMAGE: galactic-gateway:latest, NODE: iad-gateway1}
      - task: load-image
        vars: {IMAGE: galactic-gateway:latest, NODE: iad-gateway2}
      - task: load-image
        vars: {IMAGE: "{{.FABRIC_ROUTER_IMAGE}}", NODE: sjc-worker}
      - task: load-image
        vars: {IMAGE: "{{.FABRIC_ROUTER_IMAGE}}", NODE: dfw-worker}
      - task: load-image
        vars: {IMAGE: galactic-router:latest, NODE: iad-worker}
      - task: load-image
        vars: {IMAGE: galactic-router:latest, NODE: iad-worker-control}
      - task: load-image
        vars: {IMAGE: galactic-router:latest, NODE: sjc-worker}
      - task: load-image
        vars: {IMAGE: galactic-router:latest, NODE: dfw-worker}
      - task: load-image
        vars: {IMAGE: galactic-cni:latest, NODE: iad-worker}
      - task: load-image
        vars: {IMAGE: galactic-cni:latest, NODE: iad-worker-control}
      - task: load-image
        vars: {IMAGE: galactic-cni:latest, NODE: sjc-worker}
      - task: load-image
        vars: {IMAGE: galactic-cni:latest, NODE: dfw-worker}
      - task: load-image
        vars: {IMAGE: galactic-nat66:latest, NODE: iad-worker}
      - task: load-image
        vars: {IMAGE: galactic-nat66:latest, NODE: sjc-worker}
      - task: load-image
        vars: {IMAGE: galactic-nat66:latest, NODE: dfw-worker}

  "deploy:system":
    desc: Install CRDs, namespace, and RBAC
    cmds:
      - ./scripts/deploy-system.sh

  "deploy:cni":
    desc: Install Cilium and Multus, then the galactic-cni DaemonSet
    cmds:
      - ./scripts/deploy-cni.sh

  destroy:
    desc: Destroy the lab
    cmds:
      - sudo containerlab destroy -t {{.TOPO}} --cleanup
      - kind delete cluster --name dfw || true
      - kind delete cluster --name sjc || true
      - kind delete cluster --name iad || true

  inspect:
    desc: Inspect deployed nodes and management addresses
    cmds:
      - sudo containerlab inspect -t {{.TOPO}}

  graph:
    desc: Generate a draw.io diagram for the current topology
    cmds:
      - sudo containerlab graph -t {{.TOPO}} --drawio --drawio-dir .

  host-setup:
    desc: Apply host sysctls for this dual-stack lab
    cmds:
      - sudo ./scripts/host-setup.sh

  "deploy:fabric":
    desc: Install the FRR fabric DaemonSets
    cmds:
      - ./scripts/deploy-fabric.sh

  "deploy:galactic-router":
    desc: Install galactic-router DaemonSets and BGP resources
    cmds:
      - ./scripts/deploy-galactic-router.sh

  "deploy:galactic-nat66":
    desc: Install the sharded NAT66 egress DaemonSet and NAT66Shard objects
    cmds:
      - ./scripts/deploy-galactic-nat66.sh

  "deploy:scenarios":
    desc: Deploy all VPC test scenarios
    cmds:
      - task: "deploy:ns10"
      - task: "deploy:ns20"
      - task: "deploy:ns30"
      - task: "deploy:ns40"
      - task: "deploy:ns60"

  "deploy:ns10":
    desc: Deploy ns10 test VPC (IPv6-only, fd20 ULA)
    cmds:
      - ./scripts/deploy-ns.sh ns10 dfw sjc iad

  "deploy:ns20":
    desc: Deploy ns20 test VPC (dual-stack, fd20 ULA + IPv4)
    cmds:
      - ./scripts/deploy-ns.sh ns20 dfw sjc iad

  "deploy:ns30":
    desc: Deploy ns30 test VPC (dfw only, 2 pods)
    cmds:
      - ./scripts/deploy-ns.sh ns30 dfw

  "deploy:ns40":
    desc: Deploy ns40 test VPC (iad only, 2 pods)
    cmds:
      - ./scripts/deploy-ns.sh ns40 iad

  "deploy:ns60":
    desc: Deploy ns60 test VPC, nginx backend for the gateway canary
    cmds:
      - ./scripts/deploy-ns.sh ns60 iad

  verify:
    desc: Run all verification checks
    cmds:
      - task: "verify:bgp-transit"
      - task: "verify:bgp-fabric"
      - task: "verify:bgp-peers"
      - task: "verify:srv6"
      - task: "verify:evpn"
      - task: "verify:gateway"
      - task: "verify:nat66-sharding"
      - task: "verify:scenarios"

  "verify:bgp-transit":
    desc: Verify transit router BGP sessions (iBGP full mesh)
    cmds:
      - |
        for r in tr1 tr2 tr3 tr4; do
          echo "--- $r ---"
          docker exec clab-gvpc-$r vtysh -c "show bgp ipv6 unicast summary"
        done

  "verify:bgp-fabric":
    desc: Verify fabric BGP sessions on dfw, iad, and sjc workers
    cmds:
      - |
        docker exec dfw-control-plane \
          kubectl exec -n galactic-system ds/fabric-router \
          -- vtysh -c "show bgp ipv6 unicast summary"
      - |
        docker exec iad-control-plane \
          kubectl exec -n galactic-system ds/fabric-router \
          -- vtysh -c "show bgp ipv6 unicast summary"
      - |
        docker exec sjc-control-plane \
          kubectl exec -n galactic-system ds/fabric-router \
          -- vtysh -c "show bgp ipv6 unicast summary"
      - |
        docker exec iad-control-plane \
          kubectl exec -n galactic-system ds/fabric-control \
          -- vtysh -c "show bgp ipv6 unicast summary"

  "verify:bgp-peers":
    desc: Verify galactic-router BGP peer sessions (GoBGP)
    cmds:
      - docker exec dfw-control-plane kubectl get bgppeers -n galactic-system
      - docker exec sjc-control-plane kubectl get bgppeers -n galactic-system
      - docker exec iad-control-plane kubectl get bgppeers -n galactic-system

  "verify:srv6":
    desc: Verify each site's SRv6 locator prefix on tr1
    cmds:
      - docker exec clab-gvpc-tr1 vtysh -c "show bgp ipv6 unicast 2001:db8:ff01::/48"
      - docker exec clab-gvpc-tr1 vtysh -c "show bgp ipv6 unicast 2001:db8:ff02::/48"
      - docker exec clab-gvpc-tr1 vtysh -c "show bgp ipv6 unicast 2001:db8:ff03::/48"

  "verify:evpn":
    desc: Verify EVPN routes via BGPRouter status
    cmds:
      - docker exec iad-control-plane kubectl get bgprouters -A
      - docker exec sjc-control-plane kubectl get bgprouters -A
      - docker exec dfw-control-plane kubectl get bgprouters -A

  "verify:gateway":
    desc: Verify iad's gateway canary CRDs exist
    cmds:
      - docker exec iad-control-plane kubectl get networkgateways,networkrules -n galactic-system
      - docker exec iad-control-plane kubectl get daemonset -n galactic-system -l app.kubernetes.io/name=galactic-gateway

  "verify:nat66-sharding":
    desc: Verify each site's NAT66Shard is Ready and its shard SID is advertised
    cmds:
      - |
        for site in dfw sjc iad; do
          echo "--- ${site} ---"
          docker exec ${site}-control-plane kubectl get nat66shards -n galactic-system -o wide
          docker exec ${site}-control-plane kubectl get bgpadvertisements -n galactic-system
        done

  "verify:scenarios":
    desc: Verify ping across all VPC test scenarios
    cmds:
      - task: "verify:ns10"
      - task: "verify:ns20"
      - task: "verify:ns30"
      - task: "verify:ns40"

  "verify:ns10":
    desc: Verify ns10 ping (IPv6-only, 3-site mesh)
    cmds:
      - ./scripts/verify-ns10.sh

  "verify:ns20":
    desc: Verify ns20 ping (dual-stack, 3-site mesh)
    cmds:
      - ./scripts/verify-ns20.sh

  "verify:ns30":
    desc: Verify ns30 ping (dfw only, 2 pods)
    cmds:
      - ./scripts/verify-ns30.sh

  "verify:ns40":
    desc: Verify ns40 ping (iad only, 2 pods)
    cmds:
      - ./scripts/verify-ns40.sh

  clean:
    desc: Destroy the lab and delete artifacts
    cmds:
      - task: destroy
      - docker rmi kindest/node:galactic || true
      - docker rmi galactic-router:latest || true
      - docker rmi galactic-gateway:latest || true
      - docker rmi galactic-cni:latest || true
      - docker rmi {{.FABRIC_ROUTER_IMAGE}} || true
      - rm -rf clab-{{.LAB}} build/
      - rm -f dfw.kubeconfig sjc.kubeconfig iad.kubeconfig
