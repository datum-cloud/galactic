version: '3'

vars:
  LAB:
    sh: awk '/^name:/ {print $2; exit}' *.clab.yaml
  TOPO:
    sh: echo *.clab.yaml
  FRR_VERSION: "10.2.0"
  FABRIC_ROUTER_IMAGE: fabric-router:latest

tasks:
  default:
    silent: true
    cmds:
      - task --list

  build:
    desc: Build all container images
    deps:
      - "build:node"
      - "build:fabric-router"
      - "build:galactic-router"
      - "build:galactic-gateway"
      - "build:galactic-cni"
      - "build:galactic-nat"
      - "build:remote-host"

  "build:node":
    desc: Build the Kind node image
    cmds:
      - docker build --network=host -t kindest/node:galactic -f containers/kindest-node-galactic/Dockerfile ../..

  "build:fabric-router":
    desc: Build the fabric-router image (FRR v{{.FRR_VERSION}})
    cmds:
      - docker build --network=host --build-arg FRR_VERSION={{.FRR_VERSION}} -t {{.FABRIC_ROUTER_IMAGE}} -f ../../containers/fabric-router/Dockerfile ../..

  # --build-context network=../../../network satisfies go.mod's local
  # `replace go.datum.net/network => ../network` (see that line's own
  # comment) inside each Dockerfile's "network" build stage -- see
  # containers/galactic-{router,gateway,cni}/Dockerfile's own comment on
  # that stage for the full mechanism. ../../../network is this Taskfile's
  # own cwd (deploy/containerlab) relative to the network repo checked out
  # as galactic's sibling; harmless to pass even once that replace
  # directive is eventually removed, since the Dockerfile's "network"
  # stage is unused by go.mod at that point regardless of what's passed
  # here.
  "build:galactic-router":
    desc: Build the galactic-router container image
    cmds:
      - docker build --network=host --build-context network=../../../network -t galactic-router:latest -f ../../containers/galactic-router/Dockerfile ../..

  "build:galactic-gateway":
    desc: Build the galactic-gateway container image
    cmds:
      - docker build --network=host --build-context network=../../../network -t galactic-gateway:latest -f ../../containers/galactic-gateway/Dockerfile ../..

  "build:galactic-cni":
    desc: Build the galactic-cni installer image
    cmds:
      - docker build --network=host --build-context network=../../../network -t galactic-cni:latest -f ../../containers/galactic-cni/Dockerfile ../..

  "build:galactic-nat":
    desc: Build the galactic-nat egress datapath image
    cmds:
      - docker build --network=host --build-context network=../../../network -t galactic-nat:latest -f ../../containers/galactic-nat/Dockerfile ../..

  "build:remote-host":
    desc: Build the off-fabric remote host image (nginx)
    cmds:
      - docker build --network=host -t remote-host:latest -f ../../containers/remote-host/Dockerfile ../..

  deploy:
    desc: Build images and deploy the full lab
    deps: [build, host-setup]
    cmds:
      - task: "deploy:clusters"
      # No rename step: Kind's own sequential worker names are used verbatim
      # everywhere, so the containers already carry the names gvpc.clab.yaml
      # and every manifest refer to them by.
      - task: "deploy:topology"
      - task: "deploy:lab-xdp-passthrough"
      - task: "deploy:images"
      - task: "deploy:system"
      - task: "deploy:cni"
      - task: "deploy:fabric"
      - task: "deploy:galactic-router"
      - task: "deploy:galactic-nat"
      - task: "deploy:scenarios"

  "deploy:clusters":
    desc: Create Kind clusters
    cmds:
      - kind create cluster --name dfw --config node_files/dfw/config.yaml --image kindest/node:galactic
      - kind create cluster --name sjc --config node_files/sjc/config.yaml --image kindest/node:galactic
      - kind create cluster --name iad --config node_files/iad/config.yaml --image kindest/node:galactic
      - kind export kubeconfig --name dfw --kubeconfig dfw.kubeconfig
      - kind export kubeconfig --name sjc --kubeconfig sjc.kubeconfig
      - kind export kubeconfig --name iad --kubeconfig iad.kubeconfig

  "deploy:topology":
    desc: Deploy the ContainerLab topology
    cmds:
      - sudo containerlab deploy -t {{.TOPO}}

  require-clang:
    internal: true
    run: once
    cmds:
      - |
        if ! command -v clang >/dev/null 2>&1; then
          echo "ERROR: clang not found on PATH." >&2
          echo "node_files/common/xdp-passthrough.o is compiled from" >&2
          echo "xdp-passthrough.c via clang -target bpf, not committed to" >&2
          echo "git (matching this repo's own bpf2go-output convention) --" >&2
          echo "clang is required to deploy this lab. Install, e.g.:" >&2
          echo "  Fedora/RHEL: sudo dnf install clang llvm" >&2
          echo "  Debian/Ubuntu: sudo apt install clang llvm" >&2
          exit 1
        fi

  "build:lab-xdp-passthrough":
    desc: Compile the lab-only pass-through XDP program
    deps: [require-clang]
    cmds:
      - clang -O2 -g -target bpf -c node_files/common/xdp-passthrough.c -o node_files/common/xdp-passthrough.o

  # Loads the pass-through XDP program on every transit port facing an
  # edge node -- makes those veth links behave like a real gateway's
  # physical NIC uplink for edgedsr.c's XDP_TX redirect (see
  # xdp-passthrough.c's own doc comment). Idempotent: `ip link set ... xdp
  # obj` replaces whatever program (if any) is already attached.
  "deploy:lab-xdp-passthrough":
    desc: Load the pass-through XDP program on edge-facing transit ports
    deps: [build:lab-xdp-passthrough]
    cmds:
      # Every transit port facing an edge node, and only those: edge nodes
      # are the lab's only transit-facing nodes, so these are exactly the
      # links an edge XDP_TX redirect ever lands on. tr1:eth1/eth5 face
      # dfw-worker2/dfw-worker3, tr2:eth1 faces sjc-worker2, tr3:eth4 faces
      # iad-worker2 -- keep this list in step with gvpc.clab.yaml's edge
      # uplinks and node_files/tr*/frr.conf's interface descriptions. The
      # transit routers are real containerlab-managed nodes (kind: linux),
      # unlike the Kind-cluster nodes elsewhere in this Taskfile (kind:
      # ext-container, which keep their bare Kind-assigned names) --
      # containerlab prefixes its own nodes' container names with
      # "clab-{{.LAB}}-".
      - |
        set -e
        for pair in tr1:eth1 tr1:eth5 tr2:eth1 tr3:eth4; do
          tr=${pair%%:*}; iface=${pair##*:}
          container="clab-{{.LAB}}-${tr}"
          docker cp node_files/common/xdp-passthrough.o "${container}:/xdp-passthrough.o"
          # -force: without it, `ip link set ... xdp obj` errors "XDP
          # program already attached" on any re-run instead of replacing it
          # (verified live) -- needed for this task to be idempotent.
          docker exec "${container}" ip -force link set dev "${iface}" xdp obj /xdp-passthrough.o sec xdp
        done

  "deploy:images":
    desc: Load all container images into Kind
    vars:
      # Every worker in every cluster runs fabric-router (the underlay eBGP
      # session everything else depends on) and galactic-router (EVPN --
      # plain mode on compute/edge, reflector mode on iad-worker3).
      FABRIC_NODES: >-
        dfw-worker dfw-worker2 dfw-worker3
        sjc-worker sjc-worker2
        iad-worker iad-worker2 iad-worker3
      # galactic-cni goes everywhere galactic.datumapis.com/galactic=router
      # is set -- compute and edge alike, but never the reflector, whose
      # galactic=control value is mutually exclusive with it.
      CNI_NODES: >-
        dfw-worker dfw-worker2 dfw-worker3
        sjc-worker sjc-worker2
        iad-worker iad-worker2
      # The edge XDP DSR/Maglev datapath: one instance per edge node.
      GATEWAY_NODES: "dfw-worker2 dfw-worker3 sjc-worker2 iad-worker2"
      # Egress shards reuse each site's compute worker (design plan §8).
      NAT_NODES: "dfw-worker sjc-worker iad-worker"
    cmds:
      - |
        set -e
        load() {
          image="$1"; shift
          for node in "$@"; do
            echo "--- ${image} -> ${node} ---"
            docker save "${image}" | docker exec -i "${node}" \
              ctr --namespace k8s.io images import -
          done
        }
        load {{.FABRIC_ROUTER_IMAGE}} {{.FABRIC_NODES}}
        load galactic-router:latest {{.FABRIC_NODES}}
        load galactic-cni:latest {{.CNI_NODES}}
        load galactic-gateway:latest {{.GATEWAY_NODES}}
        load galactic-nat:latest {{.NAT_NODES}}

  "deploy:system":
    desc: Install CRDs, namespace, and RBAC
    cmds:
      - ./scripts/deploy-system.sh

  "deploy:cni":
    desc: Install Cilium, Multus, and galactic-cni
    cmds:
      - ./scripts/deploy-cni.sh

  destroy:
    desc: Destroy the lab
    cmds:
      - sudo containerlab destroy -t {{.TOPO}} --cleanup
      - kind delete cluster --name dfw || true
      - kind delete cluster --name sjc || true
      - kind delete cluster --name iad || true

  inspect:
    desc: List deployed nodes and mgmt addresses
    cmds:
      - sudo containerlab inspect -t {{.TOPO}}

  graph:
    desc: Generate a draw.io diagram of the topology
    cmds:
      - sudo containerlab graph -t {{.TOPO}} --drawio --drawio-dir .

  host-setup:
    desc: Apply host sysctls for this dual-stack lab
    cmds:
      - sudo ./scripts/host-setup.sh

  "deploy:fabric":
    desc: Install the FRR fabric DaemonSet
    cmds:
      - ./scripts/deploy-fabric.sh

  "deploy:galactic-router":
    desc: Install galactic-router and BGP resources
    cmds:
      - ./scripts/deploy-galactic-router.sh

  "deploy:galactic-nat":
    desc: Install the NAT egress DaemonSet and shards
    cmds:
      - ./scripts/deploy-galactic-nat.sh

  "deploy:scenarios":
    desc: Deploy all VPC test scenarios
    cmds:
      - task: "deploy:ns10"
      - task: "deploy:ns20"
      - task: "deploy:ns30"
      - task: "deploy:ns40"
      - task: "deploy:ns60"
      - task: "deploy:ns70"
      - task: "deploy:ns71"

  "deploy:ns10":
    desc: Deploy ns10 test VPC (IPv6-only, fd20 ULA)
    cmds:
      - ./scripts/deploy-ns.sh ns10 dfw sjc iad

  "deploy:ns20":
    desc: Deploy ns20 test VPC (dual-stack)
    cmds:
      - ./scripts/deploy-ns.sh ns20 dfw sjc iad

  "deploy:ns30":
    desc: Deploy ns30 test VPC (dfw only, 2 pods)
    cmds:
      - ./scripts/deploy-ns.sh ns30 dfw

  "deploy:ns40":
    desc: Deploy ns40 test VPC (iad only, 2 pods)
    cmds:
      - ./scripts/deploy-ns.sh ns40 iad

  "deploy:ns70":
    desc: Deploy ns70 test VPC (overlapping ULA on two sites, collision fixture)
    cmds:
      - ./scripts/deploy-ns.sh ns70 iad sjc

  "deploy:ns71":
    desc: Deploy ns71 test VPCs (overlapping ULA on one node, same-node collision fixture)
    cmds:
      - ./scripts/deploy-ns.sh ns71 sjc

  "deploy:ns60":
    desc: Deploy ns60 test VPC (gateway backend, one per site)
    cmds:
      - ./scripts/deploy-ns.sh ns60 dfw sjc iad

  verify:
    desc: Run all verification checks
    cmds:
      - task: "verify:bgp-transit"
      - task: "verify:bgp-fabric"
      - task: "verify:bgp-peers"
      - task: "verify:underlay"
      - task: "verify:srv6"
      - task: "verify:evpn"
      - task: "verify:gateway"
      - task: "verify:gateway-ingress"
      - task: "verify:nat-sharding"
      - task: "verify:nat-egress"
      - task: "verify:nat-collision"
      - task: "verify:nat-collision-samenode"
      - task: "verify:scenarios"

  "verify:bgp-transit":
    desc: Verify transit router BGP sessions (both address families)
    cmds:
      - |
        for r in tr1 tr2 tr3 tr4; do
          echo "--- $r (ipv6) ---"
          docker exec clab-gvpc-$r vtysh -c "show bgp ipv6 unicast summary"
          echo "--- $r (ipv4) ---"
          docker exec clab-gvpc-$r vtysh -c "show bgp ipv4 unicast summary"
        done

  "verify:bgp-fabric":
    desc: Verify fabric BGP sessions on all sites (both address families)
    cmds:
      - |
        for site in dfw iad sjc; do
          for af in ipv6 ipv4; do
            echo "--- ${site} (${af}) ---"
            docker exec ${site}-control-plane \
              kubectl exec -n galactic-system ds/fabric-router \
              -- vtysh -c "show bgp ${af} unicast summary"
          done
        done

  "verify:bgp-peers":
    desc: Verify galactic-router BGP peer sessions
    cmds:
      - docker exec dfw-control-plane kubectl get bgppeers -n galactic-system
      - docker exec sjc-control-plane kubectl get bgppeers -n galactic-system
      - docker exec iad-control-plane kubectl get bgppeers -n galactic-system

  "verify:underlay":
    desc: Verify dual-stack underlay loopback reachability from tr1
    cmds:
      # Sourced from tr1's own loopback, not the link address: the transit
      # carries per-node loopbacks only (/32 and /128), never the numbered
      # link subnets, so a ping sourced from eth1 has no return path.
      - |
        fail=0
        for lo in 10.255.255.1 10.255.255.2 10.255.255.3 10.255.255.4 \
                  10.255.255.5 10.255.255.6 10.255.255.7 10.255.255.8 \
                  10.255.255.101 10.255.255.102 10.255.255.103; do
          if docker exec clab-gvpc-tr1 ping -c1 -W2 -I 10.255.255.100 "$lo" >/dev/null 2>&1; then
            echo "ok    ipv4 tr1 -> $lo"
          else
            echo "FAIL  ipv4 tr1 -> $lo"; fail=1
          fi
        done
        for lo in fc00:0:2::1 fc00:0:3::1 fc00:0:4::1 fc00:0:8::1 fc00:0:9::1 \
                  fc00:0:a::1 fc00:0:b::1 fc00:0:c::1 \
                  fc00:0:5::1 fc00:0:6::1 fc00:0:7::1; do
          if docker exec clab-gvpc-tr1 ping -6 -c1 -W2 -I fc00:0:1::1 "$lo" >/dev/null 2>&1; then
            echo "ok    ipv6 tr1 -> $lo"
          else
            echo "FAIL  ipv6 tr1 -> $lo"; fail=1
          fi
        done
        exit $fail

  "verify:srv6":
    desc: Verify each site's SRv6 locator prefix
    cmds:
      - docker exec clab-gvpc-tr1 vtysh -c "show bgp ipv6 unicast 2001:db8:ff01::/48"
      - docker exec clab-gvpc-tr1 vtysh -c "show bgp ipv6 unicast 2001:db8:ff02::/48"
      - docker exec clab-gvpc-tr1 vtysh -c "show bgp ipv6 unicast 2001:db8:ff03::/48"

  "verify:evpn":
    desc: Verify EVPN routes via BGPRouter status
    cmds:
      - docker exec iad-control-plane kubectl get bgprouters -A
      - docker exec sjc-control-plane kubectl get bgprouters -A
      - docker exec dfw-control-plane kubectl get bgprouters -A

  "verify:gateway":
    desc: Verify every site's edge gateway CRDs and DaemonSets
    cmds:
      - |
        for site in dfw sjc iad; do
          echo "--- ${site} ---"
          docker exec ${site}-control-plane \
            kubectl get networkgateways,networkrules,servicevipbindings -n galactic-system
          docker exec ${site}-control-plane \
            kubectl get daemonset -n galactic-system -l app.kubernetes.io/name=galactic-gateway
        done

  # verify:gateway above reads CRDs and DaemonSets, so it passes on a datapath
  # where no connection can complete -- the same shape as #551. This drives a
  # real request from the one host outside every cluster (remote-host on tr4)
  # to the anycast ingress VIP and reads what came back, on the wire and in the
  # counters.
  #
  # Four assertions, because a 200 alone would not tell them apart:
  #
  #   - The VIP answers. Both halves of the connection worked at all.
  #   - A backend logged the request, with the off-fabric client's own address
  #     as its peer. That is DSR's defining property -- the client's packet
  #     reaches the backend unmodified -- and it is what separates a real
  #     round trip from some other nginx in the lab answering.
  #   - The gateway counted the request and the reply. Traffic that took the
  #     kernel's own forwarding path instead of the datapath would still
  #     return 200 while both counters sat still.
  #   - No edge node dropped a packet as ctstate INVALID. The reply crossing
  #     the kernel forwarding path rather than edge_return is exactly what
  #     that counter catches, and nothing else in this lab moves it.
  #
  # Which site answers is transit best-path's choice, not this task's, so
  # everything here discovers the serving site rather than assuming one. Note
  # that only that site is exercised: a second site's gateways stay untested
  # until best-path moves.
  #
  # Needs deploy:ns60's backends (the `deploy` task installs them).
  "verify:gateway-ingress":
    desc: Full round trip from the off-fabric client to an anycast ingress VIP
    # silent: the script is long enough that echoing it buries the result.
    silent: true
    vars:
      VIP: "2001:db8:6060::1"
      # remote-host on tr4, the one host outside every cluster.
      CLIENT: "2001:db8:1:40::2"
      EDGE_NODES: "dfw-worker2 dfw-worker3 sjc-worker2 iad-worker2"
      SITES: "dfw sjc iad"
      METRICS_PORT: "8081"
    cmds:
      - |
        set -e
        marker="galactic-verify-$(date +%s)"

        # One sample per edge node: the kernel's invalid-drop counter plus the
        # three datapath counters, as "<invalid> <forward> <return> <drops>".
        # The KUBE-FORWARD rule is matched on its text rather than its
        # position -- kube-proxy owns that chain and its ordering is not ours
        # to assume.
        sample() {
          inv=$(docker exec "$1" ip6tables -t filter -L KUBE-FORWARD -n -v -x 2>/dev/null \
            | awk '/ctstate INVALID/ {print $1; exit}')
          m=$(docker exec "$1" curl -s --max-time 5 http://localhost:{{.METRICS_PORT}}/metrics 2>/dev/null || true)
          fwd=$(printf '%s\n' "${m}" | awk '/^galactic_edge_rule_packets_total/ {s+=$2} END {print s+0}')
          ret=$(printf '%s\n' "${m}" | awk '/^galactic_edge_return_packets_total/ {s+=$2} END {print s+0}')
          drp=$(printf '%s\n' "${m}" | awk '/^galactic_edge_drops_total/ {s+=$2} END {print s+0}')
          echo "${inv:-0} ${fwd} ${ret} ${drp}"
        }

        # Counter values are Prometheus floats, so compare in awk rather than
        # with shell integer tests.
        rose() { awk -v a="$1" -v b="$2" 'BEGIN {exit !(b > a)}'; }

        snap=$(mktemp -d)
        for node in {{.EDGE_NODES}}; do sample ${node} > ${snap}/${node}; done

        echo "--- GET http://[{{.VIP}}]/ from the off-fabric client ---"
        code=$(docker exec clab-gvpc-remote-host curl -sS --max-time 12 -A "${marker}" \
          -o /dev/null -w '%{http_code}' "http://[{{.VIP}}]/") && rc=0 || rc=$?
        if [ "${rc}" -ne 0 ]; then
          echo "FAIL: no response from the VIP (curl exit ${rc}) -- the request never reached a backend," \
               "or its reply never came back" >&2
          exit 1
        fi
        if [ "${code}" != "200" ]; then
          echo "FAIL: VIP answered HTTP ${code}, want 200" >&2
          exit 1
        fi

        # Which backend served it, and what it saw as the client.
        served=""
        for site in {{.SITES}}; do
          cp=${site}-control-plane
          pods=$(docker exec ${cp} kubectl -n ns60 get pods \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)
          for pod in ${pods}; do
            line=$(docker exec ${cp} kubectl -n ns60 logs ${pod} --tail=200 2>/dev/null \
              | grep "${marker}" | tail -1 || true)
            if [ -n "${line}" ]; then served="${site}/${pod}"; served_line="${line}"; fi
          done
        done
        if [ -z "${served}" ]; then
          echo "FAIL: the VIP answered 200 but no ns60 backend logged the request -- something other than a" \
               "tenant backend answered (or ns60 is not deployed: run deploy:ns60)" >&2
          exit 1
        fi
        peer=$(echo "${served_line}" | awk '{print $1}')
        if [ "${peer}" != "{{.CLIENT}}" ]; then
          echo "FAIL: ${served} saw the client as ${peer}, want {{.CLIENT}} -- DSR must carry the client's" \
               "own address to the backend unmodified" >&2
          exit 1
        fi
        echo "served by ${served}, which saw the client as ${peer}"

        # The datapath's own account of the same request.
        fwd_moved=0
        ret_moved=0
        for node in {{.EDGE_NODES}}; do
          set -- $(cat ${snap}/${node}); was_inv=$1; was_fwd=$2; was_ret=$3; was_drp=$4
          set -- $(sample ${node});      now_inv=$1; now_fwd=$2; now_ret=$3; now_drp=$4

          if [ "${now_inv:-0}" -gt "${was_inv:-0}" ]; then
            echo "FAIL: ${node} dropped $((now_inv - was_inv)) packet(s) as ctstate INVALID -- a reply crossed" \
                 "the kernel forwarding path instead of the return datapath (#554)" >&2
            exit 1
          fi
          if rose "${was_drp}" "${now_drp}"; then
            echo "FAIL: ${node}'s datapath counted a drop during this request (galactic_edge_drops_total" \
                 "${was_drp} -> ${now_drp}); see its drops_total reason labels" >&2
            exit 1
          fi
          if rose "${was_fwd}" "${now_fwd}"; then fwd_moved=1; echo "forward half claimed by ${node}"; fi
          if rose "${was_ret}" "${now_ret}"; then ret_moved=1; echo "reply forwarded by ${node}"; fi
        done

        if [ "${fwd_moved}" -eq 0 ]; then
          echo "FAIL: no gateway counted the request (galactic_edge_rule_packets_total did not move) -- the VIP" \
               "answered without the XDP datapath intercepting anything" >&2
          exit 1
        fi
        if [ "${ret_moved}" -eq 0 ]; then
          echo "FAIL: no gateway counted the reply (galactic_edge_return_packets_total did not move) -- the" \
               "reply took the kernel forwarding path, which survives only while conntrack happens to allow it" >&2
          exit 1
        fi
        rm -rf ${snap}

        echo "PASS: VIP answered 200, backend saw the real client, both halves counted, no invalid drops"

  "verify:nat-sharding":
    desc: Verify each site's EgressShard and shard SID
    cmds:
      - |
        for site in dfw sjc iad; do
          echo "--- ${site} ---"
          docker exec ${site}-control-plane kubectl get egressshards -n galactic-system -o wide
          docker exec ${site}-control-plane kubectl get bgpadvertisements -n galactic-system
        done

  "verify:nat-egress":
    desc: Prove a tenant's packet is actually translated, not just that the shards exist
    cmds:
      # verify:nat-sharding above reads CRDs and proves only that the control
      # plane agrees with itself. This drives a real packet through the
      # datapath and reads what came out on the wire.
      #
      # dfw's tenants egress through sjc's shard: a node cannot resolve its own
      # self-originated shard SID, so dfw falls through to the next configured
      # one. That is why the sender and the capture are on different sites.
      #
      # Three things are checked, each of which has been broken at some point:
      # the EtherType (the decapsulated frame needs a rebuilt link header, or
      # the kernel dispatches it on stale packet bytes and it reaches no
      # protocol handler), the source address (the whole point of the
      # translation), and the masquerade port's range.
      #
      # The drop check is a delta across the probe, not an absolute reading.
      # galactic_nat_drops_total lives in a pinned map (natattach.PinDir) that
      # a restarting shard reuses as-is, so the counters are cumulative for the
      # life of the node, not the process. Failing on any non-zero value made
      # one long-healed transient -- a link flap, ICMP through a TCP/UDP-only
      # shard -- fail every later run, including runs where the translation
      # provably worked, and clearing it took bpftool map surgery (#546). Only
      # a counter that moves while this task is probing means anything.
      - |
        set -e
        shard=$(docker exec sjc-control-plane kubectl -n galactic-system get egressshard \
          -o jsonpath='{.items[0].status.shardAddressIPv6}')
        if [ -z "${shard}" ]; then
          echo "FAIL: sjc's EgressShard publishes no IPv6 masquerade address" >&2
          exit 1
        fi
        echo "sjc shard masquerade address: ${shard}"

        snap=$(mktemp -d)
        trap 'rm -rf "${snap}"' EXIT

        # One scrape serves both checks below, so the conn-table reading and
        # the drop reading describe the same instant.
        conns_of() { awk -F' ' '/^galactic_nat_conns\{family="nat66"\}/ {print $2}'; }
        drops_of() { awk '/^galactic_nat_drops_total/ {print $1, $2}' | sort; }

        metrics=$(docker exec sjc-worker curl -s --max-time 4 http://localhost:9182/metrics)
        before=$(printf '%s\n' "${metrics}" | conns_of)
        printf '%s\n' "${metrics}" | drops_of > "${snap}/drops.before"

        docker exec sjc-worker timeout 16 tcpdump -i eth1 -nn -e -c 2 \
          "ip6 and src ${shard}" >/tmp/nat-egress.txt 2>&1 &
        sleep 2
        pod=$(docker exec dfw-control-plane kubectl -n ns10 get pods -o jsonpath='{.items[0].metadata.name}')
        docker exec dfw-control-plane kubectl -n ns10 exec "${pod}" -- \
          timeout 6 bash -c 'for i in 1 2; do echo probe | nc -u -w1 2001:db8:1:10::1 9999; done' \
          >/dev/null 2>&1 || true
        wait

        if ! grep -q "ethertype IPv6 (0x86dd)" /tmp/nat-egress.txt; then
          echo "FAIL: no translated packet reached the wire with a valid IPv6 EtherType" >&2
          cat /tmp/nat-egress.txt >&2
          exit 1
        fi
        port=$(grep -oE "${shard}\.[0-9]+" /tmp/nat-egress.txt | head -1 | sed "s/.*\.//")
        if [ -z "${port}" ] || [ "${port}" -lt 32768 ] || [ "${port}" -ge 60768 ]; then
          echo "FAIL: masquerade port '${port}' outside the datapath's PAT range [32768,60768)" >&2
          exit 1
        fi

        metrics=$(docker exec sjc-worker curl -s --max-time 4 http://localhost:9182/metrics)
        after=$(printf '%s\n' "${metrics}" | conns_of)
        printf '%s\n' "${metrics}" | drops_of > "${snap}/drops.after"
        if [ "${after}" -le "${before}" ]; then
          echo "FAIL: connection table did not grow (${before} -> ${after})" >&2
          exit 1
        fi

        # -a2 -e 0 keeps a reason that shows up only in the after sample,
        # reading it as 0 -> N. The comparison is awk's, not the shell's:
        # counter values are Prometheus floats and can arrive in exponent
        # form, which [ -gt ] cannot parse.
        moved=$(join -a2 -e 0 -o '0,1.2,2.2' "${snap}/drops.before" "${snap}/drops.after" \
          | awk '$3 > $2 {printf "  %s %s -> %s\n", $1, $2, $3}')
        if [ -n "${moved}" ]; then
          echo "FAIL: the shard dropped packets while translating this probe:" >&2
          echo "${moved}" >&2
          exit 1
        fi

        echo "PASS: translated to ${shard}:${port}, table ${before} -> ${after}, no new drops"

  # The full egress datapath, both address families, driven as real traffic
  # against the one host in this lab that sits outside every cluster
  # (remote-host on tr4, gvpc.clab.yaml). verify:nat-egress above watches for
  # a translated packet on the wire and stops there -- it never confirms the
  # packet arrived anywhere, and never confirms a reply came back, so it
  # reports green on a datapath where no session can complete (#551). This
  # asserts the whole path in both directions.
  #
  # IPv6 goes out as NAT66, masqueraded to the shard's own IPv6 public
  # address. IPv4 goes out as NAT64: an IPv6-only tenant addresses the
  # destination's synthesized form (RFC 6052 -- the fabric NAT64 prefix with
  # the IPv4 address in the low 32 bits) and the shard translates it down to
  # IPv4, masqueraded to the shard's IPv4 public address.
  #
  # Deliberately NOT in the `verify` chain: the return half fails today on
  # both families (#549, #550), so wiring it in would leave `task verify`
  # permanently red and destroy the signal for everything else. Move it into
  # `verify` once those land.
  "verify:nat-datapath":
    desc: Full egress round trip through a shard to the off-fabric host (IPv6 + IPv4)
    # silent: the script is long enough that echoing it buries the result.
    silent: true
    vars:
      HOST6: "2001:db8:1:40::2"
      HOST4: "10.1.40.2"
      # {{.HOST4}} synthesized into the fabric NAT64 prefix: 10.1.40.2 is
      # 0a01:2802, so the tenant addresses 2001:db8:64::a01:2802.
      HOST4_SYNTH: "2001:db8:64::a01:2802"
      # dfw's tenant egresses through sjc's shard -- a node cannot resolve its
      # own self-originated shard SID, so it falls through to the next one.
      SENDER_SITE: dfw
      SHARD_NODE: sjc-worker
      SHARD_SITE: sjc
    cmds:
      - |
        set -e
        cp={{.SENDER_SITE}}-control-plane
        pod=$(docker exec ${cp} kubectl -n ns10 get pods -o jsonpath='{.items[0].metadata.name}')
        shard6=$(docker exec {{.SHARD_SITE}}-control-plane kubectl -n galactic-system \
          get egressshard -o jsonpath='{.items[0].status.shardAddressIPv6}')
        shard4=$(docker exec {{.SHARD_SITE}}-control-plane kubectl -n galactic-system get ds galactic-nat \
          -o jsonpath='{range .spec.template.spec.containers[*].env[*]}{.name}={.value}{"\n"}{end}' \
          | awk -F= '/GALACTIC_NAT_SHARD_PUB_ADDR4/ {print $2}')
        if [ -z "${shard6}" ]; then echo "FAIL: shard publishes no IPv6 masquerade address" >&2; exit 1; fi
        if [ -z "${shard4}" ]; then echo "FAIL: shard has no IPv4 masquerade address configured" >&2; exit 1; fi
        echo "sender ${pod} (${cp})  shard ${shard6} / ${shard4}"
        rc=0

        # Drops are reported as a delta across both probes, for the reason
        # verify:nat-egress states at length: the counters are cumulative for
        # the life of the node, so an absolute reading here described whatever
        # the shard had ever dropped rather than what this run did (#546).
        snap=$(mktemp -d)
        trap 'rm -rf "${snap}"' EXIT
        drops_of() {
          docker exec {{.SHARD_NODE}} curl -s --max-time 4 http://localhost:9182/metrics \
            | awk '/^galactic_nat_drops_total/ {print $1, $2}' | sort
        }
        drops_of > "${snap}/drops.before"

        # $1 label, $2 url the tenant fetches, $3 tcpdump filter at the far
        # end, $4 masquerade source the far end must see.
        probe() {
          echo "--- $1 ---"
          docker exec clab-gvpc-remote-host timeout 25 tcpdump -i eth1 -nn -c 4 "$3" >/tmp/nat-dp.txt 2>&1 &
          dumper=$!
          sleep 2
          body=$(docker exec ${cp} kubectl -n ns10 exec "${pod}" -- \
            curl -sS --max-time 12 "$2" 2>&1) && code=0 || code=$?
          wait ${dumper} || true

          if ! grep -q "$4" /tmp/nat-dp.txt; then
            echo "  FAIL forward: nothing reached the off-fabric host from $4" >&2
            sed 's/^/    /' /tmp/nat-dp.txt >&2
            rc=1
            return
          fi
          echo "  ok   forward: off-fabric host saw traffic masqueraded to $4"

          if [ ${code} -ne 0 ] || [ -z "${body}" ]; then
            echo "  FAIL return: the tenant never got a reply (curl exit ${code})" >&2
            echo "               forward half works, so this is the return path:" >&2
            echo "               see #549 (masquerade address absent from the underlay)" >&2
            echo "               and #550 (shard cannot forward a reply back to the tenant)" >&2
            rc=1
            return
          fi
          echo "  ok   return: tenant received \"${body}\""
        }

        probe "IPv6 / NAT66" "http://[{{.HOST6}}]/"      "ip6 and src ${shard6}" "${shard6}"
        probe "IPv4 / NAT64" "http://[{{.HOST4_SYNTH}}]/" "ip and src ${shard4}"  "${shard4}"

        drops_of > "${snap}/drops.after"
        drops=$(join -a2 -e 0 -o '0,1.2,2.2' "${snap}/drops.before" "${snap}/drops.after" \
          | awk '$3 > $2 {printf "    %s %s -> %s\n", $1, $2, $3}')
        if [ -n "${drops}" ]; then echo "  shard drops during this run:"; echo "${drops}"; fi

        if [ ${rc} -ne 0 ]; then
          echo "FAIL: the egress datapath does not complete a round trip" >&2
          exit 1
        fi
        echo "PASS: both families completed a round trip through the shard"

  "verify:nat-collision":
    desc: Prove two tenants sharing a ULA on different nodes do not share a translation
    cmds:
      # ns70's iad and sjc pods hold the same address by construction, and both
      # egress through dfw's shard because neither site can resolve its own
      # self-originated shard SID. Sending an identical 5-tuple from each makes
      # every field of the connection key identical except the encapsulation
      # source, so a shard that keyed on the SRv6 Argument alone would collapse
      # them into one row -- and then deliver one tenant's replies to the other.
      #
      # Two distinct masquerade ports in the capture is the pass condition.
      # They are normally adjacent: identical hash inputs give both flows the
      # same probe starting point, so the second claims the next candidate.
      - |
        set -e
        # A source port that changes per run, so each run creates genuinely new
        # flows. With a fixed port the connection rows survive in the pinned
        # map across a DaemonSet restart, and a rerun re-asserts the ports an
        # earlier run allocated instead of exercising the allocator at all --
        # the test would keep passing after the code it covers stopped working.
        sport=$(( 20000 + ($(date +%s) % 10000) ))
        echo "source port for this run: ${sport}"
        docker exec dfw-worker timeout 16 tcpdump -i eth1 -nn -c 4 \
          'ip6 and src 2001:db8:9966:1::1 and dst 2001:db8:1:10::1' >/tmp/nat-collision.txt 2>&1 &
        sleep 2
        for site in iad sjc; do
          pod=$(docker exec ${site}-control-plane kubectl -n ns70 get pods -o jsonpath='{.items[0].metadata.name}')
          docker exec ${site}-control-plane kubectl -n ns70 exec "${pod}" -- \
            timeout 5 bash -c "echo collide | nc -u -w1 -p ${sport} 2001:db8:1:10::1 9999" >/dev/null 2>&1 || true
        done
        wait
        ports=$(grep -oE '2001:db8:9966:1::1\.[0-9]+' /tmp/nat-collision.txt | cut -d. -f2 | sort -u)
        echo "masquerade ports allocated: $(echo ${ports} | tr '\n' ' ')"
        if [ "$(echo "${ports}" | wc -l)" -lt 2 ]; then
          echo "FAIL: both tenants share one masquerade port -- their flows collided" >&2
          exit 1
        fi
        echo "PASS: each tenant received its own translation"

  "verify:nat-collision-samenode":
    desc: Prove two tenants sharing a ULA on the SAME node do not share a translation
    cmds:
      # The same-node half of #538, and the counterpart to verify:nat-collision
      # above. There, the two tenants sit on different nodes and the connection
      # key's encapsulation source separates them on its own. Here both flows
      # reach the shard from sjc-worker and carry an identical encapsulation
      # source, so the SRv6 Argument is the only field left that can: ns71's two
      # pods are two distinct VPCs on one node holding one address by
      # construction (resources/tenants/ns71/), and an identical 5-tuple from
      # each makes every remaining field of the connection key match too.
      #
      # Before the fix, installEgressRoutes registered the operator-configured
      # shard SID verbatim, every VRF on the node encapsulated toward a
      # byte-identical destination, and read_argument returned one constant for
      # both -- one connection row, one masquerade port, and the second tenant's
      # replies delivered to the first.
      #
      # Two distinct masquerade ports in the capture is the pass condition, as
      # in verify:nat-collision. It is observable on the forward path alone and
      # so does not depend on the return leg, which #549/#550 still cover.
      - |
        set -e
        # A source port that changes per run, for the reason
        # verify:nat-collision states at length: a fixed one re-asserts ports an
        # earlier run already allocated instead of exercising the allocator.
        sport=$(( 30000 + ($(date +%s) % 10000) ))
        echo "source port for this run: ${sport}"
        docker exec dfw-worker timeout 16 tcpdump -i eth1 -nn -c 4 \
          'ip6 and src 2001:db8:9966:1::1 and dst 2001:db8:1:10::1' >/tmp/nat-collision-samenode.txt 2>&1 &
        sleep 2
        for app in private private-b; do
          pod=$(docker exec sjc-control-plane kubectl -n ns71 get pods -l app=${app} \
            -o jsonpath='{.items[0].metadata.name}')
          echo "sourcing from ns71/${pod} (app=${app})"
          docker exec sjc-control-plane kubectl -n ns71 exec "${pod}" -- \
            timeout 5 bash -c "echo collide | nc -u -w1 -p ${sport} 2001:db8:1:10::1 9999" >/dev/null 2>&1 || true
        done
        wait
        ports=$(grep -oE '2001:db8:9966:1::1\.[0-9]+' /tmp/nat-collision-samenode.txt | cut -d. -f2 | sort -u)
        echo "masquerade ports allocated: $(echo ${ports} | tr '\n' ' ')"
        if [ "$(echo "${ports}" | wc -l)" -lt 2 ]; then
          echo "FAIL: both tenants share one masquerade port -- their flows collided" >&2
          exit 1
        fi
        echo "PASS: each tenant received its own translation"

  "verify:scenarios":
    desc: Verify ping across all VPC test scenarios
    cmds:
      - task: "verify:ns10"
      - task: "verify:ns20"
      - task: "verify:ns30"
      - task: "verify:ns40"

  "verify:ns10":
    desc: Verify ns10 ping (IPv6-only, 3-site mesh)
    cmds:
      - ./scripts/verify-ns10.sh

  "verify:ns20":
    desc: Verify ns20 ping (dual-stack, 3-site mesh)
    cmds:
      - ./scripts/verify-ns20.sh

  "verify:ns30":
    desc: Verify ns30 ping (dfw only, 2 pods)
    cmds:
      - ./scripts/verify-ns30.sh

  "verify:ns40":
    desc: Verify ns40 ping (iad only, 2 pods)
    cmds:
      - ./scripts/verify-ns40.sh

  clean:
    desc: Destroy the lab and delete artifacts
    cmds:
      - task: destroy
      - docker rmi kindest/node:galactic || true
      - docker rmi galactic-router:latest || true
      - docker rmi galactic-gateway:latest || true
      - docker rmi galactic-cni:latest || true
      - docker rmi {{.FABRIC_ROUTER_IMAGE}} || true
      - docker rmi remote-host:latest || true
      - rm -rf clab-{{.LAB}} build/
      - rm -f dfw.kubeconfig sjc.kubeconfig iad.kubeconfig
