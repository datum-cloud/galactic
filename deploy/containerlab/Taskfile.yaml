version: '3'

vars:
  LAB:
    sh: awk '/^name:/ {print $2; exit}' *.clab.yaml
  TOPO:
    sh: echo *.clab.yaml
  FABRIC_ROUTER_IMAGE: fabric-router:latest

tasks:
  default:
    silent: true
    cmds:
      - task --list

  build:
    desc: Build all container images
    deps:
      - "build:node"
      - "build:fabric-router"
      - "build:fabric-api"
      - "build:galactic-router"
      - "build:galactic-cni"
      - "build:galactic-nat"
      - "build:galactic-gateway"
      - "build:remote-host"

  "build:node":
    desc: Build the Kind node image
    cmds:
      - docker build --network=host -t kindest/node:galactic -f containers/kindest-node-galactic/Dockerfile ../..

  "build:fabric-router":
    desc: Build the fabric-router image
    # No --build-arg FRR_VERSION: the lab builds the FRR version the
    # Dockerfile pins, the same one the published image ships to production.
    cmds:
      - docker build --network=host --build-context network=../../../network -t {{.FABRIC_ROUTER_IMAGE}} -f ../../containers/fabric-router/Dockerfile ../..

  "build:fabric-api":
    desc: Build the fabric-api image (node sidecar, cell gateway, janitor)
    cmds:
      - docker build --network=host --build-context network=../../../network -t fabric-api:latest -f ../../containers/fabric-api/Dockerfile ../..

  # --build-context network=../../../network satisfies go.mod's local
  # `replace go.datum.net/network => ../network` (see that line's own
  # comment) inside each Dockerfile's "network" build stage -- see
  # containers/galactic-{router,cni,nat,gateway}/Dockerfile's own comment on
  # that stage for the full mechanism. ../../../network is this Taskfile's
  # own cwd (deploy/containerlab) relative to the network repo checked out
  # as galactic's sibling; harmless to pass even once that replace
  # directive is eventually removed, since the Dockerfile's "network"
  # stage is unused by go.mod at that point regardless of what's passed
  # here.
  "build:galactic-router":
    desc: Build the galactic-router container image
    cmds:
      - docker build --network=host --build-context network=../../../network -t galactic-router:latest -f ../../containers/galactic-router/Dockerfile ../..

  "build:galactic-cni":
    desc: Build the galactic-cni installer image
    cmds:
      - docker build --network=host --build-context network=../../../network -t galactic-cni:latest -f ../../containers/galactic-cni/Dockerfile ../..

  "build:galactic-nat":
    desc: Build the galactic-nat egress datapath image
    cmds:
      - docker build --network=host --build-context network=../../../network -t galactic-nat:latest -f ../../containers/galactic-nat/Dockerfile ../..

  "build:galactic-gateway":
    desc: Build the galactic-gateway edge load balancer image
    cmds:
      - docker build --network=host --build-context network=../../../network -t galactic-gateway:latest -f ../../containers/galactic-gateway/Dockerfile ../..

  "build:remote-host":
    desc: Build the off-fabric remote host image (nginx)
    cmds:
      - docker build --network=host -t remote-host:latest -f ../../containers/remote-host/Dockerfile ../..

  deploy:
    desc: Build images and deploy the full lab
    deps: [build, host-setup]
    cmds:
      - task: "deploy:clusters"
      # No rename step: Kind's own sequential worker names are used verbatim
      # everywhere, so the containers already carry the names gvpc.clab.yaml
      # and every manifest refer to them by.
      - task: "deploy:topology"
      - task: "deploy:lab-xdp-passthrough"
      - task: "deploy:images"
      - task: "deploy:system"
      - task: "deploy:cni"
      - task: "deploy:lab-xdp-passthrough-compute"
      # Before deploy:fabric: the fabric-router pods' fabric-api sidecar
      # mounts a csi-driver volume, and without the driver the pod (FRR
      # included) cannot start.
      - task: "deploy:cert-manager"
      - task: "deploy:fabric"
      - task: "deploy:bmp-collector"
      - task: "deploy:galactic-router"
      - task: "deploy:galactic-nat"
      - task: "deploy:scenarios"
      # After the scenarios: the gateway's ServiceVIPBindings bind ns60's
      # backends, which deploy:scenarios creates.
      - task: "deploy:galactic-gateway"
      - task: "deploy:fabric-api"

  "deploy:clusters":
    desc: Create Kind clusters
    cmds:
      - kind create cluster --name dfw --config node_files/dfw/config.yaml --image kindest/node:galactic
      - kind create cluster --name sjc --config node_files/sjc/config.yaml --image kindest/node:galactic
      - kind create cluster --name iad --config node_files/iad/config.yaml --image kindest/node:galactic
      - kind export kubeconfig --name dfw --kubeconfig dfw.kubeconfig
      - kind export kubeconfig --name sjc --kubeconfig sjc.kubeconfig
      - kind export kubeconfig --name iad --kubeconfig iad.kubeconfig

  "deploy:topology":
    desc: Deploy the ContainerLab topology
    cmds:
      - sudo containerlab deploy -t {{.TOPO}}

  require-clang:
    internal: true
    run: once
    cmds:
      - |
        if ! command -v clang >/dev/null 2>&1; then
          echo "ERROR: clang not found on PATH." >&2
          echo "node_files/common/xdp-passthrough.o is compiled from" >&2
          echo "xdp-passthrough.c via clang -target bpf, not committed to" >&2
          echo "git (matching this repo's own bpf2go-output convention) --" >&2
          echo "clang is required to deploy this lab. Install, e.g.:" >&2
          echo "  Fedora/RHEL: sudo dnf install clang llvm" >&2
          echo "  Debian/Ubuntu: sudo apt install clang llvm" >&2
          exit 1
        fi

  "build:lab-xdp-passthrough":
    desc: Compile the lab-only pass-through XDP program
    deps: [require-clang]
    cmds:
      - clang -O2 -g -target bpf -c node_files/common/xdp-passthrough.c -o node_files/common/xdp-passthrough.o

  # Loads the pass-through XDP program on every transit port facing an edge
  # node -- makes those veth links behave like a real edge node's physical NIC
  # uplink for the egress shard's XDP_TX/XDP_REDIRECT toward the transit (see
  # xdp-passthrough.c's own doc comment). Idempotent: `ip link set ... xdp
  # obj` replaces whatever program (if any) is already attached. The compute
  # side is deploy:lab-xdp-passthrough-compute, which has to run later.
  "deploy:lab-xdp-passthrough":
    desc: Load the pass-through XDP program on edge-facing transit ports
    deps: [build:lab-xdp-passthrough]
    cmds:
      # Every transit port facing an edge node, and only those: edge nodes
      # are the lab's only transit-facing nodes, so these are exactly the
      # links a shard's XDP transmit toward the transit ever lands on. Each is
      # a *member* of a transit-side LACP bond, never the bond itself: the
      # shard's program runs on the far end's members and transmits back out
      # whichever member a packet arrived on, so the veth peer that has to be ready
      # for an XDP frame is always a member. tr1:eth1/eth6 (bond1) face
      # dfw-worker2, tr1:eth5/eth7 (bond2) dfw-worker3, tr2:eth1/eth5
      # (bond1) sjc-worker2, tr3:eth4/eth5 (bond1) iad-worker2 -- keep this
      # list in step with gvpc.clab.yaml's edge uplinks and
      # node_files/tr*/startup.sh's mkbond.sh calls. The
      # transit routers are real containerlab-managed nodes (kind: linux),
      # unlike the Kind-cluster nodes elsewhere in this Taskfile (kind:
      # ext-container, which keep their bare Kind-assigned names) --
      # containerlab prefixes its own nodes' container names with
      # "clab-{{.LAB}}-".
      - |
        set -e
        for pair in tr1:eth1 tr1:eth6 tr1:eth5 tr1:eth7 tr2:eth1 tr2:eth5 tr3:eth4 tr3:eth5; do
          tr=${pair%%:*}; iface=${pair##*:}
          container="clab-{{.LAB}}-${tr}"
          docker cp node_files/common/xdp-passthrough.o "${container}:/xdp-passthrough.o"
          # -force: without it, `ip link set ... xdp obj` errors "XDP
          # program already attached" on any re-run instead of replacing it
          # (verified live) -- needed for this task to be idempotent.
          docker exec "${container}" ip -force link set dev "${iface}" xdp obj /xdp-passthrough.o sec xdp
        done

  # The compute half of deploy:lab-xdp-passthrough: every compute-node port
  # facing an edge node, where a shard's XDP_REDIRECT of an un-translated
  # reply toward the tenant's node lands (see xdp-passthrough.c). Without it
  # those replies are never received. galactic-nat used to hold these hooks
  # while its shards ran on the compute nodes; nothing else attaches XDP here
  # now that they run on the edge.
  #
  # Separate from, and later than, the transit half because these are Kind
  # nodes, and it must run after deploy:cni. Loading an object with `ip`
  # mounts a bpffs of its own on /sys/fs/bpf when none is there yet, and
  # that mount is private. Cilium's pods mount /sys/fs/bpf with
  # bidirectional propagation and refuse to start on a node whose
  # /sys/fs/bpf is not a shared mount ("path /sys/fs/bpf is mounted on
  # /sys/fs/bpf but it is not a shared or slave mount") -- confirmed live,
  # when this ran before deploy:cni and wedged Cilium on every compute node.
  # After deploy:cni, Cilium's own shared bpffs is already there and `ip`
  # reuses it, so the guard below refuses to run on a node without one
  # rather than create the private mount.
  #
  # Each port is a bond member, as on the transit side. dfw-worker's
  # eth1/eth3 (bond0) face dfw-worker2 and eth2/eth4 (bond1) dfw-worker3;
  # sjc-worker's and iad-worker's eth1/eth2 (bond0) face their site's edge
  # node -- keep this in step with gvpc.clab.yaml's site-internal links.
  # Kind nodes' containers carry bare names.
  "deploy:lab-xdp-passthrough-compute":
    desc: Load the pass-through XDP program on edge-facing compute ports (after deploy:cni)
    deps: [build:lab-xdp-passthrough]
    cmds:
      - |
        set -e
        for node in dfw-worker sjc-worker iad-worker; do
          if ! docker exec "${node}" sh -c '[ "$(stat -f -c %T /sys/fs/bpf)" = bpf_fs ]'; then
            echo "ERROR: ${node} has no bpffs on /sys/fs/bpf yet; run deploy:cni first." >&2
            echo "       Loading an XDP object now would mount a private one and break Cilium." >&2
            exit 1
          fi
        done
        for pair in dfw-worker:eth1 dfw-worker:eth3 dfw-worker:eth2 dfw-worker:eth4 \
            sjc-worker:eth1 sjc-worker:eth2 iad-worker:eth1 iad-worker:eth2; do
          container=${pair%%:*}; iface=${pair##*:}
          docker cp node_files/common/xdp-passthrough.o "${container}:/xdp-passthrough.o"
          docker exec "${container}" ip -force link set dev "${iface}" xdp obj /xdp-passthrough.o sec xdp
        done

  "deploy:images":
    desc: Load all container images into Kind
    vars:
      # Every worker in every cluster runs fabric-router (the underlay eBGP
      # session everything else depends on) and galactic-router (EVPN --
      # plain mode on compute/edge, reflector mode on iad-worker3).
      FABRIC_NODES: >-
        dfw-worker dfw-worker2 dfw-worker3
        sjc-worker sjc-worker2
        iad-worker iad-worker2 iad-worker3
      # galactic-cni goes everywhere galactic.datumapis.com/galactic=router
      # is set -- compute and edge alike, but never the reflector, whose
      # galactic=control value is mutually exclusive with it.
      CNI_NODES: >-
        dfw-worker dfw-worker2 dfw-worker3
        sjc-worker sjc-worker2
        iad-worker iad-worker2
      # Egress shards and gateways: one each per edge node.
      NAT_NODES: "dfw-worker2 dfw-worker3 sjc-worker2 iad-worker2"
      GATEWAY_NODES: "dfw-worker2 dfw-worker3 sjc-worker2 iad-worker2"
    cmds:
      - |
        set -e
        load() {
          image="$1"; shift
          for node in "$@"; do
            echo "--- ${image} -> ${node} ---"
            docker save "${image}" | docker exec -i "${node}" \
              ctr --namespace k8s.io images import -
          done
        }
        load {{.FABRIC_ROUTER_IMAGE}} {{.FABRIC_NODES}}
        # The fabric-api sidecar rides in every fabric-router pod, and the
        # cell gateway and janitor schedule on any worker.
        load fabric-api:latest {{.FABRIC_NODES}}
        load galactic-router:latest {{.FABRIC_NODES}}
        load galactic-cni:latest {{.CNI_NODES}}
        load galactic-nat:latest {{.NAT_NODES}}
        load galactic-gateway:latest {{.GATEWAY_NODES}}

  "deploy:system":
    desc: Install CRDs, namespace, and RBAC
    cmds:
      - ./scripts/deploy-system.sh

  "deploy:cni":
    desc: Install Cilium, Multus, and galactic-cni
    cmds:
      - ./scripts/deploy-cni.sh

  destroy:
    desc: Destroy the lab
    cmds:
      - sudo containerlab destroy -t {{.TOPO}} --cleanup
      - kind delete cluster --name dfw || true
      - kind delete cluster --name sjc || true
      - kind delete cluster --name iad || true

  inspect:
    desc: List deployed nodes and mgmt addresses
    cmds:
      - sudo containerlab inspect -t {{.TOPO}}

  graph:
    desc: Generate a draw.io diagram of the topology
    cmds:
      - sudo containerlab graph -t {{.TOPO}} --drawio --drawio-dir .

  host-setup:
    desc: Apply host sysctls for this dual-stack lab
    cmds:
      - sudo ./scripts/host-setup.sh

  "deploy:fabric":
    desc: Install the FRR fabric DaemonSet
    cmds:
      - ./scripts/deploy-fabric.sh

  "deploy:cert-manager":
    desc: Install cert-manager and its csi-driver (fabric-api certificates)
    cmds:
      - ./scripts/deploy-cert-manager.sh

  "deploy:fabric-api":
    desc: Install the fabric-api PKI, CRD, gateway and janitor in every cluster
    cmds:
      - ./scripts/deploy-fabric-api.sh

  "deploy:bmp-collector":
    desc: Install the lab's BMP collector on iad-worker3
    cmds:
      - ./scripts/deploy-bmp-collector.sh

  "deploy:galactic-router":
    desc: Install galactic-router and BGP resources
    cmds:
      - ./scripts/deploy-galactic-router.sh

  "deploy:galactic-nat":
    desc: Install the NAT egress DaemonSet and shards
    cmds:
      - ./scripts/deploy-galactic-nat.sh

  "deploy:galactic-gateway":
    desc: Install galactic-gateway on every edge node, with each site's VIP rules
    cmds:
      - ./scripts/deploy-galactic-gateway.sh

  "deploy:scenarios":
    desc: Deploy all VPC test scenarios
    cmds:
      - task: "deploy:ns10"
      - task: "deploy:ns20"
      - task: "deploy:ns30"
      - task: "deploy:ns40"
      - task: "deploy:ns60"
      - task: "deploy:ns71"

  "deploy:ns10":
    desc: Deploy ns10 test VPC (IPv6-only, fd20 ULA)
    cmds:
      - ./scripts/deploy-ns.sh ns10 dfw sjc iad

  "deploy:ns20":
    desc: Deploy ns20 test VPC (dual-stack)
    cmds:
      - ./scripts/deploy-ns.sh ns20 dfw sjc iad

  "deploy:ns30":
    desc: Deploy ns30 test VPC (dfw only, 2 pods)
    cmds:
      - ./scripts/deploy-ns.sh ns30 dfw

  "deploy:ns40":
    desc: Deploy ns40 test VPC (iad only, 2 pods)
    cmds:
      - ./scripts/deploy-ns.sh ns40 iad

  "deploy:ns60":
    desc: Deploy ns60 test VPC (one VIP backend per site)
    cmds:
      - ./scripts/deploy-ns.sh ns60 dfw sjc iad

  "deploy:ns71":
    desc: Deploy ns71 test VPCs (overlapping ULA on one node, same-node collision fixture)
    cmds:
      - ./scripts/deploy-ns.sh ns71 sjc

  verify:
    desc: Run all verification checks
    cmds:
      - task: "verify:bonds"
      - task: "verify:bgp-transit"
      - task: "verify:bgp-fabric"
      - task: "verify:fabric-metrics"
      - task: "verify:fabric-api"
      - task: "verify:bgp-peers"
      - task: "verify:bmp"
      - task: "verify:underlay"
      - task: "verify:srv6"
      - task: "verify:evpn"
      - task: "verify:gateway"
      - task: "verify:gateway-ingress"
      - task: "verify:gateway-restart"
      - task: "verify:nat-sharding"
      - task: "verify:nat-egress"
      - task: "verify:nat-return-route"
      - task: "verify:nat-local"
      - task: "verify:nat-collision"
      - task: "verify:mss-clamp"
      - task: "verify:pmtu"
      - task: "verify:nat-icmp"
      - task: "verify:nat64-non-global"
      - task: "verify:scenarios"

  # First, because every check after it rides these bonds: a member that
  # never joined its aggregate leaves everything else passing over the
  # other member, with the datapath attachments on the missing one
  # unexercised.
  "verify:bonds":
    desc: Verify every LACP bond has aggregated on both ends
    cmds:
      - LAB={{.LAB}} ./scripts/verify-bonds.sh

  # Not part of `verify`: it takes links down, briefly but on purpose.
  "verify:bond-failover":
    desc: Take each bond member down in turn and confirm BGP and reachability hold
    cmds:
      - LAB={{.LAB}} ./scripts/verify-bond-failover.sh

  "verify:bgp-transit":
    desc: Verify transit router BGP sessions (both address families)
    cmds:
      - |
        for r in tr1 tr2 tr3 tr4; do
          echo "--- $r (ipv6) ---"
          docker exec clab-gvpc-$r vtysh -c "show bgp ipv6 unicast summary"
          echo "--- $r (ipv4) ---"
          docker exec clab-gvpc-$r vtysh -c "show bgp ipv4 unicast summary"
        done

  "verify:bgp-fabric":
    desc: Verify fabric BGP sessions on all sites (both address families)
    cmds:
      - |
        for site in dfw iad sjc; do
          for af in ipv6 ipv4; do
            echo "--- ${site} (${af}) ---"
            docker exec ${site}-control-plane \
              kubectl exec -n galactic-system ds/fabric-router \
              -- vtysh -c "show bgp ${af} unicast summary"
          done
        done

  "verify:fabric-metrics":
    desc: Verify every fabric-router's frr-exporter reports all underlay sessions Established
    cmds:
      - ./scripts/verify-fabric-metrics.sh

  "verify:fabric-api":
    desc: Verify the fabric-api looking glass on every fabric node, directly and through FabricQuery
    cmds:
      - ./scripts/verify-fabric-api.sh

  "verify:fabric-api-bootstrap":
    desc: Verify a fabric-router pod starts and FRR converges while fabric-api has no certificate
    cmds:
      - ./scripts/verify-fabric-api-bootstrap.sh

  "verify:bmp":
    desc: Verify the route reflector streams every EVPN peer to the BMP collector
    cmds:
      - ./scripts/verify-bmp.sh

  "verify:bgp-peers":
    desc: Verify galactic-router BGP peer sessions
    cmds:
      - docker exec dfw-control-plane kubectl get bgppeers -n galactic-system
      - docker exec sjc-control-plane kubectl get bgppeers -n galactic-system
      - docker exec iad-control-plane kubectl get bgppeers -n galactic-system

  "verify:underlay":
    desc: Verify dual-stack underlay loopback reachability from tr1
    cmds:
      # Sourced from tr1's own loopback, not the link address: the transit
      # carries per-node loopbacks only (/32 and /128), never the numbered
      # link subnets, so a ping sourced from eth1 has no return path.
      - |
        fail=0
        for lo in 10.255.255.1 10.255.255.2 10.255.255.3 10.255.255.4 \
                  10.255.255.5 10.255.255.6 10.255.255.7 10.255.255.8 \
                  10.255.255.101 10.255.255.102 10.255.255.103; do
          if docker exec clab-gvpc-tr1 ping -c1 -W2 -I 10.255.255.100 "$lo" >/dev/null 2>&1; then
            echo "ok    ipv4 tr1 -> $lo"
          else
            echo "FAIL  ipv4 tr1 -> $lo"; fail=1
          fi
        done
        for lo in fc00:0:2::1 fc00:0:3::1 fc00:0:4::1 fc00:0:8::1 fc00:0:9::1 \
                  fc00:0:a::1 fc00:0:b::1 fc00:0:c::1 \
                  fc00:0:5::1 fc00:0:6::1 fc00:0:7::1; do
          if docker exec clab-gvpc-tr1 ping -6 -c1 -W2 -I fc00:0:1::1 "$lo" >/dev/null 2>&1; then
            echo "ok    ipv6 tr1 -> $lo"
          else
            echo "FAIL  ipv6 tr1 -> $lo"; fail=1
          fi
        done
        exit $fail

  "verify:srv6":
    desc: Verify each site's SRv6 locator prefix
    cmds:
      - docker exec clab-gvpc-tr1 vtysh -c "show bgp ipv6 unicast 2001:db8:ff01::/48"
      - docker exec clab-gvpc-tr1 vtysh -c "show bgp ipv6 unicast 2001:db8:ff02::/48"
      - docker exec clab-gvpc-tr1 vtysh -c "show bgp ipv6 unicast 2001:db8:ff03::/48"

  "verify:evpn":
    desc: Verify EVPN routes via BGPRouter status
    cmds:
      - docker exec iad-control-plane kubectl get bgprouters -A
      - docker exec sjc-control-plane kubectl get bgprouters -A
      - docker exec dfw-control-plane kubectl get bgprouters -A

  "verify:gateway":
    desc: Verify every edge node's gateway is ready and every site's VIP rules are accepted and bound
    cmds:
      - |
        set -e
        rc=0
        for site in dfw sjc iad; do
          cp=${site}-control-plane
          echo "--- ${site} ---"
          docker exec ${cp} kubectl -n galactic-system get networkgateways,networkrules,servicevipbindings
          # Ready: the engine loaded every rule and advertised it. Accepted:
          # the rule found a gateway. Bound: the backend's node rewrites the
          # VIP for it.
          for check in "networkgateway Ready" "networkrule Accepted" "servicevipbinding Bound"; do
            set -- ${check}
            if ! docker exec ${cp} kubectl -n galactic-system wait $1 --all \
                --for=condition=$2 --timeout=10s >/dev/null; then
              echo "FAIL ${site}: not every $1 is $2" >&2
              rc=1
            fi
          done
        done
        exit ${rc}

  # verify:gateway reads CRDs, so it passes on a datapath where no
  # connection completes. This sends real TCP and UDP from the off-fabric
  # host to each site's VIP, through each of the site's gateway nodes in
  # turn, and checks the replies and the datapath's own counters. See the
  # script's header for each assertion.
  "verify:gateway-ingress":
    desc: TCP and UDP from the off-fabric host to each site's VIP, through every gateway node
    cmds:
      - LAB={{.LAB}} ./scripts/verify-gateway-ingress.sh

  # #710: the gateway and the egress shard share each edge node's uplinks
  # through its XDP dispatcher, so restarting either must leave the other's
  # traffic flowing.
  "verify:gateway-restart":
    desc: Restart dfw-worker2's gateway and shard in turn while the other carries traffic
    cmds:
      - LAB={{.LAB}} ./scripts/verify-gateway-restart.sh

  # Not part of `verify`: dfw-worker2 serves no VIP while it runs. Proves
  # verify:gateway-ingress fails when a gateway's XDP program is off its
  # uplinks.
  "verify:gateway-detach":
    desc: Turn dfw-worker2's gateway datapath off and confirm the ingress check fails, then passes again
    cmds:
      - LAB={{.LAB}} ./scripts/verify-gateway-detach.sh

  "verify:nat-sharding":
    desc: Verify every edge node's EgressShard is programmed and advertised
    cmds:
      # One shard per edge node: two in dfw, one each in sjc and iad. Each
      # must report Programmed=True -- attached is not enough, since a shard
      # with no programmed identity claims no packet -- and must target a
      # node labeled galactic.datumapis.com/nat=enabled. The shard
      # DaemonSet runs only on node=edge nodes carrying that label.
      - |
        set -e
        rc=0
        for pair in "dfw dfw-worker2" "dfw dfw-worker3" "sjc sjc-worker2" "iad iad-worker2"; do
          set -- ${pair}; site=$1; node=$2
          cp=${site}-control-plane
          programmed=$(docker exec ${cp} kubectl -n galactic-system get egressshard ${node}-egress \
            -o jsonpath='{.status.conditions[?(@.type=="Programmed")].status}' 2>/dev/null || true)
          nat=$(docker exec ${cp} kubectl get node ${node} \
            -o jsonpath='{.metadata.labels.galactic\.datumapis\.com/nat}')
          if [ "${programmed}" != "True" ] || [ "${nat}" != "enabled" ]; then
            echo "FAIL ${site}/${node}-egress: Programmed=${programmed:-missing}, nat label=${nat:-none}" >&2
            rc=1
          else
            echo "ok   ${site}/${node}-egress programmed on a NAT node"
          fi
        done
        for site in dfw sjc iad; do
          echo "--- ${site} ---"
          docker exec ${site}-control-plane kubectl get egressshards -n galactic-system -o wide
          docker exec ${site}-control-plane kubectl get bgpadvertisements -n galactic-system
        done
        exit ${rc}

  "verify:nat-egress":
    desc: Prove a tenant's packet is actually translated, not just that the shards exist
    cmds:
      # verify:nat-sharding above reads CRDs and proves only that the control
      # plane agrees with itself. This drives a real packet through the
      # datapath and reads what came out on the wire.
      #
      # dfw's tenant egresses through dfw's own edge shard on dfw-worker2, the
      # first entry in dfw's shard list (resources/galactic-cni/dfw/).
      #
      # Three things are checked, each of which has been broken at some point:
      # the EtherType (the decapsulated frame needs a rebuilt link header, or
      # the kernel dispatches it on stale packet bytes and it reaches no
      # protocol handler), the source address (the whole point of the
      # translation), and the masquerade port's range.
      #
      # The drop check is a delta across the probe, not an absolute reading.
      # galactic_nat_drops_total lives in a pinned map (natattach.PinDir) that
      # a restarting shard reuses as-is, so the counters are cumulative for the
      # life of the node, not the process. Failing on any non-zero value made
      # one long-healed transient -- a link flap, ICMP through a TCP/UDP-only
      # shard -- fail every later run, including runs where the translation
      # provably worked, and clearing it took bpftool map surgery (#546). Only
      # a counter that moves while this task is probing means anything.
      - |
        set -e
        shard=$(docker exec dfw-control-plane kubectl -n galactic-system get egressshard \
          dfw-worker2-egress -o jsonpath='{.status.shardAddressIPv6}')
        if [ -z "${shard}" ]; then
          echo "FAIL: dfw-worker2's EgressShard publishes no IPv6 masquerade address" >&2
          exit 1
        fi
        echo "dfw-worker2 shard masquerade address: ${shard}"

        snap=$(mktemp -d)
        trap 'rm -rf "${snap}"' EXIT

        # One scrape serves both checks below, so the conn-table reading and
        # the drop reading describe the same instant.
        conns_of() { awk -F' ' '/^galactic_nat_conns\{family="nat66"\}/ {print $2}'; }
        drops_of() { awk '/^galactic_nat_drops_total/ {print $1, $2}' | sort; }

        metrics=$(docker exec dfw-worker2 curl -s --max-time 4 http://localhost:9182/metrics)
        before=$(printf '%s\n' "${metrics}" | conns_of)
        printf '%s\n' "${metrics}" | drops_of > "${snap}/drops.before"

        # Captured at the off-fabric host, not on the shard node, and aimed at
        # the one destination outside the fabric rather than the shard's own
        # link peer. Both legs of a shard now leave from the driver via XDP,
        # which never enters the kernel's transmit path, so an AF_PACKET tap on
        # the shard node itself sees nothing -- the packet is on the wire, but
        # tcpdump there is blind to it (#565). Reading the far end instead
        # proves more than the old capture did: the frame the shard's own FIB
        # resolution addressed was accepted by every hop in between.
        #
        # TCP, against a port the off-fabric host actually serves. The old
        # probe was UDP at a closed port on an address nothing answered to; the
        # same UDP against a real host draws an ICMPv6 port-unreachable back
        # through the shard's ICMP path, which verify:nat-icmp covers and this
        # check is not about.
        docker exec clab-gvpc-remote-host timeout 16 tcpdump -i eth1 -nn -e -c 2 \
          "ip6 and src ${shard}" >/tmp/nat-egress.txt 2>&1 &
        sleep 2
        pod=$(docker exec dfw-control-plane kubectl -n ns10 get pods -o jsonpath='{.items[0].metadata.name}')
        docker exec dfw-control-plane kubectl -n ns10 exec "${pod}" -- \
          timeout 6 bash -c 'for i in 1 2; do nc -w1 2001:db8:1:40::2 80 </dev/null; done' \
          >/dev/null 2>&1 || true
        wait

        if ! grep -q "ethertype IPv6 (0x86dd)" /tmp/nat-egress.txt; then
          echo "FAIL: no translated packet reached the wire with a valid IPv6 EtherType" >&2
          cat /tmp/nat-egress.txt >&2
          exit 1
        fi
        port=$(grep -oE "${shard}\.[0-9]+" /tmp/nat-egress.txt | head -1 | sed "s/.*\.//")
        if [ -z "${port}" ] || [ "${port}" -lt 32768 ] || [ "${port}" -ge 60768 ]; then
          echo "FAIL: masquerade port '${port}' outside the datapath's PAT range [32768,60768)" >&2
          exit 1
        fi

        metrics=$(docker exec dfw-worker2 curl -s --max-time 4 http://localhost:9182/metrics)
        after=$(printf '%s\n' "${metrics}" | conns_of)
        printf '%s\n' "${metrics}" | drops_of > "${snap}/drops.after"
        if [ "${after}" -le "${before}" ]; then
          echo "FAIL: connection table did not grow (${before} -> ${after})" >&2
          exit 1
        fi

        # -a2 -e 0 keeps a reason that shows up only in the after sample,
        # reading it as 0 -> N. The comparison is awk's, not the shell's:
        # counter values are Prometheus floats and can arrive in exponent
        # form, which [ -gt ] cannot parse.
        moved=$(join -a2 -e 0 -o '0,1.2,2.2' "${snap}/drops.before" "${snap}/drops.after" \
          | awk '$3 > $2 {printf "  %s %s -> %s\n", $1, $2, $3}')
        if [ -n "${moved}" ]; then
          echo "FAIL: the shard dropped packets while translating this probe:" >&2
          echo "${moved}" >&2
          exit 1
        fi

        echo "PASS: translated to ${shard}:${port}, table ${before} -> ${after}, no new drops"

  # The underlay half of the egress return path. A shard's masquerade
  # addresses are what a reply from outside the fabric is addressed to, and
  # only galactic-nat's EVPN Type 5 advertisement ever published the IPv6 one
  # -- inside galactic-router's iBGP mesh, which the plain-IPv6-unicast
  # transit never sees. The IPv4 (NAT64) one was published by nothing at all.
  # A reply therefore reached a transit router holding no route for it and
  # took that router's own management default, so every masqueraded flow was
  # one-way while every forward-path counter stayed green (#549). Each shard
  # node's fabric-router now originates its own two addresses into the
  # underlay (resources/fabric-router/*/frr.conf.*-worker{2,3}, the edge
  # nodes the shards run on).
  #
  # Two assertions per family, because either half alone is satisfiable by a
  # datapath that still cannot complete a session: the transit resolves the
  # address to a BGP path rather than falling through to its default, and a
  # packet addressed to it from the off-fabric host actually arrives at the
  # shard's XDP program.
  #
  # Arrival is read from the shard's own drop counters rather than from a
  # capture: a probe with no connection row behind it is dropped by design
  # (nat66_return/nat64_return's NO_RETURN_CONN path, internal/plumbing/ebpf/
  # natprog/nat.c), and that counter moving is proof the packet reached the
  # program rather than merely the wire. It does leave those two counters a
  # little higher than the traffic warranted, which is harmless: every check
  # here reads drops as a delta across its own probe (#546), never as an
  # absolute.
  #
  # What this does not prove is that the shard can then deliver the
  # un-translated reply to the tenant. That is verify:nat-datapath's half,
  # and it is the half that stayed broken after #549 landed (#550).
  "verify:nat-return-route":
    desc: Prove a reply from outside the fabric reaches each shard's masquerade addresses
    silent: true
    cmds:
      - |
        set -e
        rc=0

        # $1 transit container suffix, $2 "ipv6"/"ip", $3 address, $4 the
        # default prefix in that family. Fails if the lookup landed on the
        # default (no route for this address at all) or on anything the
        # transit did not learn over BGP.
        transit_has_route() {
          out=$(docker exec clab-gvpc-$1 vtysh -c "show $2 route $3" 2>&1)
          if printf '%s\n' "${out}" | grep -q "Routing entry for $4"; then
            echo "  FAIL $1: no route for $3 -- fell through to the $4 default (#549)" >&2
            return 1
          fi
          if ! printf '%s\n' "${out}" | grep -q 'Known via "bgp"'; then
            echo "  FAIL $1: $3 is not a BGP path on the transit:" >&2
            printf '%s\n' "${out}" | sed 's/^/    /' >&2
            return 1
          fi
          return 0
        }

        drops_of() {
          docker exec $1 curl -s --max-time 4 http://localhost:9182/metrics \
            | awk -v r="$2" -F'[{}]' '$0 ~ "^galactic_nat_drops_total.*reason=\""r"\"" {print $NF}' \
            | tr -d ' '
        }

        for pair in "dfw dfw-worker2" "dfw dfw-worker3" "iad iad-worker2" "sjc sjc-worker2"; do
          set -- ${pair}; site=$1; node=$2
          cp=${site}-control-plane
          shard6=$(docker exec ${cp} kubectl -n galactic-system get egressshard ${node}-egress \
            -o jsonpath='{.status.shardAddressIPv6}')
          shard4=$(docker exec ${cp} kubectl -n galactic-system get egressshard ${node}-egress \
            -o jsonpath='{.status.shardAddressIPv4}')
          echo "--- ${site} (${node}): ${shard6} / ${shard4} ---"
          if [ -z "${shard6}" ] || [ -z "${shard4}" ]; then
            echo "  FAIL: shard publishes no masquerade address pair" >&2
            rc=1
            continue
          fi

          # Every transit router, not just the one the off-fabric host hangs
          # off: a reply can enter the fabric at any of them.
          for tr in tr1 tr2 tr3 tr4; do
            transit_has_route ${tr} ipv6 "${shard6}" "::/0" || rc=1
            transit_has_route ${tr} ip   "${shard4}" "0.0.0.0/0" || rc=1
          done
          [ ${rc} -eq 0 ] && echo "  ok   both addresses resolve to a BGP path on tr1-tr4"

          # Port 9 (discard): nothing anywhere answers it, so the only thing
          # under test is whether the SYN arrives.
          for probe in "nat66_no_return_conn [${shard6}]" "nat64_no_return_conn ${shard4}"; do
            set -- ${probe}; reason=$1; target=$2
            before=$(drops_of ${node} ${reason})
            docker exec clab-gvpc-remote-host \
              curl -sS --max-time 4 "http://${target}:9/" >/dev/null 2>&1 || true
            after=$(drops_of ${node} ${reason})
            if [ "$(awk -v a="${after:-0}" -v b="${before:-0}" 'BEGIN{print (a>b)?1:0}')" -ne 1 ]; then
              echo "  FAIL ${reason}: nothing from the off-fabric host reached the shard's" \
                   "datapath (${before:-0} -> ${after:-0}) (#549)" >&2
              rc=1
            else
              echo "  ok   ${target} reached the shard's datapath (${reason} ${before} -> ${after})"
            fi
          done
        done

        if [ ${rc} -ne 0 ]; then
          echo "FAIL: a reply from outside the fabric cannot reach every shard" >&2
          exit 1
        fi
        echo "PASS: every shard's masquerade addresses are routable from outside the fabric and arrive"

  # The full egress datapath, both address families, driven as real traffic
  # against the one host in this lab that sits outside every cluster
  # (remote-host on tr4, gvpc.clab.yaml). verify:nat-egress above watches for
  # a translated packet on the wire and stops there -- it never confirms the
  # packet arrived anywhere, and never confirms a reply came back, so it
  # reports green on a datapath where no session can complete (#551). This
  # asserts the whole path in both directions.
  #
  # IPv6 goes out as NAT66, masqueraded to the shard's own IPv6 public
  # address. IPv4 goes out as NAT64: an IPv6-only tenant addresses the
  # destination's synthesized form (RFC 6052 -- the fabric NAT64 prefix with
  # the IPv4 address in the low 32 bits) and the shard translates it down to
  # IPv4, masqueraded to the shard's IPv4 public address.
  #
  # Both halves of the SRv6 return path now work. #549 gave a reply a route to
  # the shard; #550 gave the shard a usable address to send the un-translated
  # reply on to. That second one was a tenant-side bug, not a shard-side one:
  # the shard always did re-encapsulate from its connection state, but toward
  # the outer source the tenant's node had stamped, which was that node's
  # uplink interface address -- originated into the underlay by nobody and
  # matching no node's locator_table, so the shard's own FIB lookup fell
  # through to its management default and counted a fib_no_neigh drop. The
  # datapath now stamps this node's own End.DT46 SID for the tenant's VRF
  # (internal/plumbing/ebpf/prog/usid.c, node_src_addr_table), which rides the
  # site locator each fabric-router already originates and which the tenant's
  # node decapsulates like any other SRv6 packet. Verified in the lab: a UDP
  # round trip to remote-host completes on both families, and a tcpdump on the
  # tenant's node shows the un-translated reply arriving addressed to that
  # node's own SID.
  #
  # The other half of that return path, #549, is fixed and covered by
  # verify:nat-return-route above, which is in the chain. What #550 fixed,
  # here, is the shard being unable to route the reply it re-encapsulates:
  # the datapath now stamps this node's own End.DT46 SID for the tenant's VRF
  # (internal/plumbing/ebpf/prog/usid.c, node_src_addr_table), so the reply
  # rides the site locator each fabric-router originates and the tenant's node
  # decapsulates like any other SRv6 packet -- a tcpdump on the tenant's node
  # shows the un-translated reply arriving addressed to that node's own SID.
  #
  # And #565 is fixed, so the two probe directions no longer disagree about
  # the kernel: the forward leg no longer XDP_PASSes into netfilter while the
  # return leg XDP_TXes past it. Both leave from the driver now, conntrack
  # sees the reply, and the tenant's ACK is not dropped as INVALID. A UDP round
  # trip to remote-host completes on both families.
  #
  # Still deliberately kept out of the `verify` chain -- these probes assert
  # the whole path in both directions, so they stay a standalone check rather
  # than gating the rest of `verify`.
  "verify:nat-datapath":
    desc: Full egress round trip through a shard to the off-fabric host (IPv6 + IPv4)
    # silent: the script is long enough that echoing it buries the result.
    silent: true
    vars:
      HOST6: "2001:db8:1:40::2"
      HOST4: "11.1.40.2"
      # {{.HOST4}} synthesized into the fabric NAT64 prefix: 11.1.40.2 is
      # 0b01:2802, so the tenant addresses 2001:db8:64::b01:2802.
      HOST4_SYNTH: "2001:db8:64::b01:2802"
      # dfw's tenant egresses through dfw's own first edge shard.
      SENDER_SITE: dfw
      SHARD_NODE: dfw-worker2
      SHARD_SITE: dfw
    cmds:
      - |
        set -e
        cp={{.SENDER_SITE}}-control-plane
        pod=$(docker exec ${cp} kubectl -n ns10 get pods -o jsonpath='{.items[0].metadata.name}')
        shard6=$(docker exec {{.SHARD_SITE}}-control-plane kubectl -n galactic-system \
          get egressshard {{.SHARD_NODE}}-egress -o jsonpath='{.status.shardAddressIPv6}')
        shard4=$(docker exec {{.SHARD_SITE}}-control-plane kubectl -n galactic-system \
          get egressshard {{.SHARD_NODE}}-egress -o jsonpath='{.status.shardAddressIPv4}')
        if [ -z "${shard6}" ]; then echo "FAIL: shard publishes no IPv6 masquerade address" >&2; exit 1; fi
        if [ -z "${shard4}" ]; then echo "FAIL: shard publishes no IPv4 masquerade address" >&2; exit 1; fi
        echo "sender ${pod} (${cp})  shard ${shard6} / ${shard4}"
        rc=0

        # Drops are reported as a delta across both probes, for the reason
        # verify:nat-egress states at length: the counters are cumulative for
        # the life of the node, so an absolute reading here described whatever
        # the shard had ever dropped rather than what this run did (#546).
        snap=$(mktemp -d)
        trap 'rm -rf "${snap}"' EXIT
        drops_of() {
          docker exec {{.SHARD_NODE}} curl -s --max-time 4 http://localhost:9182/metrics \
            | awk '/^galactic_nat_drops_total/ {print $1, $2}' | sort
        }
        drops_of > "${snap}/drops.before"

        # $1 label, $2 url the tenant fetches, $3 tcpdump filter at the far
        # end, $4 masquerade source the far end must see.
        probe() {
          echo "--- $1 ---"
          docker exec clab-gvpc-remote-host timeout 25 tcpdump -i eth1 -nn -c 4 "$3" >/tmp/nat-dp.txt 2>&1 &
          dumper=$!
          sleep 2
          body=$(docker exec ${cp} kubectl -n ns10 exec "${pod}" -- \
            curl -sS --max-time 12 "$2" 2>&1) && code=0 || code=$?
          wait ${dumper} || true

          if ! grep -q "$4" /tmp/nat-dp.txt; then
            echo "  FAIL forward: nothing reached the off-fabric host from $4" >&2
            sed 's/^/    /' /tmp/nat-dp.txt >&2
            rc=1
            return
          fi
          echo "  ok   forward: off-fabric host saw traffic masqueraded to $4"

          if [ ${code} -ne 0 ] || [ -z "${body}" ]; then
            echo "  FAIL return: the tenant never got a reply (curl exit ${code})" >&2
            echo "               forward half works, so this is the return path. If the" >&2
            echo "               reply never even reached the shard, that is the underlay" >&2
            echo "               half -- run verify:nat-return-route, which isolates it." >&2
            echo "               For TCP with every shard drop counter flat, check" >&2
            echo "               KUBE-FORWARD's ctstate INVALID rule on the shard node:" >&2
            echo "               see this task's own comment." >&2
            rc=1
            return
          fi
          echo "  ok   return: tenant received \"${body}\""
        }

        probe "IPv6 / NAT66" "http://[{{.HOST6}}]/"      "ip6 and src ${shard6}" "${shard6}"
        probe "IPv4 / NAT64" "http://[{{.HOST4_SYNTH}}]/" "ip and src ${shard4}"  "${shard4}"

        drops_of > "${snap}/drops.after"
        drops=$(join -a2 -e 0 -o '0,1.2,2.2' "${snap}/drops.before" "${snap}/drops.after" \
          | awk '$3 > $2 {printf "    %s %s -> %s\n", $1, $2, $3}')
        if [ -n "${drops}" ]; then echo "  shard drops during this run:"; echo "${drops}"; fi

        if [ ${rc} -ne 0 ]; then
          echo "FAIL: the egress datapath does not complete a round trip" >&2
          exit 1
        fi
        echo "PASS: both families completed a round trip through the shard"

  # Proves each compute node egresses through its own site's edge shard, and
  # no other site's. Each site's compute node lists only its site's shards
  # (resources/galactic-cni/<site>/egress-shards-patch.yaml), so a tenant's
  # translated packet must reach the off-fabric host from that site's first
  # shard's masquerade address -- one hop from the transit, never hairpinned
  # through another site's edge. A missing capture means the site has no
  # working egress at all; the wrong source means the shard list or the
  # route installation is not what the site configured.
  "verify:nat-local":
    desc: Prove each site's tenants egress through that site's own edge shard
    silent: true
    cmds:
      - |
        set -e
        rc=0
        for pair in "dfw dfw-worker2" "sjc sjc-worker2" "iad iad-worker2"; do
          set -- ${pair}; site=$1; node=$2
          cp=${site}-control-plane
          want=$(docker exec ${cp} kubectl -n galactic-system get egressshard ${node}-egress \
            -o jsonpath='{.status.shardAddressIPv6}')
          docker exec clab-gvpc-remote-host timeout 12 tcpdump -i eth1 -nn -c 1 \
            'ip6 and dst 2001:db8:1:40::2 and tcp dst port 80' >/tmp/nat-local.txt 2>&1 &
          dumper=$!
          sleep 2
          pod=$(docker exec ${cp} kubectl -n ns10 get pods -o jsonpath='{.items[0].metadata.name}')
          docker exec ${cp} kubectl -n ns10 exec "${pod}" -- \
            timeout 6 bash -c 'nc -w2 2001:db8:1:40::2 80 </dev/null' >/dev/null 2>&1 || true
          wait ${dumper} || true
          # tcpdump -nn prints "IP6 <src>.<port> > <dst>.<port>: ..."
          got=$(grep -oE 'IP6 [0-9a-f:]+\.[0-9]+ >' /tmp/nat-local.txt \
            | sed -E 's/^IP6 ([0-9a-f:]+)\.[0-9]+ >$/\1/' | head -1)
          if [ "${got}" = "${want}" ]; then
            echo "ok   ${site}: egress masqueraded to ${node}'s ${want}"
          else
            echo "FAIL ${site}: egress reached the off-fabric host from '${got:-nothing}'," \
                 "want ${node}'s ${want}" >&2
            rc=1
          fi
        done
        if [ ${rc} -ne 0 ]; then
          echo "FAIL: not every site egresses through its own edge shard" >&2
          exit 1
        fi
        echo "PASS: every site egresses through its own edge shard"

  "verify:nat-collision":
    desc: Prove two tenants sharing a ULA on one node do not share a translation
    cmds:
      # #538. Both flows reach sjc's edge shard from sjc-worker and carry an
      # identical encapsulation source, so the SRv6 Argument is the only field
      # of the connection key left that can separate them: ns71's two pods are
      # two distinct VPCs on one node holding one address by construction
      # (resources/tenants/ns71/), and an identical 5-tuple from each makes
      # every remaining field match too.
      #
      # This is the lab's only collision check. Its cross-node counterpart --
      # two tenants on different nodes, separated by the encapsulation source
      # alone -- needed two compute nodes sharing one shard, which no longer
      # happens now that every site egresses through its own edge shards and
      # each site has one compute node. The datapath half of it stays covered
      # by internal/plumbing/ebpf/natprog's tests, which build packets with an
      # explicit encapsulation source.
      #
      # Before the fix, installEgressRoutes registered the operator-configured
      # shard SID verbatim, every VRF on the node encapsulated toward a
      # byte-identical destination, and read_argument returned one constant for
      # both -- one connection row, one masquerade port, and the second tenant's
      # replies delivered to the first.
      #
      # Two distinct masquerade ports in the capture is the pass condition.
      # They are normally adjacent: identical hash inputs give both flows the
      # same probe starting point, so the second claims the next candidate. It
      # is observable on the forward path alone and so does not depend on the
      # return leg, which verify:nat-datapath covers.
      - |
        set -e
        # A source port that changes per run, so each run creates genuinely new
        # flows. With a fixed port the connection rows survive in the pinned
        # map across a DaemonSet restart, and a rerun re-asserts the ports an
        # earlier run allocated instead of exercising the allocator at all --
        # the test would keep passing after the code it covers stopped working.
        sport=$(( 30000 + ($(date +%s) % 10000) ))
        shard=$(docker exec sjc-control-plane kubectl -n galactic-system get egressshard \
          sjc-worker2-egress -o jsonpath='{.status.shardAddressIPv6}')
        echo "sjc-worker2 shard masquerade address: ${shard}"
        echo "source port for this run: ${sport}"
        # Captured at the off-fabric host, not on the shard node, and aimed at
        # the one destination outside the fabric rather than the shard's own
        # link peer. Both legs of a shard now leave from the driver via XDP,
        # which never enters the kernel's transmit path, so an AF_PACKET tap on
        # the shard node itself sees nothing -- the packet is on the wire, but
        # tcpdump there is blind to it (#565). Reading the far end instead
        # proves more than the old capture did: the frame the shard's own FIB
        # resolution addressed was accepted by every hop in between.
        docker exec clab-gvpc-remote-host timeout 16 tcpdump -i eth1 -nn -c 4 \
          "ip6 and src ${shard} and dst 2001:db8:1:40::2" >/tmp/nat-collision.txt 2>&1 &
        sleep 2
        for app in private private-b; do
          pod=$(docker exec sjc-control-plane kubectl -n ns71 get pods -l app=${app} \
            -o jsonpath='{.items[0].metadata.name}')
          echo "sourcing from ns71/${pod} (app=${app})"
          docker exec sjc-control-plane kubectl -n ns71 exec "${pod}" -- \
            timeout 5 bash -c "echo collide | nc -u -w1 -p ${sport} 2001:db8:1:40::2 9999" >/dev/null 2>&1 || true
        done
        wait
        ports=$(grep -oE "${shard}\.[0-9]+" /tmp/nat-collision.txt | cut -d. -f2 | sort -u)
        echo "masquerade ports allocated: $(echo ${ports} | tr '\n' ' ')"
        if [ "$(echo "${ports}" | wc -l)" -lt 2 ]; then
          echo "FAIL: both tenants share one masquerade port -- their flows collided" >&2
          exit 1
        fi
        echo "PASS: each tenant received its own translation"

  # Full-size TCP segments across the fabric, which a 1500-byte link only
  # carries because the uSID datapath clamps each SYN's MSS: 1 MiB through
  # each site's egress shard over NAT64 and NAT66, and 3 MB between sites
  # for both tenant families. See the script's header for each check.
  "verify:mss-clamp":
    desc: Prove full-size TCP segments cross the fabric (TCP MSS clamp)
    cmds:
      - ./scripts/verify-mss-clamp.sh

  # A packet too big for the fabric draws a Packet Too Big or Fragmentation
  # Needed from the sender's own node. See the script's header for each check.
  "verify:pmtu":
    desc: Prove a packet too big for the fabric draws an ICMP error from its node
    cmds:
      - ./scripts/verify-pmtu.sh

  # Ping, Time Exceeded, and Packet Too Big through each site's egress shard.
  # See the script's header for each check.
  "verify:nat-icmp":
    desc: Prove ICMP crosses each site's egress shard (ping, traceroute, PMTUD)
    cmds:
      - ./scripts/verify-nat-icmp.sh

  # A shard refuses NAT64 to IPv4 that is not globally reachable. See the
  # script's header.
  "verify:nat64-non-global":
    desc: Prove each site's egress shard refuses NAT64 to non-global IPv4
    cmds:
      - ./scripts/verify-nat64-non-global.sh

  "verify:scenarios":
    desc: Verify ping across all VPC test scenarios
    cmds:
      - task: "verify:ns10"
      - task: "verify:ns20"
      - task: "verify:ns30"
      - task: "verify:ns40"

  "verify:ns10":
    desc: Verify ns10 ping (IPv6-only, 3-site mesh)
    cmds:
      - ./scripts/verify-ns10.sh

  "verify:ns20":
    desc: Verify ns20 ping (dual-stack, 3-site mesh)
    cmds:
      - ./scripts/verify-ns20.sh

  "verify:ns30":
    desc: Verify ns30 ping (dfw only, 2 pods)
    cmds:
      - ./scripts/verify-ns30.sh

  "verify:ns40":
    desc: Verify ns40 ping (iad only, 2 pods)
    cmds:
      - ./scripts/verify-ns40.sh

  clean:
    desc: Destroy the lab and delete artifacts
    cmds:
      - task: destroy
      - docker rmi kindest/node:galactic || true
      - docker rmi galactic-router:latest || true
      - docker rmi galactic-nat:latest || true
      - docker rmi galactic-gateway:latest || true
      - docker rmi galactic-cni:latest || true
      - docker rmi {{.FABRIC_ROUTER_IMAGE}} || true
      - docker rmi remote-host:latest || true
      - rm -rf clab-{{.LAB}} build/
      - rm -f dfw.kubeconfig sjc.kubeconfig iad.kubeconfig
