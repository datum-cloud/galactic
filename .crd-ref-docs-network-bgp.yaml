processor:
  docPaths: []
  ignoreTypes:
    # Exclude collection wrappers by name: BGPPrefixList is a resource.
    - "[.]BGPAdvertisementList$"
    - "[.]BGPCommunitySetList$"
    - "[.]BGPPeerList$"
    - "[.]BGPPeerProfileList$"
    - "[.]BGPPolicyList$"
    - "[.]BGPPrefixListList$"
    - "[.]BGPRouterClassList$"
    - "[.]BGPRouterList$"
    - "[.]BGPStaticRouteList$"
    - "[.]BGPVRFInstanceList$"
    - "[.]EgressShardList$"
    - "[.]FRRRouterParametersList$"
    - "[.]FabricEndpointList$"
    - "[.]FabricReleaseAuthorizationList$"
    - "[.]FabricRolloutPolicyList$"
    - "[.]FabricRouterDeploymentList$"
    - "[.]FabricRouterRevisionList$"
    - "[.]FabricTopologyList$"
    - "[.]NetworkEgressPolicyList$"
    - "[.]NetworkGatewayList$"
    - "[.]NetworkServiceList$"
    - "[.]ServiceEndpointList$"
    - "[.]ServiceRoutePolicyList$"
    - "[.]ServiceVIPBindingList$"
    # The revision's configuration lists every BGP spec by name; walking
    # those wrappers first would hide the policy types from their sections.
    - "FabricNamed.*"
    # Egress and service resources have their own reference.
    - "[.]EgressShard.*"
    - "[.]ServiceEndpoint.*"
    - "[.]ServiceRoutePolicy.*"
    - "[.]ServiceVIPBinding.*"
    - "NetworkGateway"
    - "NetworkGatewaySpec"
    - "NetworkGatewayStatus"
    - "NetworkService"
    - "NetworkServiceProtocol"
    - "NetworkServiceSpec"
    - "NetworkServiceStatus"
    - "NetworkEgressPolicy"
    - "NetworkEgressPolicySpec"
    - "NetworkEgressPolicyStatus"
  ignoreFields: []
render:
  kubernetes: {}
  markdown:
    mediaWidth: 80
    anchorLink: true
    tableHideEmpty: true
