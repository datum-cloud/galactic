name: Install eBPF build dependencies
description: >-
  Installs the pinned clang/llvm/linux-libc-dev toolchain every job needs to
  regenerate internal/plumbing/ebpf/prog's bpf2go output, which is gitignored
  (see that package's doc.go).

runs:
  using: composite
  steps:
    # The cache key names the runner image, which fixes the package versions
    # apt resolves. ImageOS and ImageVersion are the runner's environment,
    # not the env context, so a step reads them.
    #
    # GitHub serves several image versions at once, so a job often lands on
    # one with no cache of its own. restore-keys then hands it the newest
    # cache from any image, and apt downloads only the packages whose
    # versions differ, instead of all of clang and llvm from a mirror that
    # can trickle slowly enough to outlast the job's timeout.
    - name: Name the runner image
      id: image
      shell: bash
      run: echo "name=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Restore the clang/llvm package cache
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ebpf-deps-apt
        key: ebpf-deps-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.name }}-${{ hashFiles('.github/actions/install-ebpf-deps/action.yaml') }}
        restore-keys: |
          ebpf-deps-apt-${{ runner.os }}-${{ runner.arch }}-

    # Pinned to an explicit versioned package (clang-18/llvm-18) rather than
    # the unversioned clang/llvm meta-packages, matching ci.yaml's
    # workflow-level BPF2GO_CC pin -- keeps the BPF object bytes (BTF, debug
    # info, section layout) produced by one job identical to every other
    # job's regeneration instead of drifting with whatever clang a future
    # runner-image bump resolves to. Bumping the version here means bumping
    # BPF2GO_CC with it.
    #
    # linux-libc-dev is listed explicitly too -- prog/doc.go's -idirafter
    # workaround exists specifically to find its headers, so no job should
    # rely on it merely happening to be preinstalled.
    - name: Install clang/llvm/linux-libc-dev
      shell: bash
      run: |
        # The Azure mirror can keep transferring slowly enough to exhaust
        # the job budget without triggering apt's inactivity timeout.
        # Replace only that mirror, including runner mirror-list sources;
        # retain the distribution, components and signature verification.
        shopt -s nullglob
        sources=(/etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources)
        for source in /etc/apt/sources.list /etc/apt/apt-mirrors.txt; do
          if [[ -f "$source" ]]; then sources+=("$source"); fi
        done
        if (( ${#sources[@]} )); then
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "${sources[@]}"
        fi
        # Bound inactive requests as well as total step time. Avoid LLVM's
        # recommended development/docs packages, which bpf2go does not use.
        #
        # Dir::Cache::Archives points apt at the restored cache, so packages
        # already there are installed without downloading them; the
        # directory is handed back to the runner user for the cache save.
        archives="$HOME/.cache/ebpf-deps-apt"
        mkdir -p "$archives/partial"
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 \
          -o Dir::Cache::Archives="$archives" -o APT::Keep-Downloaded-Packages=true \
          install -y --no-install-recommends clang-18 llvm-18 linux-libc-dev
        sudo rm -rf "$archives/partial" "$archives/lock"
        sudo chown -R "$(id -u):$(id -g)" "$archives"

    # Jobs that miss the cache in parallel all try to save the same key; one
    # wins and the rest only warn, so a failed save never fails the job.
    - name: Save the clang/llvm package cache
      if: steps.cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/ebpf-deps-apt
        key: ${{ steps.cache.outputs.cache-primary-key }}
