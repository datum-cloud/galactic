name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered by base branch: stacked pull requests target
  # another pull request's branch rather than main, and a "branches: [main]"
  # filter here skips this whole workflow for them -- leaving only the
  # publish jobs and the CLA check reporting, which reads as a green pull
  # request that was never tested.
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: '1.26'
  # Pins every job's regeneration of internal/plumbing/ebpf/prog's bpf2go
  # output (usid_bpfel/eb.go and their embedded .o's; not committed, see
  # that package's doc.go) to the same explicit clang version, rather than
  # each job/runner resolving its own unversioned "clang" off PATH.
  # clang-18/llvm-18 is the noble/ubuntu-latest default at the time this
  # was written -- reconfirm against the runner image if installation
  # starts failing.
  BPF2GO_CC: clang-18

jobs:
  # Tier 1: Fast checks (every PR)
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Without an explicit cap, a hung step (e.g. apt-get stalling against a
    # flaky mirror -- observed hanging the whole job against GitHub's
    # default 360-minute job timeout) blocks the PR for hours instead of
    # failing fast; every job below gets the same treatment.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install eBPF build dependencies
        # `task lint` type-checks the whole module, which needs
        # internal/plumbing/ebpf/prog's bpf2go output regenerated first.
        uses: ./.github/actions/install-ebpf-deps

      - name: Run lint
        run: task lint

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install eBPF build dependencies
        # `task test:unit` builds internal/plumbing/ebpf/prog, which needs
        # its bpf2go output regenerated first.
        uses: ./.github/actions/install-ebpf-deps

      - name: Run unit tests
        run: task test:unit

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  # test-unit above runs as the unprivileged runner user, so every test
  # gated on requireRoot(t) (BPF_PROG_TEST_RUN cases in
  # internal/plumbing/ebpf/prog/usid_test.go, plus the real-kernel BPF map
  # load/attach/GC-sweep tests across internal/plumbing/ebpf/attach,
  # internal/plumbing/ebpf/usidmap, internal/gc, internal/cni, and
  # internal/installer) skips instead of running -- the only unit-level
  # exercise of usid.c's 623 lines is otherwise the containerlab fabric.
  # GitHub-hosted runners grant passwordless sudo, so re-running just those
  # packages as root here (task test:unit-root, scripts/ci.sh
  # unittest-root) closes that gap by actually loading the BPF program into
  # the runner's kernel and driving it through BPF_PROG_TEST_RUN instead of
  # skipping -- scoped rather than the whole suite, both to avoid the
  # duplicated runtime and because running unrelated tests as root risks a
  # permission-denied assertion behaving differently than it does
  # unprivileged. This job is listed in test-e2e's `needs` below so a
  # failure here blocks the merge chain the same way lint/test-unit/build
  # already do; it should also be added directly to this repo's branch
  # protection required-status-checks list.
  test-unit-root:
    name: Unit Tests (root)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark workspace as safe for root
        # actions/checkout leaves the repo owned by the runner user; git
        # refuses "dubious ownership" once root reads it below, which
        # would otherwise make `go test`'s VCS stamping fail.
        run: sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Load vrf kernel module
        # internal/cni's bgp_ebpf_test.go creates a real netlink.Vrf link
        # (vrf.Add, internal/plumbing/vrf/vrf.go), which fails with
        # "operation not supported" (EOPNOTSUPP) on this runner: the vrf
        # module isn't built into its kernel and isn't preinstalled either,
        # so a bare `modprobe vrf` 404s with "Module vrf not found". It
        # lives in linux-modules-extra-<kernel-version> -- pinned to
        # `uname -r` rather than the unversioned meta-package, which can
        # pull a newer kernel's modules than the one actually running --
        # same fix and same reasoning as scripts/ci.sh's e2etest case,
        # which needs this for the same underlying reason (SEG6Local
        # END.DT46's VRFTABLE flag) and already does this exact install.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
          sudo modprobe vrf

      - name: Install eBPF build dependencies
        # `task test:unit-root` builds internal/plumbing/ebpf/prog, which
        # needs its bpf2go output regenerated first. This runs as the
        # unprivileged runner user -- it's the regeneration below, run as
        # root via `sudo -E task test:unit-root`, that needs clang on
        # root's PATH, which -E's preserved PATH (asserted explicitly via
        # `env "PATH=$PATH"`) already covers.
        uses: ./.github/actions/install-ebpf-deps

      - name: Run root-gated unit tests as root
        # sudo's secure_path policy overrides -E's preserved PATH for
        # exactly the PATH variable, which would hide the go/task binaries
        # setup-go/setup-task just installed -- routing through `env`
        # re-asserts it explicitly. -E otherwise keeps HOME (and so
        # GOPATH/GOMODCACHE) pointed at the same module cache test-unit
        # already populated, instead of root's empty one.
        run: sudo -E env "PATH=$PATH" task test:unit-root

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install eBPF build dependencies
        # `task build`'s build:ebpf step regenerates
        # internal/plumbing/ebpf/prog's bpf2go output before it builds any
        # binary -- see the composite action for the package pins.
        uses: ./.github/actions/install-ebpf-deps

      - name: Build binary
        # task build's build:ebpf step regenerates
        # internal/plumbing/ebpf/prog's bpf2go output (usid_bpfel/eb.go
        # and their embedded .o's) from usid.c before build:binaries ever
        # runs -- these are gitignored (see that package's doc.go), so
        # there's nothing checked in for this to drift against; it's
        # produced fresh on every build, here exactly as everywhere else.
        run: task build

  # Tier 2: Integration tests (every PR, main branch, and releases)
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-unit-root, build]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install eBPF build dependencies
        # `task test:e2e` compiles ./tests/e2e/... on the host (the
        # galactic-cni image it builds separately regenerates its own copy
        # inside containers/galactic-cni/Dockerfile's builder stage), which
        # needs internal/plumbing/ebpf/prog's bpf2go output regenerated
        # first.
        uses: ./.github/actions/install-ebpf-deps

      - name: Run E2E tests
        run: task test:e2e
