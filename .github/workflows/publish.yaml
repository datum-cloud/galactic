name: Publish Docker Image

on:
  push:
  release:
    types: ['published']

jobs:
  publish-galactic-cni-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.22.0
    with:
      image-name: galactic-cni
      dockerfile-path: containers/galactic-cni/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-galactic-router-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.22.0
    with:
      image-name: galactic-router
      dockerfile-path: containers/galactic-router/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-galactic-gateway-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.22.0
    with:
      image-name: galactic-gateway
      dockerfile-path: containers/galactic-gateway/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-fabric-router-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.22.0
    with:
      image-name: fabric-router
      dockerfile-path: containers/fabric-router/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-fabric-api-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.22.0
    with:
      image-name: fabric-api
      dockerfile-path: containers/fabric-api/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-fabric-router-controller-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.22.0
    with:
      image-name: fabric-router-controller
      dockerfile-path: containers/fabric-router-controller/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-galactic-controller-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.22.0
    with:
      image-name: galactic-controller
      dockerfile-path: containers/galactic-controller/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-galactic-nat-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.22.0
    with:
      image-name: galactic-nat
      dockerfile-path: containers/galactic-nat/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-galactic-edge-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.22.0
    with:
      image-name: galactic-edge
      dockerfile-path: containers/galactic-edge/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  # The reference edge provider, outside the core: no kustomize bundle entry.
  publish-galactic-edge-provider-example-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.22.0
    with:
      image-name: galactic-edge-provider-example
      dockerfile-path: examples/edge-provider/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  # galactic-vrf, the #855 ingress sidecar, deliberately has no entry in
  # publish-kustomize-bundles below: it has no config/galactic-vrf base to
  # stamp an image into yet (the #856 deployment contract is still open).
  # Publishing the image is what unblocks that work.
  publish-galactic-vrf-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.22.0
    with:
      image-name: galactic-vrf
      dockerfile-path: containers/galactic-vrf/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  # galactic-debug has no config/galactic-debug base and no entry in
  # publish-kustomize-bundles below: it is never deployed as a standing
  # workload, only attached on demand via `kubectl debug` (see
  # containers/galactic-debug/README.md), so there is no manifest for it
  # to stamp a tag into.
  publish-galactic-debug-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.22.0
    with:
      image-name: galactic-debug
      dockerfile-path: containers/galactic-debug/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-kustomize-bundles:
    needs:
      [
        publish-galactic-cni-image,
        publish-galactic-router-image,
        publish-galactic-gateway-image,
        publish-fabric-router-image,
        publish-fabric-api-image,
        publish-galactic-nat-image,
        publish-galactic-edge-image,
        publish-galactic-controller-image,
        publish-fabric-router-controller-image,
      ]
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.22.0
    with:
      bundle-name: ghcr.io/datum-cloud/galactic-kustomize
      bundle-path: config
      images: |
        - { path: config/galactic-cni, name: ghcr.io/datum-cloud/galactic-cni, tag: "${{ needs.publish-galactic-cni-image.outputs.tag }}" }
        - { path: config/galactic-router/base, name: ghcr.io/datum-cloud/galactic-router, tag: "${{ needs.publish-galactic-router-image.outputs.tag }}" }
        - { path: config/galactic-gateway/base, name: ghcr.io/datum-cloud/galactic-gateway, tag: "${{ needs.publish-galactic-gateway-image.outputs.tag }}" }
        - { path: config/fabric-router, name: ghcr.io/datum-cloud/fabric-router, tag: "${{ needs.publish-fabric-router-image.outputs.tag }}" }
        # config/galactic-nat/base is not in config/kustomization.yaml's own
        # resource list (it needs per-node values, same exemption
        # config/galactic-gateway/base and config/fabric-router have), but its
        # image still has to be built and its tag still has to be stamped:
        # config/galactic-nat/base/daemonset.yaml references
        # ghcr.io/datum-cloud/galactic-nat, and a component whose manifest names
        # an image nothing publishes cannot be applied at all.
        - { path: config/galactic-nat/base, name: ghcr.io/datum-cloud/galactic-nat, tag: "${{ needs.publish-galactic-nat-image.outputs.tag }}" }
        # fabric-api is opt-in (a Component of config/fabric-router and its
        # own config/fabric-api gateway base), but both reference the image,
        # so its tag is stamped into each.
        - { path: config/fabric-router/components/fabric-api, name: ghcr.io/datum-cloud/fabric-api, tag: "${{ needs.publish-fabric-api-image.outputs.tag }}" }
        - { path: config/fabric-api/base, name: ghcr.io/datum-cloud/fabric-api, tag: "${{ needs.publish-fabric-api-image.outputs.tag }}" }
        # config/galactic-edge/base is opt-in and needs a per-cell MTU, like
        # config/galactic-nat/base.
        - { path: config/galactic-edge/base, name: ghcr.io/datum-cloud/galactic-edge, tag: "${{ needs.publish-galactic-edge-image.outputs.tag }}" }
        # config/galactic-controller/base is opt-in too, for the same reason.
        - { path: config/galactic-controller/base, name: ghcr.io/datum-cloud/galactic-controller, tag: "${{ needs.publish-galactic-controller-image.outputs.tag }}" }
        - { path: config/galactic-controller/fabric, name: ghcr.io/datum-cloud/galactic-controller, tag: "${{ needs.publish-galactic-controller-image.outputs.tag }}" }
        - { path: config/fabric-router-controller/base, name: ghcr.io/datum-cloud/fabric-router-controller, tag: "${{ needs.publish-fabric-router-controller-image.outputs.tag }}" }
    secrets: inherit

  # The Looking Glass service API (protobuf sources, a descriptor set with
  # imports, and a README) is a release asset, so a consumer outside this
  # repository can generate a client pinned to the release.
  publish-service-api:
    if: github.event_name == 'release'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.70.0

      - name: Build the service API bundle
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: hack/service-api-bundle.sh "$TAG" dist

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "dist/fabric-service-api-$TAG.tar.gz" dist/SHA256SUMS --clobber
