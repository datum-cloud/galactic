apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: edgeservices.galactic.datumapis.com
spec:
  group: galactic.datumapis.com
  names:
    categories:
      - galactic
    kind: EdgeService
    listKind: EdgeServiceList
    plural: edgeservices
    singular: edgeservice
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.providerRef.name
          name: Provider
          type: string
        - jsonPath: .spec.vpcRef.name
          name: VPC
          type: string
        - jsonPath: .spec.validUntil
          name: Valid Until
          type: date
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            EdgeService grants one Galactic Edge provider the use of one VPC: the
            capabilities it may use there and the prefixes it may request. It lives in
            the VPC's namespace and is written by the platform authority, never by the
            provider. Changing the spec revokes every authorization issued under the
            previous generation; deleting it revokes them all.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: EdgeServiceSpec is a tenant's grant to one provider in one VPC.
              properties:
                capabilities:
                  description: Capabilities are the capability names the provider may use in the VPC.
                  items:
                    enum:
                      - SocketAccess
                      - PacketAccess
                      - PrefixReachability
                    type: string
                  maxItems: 3
                  minItems: 1
                  type: array
                  x-kubernetes-list-type: set
                clientPool:
                  description: |-
                    ClientPool is the IPv6 range, inside the VPC, that attachments take
                    their addresses from: a masked CIDR from /64 to /120. At most 1024 of
                    its addresses are allocated, whatever its size. Pools of services
                    granting the same VPC must not overlap; galactic-controller refuses
                    the attachments of the later of two overlapping services. Without a
                    pool, the service admits no attachment. A pool can be added to a
                    service that has none, and is fixed from then on.
                  maxLength: 43
                  type: string
                  x-kubernetes-validations:
                    - message: clientPool must be a masked IPv6 CIDR from /64 to /120
                      rule: isCIDR(self) && cidr(self).ip().family() == 6 && cidr(self) == cidr(self).masked() && cidr(self).prefixLength() >= 64 && cidr(self).prefixLength() <= 120
                drainSeconds:
                  description: |-
                    DrainSeconds is how long an attachment the foundation revokes keeps
                    its resources before they are released. Unset means 30.
                  format: int32
                  maximum: 300
                  minimum: 0
                  type: integer
                prefixes:
                  description: |-
                    Prefixes bound the prefixes the provider may request in the VPC. Each
                    is a masked CIDR. Grants of services granting the same VPC must not
                    overlap: galactic-controller refuses the attachments and routes of the
                    later of two services whose prefixes overlap.
                  items:
                    maxLength: 43
                    type: string
                  maxItems: 64
                  type: array
                  x-kubernetes-list-type: set
                  x-kubernetes-validations:
                    - message: each prefix must be a masked CIDR
                      rule: self.all(p, isCIDR(p) && cidr(p) == cidr(p).masked())
                providerRef:
                  description: ProviderRef is the only provider the grant authorizes.
                  properties:
                    name:
                      description: Name is the EdgeProvider's name.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                trafficPolicy:
                  description: |-
                    TrafficPolicy names the TrafficPolicy, in the service's namespace, for
                    each direction of every attachment the service admits. Ingress is
                    traffic delivered to the provider from the VPC; egress is traffic the
                    provider sends into the VPC. An omitted reference selects the built-in
                    default, which denies everything in that direction. A change applies
                    to active attachments.
                  properties:
                    egressPolicyRef:
                      description: EgressPolicyRef is the policy for traffic the workload sends.
                      properties:
                        name:
                          description: Name is the TrafficPolicy's name.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                      required:
                        - name
                      type: object
                    ingressPolicyRef:
                      description: IngressPolicyRef is the policy for traffic delivered to the workload.
                      properties:
                        name:
                          description: Name is the TrafficPolicy's name.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                      required:
                        - name
                      type: object
                  type: object
                validUntil:
                  description: |-
                    ValidUntil, when set, is the wall-clock time after which the grant
                    authorizes nothing. Admission refuses it, and revokes what it issued,
                    once fewer than the cell's maximum clock skew remain.
                  format: date-time
                  type: string
                vpcRef:
                  description: VPCRef is the only VPC the grant authorizes.
                  properties:
                    name:
                      description: Name is the VPC's name.
                      maxLength: 253
                      minLength: 1
                      type: string
                    uid:
                      description: UID is the VPC's metadata.uid.
                      maxLength: 36
                      minLength: 1
                      type: string
                  required:
                    - name
                    - uid
                  type: object
              required:
                - capabilities
                - providerRef
                - vpcRef
              type: object
              x-kubernetes-validations:
                - message: providerRef is immutable
                  rule: self.providerRef == oldSelf.providerRef
                - message: vpcRef.uid is immutable
                  rule: self.vpcRef.uid == oldSelf.vpcRef.uid
                - message: capabilities are immutable
                  rule: self.capabilities == oldSelf.capabilities
                - message: clientPool cannot change or be removed once set
                  rule: '!has(oldSelf.clientPool) || (has(self.clientPool) && self.clientPool == oldSelf.clientPool)'
            status:
              description: EdgeServiceStatus reports the grant's admission state.
              properties:
                allocations:
                  description: |-
                    Allocations are the client pool addresses held by attachments. Core
                    writes them with a resourceVersion precondition, so two writers never
                    hand out one address, and removes one only after the attachment's node
                    has released it.
                  items:
                    description: EdgeAllocation is one client pool address and the attachment holding it.
                    properties:
                      address:
                        description: Address is the allocated IPv6 address.
                        maxLength: 39
                        type: string
                      attachment:
                        description: Attachment is the holding EdgeAttachment's namespace and name.
                        maxLength: 317
                        type: string
                      attachmentUID:
                        description: AttachmentUID is the holding EdgeAttachment's metadata.uid.
                        maxLength: 36
                        type: string
                    required:
                      - address
                      - attachment
                      - attachmentUID
                    type: object
                  maxItems: 1024
                  type: array
                  x-kubernetes-list-map-keys:
                    - address
                  x-kubernetes-list-type: map
                conditions:
                  description: Conditions include Admitted and TrafficPolicyResolved.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  maxItems: 8
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                observedGeneration:
                  description: ObservedGeneration is the generation Conditions describe.
                  format: int64
                  type: integer
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
