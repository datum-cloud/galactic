apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: edgeservices.galactic.datumapis.com
spec:
  group: galactic.datumapis.com
  names:
    categories:
      - galactic
    kind: EdgeService
    listKind: EdgeServiceList
    plural: edgeservices
    singular: edgeservice
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.providerRef.name
          name: Provider
          type: string
        - jsonPath: .spec.vpcRef.name
          name: VPC
          type: string
        - jsonPath: .spec.validUntil
          name: Valid Until
          type: date
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            EdgeService grants one Galactic Edge provider the use of one VPC: the
            capabilities it may use there and the prefixes it may request. It lives in
            the VPC's namespace and is written by the platform authority, never by the
            provider. Changing the spec revokes every authorization issued under the
            previous generation; deleting it revokes them all.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: EdgeServiceSpec is a tenant's grant to one provider in one VPC.
              properties:
                capabilities:
                  description: Capabilities are the capability names the provider may use in the VPC.
                  items:
                    enum:
                      - SocketAccess
                      - PacketAccess
                      - PrefixReachability
                    type: string
                  maxItems: 3
                  minItems: 1
                  type: array
                  x-kubernetes-list-type: set
                prefixes:
                  description: |-
                    Prefixes bound the prefixes the provider may request in the VPC. Each
                    is a masked CIDR.
                  items:
                    maxLength: 43
                    type: string
                  maxItems: 64
                  type: array
                  x-kubernetes-list-type: set
                  x-kubernetes-validations:
                    - message: each prefix must be a masked CIDR
                      rule: self.all(p, isCIDR(p) && cidr(p) == cidr(p).masked())
                providerRef:
                  description: ProviderRef is the only provider the grant authorizes.
                  properties:
                    name:
                      description: Name is the EdgeProvider's name.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                validUntil:
                  description: |-
                    ValidUntil, when set, is the wall-clock time after which the grant
                    authorizes nothing. Admission refuses it, and revokes what it issued,
                    once fewer than the cell's maximum clock skew remain.
                  format: date-time
                  type: string
                vpcRef:
                  description: VPCRef is the only VPC the grant authorizes.
                  properties:
                    name:
                      description: Name is the VPC's name.
                      maxLength: 253
                      minLength: 1
                      type: string
                    uid:
                      description: UID is the VPC's metadata.uid.
                      maxLength: 36
                      minLength: 1
                      type: string
                  required:
                    - name
                    - uid
                  type: object
              required:
                - capabilities
                - providerRef
                - vpcRef
              type: object
              x-kubernetes-validations:
                - message: providerRef is immutable
                  rule: self.providerRef == oldSelf.providerRef
                - message: vpcRef.uid is immutable
                  rule: self.vpcRef.uid == oldSelf.vpcRef.uid
                - message: capabilities are immutable
                  rule: self.capabilities == oldSelf.capabilities
            status:
              description: EdgeServiceStatus reports the grant's admission state.
              properties:
                conditions:
                  description: Conditions include Admitted.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  maxItems: 8
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                observedGeneration:
                  description: ObservedGeneration is the generation Conditions describe.
                  format: int64
                  type: integer
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
