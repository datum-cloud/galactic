---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: bgprouters.galactic.datumapis.com
spec:
  group: galactic.datumapis.com
  names:
    kind: BGPRouter
    listKind: BGPRouterList
    plural: bgprouters
    shortNames:
    - bgpr
    singular: bgprouter
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.name
      name: TARGET
      type: string
    - jsonPath: .spec.localASN
      name: ASN
      type: integer
    - jsonPath: .spec.routerID
      name: ROUTER-ID
      type: string
    - jsonPath: .status.phase
      name: PHASE
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BGPRouter defines a logical BGP routing context. It abstracts a processing
          instance bound to a specific execution context (e.g., a VRF or network
          namespace) on a target node and acts as the primary ownership boundary for
          BGPPeer, BGPAdvertisement, and BGPPolicy resources.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BGPRouterSpec defines the desired state of a BGPRouter.
            properties:
              addressFamilies:
                description: AddressFamilies defines the address families this router
                  activates.
                items:
                  description: |-
                    AddressFamily is a BGP address family expressed as an AFI/SAFI pair.
                    Valid combinations: ipv4/unicast, ipv6/unicast, l2vpn/evpn.
                  properties:
                    afi:
                      description: AFI is the address family indicator.
                      enum:
                      - ipv4
                      - ipv6
                      - l2vpn
                      type: string
                    safi:
                      description: SAFI is the subsequent address family indicator.
                      enum:
                      - unicast
                      - evpn
                      type: string
                  required:
                  - afi
                  - safi
                  type: object
                  x-kubernetes-validations:
                  - message: IPv4 only supports unicast SAFI
                    rule: 'self.afi == ''ipv4'' ? self.safi == ''unicast'' : true'
                  - message: IPv6 only supports unicast SAFI
                    rule: 'self.afi == ''ipv6'' ? self.safi == ''unicast'' : true'
                  - message: L2VPN only supports evpn SAFI
                    rule: 'self.afi == ''l2vpn'' ? self.safi == ''evpn'' : true'
                minItems: 1
                type: array
              frr:
                description: FRR holds settings for routers whose class is implemented
                  with FRR.
                properties:
                  retain:
                    description: |-
                      Retain lists definitions rendered on this router even when no peer
                      or advertisement references them, so a migrated router's first
                      configuration matches the one it replaces. Retained definitions never
                      create sessions or advertisements.
                    properties:
                      communitySetRefs:
                        description: CommunitySetRefs names BGPCommunitySets.
                        items:
                          description: |-
                            LocalObjectRef references an object of the kind the field names, in the
                            referrer's namespace.
                          properties:
                            name:
                              description: Name is the referenced object's name.
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        maxItems: 512
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      peerProfileRefs:
                        description: PeerProfileRefs names BGPPeerProfiles.
                        items:
                          description: |-
                            LocalObjectRef references an object of the kind the field names, in the
                            referrer's namespace.
                          properties:
                            name:
                              description: Name is the referenced object's name.
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        maxItems: 64
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      policyRefs:
                        description: PolicyRefs names BGPPolicies.
                        items:
                          description: |-
                            LocalObjectRef references an object of the kind the field names, in the
                            referrer's namespace.
                          properties:
                            name:
                              description: Name is the referenced object's name.
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        maxItems: 256
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      prefixListRefs:
                        description: PrefixListRefs names BGPPrefixLists.
                        items:
                          description: |-
                            LocalObjectRef references an object of the kind the field names, in the
                            referrer's namespace.
                          properties:
                            name:
                              description: Name is the referenced object's name.
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        maxItems: 256
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                    type: object
                type: object
              listenPort:
                description: |-
                  ListenPort is the TCP port this router listens on for incoming BGP
                  peer connections. Defaults to 179 (the IANA-assigned BGP port) if unset.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              localASN:
                description: |-
                  LocalASN is the BGP Autonomous System Number for this router.
                  Must be a valid 2-byte or 4-byte ASN per RFC 6793.
                format: int64
                maximum: 4294967295
                minimum: 1
                type: integer
              nodeID:
                description: |-
                  NodeID is this router's 16-bit slot within its PoP's SRv6Locator block,
                  used for RFC 9800 NEXT-CSID compression. Unique within the PoP.
                  The uSID carrier format reserves 0x0000 and 0xE000-0xFFFF (the latter is
                  Function space, not Node-ID space), leaving 0x0001-0xDFFF assignable.
                format: int32
                maximum: 57343
                minimum: 1
                type: integer
              plane:
                description: |-
                  Plane is the routing plane this router belongs to. Unset means the
                  tenant EVPN overlay. Underlay requires a routerClassName. Immutable.
                enum:
                - Underlay
                - Overlay
                type: string
              routerClassName:
                description: |-
                  RouterClassName names the BGPRouterClass whose controller owns this
                  router. A router without one is owned by the Galactic EVPN
                  implementation (galactic-router and its related controllers). A
                  router naming a class is ignored by every component except that
                  class's controller, and by every component when the class does not
                  exist. Immutable.
                maxLength: 253
                minLength: 1
                type: string
              routerID:
                description: |-
                  RouterID is a unique 32-bit identifier expressed in IPv4 dotted-decimal notation.
                  In an IPv6-only underlay this is a logical identifier only.
                format: ipv4
                type: string
              srv6Locator:
                description: |-
                  SRv6Locator is the SRv6 locator block this router owns, expressed as an
                  IPv6 CIDR (e.g. "2001:db8:ff01::/48"). Individual SRv6 endpoint SIDs are
                  host addresses within this block.
                type: string
                x-kubernetes-validations:
                - message: srv6Locator must be a valid CIDR
                  rule: isCIDR(self)
                - message: srv6Locator must be an IPv6 CIDR
                  rule: self.contains(':')
              targetRef:
                description: TargetRef identifies the Node this router executes on.
                properties:
                  kind:
                    description: Kind is the target resource kind (e.g. Node).
                    minLength: 1
                    type: string
                  name:
                    description: Name is the name of the target resource.
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
            required:
            - addressFamilies
            - localASN
            - routerID
            - targetRef
            type: object
            x-kubernetes-validations:
            - message: routerClassName is immutable
              rule: has(self.routerClassName) == has(oldSelf.routerClassName) && (!has(self.routerClassName)
                || self.routerClassName == oldSelf.routerClassName)
            - message: plane is immutable
              rule: has(self.plane) == has(oldSelf.plane) && (!has(self.plane) ||
                self.plane == oldSelf.plane)
            - message: an Underlay router must name a routerClassName
              rule: '!has(self.plane) || self.plane != ''Underlay'' || has(self.routerClassName)'
            - message: frr settings apply only to a router that names a routerClassName
              rule: '!has(self.frr) || has(self.routerClassName)'
          status:
            description: BGPRouterStatus defines the observed state of a BGPRouter.
            properties:
              conditions:
                description: Conditions contains the standard conditions for this
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  was computed from.
                format: int64
                type: integer
              peers:
                description: Peers summarizes peer session counts.
                properties:
                  established:
                    description: Established is the count of peers currently in the
                      Established state.
                    format: int32
                    type: integer
                  total:
                    description: Total is the total number of configured peers.
                    format: int32
                    type: integer
                required:
                - established
                - total
                type: object
              phase:
                description: Phase is the high-level lifecycle state of this router.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
