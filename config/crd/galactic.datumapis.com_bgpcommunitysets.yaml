  group: galactic.datumapis.com
  names:
    kind: BGPCommunitySet
    listKind: BGPCommunitySetList
    plural: bgpcommunitysets
    shortNames:
    - bgpcs
    singular: bgpcommunityset
  scope: Namespaced
