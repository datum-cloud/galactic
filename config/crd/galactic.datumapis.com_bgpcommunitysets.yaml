      type: string
    - jsonPath: .spec.entries
      name: ENTRIES
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BGPCommunitySet defines a named list of BGP community values used by BGPPolicy
          terms to match or set communities on routes. It is referenced by name from
          BGPPolicyMatch.communitySetRef.

          A single BGPCommunitySet holds either standard or large communities — the type
          is declared upfront and all entries are validated against it via CEL.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BGPCommunitySetSpec defines the desired state of BGPCommunitySet.
            properties:
              entries:
                description: |-
                  Entries is the list of community values.
                  Standard: ASN:NN, IP:NN, or well-known names (graceful-shutdown, no-export,
                  no-advertise, blackhole).
                  Large: ASN:NN:NN.
                items:
                  type: string
                maxItems: 256
                minItems: 1
                type: array
              type:
                description: Type is the community format for all entries in this
                  set.
                enum:
                - standard
                - large
                type: string
            required:
            - entries
            - type
            type: object
            x-kubernetes-validations:
            - message: standard entries must be ASN:NN, IP:NN, or a well-known name
              rule: 'self.type == ''standard'' ? self.all(e, e.matches(''^[0-9]{1,10}:[0-9]{1,10}$'')
                || e.matches(''^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}:[0-9]{1,10}$'')
                || e == ''graceful-shutdown'' || e == ''no-export'' || e == ''no-advertise''
                || e == ''blackhole'') : true'
            - message: large entries must be ASN:NN:NN
              rule: 'self.type == ''large'' ? self.all(e, e.matches(''^[0-9]{1,10}:[0-9]{1,10}:[0-9]{1,10}$''))
                : true'
          status:
            description: BGPCommunitySetStatus defines the observed state of BGPCommunitySet.
            properties:
              conditions:
                description: Conditions contains the standard conditions for this
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
