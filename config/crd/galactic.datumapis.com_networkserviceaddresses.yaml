---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: networkserviceaddresses.galactic.datumapis.com
spec:
  group: galactic.datumapis.com
  names:
    kind: NetworkServiceAddress
    listKind: NetworkServiceAddressList
    plural: networkserviceaddresses
    shortNames:
    - svcaddr
    singular: networkserviceaddress
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NetworkServiceAddress coordinates forwarding and withdrawal for
          a shared address.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetworkServiceAddressSpec is the authoritative listener inventory
              for one allocated address.
            properties:
              group:
                description: NetworkServiceAddressGroup identifies the complete desired
                  listener inventory of one allocated VIP.
                properties:
                  generation:
                    format: int64
                    minimum: 1
                    type: integer
                  listenerName:
                    maxLength: 63
                    minLength: 1
                    type: string
                  listeners:
                    items:
                      description: NetworkServiceAddressListener describes one socket
                        interval in an address group.
                      properties:
                        name:
                          maxLength: 63
                          minLength: 1
                          type: string
                        port:
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        portRange:
                          description: PortRange is an inclusive transport port interval.
                          properties:
                            end:
                              format: int32
                              maximum: 65535
                              minimum: 1
                              type: integer
                            start:
                              format: int32
                              maximum: 65535
                              minimum: 1
                              type: integer
                          required:
                          - end
                          - start
                          type: object
                          x-kubernetes-validations:
                          - message: port range start must not exceed end
                            rule: self.start <= self.end
                        protocol:
                          description: |-
                            NetworkServiceProtocol is the IP protocol a VIP or endpoint matches.

                            The set of values is open-ended. A client reading an object that carries
                            this type must accept a value it does not recognise, preserve it when it
                            writes the object back, and treat it as a protocol it cannot act on, never
                            as tcp or udp. Each field of this type admits only the values it lists, and
                            the API server refuses any other.
                          enum:
                          - tcp
                          - udp
                          type: string
                      required:
                      - name
                      - protocol
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of port and portRange is required
                        rule: has(self.port) != has(self.portRange)
                      - message: ranges require UDP
                        rule: '!has(self.portRange) || self.protocol == ''udp'''
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  revision:
                    maxLength: 64
                    minLength: 1
                    type: string
                  uid:
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - generation
                - revision
                - uid
                type: object
                x-kubernetes-validations:
                - message: listenerName must identify a declared listener
                  rule: '!has(self.listenerName) || (has(self.listeners) && self.listeners.exists(l,
                    l.name == self.listenerName))'
              retired:
                description: Retired permanently closes this allocation identity.
                type: boolean
              vipAddress:
                type: string
                x-kubernetes-validations:
                - message: VIP must be IPv6
                  rule: isIP(self) && ip(self).family() == 6
              vpcRef:
                type: string
            required:
            - group
            - vipAddress
            - vpcRef
            type: object
            x-kubernetes-validations:
            - message: address allocation identity is immutable
              rule: self.vpcRef == oldSelf.vpcRef && self.vipAddress == oldSelf.vipAddress
                && self.group.uid == oldSelf.group.uid
            - message: address generation must not regress
              rule: self.group.generation >= oldSelf.group.generation
            - message: equal generations must have identical inventories
              rule: self.group.generation != oldSelf.group.generation || self.group
                == oldSelf.group
            - message: address inventory must not select an individual listener
              rule: '!has(self.group.listenerName)'
            - message: active addresses require a VPC and listener inventory
              rule: (has(self.retired) && self.retired) || (size(self.vpcRef) > 0
                && has(self.group.listeners) && size(self.group.listeners) > 0)
            - message: retired address authority is immutable
              rule: '!has(oldSelf.retired) || !oldSelf.retired || self == oldSelf'
          status:
            description: NetworkServiceAddressStatus reports address-level convergence.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
