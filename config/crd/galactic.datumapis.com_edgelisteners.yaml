apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: edgelisteners.galactic.datumapis.com
spec:
  group: galactic.datumapis.com
  names:
    categories:
      - galactic
    kind: EdgeListener
    listKind: EdgeListenerList
    plural: edgelisteners
    singular: edgelistener
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.providerRef.name
          name: Provider
          type: string
        - jsonPath: .status.conditions[?(@.type=="Accepted")].status
          name: Accepted
          type: string
        - jsonPath: .status.conditions[?(@.type=="Programmed")].status
          name: Programmed
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            EdgeListener gives an approved provider public addresses and ports, served
            by the gateway nodes of the cell. It lives in the gateway namespace. The
            platform authority writes its spec and core its status; no provider writes
            either. Core turns each port into a gateway NetworkService whose backends are
            the provider's listener attachments.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: |-
                EdgeListenerSpec is the public addresses and ports the platform gives one
                provider. Only the platform authority writes it; no provider may.
              properties:
                addresses:
                  description: |-
                    Addresses are the public addresses, at most one IPv6 and one IPv4. Each
                    must fall in one of the cell's gateway VIP prefixes; core refuses any
                    other with AddressOutsidePool. An IPv4 address is written in dotted
                    form.
                  items:
                    maxLength: 39
                    type: string
                  maxItems: 2
                  minItems: 1
                  type: array
                  x-kubernetes-list-type: set
                  x-kubernetes-validations:
                    - message: addresses must be valid IPv4 or IPv6 addresses, IPv4 in dotted form
                      rule: self.all(a, isIP(a))
                    - message: addresses may hold at most one IPv6 address
                      rule: self.filter(a, isIP(a) && ip(a).family() == 6).size() <= 1
                    - message: addresses may hold at most one IPv4 address
                      rule: self.filter(a, isIP(a) && ip(a).family() == 4).size() <= 1
                failurePolicy:
                  default: FailOpen
                  description: |-
                    FailurePolicy is copied into the health check of each of the listener's
                    NetworkServices.
                  enum:
                    - FailOpen
                    - FailClosed
                  type: string
                healthPort:
                  description: |-
                    HealthPort is the TCP port probed on each backend. Unset, it is the
                    first tcp port's backendPort. It is required when every port is udp.
                  format: int32
                  maximum: 65535
                  minimum: 1
                  type: integer
                ports:
                  description: |-
                    Ports are the public ports. Core writes one gateway NetworkService per
                    port. Two ports of one protocol cannot share a backendPort, since a
                    backend's reply is translated back to one public port.
                  items:
                    description: |-
                      EdgeListenerPort is one public port and the port the provider's instances
                      serve it on.
                    properties:
                      backendPort:
                        description: |-
                          BackendPort is the port each provider instance listens on, on its
                          listener attachment's address.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      port:
                        description: Port is the public port on the listener's addresses.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      protocol:
                        description: Protocol is tcp or udp.
                        enum:
                          - tcp
                          - udp
                        type: string
                    required:
                      - backendPort
                      - port
                      - protocol
                    type: object
                  maxItems: 16
                  minItems: 1
                  type: array
                  x-kubernetes-list-map-keys:
                    - protocol
                    - port
                  x-kubernetes-list-type: map
                  x-kubernetes-validations:
                    - message: two ports of one protocol cannot share a backendPort
                      rule: self.all(p, self.exists_one(q, q.protocol == p.protocol && q.backendPort == p.backendPort))
                providerRef:
                  description: |-
                    ProviderRef is the provider the listener serves. It must list
                    PublicListener.
                  properties:
                    name:
                      description: Name is the EdgeProvider's name.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                serviceRef:
                  description: |-
                    ServiceRef is the EdgeService granting the provider SocketAccess and
                    PublicListener on its ingress gVPC. The provider's listener
                    attachments are made against it.
                  properties:
                    name:
                      description: Name is the EdgeService's name.
                      maxLength: 253
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace is the EdgeService's namespace, the ingress gVPC's namespace.
                      maxLength: 63
                      minLength: 1
                      type: string
                  required:
                    - name
                    - namespace
                  type: object
                sessionAffinity:
                  default: ClientIPAndProtocol
                  description: SessionAffinity is copied into each of the listener's NetworkServices.
                  enum:
                    - None
                    - ClientIP
                    - ClientIPAndProtocol
                  type: string
              required:
                - addresses
                - ports
                - providerRef
                - serviceRef
              type: object
              x-kubernetes-validations:
                - message: providerRef is immutable
                  rule: self.providerRef == oldSelf.providerRef
                - message: serviceRef is immutable
                  rule: self.serviceRef == oldSelf.serviceRef
                - message: 'healthPort is required when every port is udp: a health check probes a TCP port'
                  rule: has(self.healthPort) || self.ports.exists(p, p.protocol == 'tcp')
            status:
              description: EdgeListenerStatus is written by core only.
              properties:
                backends:
                  description: Backends are the provider's listener attachments.
                  items:
                    description: |-
                      EdgeListenerBackend is one listener attachment and whether it receives new
                      flows.
                    properties:
                      address:
                        description: Address is the attachment's IPv6 address in the ingress gVPC.
                        maxLength: 39
                        type: string
                      attachment:
                        description: Attachment is the EdgeAttachment's namespace and name.
                        maxLength: 317
                        type: string
                      node:
                        description: Node is the attachment's node.
                        maxLength: 253
                        type: string
                      serving:
                        description: |-
                          Serving is whether the attachment receives new flows: it is
                          programmed, its instance lease is valid and its provider reports Ready.
                        type: boolean
                    required:
                      - attachment
                    type: object
                  maxItems: 1024
                  type: array
                  x-kubernetes-list-map-keys:
                    - attachment
                  x-kubernetes-list-type: map
                conditions:
                  description: Conditions are Accepted and Programmed.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  maxItems: 8
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                observedGeneration:
                  description: ObservedGeneration is the generation Conditions describe.
                  format: int64
                  type: integer
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
