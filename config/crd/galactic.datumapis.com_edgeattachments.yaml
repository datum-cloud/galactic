apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: edgeattachments.galactic.datumapis.com
spec:
  group: galactic.datumapis.com
  names:
    categories:
      - galactic
    kind: EdgeAttachment
    listKind: EdgeAttachmentList
    plural: edgeattachments
    singular: edgeattachment
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.serviceRef.name
          name: Service
          type: string
        - jsonPath: .status.nodeName
          name: Node
          type: string
        - jsonPath: .status.address
          name: Address
          type: string
        - jsonPath: .status.conditions[?(@.type=="Programmed")].status
          name: Programmed
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            EdgeAttachment is one provider instance's isolated connection to the VPC
            its EdgeService grants: an address from the service's client pool, a link
            from the pod into the VPC's host VRF on the pod's node and, with
            PacketAccess, a TUN device. It lives in the provider's namespace. Its name
            is derived from the service and pod UIDs, so a retried create lands on the
            same object.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: |-
                EdgeAttachmentSpec is an instance's request for one isolated connection to
                its service's VPC. The instance writes it at create; a
                ValidatingAdmissionPolicy requires podUID to be the pod its token was
                issued for.
              properties:
                capabilities:
                  description: |-
                    Capabilities are the capability versions the attachment uses:
                    SocketAccess, PacketAccess or both.
                  items:
                    description: |-
                      EdgeCapability is a capability a provider implements, at one version, such
                      as PacketAccess v1.
                    properties:
                      name:
                        description: Name is the capability's name.
                        enum:
                          - SocketAccess
                          - PacketAccess
                          - PrefixReachability
                        type: string
                      version:
                        description: Version is the capability's version.
                        pattern: ^v[1-9][0-9]*$
                        type: string
                    required:
                      - name
                      - version
                    type: object
                  maxItems: 2
                  minItems: 1
                  type: array
                  x-kubernetes-list-map-keys:
                    - name
                  x-kubernetes-list-type: map
                  x-kubernetes-validations:
                    - message: an attachment uses only SocketAccess and PacketAccess
                      rule: self.all(c, c.name in ['SocketAccess', 'PacketAccess'])
                contractVersion:
                  description: |-
                    ContractVersion is the provider contract version the request is
                    written to.
                  maxLength: 16
                  minLength: 1
                  type: string
                instanceRef:
                  description: InstanceRef is the requesting EdgeInstance.
                  properties:
                    name:
                      description: Name is the EdgeInstance's name.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                packetDevice:
                  description: PacketDevice owns the TUN device. Required with PacketAccess.
                  properties:
                    group:
                      description: Group is the group ID allowed to open the device.
                      format: int64
                      maximum: 4294967294
                      minimum: 0
                      type: integer
                    owner:
                      description: Owner is the user ID allowed to open the device.
                      format: int64
                      maximum: 4294967294
                      minimum: 0
                      type: integer
                  required:
                    - group
                    - owner
                  type: object
                podUID:
                  description: |-
                    PodUID is the requesting pod's metadata.uid. It must equal the
                    instance's.
                  maxLength: 36
                  minLength: 1
                  type: string
                providerRef:
                  description: |-
                    ProviderRef is the provider the requesting instance runs. It must be
                    the service's and the instance's provider. The provider's admission
                    binding checks the writer against it.
                  properties:
                    name:
                      description: Name is the EdgeProvider's name.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                serviceRef:
                  description: ServiceRef is the EdgeService granting the VPC.
                  properties:
                    name:
                      description: Name is the EdgeService's name.
                      maxLength: 253
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace is the EdgeService's namespace, its VPC's namespace.
                      maxLength: 63
                      minLength: 1
                      type: string
                    uid:
                      description: UID is the EdgeService's metadata.uid.
                      maxLength: 36
                      minLength: 1
                      type: string
                  required:
                    - name
                    - namespace
                    - uid
                  type: object
              required:
                - capabilities
                - contractVersion
                - instanceRef
                - podUID
                - providerRef
                - serviceRef
              type: object
              x-kubernetes-validations:
                - message: spec is immutable
                  rule: self == oldSelf
                - message: packetDevice is required with PacketAccess and allowed only with it
                  rule: self.capabilities.exists(c, c.name == 'PacketAccess') == has(self.packetDevice)
            status:
              description: |-
                EdgeAttachmentStatus is the attachment's lifecycle. A field is written only
                by the writer named on it.
              properties:
                address:
                  description: |-
                    Address is the attachment's IPv6 address in the VPC, from the
                    service's client pool. Set by core at allocation.
                  maxLength: 39
                  type: string
                conditions:
                  description: |-
                    Conditions are Admitted, Allocated, Draining (core), Programmed,
                    Released (node) and Ready (provider).
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  maxItems: 8
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                drainDeadline:
                  description: DrainDeadline is when core deletes an attachment it is draining.
                  format: date-time
                  type: string
                hostLink:
                  description: HostLink is the host end of the attachment's link. Set by the node.
                  maxLength: 15
                  type: string
                nodeName:
                  description: |-
                    NodeName is the node that programs the attachment, from its instance.
                    Set by core at admission.
                  maxLength: 253
                  type: string
                packetDevice:
                  description: |-
                    PacketDevice is the TUN device in the provider pod. Set by the node
                    for a PacketAccess attachment.
                  maxLength: 15
                  type: string
                podVRF:
                  description: |-
                    PodVRF is the VRF in the provider pod that the provider binds its
                    sockets to. Set by the node.
                  maxLength: 15
                  type: string
                vpc:
                  description: |-
                    VPC is the base62 identifier of the service's VPC. Set by core at
                    admission.
                  maxLength: 16
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
