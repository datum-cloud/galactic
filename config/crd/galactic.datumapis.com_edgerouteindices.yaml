apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: edgerouteindices.galactic.datumapis.com
spec:
  group: galactic.datumapis.com
  names:
    categories:
      - galactic
    kind: EdgeRouteIndex
    listKind: EdgeRouteIndexList
    plural: edgerouteindices
    singular: edgerouteindex
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.vpcUID
          name: VPC
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            EdgeRouteIndex is galactic-controller's record of every accepted
            EdgeRoute in one VPC. Acceptance is a compare-and-swap on it, so two
            controller replicas that both believe they lead cannot accept overlapping
            routes. It lives in the VPC's namespace, named by the VPC's UID. Only
            galactic-controller reads or writes it.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: EdgeRouteIndexSpec is every route accepted in one VPC.
              properties:
                rebuilt:
                  description: |-
                    Rebuilt is set when the index was rebuilt from routes' status after it
                    was lost. Entries of routes deleted meanwhile are gone, so no first
                    claim is accepted until galactic-controller has waited the takeover
                    interval and cleared it.
                  type: boolean
                routes:
                  description: |-
                    Routes are the accepted routes, keyed by prefix. No two overlap. At
                    most 1024, so a full index stays within etcd's object size limit at
                    its entries' largest.
                  items:
                    description: |-
                      EdgeRouteIndexEntry is one route the index holds: an accepted holder, or
                      one whose fencing has not completed since its route was removed or
                      revoked.
                    properties:
                      attachmentUID:
                        description: AttachmentUID is the accepted attachment's metadata.uid.
                        maxLength: 36
                        type: string
                      epoch:
                        description: Epoch is the route's last accepted epoch.
                        format: int64
                        minimum: 1
                        type: integer
                      instance:
                        description: Instance is the accepted instance's namespace and name.
                        maxLength: 317
                        type: string
                      instanceEpoch:
                        description: |-
                          InstanceEpoch is the epoch of the instance's lease the route was
                          accepted under.
                        format: int64
                        minimum: 1
                        type: integer
                      instanceIncarnation:
                        description: |-
                          InstanceIncarnation is the incarnation of the instance's lease the
                          route was accepted under.
                        maxLength: 64
                        type: string
                      node:
                        description: Node is the accepted attachment's node.
                        maxLength: 253
                        type: string
                      prefix:
                        description: Prefix is the route's prefix.
                        maxLength: 43
                        type: string
                      removing:
                        description: |-
                          Removing, when set, is why the entry is leaving: the route is gone or
                          its holder revoked. The entry stays until the holder's gate is
                          confirmed closed or galactic-controller has waited the takeover
                          interval since it recorded the removal.
                        maxLength: 64
                        type: string
                      route:
                        description: Route is the EdgeRoute's namespace and name.
                        maxLength: 317
                        type: string
                      routeUID:
                        description: RouteUID is the EdgeRoute's metadata.uid.
                        maxLength: 36
                        type: string
                    required:
                      - attachmentUID
                      - epoch
                      - instance
                      - instanceEpoch
                      - instanceIncarnation
                      - node
                      - prefix
                      - route
                      - routeUID
                    type: object
                  maxItems: 1024
                  type: array
                  x-kubernetes-list-map-keys:
                    - prefix
                  x-kubernetes-list-type: map
                vpcUID:
                  description: VPCUID is the VPC's metadata.uid, also the index's name.
                  maxLength: 36
                  minLength: 1
                  type: string
              required:
                - vpcUID
              type: object
              x-kubernetes-validations:
                - message: vpcUID is immutable
                  rule: self.vpcUID == oldSelf.vpcUID
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources: {}
