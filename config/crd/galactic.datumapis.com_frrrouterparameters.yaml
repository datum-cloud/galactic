---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: frrrouterparameters.galactic.datumapis.com
spec:
  group: galactic.datumapis.com
  names:
    kind: FRRRouterParameters
    listKind: FRRRouterParametersList
    plural: frrrouterparameters
    shortNames:
    - frrparams
    singular: frrrouterparameters
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.defaultsProfile
      name: DEFAULTS
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FRRRouterParameters holds the FRR implementation settings a
          BGPRouterClass applies to every router of the class: daemon-wide lines
          that are not routing intent. Its spec is immutable, so a revision's
          parameters stay reproducible; a new parameter set is a new object.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FRRRouterParametersSpec defines FRR implementation settings.
            properties:
              allowMartianNexthop:
                description: |-
                  AllowMartianNexthop accepts next hops FRR otherwise treats as
                  martian.
                type: boolean
              bmpTargets:
                description: |-
                  BMPTargets lists the BMP collectors every router of the class streams
                  to. The router image must load bgpd's BMP module.
                items:
                  description: BMPTarget is one `bmp targets` block.
                  properties:
                    connect:
                      description: Connect is the collector this target streams to.
                      properties:
                        address:
                          description: Address is the collector's IP address.
                          maxLength: 45
                          type: string
                          x-kubernetes-validations:
                          - message: address must be a valid IP address
                            rule: isIP(self)
                        maxRetryMilliseconds:
                          description: MaxRetryMilliseconds is the longest reconnect
                            backoff.
                          format: int32
                          maximum: 86400000
                          minimum: 100
                          type: integer
                        minRetryMilliseconds:
                          description: MinRetryMilliseconds is the shortest reconnect
                            backoff.
                          format: int32
                          maximum: 86400000
                          minimum: 100
                          type: integer
                        port:
                          description: Port is the collector's TCP port.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        sourceInterface:
                          description: |-
                            SourceInterface is the local interface whose address the session is
                            sourced from. Unset lets the kernel choose the source address.
                          maxLength: 15
                          minLength: 1
                          pattern: ^[A-Za-z0-9_.@-]+$
                          type: string
                      required:
                      - address
                      - port
                      type: object
                      x-kubernetes-validations:
                      - message: minRetryMilliseconds must not exceed maxRetryMilliseconds
                        rule: '!has(self.minRetryMilliseconds) || !has(self.maxRetryMilliseconds)
                          || self.minRetryMilliseconds <= self.maxRetryMilliseconds'
                    monitors:
                      description: Monitors lists the RIBs streamed.
                      items:
                        description: BMPMonitor streams one family's RIB to a BMP
                          target.
                        properties:
                          afi:
                            description: AFI is the address family indicator.
                            enum:
                            - ipv4
                            - ipv6
                            - l2vpn
                            type: string
                          mode:
                            description: Mode selects the RIB.
                            enum:
                            - LocRIB
                            - PrePolicy
                            - PostPolicy
                            type: string
                          safi:
                            description: SAFI is the subsequent address family indicator.
                            enum:
                            - unicast
                            - evpn
                            type: string
                        required:
                        - afi
                        - mode
                        - safi
                        type: object
                        x-kubernetes-validations:
                        - message: BMP monitors cover ipv4 or ipv6 unicast
                          rule: (self.afi == 'ipv4' || self.afi == 'ipv6') && self.safi
                            == 'unicast'
                      maxItems: 6
                      minItems: 1
                      type: array
                      x-kubernetes-list-map-keys:
                      - afi
                      - safi
                      - mode
                      x-kubernetes-list-type: map
                    name:
                      description: Name is the target's FRR name.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
                      type: string
                    statsIntervalMilliseconds:
                      description: |-
                        StatsIntervalMilliseconds is how often the target sends BMP
                        statistics reports. Unset sends none.
                      format: int32
                      maximum: 86400000
                      minimum: 100
                      type: integer
                  required:
                  - connect
                  - monitors
                  - name
                  type: object
                maxItems: 4
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              defaultsProfile:
                description: |-
                  DefaultsProfile is the `frr defaults` profile. Changing a router's
                  profile restarts bgpd.
                enum:
                - traditional
                - datacenter
                type: string
              ebgpRequiresPolicy:
                description: |-
                  EBGPRequiresPolicy is FRR's RFC 8212 behavior: an eBGP session with
                  no policy in a direction exchanges no routes in it. Unset or true
                  keeps FRR's default, which is on; false renders
                  `no bgp ebgp-requires-policy`. False also lets the routers' peer
                  families leave exportPolicyRef unset, which exports every route the
                  router selects to that peer; any other class refuses a peer family
                  with no export policy.
                type: boolean
              hostnameSuffix:
                description: |-
                  HostnameSuffix is appended to the bound Node's name to form the
                  router hostname.
                maxLength: 63
                pattern: ^[A-Za-z0-9.-]*$
                type: string
              ipv4UnicastDefault:
                description: |-
                  IPv4UnicastDefault activates IPv4 unicast for every neighbor by
                  default. False renders `no bgp default ipv4-unicast`.
                type: boolean
              logFile:
                description: LogFile is FRR's log file. Unset renders no log file
                  line.
                properties:
                  level:
                    description: Level is the lowest level written.
                    enum:
                    - emergencies
                    - alerts
                    - critical
                    - errors
                    - warnings
                    - notifications
                    - informational
                    - debugging
                    type: string
                  path:
                    description: Path is the log file's absolute path in the router
                      container.
                    maxLength: 255
                    minLength: 2
                    pattern: ^/[^\s]*$
                    type: string
                required:
                - level
                - path
                type: object
              logNeighborChanges:
                description: LogNeighborChanges logs BGP session state changes.
                type: boolean
              logSyslog:
                description: |-
                  LogSyslog is the lowest level FRR sends to syslog. Unset renders no
                  log syslog line.
                enum:
                - emergencies
                - alerts
                - critical
                - errors
                - warnings
                - notifications
                - informational
                - debugging
                type: string
            required:
            - defaultsProfile
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; create a new FRRRouterParameters
              rule: self == oldSelf
          status:
            description: FRRRouterParametersStatus defines the observed state of FRRRouterParameters.
            properties:
              conditions:
                description: Conditions contains the standard conditions for this
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  was computed from.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
