---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: bgpvrfinstances.galactic.datumapis.com
spec:
  group: galactic.datumapis.com
  names:
    kind: BGPVRFInstance
    listKind: BGPVRFInstanceList
    plural: bgpvrfinstances
    shortNames:
    - bgpvrf
    singular: bgpvrfinstance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vrfID
      name: VRF-ID
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BGPVRFInstance configures an L2VPN EVPN VRF on matched BGPRouters.
          The referenced BGPRouter must have l2vpn-evpn in its addressFamilies.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BGPVRFInstanceSpec defines the desired VRF configuration.
            properties:
              exportRouteTargets:
                description: |-
                  ExportRouteTargets is the list of BGP extended community route targets
                  attached to routes exported from this VRF.
                items:
                  description: RouteTarget is a BGP extended community in "ASN:NN"
                    or "IP:NN" format.
                  properties:
                    value:
                      description: |-
                        Value is the route target extended community string.
                        Format: "ASN:NN" (e.g. "65000:100") or "IP:NN" (e.g. "192.0.2.1:100").
                      maxLength: 21
                      minLength: 1
                      type: string
                  required:
                  - value
                  type: object
                  x-kubernetes-validations:
                  - message: value must be in ASN:NN or IP:NN format
                    rule: self.value.matches('^([0-9]{1,9}[.][0-9]{1,9}[.][0-9]{1,9}[.][0-9]{1,9}|[0-9]{1,10}):[0-9]{1,10}$')
                maxItems: 32
                minItems: 1
                type: array
              importRouteTargets:
                description: |-
                  ImportRouteTargets is the list of BGP extended community route targets
                  used to import routes into this VRF.
                items:
                  description: RouteTarget is a BGP extended community in "ASN:NN"
                    or "IP:NN" format.
                  properties:
                    value:
                      description: |-
                        Value is the route target extended community string.
                        Format: "ASN:NN" (e.g. "65000:100") or "IP:NN" (e.g. "192.0.2.1:100").
                      maxLength: 21
                      minLength: 1
                      type: string
                  required:
                  - value
                  type: object
                  x-kubernetes-validations:
                  - message: value must be in ASN:NN or IP:NN format
                    rule: self.value.matches('^([0-9]{1,9}[.][0-9]{1,9}[.][0-9]{1,9}[.][0-9]{1,9}|[0-9]{1,10}):[0-9]{1,10}$')
                maxItems: 32
                minItems: 1
                type: array
              nptv6:
                description: |-
                  NPTv6 configures stateless RFC 6296 Network Prefix Translation for
                  this VRF: backends presenting an address within ULAPrefix are
                  translated, checksum-neutrally and bidirectionally, to the
                  corresponding address in PublicPrefix. Unset means this VRF's traffic
                  crosses the SRv6 fabric with its own ULA source/destination
                  unmodified — the common case. Keyed by this VRFID, never by address,
                  specifically so two VRFs may configure the identical ULAPrefix (e.g.
                  both using the same private range) without collision — each VRF's
                  mapping is independent, looked up only after this VRF's own identity
                  is already resolved from the SRv6 uSID Argument, never derived from
                  address content alone.
                properties:
                  publicPrefix:
                    description: |-
                      PublicPrefix is the externally-routable IPv6 prefix ULAPrefix
                      translates to/from, same prefix length as ULAPrefix.
                    type: string
                    x-kubernetes-validations:
                    - message: publicPrefix must be a valid CIDR
                      rule: isCIDR(self)
                    - message: publicPrefix must be an IPv6 CIDR
                      rule: self.contains(':')
                  ulaPrefix:
                    description: |-
                      ULAPrefix is this VRF's tenant-facing IPv6 ULA prefix (e.g.
                      "fd20:60::/64"), as presented by backends inside the VRF.
                    type: string
                    x-kubernetes-validations:
                    - message: ulaPrefix must be a valid CIDR
                      rule: isCIDR(self)
                    - message: ulaPrefix must be an IPv6 CIDR
                      rule: self.contains(':')
                required:
                - publicPrefix
                - ulaPrefix
                type: object
                x-kubernetes-validations:
                - message: ulaPrefix and publicPrefix must share the same prefix length
                  rule: self.ulaPrefix.split('/')[1] == self.publicPrefix.split('/')[1]
              routerRef:
                description: |-
                  RouterRef targets a single BGPRouter by name.
                  Mutually exclusive with routerSelector.
                properties:
                  name:
                    description: Name is the name of the BGPRouter.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              routerSelector:
                description: |-
                  RouterSelector targets one or more BGPRouters by label.
                  Mutually exclusive with routerRef.
                properties:
                  matchExpressions:
                    description: MatchExpressions is a list of label selector requirements.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: MatchLabels is a map of key/value label pairs to
                      match.
                    type: object
                type: object
              vrfID:
                description: |-
                  VRFID is the 16-bit PoP-local VRF identifier used for RFC 9800 uSID
                  Argument addressing and to derive the RFC 4364 Type 1 Route
                  Distinguisher ("routerID:vrfID"). Unique per (VPC, PoP). Value 0 is
                  reserved.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
            required:
            - exportRouteTargets
            - importRouteTargets
            - vrfID
            type: object
            x-kubernetes-validations:
            - message: Exactly one of routerRef or routerSelector must be set
              rule: has(self.routerRef) != has(self.routerSelector)
          status:
            description: BGPVRFInstanceStatus defines the observed state of BGPVRFInstance.
            properties:
              conditions:
                description: Conditions are top-level conditions for this BGPVRFInstance.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              routers:
                description: Routers holds per-router reconciliation status.
                items:
                  description: RouterStatus holds per-router reconciliation status
                    used by BGPVRFInstance.
                  properties:
                    conditions:
                      description: Conditions are the per-router conditions.
                      items:
                        description: Condition contains details for one aspect of
                          the current state of this API Resource.
                        properties:
                          lastTransitionTime:
                            description: |-
                              lastTransitionTime is the last time the condition transitioned from one status to another.
                              This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                            format: date-time
                            type: string
                          message:
                            description: |-
                              message is a human readable message indicating details about the transition.
                              This may be an empty string.
                            maxLength: 32768
                            type: string
                          observedGeneration:
                            description: |-
                              observedGeneration represents the .metadata.generation that the condition was set based upon.
                              For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                              with respect to the current state of the instance.
                            format: int64
                            minimum: 0
                            type: integer
                          reason:
                            description: |-
                              reason contains a programmatic identifier indicating the reason for the condition's last transition.
                              Producers of specific condition types may define expected values and meanings for this field,
                              and whether the values are considered a guaranteed API.
                              The value should be a CamelCase string.
                              This field may not be empty.
                            maxLength: 1024
                            minLength: 1
                            pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                            type: string
                          status:
                            description: status of the condition, one of True, False,
                              Unknown.
                            enum:
                            - "True"
                            - "False"
                            - Unknown
                            type: string
                          type:
                            description: type of condition in CamelCase or in foo.example.com/CamelCase.
                            maxLength: 316
                            pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                            type: string
                        required:
                        - lastTransitionTime
                        - message
                        - reason
                        - status
                        - type
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - type
                      x-kubernetes-list-type: map
                    resolvedConfig:
                      description: ResolvedConfig holds the configuration that was
                        actually applied.
                      properties:
                        addressFamilies:
                          description: AddressFamilies configured.
                          items:
                            description: |-
                              AddressFamily is a BGP address family expressed as an AFI/SAFI pair.
                              Valid combinations: ipv4/unicast, ipv6/unicast, l2vpn/evpn.
                            properties:
                              afi:
                                description: AFI is the address family indicator.
                                enum:
                                - ipv4
                                - ipv6
                                - l2vpn
                                type: string
                              safi:
                                description: SAFI is the subsequent address family
                                  indicator.
                                enum:
                                - unicast
                                - evpn
                                type: string
                            required:
                            - afi
                            - safi
                            type: object
                            x-kubernetes-validations:
                            - message: IPv4 only supports unicast SAFI
                              rule: 'self.afi == ''ipv4'' ? self.safi == ''unicast''
                                : true'
                            - message: IPv6 only supports unicast SAFI
                              rule: 'self.afi == ''ipv6'' ? self.safi == ''unicast''
                                : true'
                            - message: L2VPN only supports evpn SAFI
                              rule: 'self.afi == ''l2vpn'' ? self.safi == ''evpn''
                                : true'
                          type: array
                        asNumber:
                          description: ASNumber is the AS number configured.
                          format: int64
                          type: integer
                        routerID:
                          description: RouterID resolved for this router.
                          type: string
                      type: object
                    routerName:
                      description: RouterName is the name of the BGPRouter this entry
                        describes.
                      type: string
                  required:
                  - routerName
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - routerName
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
