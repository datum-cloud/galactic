---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: bgpadvertisements.galactic.datumapis.com
spec:
  group: galactic.datumapis.com
  names:
    kind: BGPAdvertisement
    listKind: BGPAdvertisementList
    plural: bgpadvertisements
    shortNames:
    - bgpadv
    singular: bgpadvertisement
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.routerRef.name
      name: ROUTER
      type: string
    - jsonPath: .spec.addressFamily.afi
      name: ADDRESS-FAMILY
      type: string
    - jsonPath: .status.advertisedPrefixes
      name: PREFIXES
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BGPAdvertisement defines routing information to advertise from a single BGPRouter.
          Routes are originated from static Prefixes, redistributed routing table entries,
          or local interface/kernel routes. Fan-out via routerSelector is intentionally not
          supported to avoid ambiguous prefix attribution across multiple routers.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BGPAdvertisementSpec defines the desired advertisement state.
              At least one of prefixes, redistribute, or originateFrom must be specified.
            properties:
              addressFamily:
                description: AddressFamily defines the AFI/SAFI for this advertisement.
                properties:
                  afi:
                    description: AFI is the address family indicator.
                    enum:
                    - ipv4
                    - ipv6
                    - l2vpn
                    type: string
                  safi:
                    description: SAFI is the subsequent address family indicator.
                    enum:
                    - unicast
                    - evpn
                    type: string
                required:
                - afi
                - safi
                type: object
                x-kubernetes-validations:
                - message: IPv4 only supports unicast SAFI
                  rule: 'self.afi == ''ipv4'' ? self.safi == ''unicast'' : true'
                - message: IPv6 only supports unicast SAFI
                  rule: 'self.afi == ''ipv6'' ? self.safi == ''unicast'' : true'
                - message: L2VPN only supports evpn SAFI
                  rule: 'self.afi == ''l2vpn'' ? self.safi == ''evpn'' : true'
              aggregation:
                description: |-
                  Aggregation originates an aggregate of contributing routes already in
                  the BGP table. It never installs a discard route; pair it with a
                  BGPStaticRoute where one is wanted. Honored by the fabric router
                  implementation only.
                properties:
                  asSet:
                    description: ASSet carries the contributors' AS numbers in an
                      AS_SET.
                    type: boolean
                  prefix:
                    description: Prefix is the aggregate in CIDR notation.
                    maxLength: 43
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: prefix must be a valid CIDR
                      rule: isCIDR(self)
                  summaryOnly:
                    description: |-
                      SummaryOnly suppresses the contributing routes, advertising only the
                      aggregate.
                    type: boolean
                required:
                - prefix
                type: object
              communities:
                description: |-
                  Communities is the default list of BGP communities to attach to all advertised prefixes.
                  Per-prefix communities in Prefixes[n].communities replace this value for individual prefixes.
                items:
                  description: Community is a BGP community in ASN:NN or IP:NN format.
                  maxLength: 32
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-validations:
                - message: community must be in ASN:NN or IP:NN format
                  rule: self.all(c, c.matches('^[0-9]{1,10}:[0-9]{1,10}$') || c.matches('^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}:[0-9]{1,10}$'))
              function:
                description: |-
                  Function is the RFC 8986 SRv6 endpoint behavior applied when this
                  advertisement originates a compressed uSID. Required when VRFID is set.
                enum:
                - End.DT4
                - End.DT6
                - End.DT46
                type: string
              localPreference:
                description: |-
                  LocalPreference sets the default BGP LOCAL_PREF attribute for all advertised prefixes.
                  Per-prefix localPreference in Prefixes[n].localPreference overrides this value.
                  Only meaningful for iBGP sessions.
                format: int32
                minimum: 0
                type: integer
              originateFrom:
                description: |-
                  OriginateFrom defines how routes are sourced from a local interface or kernel table.
                  When set, routes are originated from the specified source in addition to any static Prefixes.
                  At least one of Prefixes, Redistribute, or OriginateFrom must be specified.
                properties:
                  interfaceName:
                    description: |-
                      InterfaceName is the name of the interface to originate routes from.
                      Required when type is "interface".
                    minLength: 1
                    type: string
                  type:
                    description: Type is the source from which routes are originated.
                    enum:
                    - interface
                    - kernel
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: interfaceName is required when type is interface
                  rule: 'self.type == ''interface'' ? has(self.interfaceName) : true'
                - message: interfaceName must not be set when type is kernel
                  rule: 'self.type == ''kernel'' ? !has(self.interfaceName) : true'
              policyRef:
                description: |-
                  PolicyRef references a BGPPolicy to apply as a conditional filter before advertisement.
                  Only routes that match the policy are originated.
                properties:
                  name:
                    description: Name is the name of the BGPPolicy within the same
                      namespace.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              prefixes:
                description: |-
                  Prefixes is the list of CIDR prefixes to advertise.
                  At least one of Prefixes, Redistribute, or OriginateFrom must be specified.
                items:
                  description: Prefix is an IPv4 or IPv6 CIDR prefix.
                  maxLength: 64
                  type: string
                  x-kubernetes-validations:
                  - message: must be a valid IPv4 or IPv6 CIDR
                    rule: self.matches('^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+/[0-9]{1,2}$|^[0-9a-fA-F:]+::?[0-9a-fA-F:]+/[0-9]{1,3}$')
                maxItems: 256
                type: array
                x-kubernetes-list-type: set
              redistribute:
                description: |-
                  Redistribute defines routing table sources to redistribute into BGP.
                  Routes matching the source type are originated without requiring explicit CIDR entries.
                  At least one of Prefixes, Redistribute, or OriginateFrom must be specified.
                items:
                  description: RedistributeSource is a local routing table source
                    to redistribute into BGP.
                  enum:
                  - static
                  - connected
                  - kernel
                  type: string
                maxItems: 3
                type: array
                x-kubernetes-list-type: set
              routerRef:
                description: RouterRef targets a single BGPRouter by name.
                properties:
                  name:
                    description: Name is the name of the BGPRouter.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              vrfID:
                description: |-
                  VRFID is the 16-bit PoP-local VRF identifier this advertisement's SRv6
                  SID resolves into, per RFC 9800 uSID Argument addressing. Required when
                  Function is set.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
            required:
            - addressFamily
            - routerRef
            type: object
            x-kubernetes-validations:
            - message: at least one of prefixes, redistribute, originateFrom, or aggregation
                must be specified
              rule: (has(self.prefixes) && self.prefixes.size() > 0) || (has(self.redistribute)
                && self.redistribute.size() > 0) || has(self.originateFrom) || has(self.aggregation)
            - message: aggregation cannot be combined with prefixes, redistribute,
                or originateFrom
              rule: '!has(self.aggregation) || ((!has(self.prefixes) || self.prefixes.size()
                == 0) && (!has(self.redistribute) || self.redistribute.size() == 0)
                && !has(self.originateFrom))'
            - message: aggregation prefix must be in the advertisement's unicast address
                family
              rule: '!has(self.aggregation) || !isCIDR(self.aggregation.prefix) ||
                (self.addressFamily.afi == ''ipv4'' && cidr(self.aggregation.prefix).ip().family()
                == 4) || (self.addressFamily.afi == ''ipv6'' && cidr(self.aggregation.prefix).ip().family()
                == 6)'
          status:
            description: BGPAdvertisementStatus defines the observed state of BGPAdvertisement.
            properties:
              advertisedPrefixes:
                description: AdvertisedPrefixes is the count of prefixes currently
                  being originated.
                format: int32
                type: integer
              conditions:
                description: Conditions contains the standard conditions for this
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  was computed from.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
