apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: edgeroutes.galactic.datumapis.com
spec:
  group: galactic.datumapis.com
  names:
    categories:
      - galactic
    kind: EdgeRoute
    listKind: EdgeRouteList
    plural: edgeroutes
    singular: edgeroute
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.prefix
          name: Prefix
          type: string
        - jsonPath: .status.conditions[?(@.type=="Accepted")].status
          name: Accepted
          type: string
        - jsonPath: .status.accepted.attachment
          name: Attachment
          type: string
        - jsonPath: .status.accepted.node
          name: Node
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            EdgeRoute is one prefix's forwarding claim in one VPC: which attachment of
            which provider instance forwards the prefix. It lives in the provider's
            namespace; its name is derived from the VPC UID and the prefix. Providers
            write the claim; only galactic-controller accepts one, and a node opens the
            prefix's forwarding gate only for the accepted holder, only while that
            holder's instance lease is valid.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: |-
                EdgeRouteSpec is a provider's request to forward one prefix of a VPC
                through one of its attachments.
              properties:
                claim:
                  description: Claim is the current claim on the route.
                  properties:
                    attachment:
                      description: |-
                        Attachment is the claiming EdgeAttachment's name, in the route's
                        namespace.
                      maxLength: 253
                      minLength: 1
                      type: string
                    epoch:
                      description: |-
                        Epoch is the claim's epoch. It advances whenever the attachment or the
                        instance epoch changes.
                      format: int64
                      minimum: 1
                      type: integer
                    holderInstance:
                      description: |-
                        HolderInstance is the claiming EdgeInstance's name, in the route's
                        namespace.
                      maxLength: 253
                      minLength: 1
                      type: string
                    holderPodUID:
                      description: |-
                        HolderPodUID is the claiming pod's metadata.uid. The provider's
                        admission binding requires it to be the pod the writer's token was
                        issued for.
                      maxLength: 36
                      minLength: 1
                      type: string
                    instanceEpoch:
                      description: |-
                        InstanceEpoch is the epoch of the instance's lease the claim is held
                        under. The claim is valid only while that lease is valid at this epoch.
                      format: int64
                      minimum: 1
                      type: integer
                    released:
                      description: |-
                        Released reports that the holder of Epoch stopped forwarding and gave
                        the route up.
                      type: boolean
                  required:
                    - attachment
                    - epoch
                    - holderInstance
                    - holderPodUID
                    - instanceEpoch
                  type: object
                incarnation:
                  description: |-
                    Incarnation identifies this route object across its deletion and
                    recreation, set once at create. A recreated route has a new one, so no
                    acceptance of the old object applies to it.
                  maxLength: 64
                  minLength: 1
                  type: string
                prefix:
                  description: |-
                    Prefix is the IPv6 prefix forwarded, a masked CIDR. It must be inside
                    the service's granted prefixes and must not overlap another route of
                    the VPC, a workload subnet of the VPC or another service's client
                    pool, or contain another attachment's address. It may lie inside its
                    own service's client pool, which no attachment is then allocated an
                    address from.
                  maxLength: 43
                  type: string
                  x-kubernetes-validations:
                    - message: prefix must be a masked, non-default IPv6 CIDR in canonical form
                      rule: isCIDR(self) && cidr(self).ip().family() == 6 && cidr(self) == cidr(self).masked() && cidr(self).prefixLength() > 0 && string(cidr(self)) == self
                providerRef:
                  description: ProviderRef is the provider of the instances that claim the route.
                  properties:
                    name:
                      description: Name is the EdgeProvider's name.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                vpcUID:
                  description: VPCUID is the metadata.uid of the VPC the prefix is in.
                  maxLength: 36
                  minLength: 1
                  type: string
              required:
                - incarnation
                - prefix
                - providerRef
                - vpcUID
              type: object
              x-kubernetes-validations:
                - message: providerRef, vpcUID, prefix and incarnation are immutable
                  rule: self.providerRef == oldSelf.providerRef && self.vpcUID == oldSelf.vpcUID && self.prefix == oldSelf.prefix && self.incarnation == oldSelf.incarnation
                - message: the claim's epoch never decreases and the claim is never removed
                  rule: '!has(oldSelf.claim) || (has(self.claim) && self.claim.epoch >= oldSelf.claim.epoch)'
                - message: a released claim stays released until a new epoch
                  rule: '!has(oldSelf.claim) || !has(self.claim) || self.claim.epoch > oldSelf.claim.epoch || !(has(oldSelf.claim.released) && oldSelf.claim.released) || (has(self.claim.released) && self.claim.released)'
                - message: a new holder needs a new claim epoch
                  rule: '!has(oldSelf.claim) || !has(self.claim) || (self.claim.attachment == oldSelf.claim.attachment && self.claim.holderInstance == oldSelf.claim.holderInstance && self.claim.instanceEpoch == oldSelf.claim.instanceEpoch && self.claim.holderPodUID == oldSelf.claim.holderPodUID) || self.claim.epoch > oldSelf.claim.epoch'
            status:
              description: |-
                EdgeRouteStatus is the route's acceptance and the fencing of its accepted
                holder.
              properties:
                accepted:
                  description: |-
                    Accepted is the holder galactic-controller last accepted, written only
                    after the route is committed to its VPC's EdgeRouteIndex. It stays
                    after a revocation, with Accepted False, so the node can confirm the
                    holder's gate closed.
                  properties:
                    attachment:
                      description: |-
                        Attachment is the accepted EdgeAttachment's name, in the route's
                        namespace.
                      maxLength: 253
                      type: string
                    attachmentUID:
                      description: AttachmentUID is the accepted EdgeAttachment's metadata.uid.
                      maxLength: 36
                      type: string
                    epoch:
                      description: Epoch is the accepted claim epoch.
                      format: int64
                      minimum: 1
                      type: integer
                    instance:
                      description: |-
                        Instance is the accepted EdgeInstance's name, in the route's
                        namespace.
                      maxLength: 253
                      type: string
                    instanceEpoch:
                      description: |-
                        InstanceEpoch is the epoch of the instance's lease the route was
                        accepted under.
                      format: int64
                      minimum: 1
                      type: integer
                    instanceIncarnation:
                      description: |-
                        InstanceIncarnation is the incarnation of the instance's lease the
                        route was accepted under.
                      maxLength: 64
                      type: string
                    node:
                      description: |-
                        Node is the node of the attachment, the only node that may forward
                        the prefix.
                      maxLength: 253
                      type: string
                    vpcNamespace:
                      description: |-
                        VPCNamespace is the namespace of the VPC, where its EdgeRouteIndex
                        lives.
                      maxLength: 63
                      type: string
                  required:
                    - attachment
                    - attachmentUID
                    - epoch
                    - instance
                    - instanceEpoch
                    - instanceIncarnation
                    - node
                    - vpcNamespace
                  type: object
                closedEpoch:
                  description: |-
                    ClosedEpoch is the highest accepted epoch whose forwarding gate the
                    accepted holder's node confirmed closed. Only galactic-edge on that
                    node writes it, and it never decreases.
                  format: int64
                  minimum: 0
                  type: integer
                conditions:
                  description: |-
                    Conditions are Accepted, Claimed and Published, set by
                    galactic-controller.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  maxItems: 8
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
              type: object
              x-kubernetes-validations:
                - message: closedEpoch never decreases
                  rule: self.?closedEpoch.orValue(0) >= oldSelf.?closedEpoch.orValue(0)
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
