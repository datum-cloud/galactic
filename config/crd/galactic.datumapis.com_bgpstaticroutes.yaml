---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: bgpstaticroutes.galactic.datumapis.com
spec:
  group: galactic.datumapis.com
  names:
    kind: BGPStaticRoute
    listKind: BGPStaticRouteList
    plural: bgpstaticroutes
    shortNames:
    - bgpsr
    singular: bgpstaticroute
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.routerRef.name
      name: ROUTER
      type: string
    - jsonPath: .spec.destination
      name: DESTINATION
      type: string
    - jsonPath: .spec.action
      name: ACTION
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BGPStaticRoute installs one static route in a router's default routing
          instance. Installing a route never advertises it: advertisement is a
          separate BGPAdvertisement, and an aggregate never creates a discard route.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BGPStaticRouteSpec defines one static route.
            properties:
              action:
                description: Action is what the route does with matching traffic.
                enum:
                - Discard
                - NextHop
                type: string
              addressFamily:
                description: 'AddressFamily is the route''s family: ipv4 or ipv6.'
                enum:
                - ipv4
                - ipv6
                - l2vpn
                type: string
              destination:
                description: Destination is the route's prefix in CIDR notation.
                maxLength: 43
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: destination must be a valid CIDR
                  rule: isCIDR(self)
              nextHop:
                description: NextHop is the gateway address for action NextHop.
                maxLength: 45
                type: string
                x-kubernetes-validations:
                - message: nextHop must be a valid IP address
                  rule: isIP(self)
              routerRef:
                description: RouterRef names the BGPRouter whose routing instance
                  holds the route.
                properties:
                  name:
                    description: Name is the name of the BGPRouter.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - action
            - addressFamily
            - destination
            - routerRef
            type: object
            x-kubernetes-validations:
            - message: addressFamily must be ipv4 or ipv6
              rule: self.addressFamily == 'ipv4' || self.addressFamily == 'ipv6'
            - message: destination must be in addressFamily
              rule: '!isCIDR(self.destination) || cidr(self.destination).ip().family()
                == (self.addressFamily == ''ipv4'' ? 4 : 6)'
            - message: nextHop is required with, and only with, action NextHop
              rule: (self.action == 'NextHop') == has(self.nextHop)
            - message: nextHop must be in addressFamily
              rule: '!has(self.nextHop) || !isIP(self.nextHop) || ip(self.nextHop).family()
                == (self.addressFamily == ''ipv4'' ? 4 : 6)'
          status:
            description: BGPStaticRouteStatus defines the observed state of BGPStaticRoute.
            properties:
              conditions:
                description: Conditions contains the standard conditions for this
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  was computed from.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
