  name: bgprouterclasses.galactic.datumapis.com
spec:
  group: galactic.datumapis.com
  names:
    kind: BGPRouterClass
    listKind: BGPRouterClassList
    plural: bgprouterclasses
    shortNames:
    - bgprc
    singular: bgprouterclass
  scope: Cluster
