---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: servicevipbindings.galactic.datumapis.com
spec:
  group: galactic.datumapis.com
  names:
    kind: ServiceVIPBinding
    listKind: ServiceVIPBindingList
    plural: servicevipbindings
    shortNames:
    - svcvip
    singular: servicevipbinding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.name
      name: NODE
      type: string
    - jsonPath: .spec.vipAddress
      name: VIP
      type: string
    - jsonPath: .spec.backendAddress
      name: BACKEND
      type: string
    - jsonPath: .spec.egressKind
      name: KIND
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ServiceVIPBinding drives one worker node's backend-side half of the
          DSR/Maglev load-balancer datapath: it tells the node which service VIP a
          specific local backend must be reachable on, so the backend can reply to
          clients directly (the "Direct Server Return" this design depends on —
          see NetworkGateway's doc comment). Generated, never written by users:
          galactic-router on each worker node writes one object per (service, VIP,
          backend) for every backend a NetworkService's BackendSelector places on that
          node, owned by the service, and the same process's per-node reconciler
          consumes it.

          EgressKind decides which of two backend mechanisms this object drives,
          mirroring the same veth/tap fork the SRv6 uSID decap datapath already
          has (internal/plumbing/ebpf/usidmap's egress_kind field). Both mechanisms
          now converge on the same VIP-boundary substitution
          (BackendAddress:BackendPort for VIPAddress:Port at the SRv6 uSID TC-BPF
          boundary, usid_ingress's inbound half / usid_egress's outbound half) —
          required for both, not just tap, since a decapsulated ingress packet is
          delivered into the owning tenant's own VRF routing table, which has no
          route to an address bound outside that VRF (found live: see galactic's
          ServiceVIPBindingReconciler doc comment):

            - veth (container backend): the node ALSO binds VIPAddress on its own
              galactic-vip0 dummy interface (internal/plumbing/vip's
              Bind/Unbind/Verify in galactic) — this alone does not deliver
              anything to the backend pod (galactic-vip0 lives in the node's root
              namespace, not the tenant's VRF), but still lets the node itself
              verifiably answer on the VIP.
            - tap (VM backend): there is no guest-side configuration capability in
              this repo by design (internal/cnitap's own doc comment), so the
              substitution above is this kind's *only* delivery mechanism — the
              guest OS never needs to know the VIP exists at all.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ServiceVIPBindingSpec defines the desired VIP binding/translation
              state.
            properties:
              backendAddress:
                description: |-
                  BackendAddress is the backend's own real address (its pod-netns
                  address for a veth backend, or its actual guest-facing address for a
                  tap backend) — the VIP-boundary substitution target for both kinds
                  now (see EgressKind's own doc comment for why veth needs this too,
                  not just tap). +optional at the API level for the same reason
                  EgressKind itself carries no matching CEL requirement; the
                  reconciler validates it's set for either kind before doing anything.
                type: string
                x-kubernetes-validations:
                - message: backendAddress must be a valid IP address
                  rule: self == '' || isIP(self)
              backendPort:
                description: |-
                  BackendPort is the backend's own real port, paired with
                  BackendAddress — required for both kinds, see that field's doc
                  comment.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              egressKind:
                description: EgressKind selects which backend mechanism this binding
                  drives.
                enum:
                - veth
                - tap
                type: string
              port:
                description: Port is the VIP-facing port traffic arrives on.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              portRange:
                description: |-
                  PortRange translates an inclusive IPv6 UDP interval without changing ports.
                  It replaces Port and requires BackendPort to be omitted.
                properties:
                  end:
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  start:
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                required:
                - end
                - start
                type: object
                x-kubernetes-validations:
                - message: port range start must not exceed end
                  rule: self.start <= self.end
              protocol:
                description: Protocol is the transport protocol this binding applies
                  to.
                enum:
                - tcp
                - udp
                type: string
              sourceRef:
                description: SourceRef binds generated coordinated translations to
                  one source allocation.
                properties:
                  allocationUID:
                    minLength: 1
                    type: string
                  generation:
                    format: int64
                    minimum: 1
                    type: integer
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    minLength: 1
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    minLength: 1
                    type: string
                required:
                - allocationUID
                - generation
                - name
                - namespace
                - uid
                type: object
                x-kubernetes-validations:
                - message: binding source authority is immutable
                  rule: self == oldSelf
              targetRef:
                description: TargetRef identifies the Node this binding applies to.
                properties:
                  kind:
                    description: Kind is the target resource kind (e.g. Node).
                    minLength: 1
                    type: string
                  name:
                    description: Name is the name of the target resource.
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
              vipAddress:
                description: VIPAddress is the service VIP the backend must be reachable
                  on.
                type: string
                x-kubernetes-validations:
                - message: vipAddress must be a valid IP address
                  rule: isIP(self)
              vpcRef:
                description: |-
                  VPCRef is the opaque identifier of the VPC the backend belongs to,
                  copied from the owning NetworkService. It names the tenant VRF the
                  binding's translation rows are written for, so two tenants using the
                  same backend address on one node never share a row.
                minLength: 1
                type: string
            required:
            - egressKind
            - protocol
            - targetRef
            - vipAddress
            - vpcRef
            type: object
            x-kubernetes-validations:
            - message: exactly one of port and portRange is required
              rule: has(self.port) != has(self.portRange)
            - message: UDP ranges preserve ports and omit backendPort
              rule: '!has(self.portRange) || self.protocol == ''udp'' && !has(self.backendPort)'
            - message: range bindings are immutable; replace to change the translation
              rule: '!has(oldSelf.portRange) || self == oldSelf'
            - message: binding source authority presence is immutable
              rule: has(self.sourceRef) == has(oldSelf.sourceRef)
          status:
            description: ServiceVIPBindingStatus defines the observed state of a ServiceVIPBinding.
            properties:
              conditions:
                description: |-
                  Conditions contains the standard conditions for this resource,
                  including Bound (set True once internal/plumbing/vip.Verify or the
                  equivalent tap-translation-table check confirms the backend is
                  actually reachable on VIPAddress, not merely that the bind/table-write
                  call itself returned nil).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              health:
                description: |-
                  Health is the health decision for this binding's backend, set by
                  galactic-router on the backend's node while the owning NetworkService
                  has a healthCheck, and cleared once it has none. Every binding of one
                  backend carries the same decision.
                properties:
                  attachmentUID:
                    description: |-
                      AttachmentUID is the UID of the VPCAttachment that held the backend's
                      address when the decision was made.
                    type: string
                  lastProbeTime:
                    description: LastProbeTime is refreshed after every probe for
                      FailClosed services.
                    format: date-time
                    type: string
                  lastTransitionTime:
                    description: LastTransitionTime is when State last changed.
                    format: date-time
                    type: string
                  message:
                    description: Message is the last probe error, when there is one.
                    maxLength: 1024
                    type: string
                  observedGeneration:
                    description: ObservedGeneration identifies the NetworkService
                      configuration probed.
                    format: int64
                    type: integer
                  port:
                    description: Port is the TCP port that was probed.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  reason:
                    description: Reason is ProbeSucceeded, ProbeFailed, Pending or
                      ProbeUnavailable.
                    maxLength: 64
                    type: string
                  state:
                    description: State is the decision.
                    enum:
                    - Healthy
                    - Unhealthy
                    - Unknown
                    type: string
                required:
                - attachmentUID
                - lastTransitionTime
                - port
                - reason
                - state
                type: object
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  was computed from.
                format: int64
                type: integer
              sourceAuthorityEnforced:
                description: SourceAuthorityEnforced confirms terminal source-allocation
                  checks before map writes.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
