---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: serviceendpoints.galactic.datumapis.com
spec:
  group: galactic.datumapis.com
  names:
    kind: ServiceEndpoint
    listKind: ServiceEndpointList
    plural: serviceendpoints
    shortNames:
    - svcendpoint
    singular: serviceendpoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.address
      name: ADDRESS
      type: string
    - jsonPath: .spec.port
      name: PORT
      type: integer
    - jsonPath: .spec.distribution
      name: DISTRIBUTION
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ServiceEndpoint publishes a platform service that can be reached through a
          VPC attachment. The object describes the service contract; the controller
          that owns the service is responsible for its health and implementation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ServiceEndpointSpec defines a platform service address and
              its scope.
            properties:
              address:
                description: Address is the stable address that consumers use to reach
                  the service.
                type: string
                x-kubernetes-validations:
                - message: address must be an IP address
                  rule: isIP(self)
              attachmentRef:
                description: |-
                  AttachmentRef identifies the Cloud API VPCAttachment that hosts this
                  endpoint when the service is delivered through a private VPC path.
                  The network API keeps this reference opaque; the consuming controller
                  resolves it against the Cloud API.
                properties:
                  name:
                    description: Name is the Cloud API VPCAttachment name.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace is the namespace containing the Cloud API
                      VPCAttachment.
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
              attachmentSelector:
                description: |-
                  AttachmentSelector selects the Cloud API VPCAttachments that host replicas
                  of this endpoint. Labels used here must be assigned by the platform service
                  controller, not by tenants. The dataplane selects ready replicas for each
                  consumer according to DeliveryMode and Distribution.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              deliveryMode:
                description: |-
                  DeliveryMode defines how a backing attachment is selected relative to a
                  consumer. PreferNodeLocal uses a ready attachment on the consumer's node
                  when one exists and otherwise falls back to a ready remote attachment.
                  The dataplane preserves the consumer source address. If consumers with
                  overlapping address space present an identical TCP or UDP five-tuple to the
                  same replica, it rejects the later ambiguous flow fail-closed rather than
                  translate the source or risk returning traffic to the wrong VPC.
                enum:
                - NodeLocal
                - PreferNodeLocal
                type: string
              distribution:
                description: |-
                  Distribution says how a consumer's traffic reaches the producers on
                  its own node. Single, the default, allows one ready producer per node
                  and VPC and sends every consumer on that node to it; an endpoint that
                  selects more is refused. Spread sends new flows to any producer on the
                  consumer's node that its health check has not found Unhealthy: each
                  TCP connection stays with the producer that received its first packet,
                  and each UDP datagram picks a producer of its own, which suits
                  request/response protocols such as DNS but not ones that need a UDP
                  flow to stay on one producer. An Unhealthy producer keeps its existing
                  TCP connections and replies, and gets new flows again once it is
                  Healthy. When every producer on a node is Unhealthy, all of them stay
                  eligible. A node may hold at most 16 producers of a Spread endpoint.
                enum:
                - Single
                - Spread
                type: string
              healthCheck:
                description: |-
                  HealthCheck configures the TCP health check of a Spread endpoint's
                  producers. Each producer's own node probes it and publishes the
                  decision in that node's ServiceEndpointProducerReport for the endpoint.
                  Required when Distribution is Spread and refused otherwise.

                  Where interface traffic policy is enforced, the producer's policy must
                  allow TCP from fe80::/10 to the health check port on the Private path,
                  and the replies back.
                properties:
                  healthyThreshold:
                    default: 3
                    description: |-
                      HealthyThreshold is the number of consecutive successful probes that
                      make a producer Healthy.
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                  intervalSeconds:
                    default: 5
                    description: IntervalSeconds is the time between two probes of
                      one producer.
                    format: int32
                    maximum: 300
                    minimum: 1
                    type: integer
                  port:
                    description: |-
                      Port is the TCP port probed on every producer, 1-65535. Unset, it is
                      the endpoint's port, which must then be a tcp port. A udp endpoint must
                      set it to a TCP port its producers listen on.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  timeoutSeconds:
                    default: 2
                    description: |-
                      TimeoutSeconds is how long a probe waits for the handshake. It must not
                      exceed IntervalSeconds.
                    format: int32
                    maximum: 60
                    minimum: 1
                    type: integer
                  unhealthyThreshold:
                    default: 3
                    description: |-
                      UnhealthyThreshold is the number of consecutive failed probes that
                      make a producer Unhealthy.
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: timeoutSeconds must not exceed intervalSeconds
                  rule: self.timeoutSeconds <= self.intervalSeconds
              port:
                description: Port is the service port.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              protocol:
                description: Protocol is the transport protocol accepted by the endpoint.
                enum:
                - tcp
                - udp
                type: string
              region:
                description: |-
                  Region limits endpoint selection to a region. An empty value means the
                  endpoint is not region-scoped.
                type: string
              serviceClass:
                description: |-
                  ServiceClass identifies the platform capability implemented by this
                  endpoint, for example "ipv6-egress-dns".
                minLength: 1
                type: string
            required:
            - address
            - deliveryMode
            - port
            - protocol
            - serviceClass
            type: object
            x-kubernetes-validations:
            - message: exactly one of attachmentRef or attachmentSelector must be
                set
              rule: has(self.attachmentRef) != has(self.attachmentSelector)
            - message: healthCheck must be set when distribution is Spread, and only
                then
              rule: (has(self.distribution) && self.distribution == 'Spread') == has(self.healthCheck)
            - message: a udp endpoint's healthCheck must set port
              rule: '!has(self.healthCheck) || has(self.healthCheck.port) || self.protocol
                == ''tcp'''
          status:
            description: ServiceEndpointStatus reports what the nodes observe of an
              endpoint.
            properties:
              producers:
                description: |-
                  Producers holds health decisions written by galactic-router versions
                  that do not write ServiceEndpointProducerReports. Each such node writes
                  the entries of the producers on that node, under its own field manager.
                  A current galactic-router removes its own entries here once its report
                  holds their replacements, and reads both: for each producer and node it
                  uses whichever entry was renewed later. An entry whose attachmentUID no
                  longer matches the attachment of that name describes an earlier
                  attachment and is ignored. An entry not renewed for 60 seconds is
                  expired, and no node routes on its state.
                items:
                  description: ServiceEndpointProducerStatus is one producer's health
                    decision.
                  properties:
                    attachmentUID:
                      description: AttachmentUID is the UID of the VPCAttachment that
                        was probed.
                      type: string
                    lastTransitionTime:
                      description: LastTransitionTime is when State last changed.
                      format: date-time
                      type: string
                    message:
                      description: Message is the last probe error, when there is
                        one.
                      maxLength: 1024
                      type: string
                    name:
                      description: Name is the producer VPCAttachment's name.
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace is the producer VPCAttachment's namespace.
                      minLength: 1
                      type: string
                    node:
                      description: Node is the node that hosts the producer and probes
                        it.
                      minLength: 1
                      type: string
                    port:
                      description: Port is the TCP port that was probed.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    reason:
                      description: Reason is ProbeSucceeded, ProbeFailed, Pending
                        or ProbeUnavailable.
                      maxLength: 64
                      type: string
                    renewTime:
                      description: |-
                        RenewTime is when the producer's node last confirmed this entry. The
                        entry is current for 60 seconds after it, and expired after that or
                        when RenewTime is unset.
                      format: date-time
                      type: string
                    state:
                      description: |-
                        State is the decision. Healthy and Unknown producers receive new
                        flows; Unhealthy ones do not, unless every producer on the node is
                        Unhealthy.
                      enum:
                      - Healthy
                      - Unhealthy
                      - Unknown
                      type: string
                  required:
                  - attachmentUID
                  - lastTransitionTime
                  - name
                  - namespace
                  - node
                  - port
                  - reason
                  - state
                  type: object
                maxItems: 4096
                type: array
                x-kubernetes-list-map-keys:
                - namespace
                - name
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
