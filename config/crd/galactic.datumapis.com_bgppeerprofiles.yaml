---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: bgppeerprofiles.galactic.datumapis.com
spec:
  group: galactic.datumapis.com
  names:
    kind: BGPPeerProfile
    listKind: BGPPeerProfileList
    plural: bgppeerprofiles
    shortNames:
    - bgppp
    singular: bgppeerprofile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.peerASN
      name: PEER-ASN
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BGPPeerProfile is a reusable set of session settings that BGPPeers
          reference with spec.peerProfileRef. The FRR implementation renders a
          profile as one peer group and each referencing peer as a member. There
          is no profile inheritance: a peer's own transport and family settings
          override the profile field by field.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BGPPeerProfileSpec defines a peer profile's settings.
            properties:
              addressFamilies:
                description: |-
                  AddressFamilies lists the families a member activates, with their
                  settings.
                items:
                  description: |-
                    BGPPeerFamilySettings holds one address family's session settings for a
                    peer or a peer profile. Every field is optional: on a peer, an unset field
                    falls through to the profile's setting for the same family.
                  properties:
                    afi:
                      description: AFI is the address family indicator.
                      enum:
                      - ipv4
                      - ipv6
                      - l2vpn
                      type: string
                    allowASIn:
                      description: |-
                        AllowASIn accepts routes whose AS path holds the local ASN up to this
                        many times.
                      format: int32
                      maximum: 10
                      minimum: 1
                      type: integer
                    exportPolicyRef:
                      description: |-
                        ExportPolicyRef names the BGPPolicy applied to routes sent to the peer
                        in this family. A fabric peer family must resolve one: there is no
                        implicit export-everything default.
                      properties:
                        name:
                          description: Name is the referenced object's name.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    frr:
                      description: FRR holds FRR-specific settings.
                      properties:
                        weight:
                          description: |-
                            Weight is FRR's local, non-propagated path preference for routes
                            learned from the peer. It is not LOCAL_PREF.
                          format: int32
                          maximum: 65535
                          minimum: 0
                          type: integer
                      type: object
                    importPolicyRef:
                      description: |-
                        ImportPolicyRef names the BGPPolicy applied to routes received from
                        the peer in this family.
                      properties:
                        name:
                          description: Name is the referenced object's name.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    nextHopMode:
                      description: NextHopMode controls the advertised next hop.
                      enum:
                      - Unchanged
                      - Self
                      - SelfForce
                      type: string
                    prefixLimit:
                      description: PrefixLimit bounds the prefixes the peer may send
                        in this family.
                      properties:
                        action:
                          description: Action is what happens once maximum is exceeded.
                          enum:
                          - WarnOnly
                          - Restart
                          - Shutdown
                          type: string
                        maximum:
                          description: Maximum is the number of prefixes accepted
                            before the action applies.
                          format: int64
                          maximum: 4294967295
                          minimum: 1
                          type: integer
                        restartMinutes:
                          description: |-
                            RestartMinutes is the delay before a Restart action re-establishes
                            the session.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        warningThresholdPercent:
                          description: |-
                            WarningThresholdPercent logs a warning once received prefixes reach
                            this share of maximum.
                          format: int32
                          maximum: 100
                          minimum: 1
                          type: integer
                      required:
                      - action
                      - maximum
                      type: object
                      x-kubernetes-validations:
                      - message: restartMinutes is required with, and only with, action
                          Restart
                        rule: (self.action == 'Restart') == has(self.restartMinutes)
                    routeReflectorClient:
                      description: |-
                        RouteReflectorClient treats the peer as a route-reflector client in
                        this family.
                      type: boolean
                    safi:
                      description: SAFI is the subsequent address family indicator.
                      enum:
                      - unicast
                      - evpn
                      type: string
                    sendCommunity:
                      description: |-
                        SendCommunity restricts the community attributes sent to the peer to
                        the named ones. Unset sends every community attribute, the pinned
                        FRR's default.
                      enum:
                      - standard
                      - extended
                      - large
                      - both
                      type: string
                    softReconfigurationInbound:
                      description: |-
                        SoftReconfigurationInbound keeps a copy of the routes received from
                        the peer, so an import policy change applies without a refresh.
                      type: boolean
                  required:
                  - afi
                  - safi
                  type: object
                  x-kubernetes-validations:
                  - message: IPv4 only supports unicast SAFI
                    rule: 'self.afi == ''ipv4'' ? self.safi == ''unicast'' : true'
                  - message: IPv6 only supports unicast SAFI
                    rule: 'self.afi == ''ipv6'' ? self.safi == ''unicast'' : true'
                  - message: L2VPN only supports evpn SAFI
                    rule: 'self.afi == ''l2vpn'' ? self.safi == ''evpn'' : true'
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - afi
                - safi
                x-kubernetes-list-type: map
              frr:
                description: FRR holds FRR rendering settings.
                properties:
                  peerGroupName:
                    description: |-
                      PeerGroupName is the FRR peer group name. When unset the profile's
                      metadata.name is used.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
                    type: string
                type: object
              peerASN:
                description: |-
                  PeerASN, when set, is the remote ASN of every member. A member whose
                  own peerASN differs is rejected.
                format: int64
                maximum: 4294967295
                minimum: 1
                type: integer
              transport:
                description: Transport holds session transport settings.
                properties:
                  advertisementIntervalSeconds:
                    description: |-
                      AdvertisementIntervalSeconds is the minimum interval between UPDATE
                      messages. Unset leaves the implementation's default.
                    format: int32
                    maximum: 600
                    minimum: 0
                    type: integer
                  ebgpMultihopTTL:
                    description: |-
                      EBGPMultihopTTL allows an eBGP session over up to this many hops.
                      Unset renders no multihop line.
                    format: int32
                    maximum: 255
                    minimum: 1
                    type: integer
                type: object
            type: object
          status:
            description: BGPPeerProfileStatus defines the observed state of BGPPeerProfile.
            properties:
              conditions:
                description: Conditions contains the standard conditions for this
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  was computed from.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
