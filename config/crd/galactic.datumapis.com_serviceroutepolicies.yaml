  names:
    kind: ServiceRoutePolicy
    listKind: ServiceRoutePolicyList
    plural: serviceroutepolicies
    shortNames:
    - svcroute
    singular: serviceroutepolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serviceRef.name
      name: SERVICE
      type: string
    - jsonPath: .spec.region
      name: REGION
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ServiceRoutePolicy selects VPC attachments that should receive a route to a
          platform ServiceEndpoint. The selector is evaluated by the network control
          plane; Galactic compiles the selected attachments into dataplane state.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ServiceRoutePolicySpec defines service selection and attachment
              eligibility.
            properties:
              attachmentSelector:
                description: |-
                  AttachmentSelector selects eligible VPC attachments by authoritative
                  labels. Labels that grant access to platform services must be assigned by
                  the network control plane, not by tenants.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              authorization:
                description: Authorization defines the lifetime of translated service
                  access.
                properties:
                  persistent:
                    description: Persistent retains access until policy withdrawal
                      or VPC lifetime replacement.
                    type: boolean
                  validUntil:
                    description: |-
                      ValidUntil is the absolute UTC deadline for requests and existing replies.
                      Node controllers reject deadlines more than two minutes in the future.
                    format: date-time
                    type: string
                type: object
                x-kubernetes-validations:
                - message: persistent access must omit validUntil; bounded access
                    requires validUntil
                  rule: 'has(self.persistent) && self.persistent ? !has(self.validUntil)
                    : has(self.validUntil)'
              consumerVPCRef:
                description: |-
                  ConsumerVPCRef pins authorization to the immutable lifetime of the VPC
                  selected by AttachmentSelector. Galactic resolves the name through the
                  Cloud API and requires both the live name and UID to match.
                properties:
                  name:
                    description: Name is the VPC name in the policy namespace.
                    minLength: 1
                    type: string
                  uid:
                    description: UID is the Kubernetes UID of that VPC lifetime.
                    minLength: 1
                    type: string
                required:
                - name
                - uid
                type: object
              frontend:
                description: |-
                  Frontend is the address presented inside the consumer VPC. When set,
                  Galactic translates it to the ServiceEndpoint address and restores it on
                  replies.
                properties:
                  address:
                    description: |-
                      Address is translated to the ServiceEndpoint address for requests and is
                      restored as the source address for replies.
                    type: string
                    x-kubernetes-validations:
                    - message: address must be an IP address
                      rule: isIP(self)
                required:
                - address
                type: object
              protocolPorts:
                description: |-
                  ProtocolPorts limits the traffic that the route is intended to carry.
                  An empty list means the endpoint's declared port and protocol are used.
                items:
                  description: ServiceRouteProtocolPort identifies an allowed transport
                    protocol and port.
                  properties:
                    port:
                      description: Port is the transport port.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    protocol:
                      description: Protocol is the transport protocol.
                      enum:
                      - tcp
                      - udp
                      type: string
                  required:
                  - port
                  - protocol
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              region:
                description: |-
                  Region limits selected attachments to a region. An empty value means the
                  policy applies in every region where the endpoint is available.
                type: string
              serviceRef:
                description: ServiceRef identifies the ServiceEndpoint in this namespace.
                properties:
                  name:
                    description: Name is the ServiceEndpoint name.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - attachmentSelector
            - serviceRef
            type: object
            x-kubernetes-validations:
            - message: frontend requires consumerVPCRef
              rule: '!has(self.frontend) || has(self.consumerVPCRef)'
            - message: frontend requires authorization
              rule: '!has(self.frontend) || has(self.authorization)'
          status:
            description: ServiceRoutePolicyStatus contains policy conditions and fenced
              node reports.
            properties:
              conditions:
                description: Conditions contains durable acceptance and service-availability
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              nodes:
                description: |-
                  Nodes contains short-lived acknowledgments written by trusted node controllers.
                  Consumers require current UID, generation, input digest, and unexpired reports.
                items:
                  description: ServiceRouteNodeStatus acknowledges one node's current
                    programmed path.
                  properties:
                    inputDigest:
                      type: string
                    nodeName:
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                    policyUID:
                      type: string
                    ready:
                      type: boolean
                    validUntil:
                      format: date-time
                      type: string
                  required:
                  - inputDigest
                  - nodeName
                  - observedGeneration
                  - policyUID
                  - ready
                  - validUntil
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - nodeName
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
