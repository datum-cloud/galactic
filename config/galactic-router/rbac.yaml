apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: galactic-router
rules:
  - apiGroups: ["network.datumapis.com"]
    resources:
      - bgprouters
      - bgppeers
      - bgppolicies
    verbs: ["get", "list", "watch", "update", "patch"]
  # bgpadvertisements/bgpvrfinstances need delete: the GC reconciler
  # periodically removes orphaned CRDs left behind when CNI DEL never fires
  # (e.g. a force-terminated container). No create/update/patch on either
  # base resource: galactic-cni already owns creating/updating both
  # (config/galactic-cni/rbac.yaml) via galactic-bgp, and this binary's own
  # reconcilers only read them and write their /status subresource (see
  # the rule below). NetworkGatewayReconciler/NetworkRuleReconciler need
  # create/update/patch on bgpadvertisements, but that's galactic-gateway's
  # ClusterRole (config/galactic-gateway/rbac.yaml), not this one.
  - apiGroups: ["network.datumapis.com"]
    resources:
      - bgpadvertisements
      - bgpvrfinstances
    verbs: ["get", "list", "watch", "delete"]
  # servicevipbindings needs full CRUD on the base resource:
  # NetworkRuleBindingReconciler creates, updates and deletes this node's
  # generated bindings, and ServiceVIPBindingReconciler adds and removes its
  # own teardown finalizer with a Patch on the object itself, not just its
  # /status subresource. NodeDepartureReconciler deletes a departed node's
  # generated bindings and patches the finalizer off every binding that
  # targets it.
  - apiGroups: ["network.datumapis.com"]
    resources:
      - servicevipbindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # NetworkRuleBindingReconciler reads every NetworkRule to find the backends
  # on this node, and writes its per-node BackendsBound condition to rule
  # status. It never writes the rule itself.
  - apiGroups: ["network.datumapis.com"]
    resources:
      - networkrules
    verbs: ["get", "list", "watch"]
  - apiGroups: ["network.datumapis.com"]
    resources:
      - serviceendpoints
      - serviceroutepolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["network.datumapis.com"]
    resources:
      - bgprouters/status
      - bgppeers/status
      - bgpadvertisements/status
      - bgppolicies/status
      - bgpvrfinstances/status
      - servicevipbindings/status
      - networkrules/status
      - serviceroutepolicies/status
    verbs: ["get", "update", "patch"]
  - apiGroups: ["cloud.datumapis.com"]
    resources:
      - vpcs
      - vpcattachments
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["get", "list", "watch"]
  # GCReconciler's CollectOrphanedVRFs cross-references tenant EndpointSlices
  # cluster-wide to avoid reaping a VRF internal/ingresssidecar still owns —
  # see activeVPCsFromEndpointSlices's own doc comment in internal/gc/gc.go.
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # PeerStateEventEmitter (internal/controller/peer_events.go) raises BGPPeer
  # session-state-transition Events via the modern events.k8s.io/v1 API
  # (mgr.GetEventRecorder), not the deprecated core "" Events API the rule
  # below was originally added for — see docs/plans/router-bgp-peer-session-
  # events.md.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: galactic-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: galactic-router
subjects:
  - kind: ServiceAccount
    name: galactic-router
    namespace: galactic-system
