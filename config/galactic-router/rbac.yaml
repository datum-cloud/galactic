apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: galactic-router
rules:
  - apiGroups: ["galactic.datumapis.com"]
    resources: ["networkserviceaddresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["galactic.datumapis.com"]
    resources:
      - bgprouters
      - bgppeers
      - bgppolicies
    verbs: ["get", "list", "watch", "update", "patch"]
  # The router patches coordinated advertisement withdrawal finalizers.
  # GC deletes orphaned advertisements and VRFs; CNI/gateway own their specs.
  - apiGroups: ["galactic.datumapis.com"]
    resources: ["bgpadvertisements"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: ["galactic.datumapis.com"]
    resources: ["bgpvrfinstances"]
    verbs: ["get", "list", "watch", "delete"]
  # servicevipbindings needs full CRUD on the base resource:
  # NetworkServiceBindingReconciler creates, updates and deletes this node's
  # generated bindings, and ServiceVIPBindingReconciler adds and removes its
  # own teardown finalizer with a Patch on the object itself, not just its
  # /status subresource. NodeDepartureReconciler deletes a departed node's
  # generated bindings and patches the finalizer off every binding that
  # targets it.
  - apiGroups: ["galactic.datumapis.com"]
    resources:
      - servicevipbindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # NetworkServiceBindingReconciler reads every NetworkService to find the backends
  # on this node, and writes its per-node BackendsBound condition to rule
  # status. It never writes the rule itself.
  - apiGroups: ["galactic.datumapis.com"]
    resources:
      - networkservices
    verbs: ["get", "list", "watch"]
  - apiGroups: ["galactic.datumapis.com"]
    resources:
      - serviceendpoints
      - serviceroutepolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["galactic.datumapis.com"]
    resources:
      - bgprouters/status
      - bgppeers/status
      - bgpadvertisements/status
      - bgppolicies/status
      - bgpvrfinstances/status
      - servicevipbindings/status
      - networkservices/status
      - serviceroutepolicies/status
      - serviceendpoints/status
    verbs: ["get", "update", "patch"]
  - apiGroups: ["galactic.datumapis.com"]
    resources:
      - vpcs
      - vpcattachments
    verbs: ["get", "list", "watch"]
  # GC keeps a VPC's VRF and BGPVRFInstance while an edge attachment on
  # this node uses it (internal/edge/maintenance), read uncached.
  - apiGroups: ["galactic.datumapis.com"]
    resources:
      - edgeattachments
    verbs: ["get", "list"]
  # The traffic policy reconciler (GALACTIC_ROUTER_TRAFFIC_POLICY) reads
  # policies and bindings and applies this node's entry in each binding's
  # status.nodes. It never writes either resource itself. It also enforces
  # the policy each edge attachment's EdgeService selects, so it watches
  # both.
  - apiGroups: ["galactic.datumapis.com"]
    resources:
      - trafficpolicies
      - trafficpolicybindings
      - edgeattachments
      - edgeservices
    verbs: ["get", "list", "watch"]
  - apiGroups: ["galactic.datumapis.com"]
    resources:
      - trafficpolicybindings/status
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["get", "list", "watch"]
  # GCReconciler's CollectOrphanedVRFs cross-references tenant EndpointSlices
  # cluster-wide to avoid reaping a VRF internal/ingresssidecar still owns —
  # see activeVPCsFromEndpointSlices's own doc comment in internal/gc/gc.go.
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # PeerStateEventEmitter (internal/controller/peer_events.go) raises BGPPeer
  # session-state-transition Events via the modern events.k8s.io/v1 API
  # (mgr.GetEventRecorder), not the deprecated core "" Events API the rule
  # below was originally added for — see docs/plans/router-bgp-peer-session-
  # events.md.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: galactic-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: galactic-router
subjects:
  - kind: ServiceAccount
    name: galactic-router
    namespace: galactic-system
