apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: galactic-router
rules:
  - apiGroups: ["network.datumapis.com"]
    resources:
      - bgprouters
      - bgppeers
      - bgppolicies
    verbs: ["get", "list", "watch", "update", "patch"]
  # bgpadvertisements/bgpvrfinstances need delete: the GC reconciler
  # periodically removes orphaned CRDs left behind when CNI DEL never fires
  # (e.g. a force-terminated container). No create/update/patch on either
  # base resource: galactic-cni already owns creating/updating both
  # (config/galactic-cni/rbac.yaml) via galactic-bgp, and this binary's own
  # reconcilers only read them and write their /status subresource (see
  # the rule below). NetworkGatewayReconciler/NetworkRuleReconciler need
  # create/update/patch on bgpadvertisements, but that's galactic-gateway's
  # ClusterRole (config/galactic-gateway/rbac.yaml), not this one.
  - apiGroups: ["network.datumapis.com"]
    resources:
      - bgpadvertisements
      - bgpvrfinstances
    verbs: ["get", "list", "watch", "delete"]
  # servicevipbindings needs update/patch on the base resource (not just
  # delete, unlike bgpadvertisements/bgpvrfinstances above):
  # ServiceVIPBindingReconciler adds/removes its own teardown finalizer via
  # a Patch call on the object itself (mirroring NetworkRuleReconciler's
  # identical finalizer pattern on NetworkRule, config/galactic-gateway/
  # rbac.yaml), not just its /status subresource.
  - apiGroups: ["network.datumapis.com"]
    resources:
      - servicevipbindings
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["network.datumapis.com"]
    resources:
      - bgprouters/status
      - bgppeers/status
      - bgpadvertisements/status
      - bgppolicies/status
      - bgpvrfinstances/status
      - servicevipbindings/status
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["get", "list", "watch"]
  # GCReconciler's CollectOrphanedVRFs cross-references tenant EndpointSlices
  # cluster-wide to avoid reaping a VRF internal/ingresssidecar still owns —
  # see activeVPCsFromEndpointSlices's own doc comment in internal/gc/gc.go.
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: galactic-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: galactic-router
subjects:
  - kind: ServiceAccount
    name: galactic-router
    namespace: galactic-system
