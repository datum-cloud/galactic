apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-router
spec:
  template:
    spec:
      # This is the default, unqualified per-node role -- it needs no
      # name/label of its own (../../base/daemonset.yaml's plain "galactic-router"
      # identity is all it gets) since nothing else needs to select it
      # apart from the rr (route reflector) role, which independently
      # patches the same ../../base/ with its own distinct name/label -- see
      # ../control/daemonset-patch.yaml. Opt-in via
      # galactic.datumapis.com/galactic=router, an independent flag rather
      # than a galactic.datumapis.com/node primary-role value: this plain
      # (non-reflector) router mode now runs on *both* compute and edge
      # nodes (galactic-gateway no longer bundles its own galactic-router
      # container -- see config/galactic-gateway/base/daemonset.yaml), and
      # galactic-cni opts in via this identical flag (config/galactic-cni/
      # daemonset.yaml) for the same reason. galactic.datumapis.com/galactic
      # is mutually exclusive between "router" (this role) and "control"
      # (../control/daemonset-patch.yaml) by construction -- a label key can only
      # hold one value, so a node is never both at once. Excludes
      # Kubernetes control-plane nodes outright — the base DaemonSet's
      # blanket toleration would otherwise let it land there if one ever
      # carried this flag.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: galactic.datumapis.com/galactic
                    operator: In
                    values:
                      - router
      containers:
        - name: galactic-router
          env:
            - name: GALACTIC_ROUTER_BGP_LISTEN_PORT
              # This role only dials *out* to iBGP peers (the reflector,
              # see ../control/daemonset-patch.yaml, still a sibling under
              # overlays/); -1 disables the inbound
              # listener entirely, so no BGP containerPort belongs on this
              # patch -- there's no port here to document.
              value: "-1"
