apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-router
  labels:
    app.kubernetes.io/name: galactic-router-rr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: galactic-router-rr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: galactic-router-rr
    spec:
      # Route-reflector role: opt-in only, requires
      # galactic.datumapis.com/galactic=control, so it never
      # double-schedules with the plain per-worker default DaemonSet (see
      # ../default/daemonset-patch.yaml) on the same node --
      # galactic.datumapis.com/galactic's two values ("router", the plain
      # role above; "control", this one) are mutually exclusive by
      # construction, since a label key can only hold one value at a
      # time, the same reason galactic.datumapis.com/node's "compute"/
      # "edge" values can't coexist on one node. This node need not (and
      # must not) also carry galactic.datumapis.com/galactic=router --
      # galactic-cni (config/galactic-cni/daemonset.yaml) and this same
      # rr pod are never both scheduled here. Named "control" (not
      # "route-reflector") to match galactic.datumapis.com/fabric's
      # parallel "router"/"control" pair (config/fabric-router/
      # daemonset.yaml) -- one key per family, values as modes, rather
      # than a second independent boolean flag per family. Also excludes
      # Kubernetes control-plane nodes outright — the base DaemonSet's
      # blanket toleration would otherwise let it land there if one ever
      # carried this flag.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: galactic.datumapis.com/galactic
                    operator: In
                    values:
                      - control
      containers:
        - name: galactic-router
          env:
            - name: GALACTIC_ROUTER_REFLECTOR
              value: "true"
            - name: GALACTIC_ROUTER_BGP_LISTEN_PORT
              value: "1790"
              # GALACTIC_ROUTER_BGP_LOCAL_ADDRESS is auto-detected from the
              # host's lo interface by default (the stable peering address
              # other compute routers reflect through). Set it explicitly here
              # only if lo doesn't carry the desired address on this cluster.
          # Documentation only (hostNetwork: true, so this doesn't change
          # behavior): the rr role is the one place galactic-router
          # actually listens for inbound BGP -- the default role (see
          # ../../base/daemonset.yaml) and the router container in
          # config/galactic-gateway/base/daemonset.yaml both set
          # GALACTIC_ROUTER_BGP_LISTEN_PORT=-1 and open no BGP port at all,
          # so this entry only belongs on this patch, not the shared base.
          ports:
            - name: bgp
              containerPort: 1790
              protocol: TCP
