apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-router
  namespace: galactic-system
  labels:
    app.kubernetes.io/name: galactic-router
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: galactic-router
  # Like config/fabric-router/daemonset.yaml, this is a BGP speaker whose
  # gRPC health probe (below) only reflects "the process is up" --
  # cmd/galactic-router/root.go sets SERVING unconditionally right after
  # the server starts, never tied to iBGP session/route state -- so
  # RollingUpdate would advance to the next node on exactly the wrong
  # signal. A restart implicitly withdraws routes (no BGP graceful restart
  # support in internal/runtime/gobgp), and for the rr role every compute
  # node's iBGP session pivots through this one pod, so an automatic
  # rollout there is a fleet-wide route flap, not a single-node one --
  # worse than fabric-router's per-node blast radius. OnDelete puts pod
  # recreation under explicit, node-by-node control instead.
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels:
        app.kubernetes.io/name: galactic-router
    spec:
      serviceAccountName: galactic-router
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # This base is role-agnostic on purpose -- no affinity, no BGP
      # listen port -- so it's not meant to be applied on its own (its
      # blanket toleration below plus no affinity would schedule it onto
      # every node, control-plane included). ../overlays/default/ patches in
      # the default per-node role's affinity + GALACTIC_ROUTER_BGP_LISTEN_PORT
      # (see ../overlays/default/daemonset-patch.yaml); ../overlays/rr/
      # independently patches this same, unmodified base into the separate
      # route-reflector role.
      # Neither overlay derives from the other -- both patch this file
      # independently, each in its own isolated kustomize build, rather
      # than via a shared patches: entry one level up -- see
      # ../kustomization.yaml's own comment for why that's unsafe here.
      # Loss of galactic-router blackholes every VPC route through this
      # node, so the scheduler/kubelet must never preempt it for ordinary
      # workloads under node pressure.
      priorityClassName: system-node-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
      containers:
        - name: galactic-router
          # ":latest" is a placeholder only: no such tag is ever pushed to
          # GHCR. CI resolves and stamps a real version tag here when it
          # publishes the ghcr.io/datum-cloud/galactic-kustomize OCI bundle
          # (see .github/workflows/publish.yaml); applying this manifest
          # directly from a git checkout will fail to pull the image unless
          # you override the tag first — see the README's "Production
          # Deployment" section.
          image: ghcr.io/datum-cloud/galactic-router:latest
          command:
            - /galactic-router
          env:
            - name: GALACTIC_ROUTER_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GALACTIC_ROUTER_GC_NAMESPACE
              value: galactic-system
            # 5179 is also the binary's own default. Set explicitly here
            # anyway, matching this manifest's convention elsewhere, so it
            # can't silently drift if the binary's default ever changes.
            - name: GALACTIC_ROUTER_GRPC_HEALTH_PORT
              value: "5179"
          ports:
            - name: metrics
              containerPort: 9179
              protocol: TCP
            - name: grpc-health
              containerPort: 5179
              protocol: TCP
          # No BGP containerPort or GALACTIC_ROUTER_BGP_LISTEN_PORT here:
          # this base is role-agnostic, and the right value is role-dependent
          # -- see ../overlays/default/daemonset-patch.yaml (-1, disabled) and
          # ../overlays/rr/daemonset-patch.yaml (1790, the one role that actually
          # listens). Declaring one here would just be wrong for whichever
          # role doesn't match it.
          # GoBGP's cold start (peer session setup, RIB population) can
          # outrun readinessProbe/livenessProbe's short initialDelaySeconds
          # on a slow node, risking a liveness-triggered restart loop before
          # the process finishes initializing. startupProbe reuses the same
          # gRPC health check with a much longer failureThreshold so
          # liveness doesn't start counting until this succeeds once.
          startupProbe:
            grpc:
              port: 5179
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            grpc:
              port: 5179
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            grpc:
              port: 5179
            initialDelaySeconds: 5
            periodSeconds: 10
          # BPF (added alongside the pre-existing NET_ADMIN) and the bpf-fs
          # volumeMount below are new plumbing for the DSR/Maglev redesign's
          # ServiceVIPBindingReconciler (internal/controller/
          # servicevipbinding_controller.go): its EgressKindTap branch opens
          # a second handle onto vip_xlat_table, a map the eBPF uSID
          # datapath already pinned elsewhere on this node (galactic-cni's
          # own DaemonSet, config/galactic-cni/daemonset.yaml, loads and
          # attaches that program; this container never does) --
          # internal/plumbing/ebpf/vipxlatmap.OpenPinnedVipXlatTable's own
          # doc comment has the full reasoning. Neither grant is
          # unconditional the way galactic-cni's is (that DaemonSet's own
          # comment: "the datapath is unconditional... there is no flag to
          # gate this grant behind") -- a node with no tap-kind
          # ServiceVIPBinding ever scheduled to it simply never exercises
          # this path, but the grant/mount must still be present up front
          # since ServiceVIPBindingReconciler.SetupWithManager always
          # attempts to open the pin at startup (see root.go's runCmd).
          securityContext:
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add:
                - NET_ADMIN
                - BPF
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            # GC (internal/gc) checks whether a container's netns bind-mount
            # still exists on the host to decide whether shared BGP CRDs/VRFs
            # are orphaned. Without this mount the container has no
            # visibility into /var/run/netns at all, so that check always
            # (and incorrectly) reports every namespace as gone.
            - name: netns
              mountPath: /var/run/netns
              readOnly: true
            - name: bpf-fs
              mountPath: /sys/fs/bpf
            # internal/plumbing/vrf/lock.go's flock serializes VRF table ID
            # allocation between this container's GC pass (RemoveOrphanedVRFs
            # -> vrf.Delete) and the galactic-cni plugin's ADD/DEL, which runs
            # as a bare process directly on the host and locks the real
            # /var/lib/cni/galactic-vrf path unconditionally -- the lockDir
            # constant is not configurable. Without this mount,
            # readOnlyRootFilesystem above sends the container's MkdirAll
            # against its own throwaway overlay fs, so both the lock and any
            # VRF orphan GC it guards fail every time. Same well-known
            # /var/lib/cni root the CNI plugin's IPAM state
            # (internal/cni/ipam.DefaultLockDir) already lives under, so it
            # must be a real, writable directory on every node running this
            # DaemonSet regardless of this mount's presence.
            - name: cni-state
              mountPath: /var/lib/cni
      volumes:
        - name: netns
          hostPath:
            path: /var/run/netns
            type: DirectoryOrCreate
        - name: cni-state
          hostPath:
            path: /var/lib/cni
            type: DirectoryOrCreate
        - name: bpf-fs
          # The host's bpffs mount, same convention/tradeoff
          # config/galactic-cni/daemonset.yaml's own bpf-fs volume already
          # documents in full (mirrored here rather than repeated verbatim):
          # `Directory` (not DirectoryOrCreate) because bpffs must already
          # be mounted at this path by the host/kubelet node setup, and this
          # container gets read/write visibility into every other pinned
          # BPF object under it, not just vip_xlat_table -- an accepted,
          # largely inherent tradeoff of bpffs pinning on this platform.
          hostPath:
            path: /sys/fs/bpf
            type: Directory
