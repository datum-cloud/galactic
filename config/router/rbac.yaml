apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: galactic-router
rules:
  - apiGroups: ["network.datumapis.com"]
    resources:
      - bgprouters
      - bgppeers
      - bgppolicies
    verbs: ["get", "list", "watch", "update", "patch"]
  # bgpadvertisements/bgpvrfinstances need delete: the GC reconciler
  # periodically removes orphaned CRDs left behind when CNI DEL never fires
  # (e.g. a force-terminated container). No create/update/patch on either
  # base resource: galactic-cni already owns creating/updating both
  # (config/cni/rbac.yaml) via galactic-bgp, and this binary's own
  # reconcilers only read them and write their /status subresource (see
  # the rule below) — create/update/patch on bgpadvertisements was only
  # ever needed by NetworkGatewayReconciler/NetworkRuleReconciler, which no
  # longer live in this binary (see config/gateway/rbac.yaml for their
  # replacement RBAC).
  - apiGroups: ["network.datumapis.com"]
    resources:
      - bgpadvertisements
      - bgpvrfinstances
    verbs: ["get", "list", "watch", "delete"]
  # networkgateways/networkegresspolicies (datum-cloud/enhancements#865):
  # read-only, for internal/egressroute.Run (invoked by
  # EgressRouteReconciler, internal/controller/egressroute_controller.go).
  # This binary's own reconcilers never write either — enablement and
  # gateway-node assignment are set by NetworkEgressPolicyReconciler in
  # galactic-gateway (config/gateway/rbac.yaml), and EgressSID is
  # published by NetworkGatewayReconciler, also in galactic-gateway. This
  # binary only ever reads both to decide whether/where to point a local
  # tenant VRF's own default route.
  - apiGroups: ["network.datumapis.com"]
    resources:
      - networkgateways
      - networkegresspolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["network.datumapis.com"]
    resources:
      - bgprouters/status
      - bgppeers/status
      - bgpadvertisements/status
      - bgppolicies/status
      - bgpvrfinstances/status
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: galactic-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: galactic-router
subjects:
  - kind: ServiceAccount
    name: galactic-router
    namespace: galactic-system
