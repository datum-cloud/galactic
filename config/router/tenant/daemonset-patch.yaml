apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-router
  labels:
    app.kubernetes.io/name: galactic-router-tenant
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: galactic-router-tenant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: galactic-router-tenant
    spec:
      # Tenant pods run on worker nodes explicitly labeled for it;
      # opt-in only so new node types (GPU, monitoring, etc.) don't
      # accidentally pick up the tenant. Also excludes Kubernetes
      # control-plane nodes outright — the base DaemonSet's blanket
      # toleration would otherwise let it land there if one ever
      # carried the galactic.datumapis.com/node=edge label.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: galactic.datumapis.com/node
                    operator: In
                    values:
                      - edge
      containers:
        - name: galactic-router
          env:
            - name: GALACTIC_ROUTER_BGP_LISTEN_PORT
              # Tenant nodes only dial *out* to iBGP peers (the reflector,
              # see ../tenant-control/daemonset-patch.yaml); -1 disables
              # the inbound listener entirely, so no BGP containerPort
              # belongs on this patch -- there's no port here to document.
              value: "-1"
