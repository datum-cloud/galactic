apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-router
  namespace: galactic-system
  labels:
    app.kubernetes.io/name: galactic-router
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: galactic-router
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: galactic-router
    spec:
      serviceAccountName: galactic-router
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Loss of galactic-router blackholes every VPC route through this
      # node, so the scheduler/kubelet must never preempt it for ordinary
      # workloads under node pressure.
      priorityClassName: system-node-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
      containers:
        - name: galactic-router
          # ":latest" is a placeholder only: no such tag is ever pushed to
          # GHCR. CI resolves and stamps a real version tag here when it
          # publishes the ghcr.io/datum-cloud/galactic-kustomize OCI bundle
          # (see .github/workflows/publish.yaml); applying this manifest
          # directly from a git checkout will fail to pull the image unless
          # you override the tag first — see the README's "Production
          # Deployment" section.
          image: ghcr.io/datum-cloud/galactic-router:latest
          command:
            - /galactic-router
          env:
            - name: GALACTIC_ROUTER_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GALACTIC_ROUTER_ROUTER_MODE
              value: tenant
            - name: GALACTIC_ROUTER_GC_NAMESPACE
              value: galactic-system
            # 5179 is also the binary's own default (it used to be 5000,
            # which permanently collided with Talos's built-in
            # /sbin/dashboard on 127.0.0.1:5000 under hostNetwork: true --
            # see docs/router/configuration.md). Set explicitly here
            # anyway, matching this manifest's convention elsewhere, so it
            # can't silently drift if the binary's default ever changes.
            - name: GALACTIC_ROUTER_GRPC_HEALTH_PORT
              value: "5179"
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: grpc-health
              containerPort: 5179
              protocol: TCP
          # No BGP containerPort here: GALACTIC_ROUTER_BGP_LISTEN_PORT
          # isn't set at this (never-applied-directly) base level at all,
          # and its real value is role-dependent -- see
          # ../tenant-control/daemonset-patch.yaml (1790, the one role
          # that actually listens) and ../tenant/daemonset-patch.yaml
          # (-1, disabled). Declaring one here would just be wrong for
          # whichever role doesn't match it.
          # GoBGP's cold start (peer session setup, RIB population) can
          # outrun readinessProbe/livenessProbe's short initialDelaySeconds
          # on a slow node, risking a liveness-triggered restart loop before
          # the process finishes initializing. startupProbe reuses the same
          # gRPC health check with a much longer failureThreshold so
          # liveness doesn't start counting until this succeeds once.
          startupProbe:
            grpc:
              port: 5179
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            grpc:
              port: 5179
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            grpc:
              port: 5179
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add:
                - NET_ADMIN
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            # GC (internal/gc) checks whether a container's netns bind-mount
            # still exists on the host to decide whether shared BGP CRDs/VRFs
            # are orphaned. Without this mount the container has no
            # visibility into /var/run/netns at all, so that check always
            # (and incorrectly) reports every namespace as gone.
            - name: netns
              mountPath: /var/run/netns
              readOnly: true
      volumes:
        - name: netns
          hostPath:
            path: /var/run/netns
            type: DirectoryOrCreate
