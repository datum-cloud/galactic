# Alerts on the underlay (fabric-router's FRR, via frr-exporter and
# fabric-config-agent), on galactic-router's BMP export and route installs,
# on the galactic-nat egress shards' session tables, masquerade ports and
# uplink NICs, and on the fabric-api looking glass's gateway and node
# sidecars. A BGP session that drops is also streamed to the BMP collector as
# a Peer Down carrying the reason and any NOTIFICATION; these rules are the
# Prometheus-side signal for the same events, so an alert does not depend on
# the collector or the log pipeline behind it.
#
# This file is the tested source for these rules, not necessarily where they
# run. On Datum's infra the edge clusters' vmalert records but never notifies,
# so the rules are evaluated centrally against the metrics the edge vmagent
# remote-writes, and infra carries a copy of them. Change them here first,
# with their tests, then update infra's copy to match.
#
# Every alert carries the labels and annotations infra's alerting standard
# (infra docs/enhancements/alerting-standards) checks for: severity, service
# and team, summary, description and runbook_url. service is galactic, the
# Backstage System that owns galactic-router, galactic-nat and the fabric
# router underlay, and team is connect, that System's owner in infra's
# catalog-info.yaml.
#
# Unit tests: tests/rules-test.yaml, run with task test:alerts.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: galactic-bgp
  labels:
    app.kubernetes.io/name: galactic-bgp
spec:
  groups:
    - name: fabric-router
      rules:
        # frr_bgp_peer_state is 1 for Established, 0 for any other FSM state,
        # 2 for a neighbor that is administratively shut down. Only 0 is an
        # outage; a deliberate shutdown is covered by the next rule.
        - alert: FabricBGPSessionDown
          expr: frr_bgp_peer_state{job="fabric-router"} == 0
          for: 5m
          labels:
            severity: critical
            service: galactic
            team: connect
          annotations:
            summary: "Underlay BGP session {{ $labels.node }} -> {{ $labels.peer }} ({{ $labels.afi }}) is down"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricbgpsessiondown"
            description: >-
              fabric-router on {{ $labels.node }} has not had its {{ $labels.afi }} {{ $labels.safi }} session to
              {{ $labels.peer }} (AS {{ $labels.peer_as }}) Established for 5 minutes. The BMP collector's Peer Down
              for this session carries the reason and any NOTIFICATION.
        - alert: FabricBGPSessionAdminDown
          expr: frr_bgp_peer_state{job="fabric-router"} == 2
          for: 1h
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "Underlay BGP session {{ $labels.node }} -> {{ $labels.peer }} ({{ $labels.afi }}) has been shut down for an hour"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricbgpsessionadmindown"
            description: >-
              The neighbor is administratively shut down in fabric-router's running config on {{ $labels.node }}.
              Re-enable it, or remove it from that node's fabric-router.<nodename> ConfigMap if the shutdown is
              meant to last.
        # A session's uptime falls back toward zero each time it re-establishes,
        # so resets() counts re-establishments, including flaps that come and
        # go between two scrapes and never show in frr_bgp_peer_state.
        - alert: FabricBGPSessionFlapping
          expr: resets(frr_bgp_peer_uptime_seconds{job="fabric-router"}[30m]) >= 3
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "Underlay BGP session {{ $labels.node }} -> {{ $labels.peer }} ({{ $labels.afi }}) is flapping"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricbgpsessionflapping"
            description: >-
              The session re-established {{ $value }} times in the last 30 minutes. The BMP collector's Peer Down
              messages for it carry the reason for each drop.
        # Compared against the same session an hour ago, so a session new
        # within the hour has nothing to compare against and does not alert,
        # and only while the session is Established, since a session that is
        # down already has FabricBGPSessionDown.
        - alert: FabricBGPPrefixesDropped
          expr: |
            (
              frr_bgp_peer_prefixes_received_count_total{job="fabric-router"}
                < 0.5 * (frr_bgp_peer_prefixes_received_count_total{job="fabric-router"} offset 1h)
            )
            and frr_bgp_peer_state{job="fabric-router"} == 1
          for: 15m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "{{ $labels.node }} receives under half its usual prefixes from {{ $labels.peer }} ({{ $labels.afi }})"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricbgpprefixesdropped"
            description: >-
              {{ $labels.node }} now receives {{ $value }} {{ $labels.afi }} prefixes from {{ $labels.peer }}, under
              half what it received an hour ago, while the session stays up. Check the peer's export policy and
              this node's import filters; the BMP collector's pre-policy routes show what the peer actually sent.
        - alert: FabricRouterExporterCollectorFailing
          expr: frr_collector_up{job="fabric-router"} == 0
          for: 10m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "frr-exporter's {{ $labels.collector }} collector is failing on {{ $labels.node }}"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricrouterexportercollectorfailing"
            description: >-
              frr-exporter on {{ $labels.node }} cannot read the {{ $labels.collector }} data from FRR, usually
              because a daemon's vty socket in /run/frr is missing or unreadable. The other fabric-router alerts on
              this node are blind until it recovers.
        - alert: FabricRouterMetricsDown
          expr: up{job="fabric-router"} == 0
          for: 5m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "fabric-router metrics on {{ $labels.node }} cannot be scraped"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutermetricsdown"
            description: >-
              Prometheus cannot reach frr-exporter on {{ $labels.node }} (port 9342). Every other fabric-router
              alert on this node is blind until it recovers.
    # From fabric-config-agent's session check (job fabric-config-agent, port
    # 9343).
    - name: fabric-config-agent
      rules:
        # The agent hard-resets a session with a mapped next hop at most once
        # per 10 minutes, so 15 minutes means at least one reset did not fix
        # it, or the agent runs with --detect-only.
        - alert: FabricBGPMappedNextHop
          expr: fabric_router_bgp_mapped_nexthop{job="fabric-config-agent"} == 1
          for: 15m
          labels:
            severity: critical
            service: galactic
            team: connect
          annotations:
            summary: "{{ $labels.node }} announces an IPv4-mapped next hop to {{ $labels.peer }}"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricbgpmappednexthop"
            description: >-
              fabric-router on {{ $labels.node }} has announced ::ffff:<router-id> as the IPv6 next hop to
              {{ $labels.peer }} for 15 minutes, despite the agent's resets. Receiving routers cannot install these
              routes, so other sites lose their routes to this node's locators and NAT shards. The agent's
              MappedNextHopReset events on the pod show each reset.
        # A BGP route that loses to an installed connected or static route is
        # not counted, so this fires only for prefixes nothing routes.
        - alert: FabricBGPRoutesNotInstalled
          expr: fabric_router_bgp_uninstalled_routes{job="fabric-config-agent"} > 0
          for: 10m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "{{ $value }} {{ $labels.afi }} BGP routes on {{ $labels.node }} are not installed"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricbgproutesnotinstalled"
            description: >-
              zebra on {{ $labels.node }} holds {{ $value }} {{ $labels.afi }} prefixes learned over BGP with no
              route installed in the kernel for 10 minutes, usually because the next hop does not resolve.
              `show {{ $labels.afi }} route` in the frr container shows which. An IPv4-mapped next hop from the
              announcing node (FabricBGPMappedNextHop) is one cause.
        - alert: FabricConfigAgentMetricsDown
          expr: up{job="fabric-config-agent"} == 0
          for: 5m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "fabric-config-agent metrics on {{ $labels.node }} cannot be scraped"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricconfigagentmetricsdown"
            description: >-
              Prometheus cannot reach fabric-config-agent on {{ $labels.node }} (port 9343), so
              FabricBGPMappedNextHop and FabricBGPRoutesNotInstalled cannot fire for it.
    - name: galactic-router
      rules:
        - alert: GalacticRouterBMPStationDown
          expr: galactic_router_bmp_station_up{job=~"galactic-router|galactic-router-rr"} == 0
          for: 10m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "{{ $labels.router }} on {{ $labels.node }} is not streaming to BMP collector {{ $labels.station }}"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticrouterbmpstationdown"
            description: >-
              galactic-router's BMP session to {{ $labels.station }} has been down for 10 minutes, or the station's
              name does not resolve. Route history and Peer Down events for this router are not being recorded.
        # vrf counts tenant VPC routes, plain counts egress shard and VIP routes.
        # The router retries both as the underlay changes, so this fires only
        # for routes still failing after 10 minutes of retries.
        - alert: GalacticRouterRoutesNotInstalled
          expr: galactic_router_route_install_failing{job=~"galactic-router|galactic-router-rr"} > 0
          for: 10m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "{{ $value }} {{ $labels.kind }} routes on {{ $labels.node }} are not installed"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticrouterroutesnotinstalled"
            description: >-
              galactic-router on {{ $labels.node }} has failed for 10 minutes to install {{ $value }}
              {{ $labels.kind }} routes it holds a best path for, so this node cannot reach those prefixes.
              The router's "route install failed" log lines name each prefix and the error, usually a SID
              with no route over an SRv6 uplink or an unresolved neighbor.
        - alert: GalacticRouterMetricsDown
          expr: up{job=~"galactic-router|galactic-router-rr"} == 0
          for: 5m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "{{ $labels.job }} metrics on {{ $labels.node }} cannot be scraped"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticroutermetricsdown"
            description: >-
              Prometheus cannot reach galactic-router's metrics port on {{ $labels.node }} (9179), so
              GalacticRouterBMPStationDown and GalacticRouterRoutesNotInstalled cannot fire for it.
    # From each egress shard's galactic-nat (job galactic-nat, port 9182).
    - name: galactic-nat
      rules:
        # Expired sessions keep their rows until the LRU evicts them, so a
        # busy shard's table sits near full by design. Live sessions are lost
        # only once the table is full and its least recently seen row is
        # younger than the longest session timeout, 7440s for established
        # TCP: the LRU is then evicting sessions that were still live.
        - alert: GalacticNatSessionTableEvictingLive
          expr: >-
            sum by (node) (galactic_nat_conns{job="galactic-nat"})
              / on (node) max by (node) (galactic_nat_conn_table_max_entries{job="galactic-nat"}) > 0.9
            and on (node)
            max by (node) (galactic_nat_conn_table_oldest_row_age_seconds{job="galactic-nat"}) < 7440
          for: 15m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "The NAT session table on {{ $labels.node }} is over 90% full and evicting live sessions"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatsessiontableevictinglive"
            description: >-
              The egress shard on {{ $labels.node }} has had its session table over 90% full for 15 minutes, with
              its least recently used row younger than the 7440s established-TCP timeout. The table is evicting
              idle sessions that have not expired, so tenants' long-lived connections through this shard break
              when they next send. galactic_nat_sessions shows which family and protocol hold the table.
        # A shard drops a new flow when it finds no free masquerade port (or
        # Echo Identifier) for it. It probes only 8 of 28000 ports per
        # destination address and port, so a lone drop can happen while ports
        # remain free, and they grow more frequent as a destination fills:
        # about 1 in 250 new flows at half full. Drops in every 10-minute
        # window for 15 minutes mean a destination is full or close to it.
        # The counter lives in a pinned map and outlives the process, so only
        # its increase is read.
        - alert: GalacticNatPortExhausted
          expr: >-
            sum by (node, reason) (
              increase(galactic_nat_drops_total{job="galactic-nat", reason=~"nat(66|64)_pat_exhausted"}[10m])
            ) > 0
          for: 15m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "The egress shard on {{ $labels.node }} is out of masquerade ports ({{ $labels.reason }})"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatportexhausted"
            description: >-
              The egress shard on {{ $labels.node }} has dropped new flows for want of a free masquerade port
              ({{ $labels.reason }}) in every 10-minute window for 15 minutes, about {{ $value | humanize }} in the last
              one. Each drop is a connection a tenant failed to open. Many flows to one destination address and
              port fill its ports first.
        # One NIC receive queue dropping a steady share of its traffic while
        # most of the interface's queues do not (#673). The NIC drops these
        # before the XDP datapath sees them, so galactic_nat_drops_total stays
        # flat. Every flow hashed to the queue keeps failing on retry, and a
        # BGP session on it expires its hold timer. Three conditions, all for
        # 10 minutes: the queue drops over 1% of its packets while no more than
        # half of the interface's queues drop that much (a burst spreads across
        # queues, and a single-queue uplink is all of its own queues so it
        # cannot fire), and the queue either delivers over 10 packets a second
        # (so a handful of drops on an idle queue does not count) or delivers
        # none while discarding. That second case is a queue that has stopped
        # entirely, which is unambiguous at any rate; the floor alone measures
        # delivered packets, which a dead queue has none of. Idle queues count
        # as queues of the interface. Only drivers that count discards per
        # queue report them, bnxt_en among them.
        - alert: GalacticNatUplinkRxQueueStalled
          expr: |
            (
              rate(galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat"}[5m])
                /
              (rate(galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat"}[5m]) + rate(galactic_nat_uplink_rx_queue_packets_total{job="galactic-nat"}[5m]))
            ) > 0.01
            and on (node, interface)
            (
              count by (node, interface) (
                (
                  rate(galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat"}[5m])
                    /
                  (rate(galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat"}[5m]) + rate(galactic_nat_uplink_rx_queue_packets_total{job="galactic-nat"}[5m]))
                ) > 0.01
              )
                <=
              0.5 * count by (node, interface) (
                (
                  rate(galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat"}[5m])
                    /
                  (rate(galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat"}[5m]) + rate(galactic_nat_uplink_rx_queue_packets_total{job="galactic-nat"}[5m]))
                )
              )
            )
            and
            (
              rate(galactic_nat_uplink_rx_queue_packets_total{job="galactic-nat"}[5m]) > 10
              or
              (
                rate(galactic_nat_uplink_rx_queue_packets_total{job="galactic-nat"}[5m]) == 0
                and
                rate(galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat"}[5m]) > 0
              )
            )
          for: 10m
          labels:
            severity: critical
            service: galactic
            team: connect
          annotations:
            summary: "Receive queue {{ $labels.queue }} of {{ $labels.interface }} on {{ $labels.node }} is dropping packets"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatuplinkrxqueuestalled"
            description: >-
              Queue {{ $labels.queue }} of uplink {{ $labels.interface }} ({{ $labels.driver }}) has discarded
              {{ $value | humanizePercentage }} of its packets for 10 minutes while no more than half of the
              interface's queues have. Flows hashed to that queue fail on every retry. Bouncing the interface clears it,
              once its bond partner is confirmed up.
        - alert: GalacticNatMetricsDown
          expr: up{job="galactic-nat"} == 0
          for: 5m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "galactic-nat metrics on {{ $labels.node }} cannot be scraped"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatmetricsdown"
            description: >-
              Prometheus cannot reach galactic-nat's metrics port on {{ $labels.node }} (9182), so
              GalacticNatSessionTableEvictingLive, GalacticNatPortExhausted and GalacticNatUplinkRxQueueStalled
              cannot fire for it.
    # From galactic-cni (job galactic-cni, port 9180): its egress shard groups,
    # one per translation class (nat66, or nat64:<prefix>), and its own
    # control loop. A node in ordered mode with no group left publishes no
    # pool series, so these rules key off galactic_cni_egress_mode and
    # galactic_cni_egress_group_routes, which galactic-cni always exports,
    # rather than read missing pool series as a healthy pool.
    - name: galactic-cni-egress
      rules:
        # A class's group has shards, or routes still name it, but no shard
        # takes tenants: every candidate is unreachable from this node or
        # draining, or the cluster has none left. Every tenant of that class
        # on the node without a live pin has no egress.
        - alert: GalacticEgressPoolEmpty
          expr: |
            sum by (node, class) (galactic_cni_egress_pool_members{job="galactic-cni", state="active"}) == 0
            and on (node, class)
            (
              sum by (node, class) (galactic_cni_egress_pool_members{job="galactic-cni", state=~"draining|unreachable"}) > 0
              or
              sum by (node, class) (galactic_cni_egress_group_routes{job="galactic-cni"}) > 0
            )
          for: 2m
          labels:
            severity: critical
            service: galactic
            team: connect
          annotations:
            summary: "No egress shard takes {{ $labels.class }} traffic from {{ $labels.node }}"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticegresspoolempty"
            description: >-
              No egress shard in {{ $labels.node }}'s {{ $labels.class }} group has taken new tenants for 2
              minutes while the group has shards or routes, so new {{ $labels.class }} egress from that node is
              dropped. galactic_cni_egress_pool_members shows whether its shards are unreachable (no route to their
              SID over an SRv6 uplink) or draining.
        # Fewer shards take tenants than the operator said the class should
        # have. A class with no eligible shard at all is
        # GalacticEgressClassUnserved instead.
        - alert: GalacticEgressPoolBelowMinimum
          expr: |
            sum by (node, class) (galactic_cni_egress_pool_members{job="galactic-cni", state="active"})
              < on (node) group_left max by (node) (galactic_cni_egress_pool_min_active{job="galactic-cni"})
            and on (node, class)
            sum by (node, class) (galactic_cni_egress_pool_members{job="galactic-cni", state=~"active|draining|unreachable"}) > 0
            and on (node, class)
            max by (node, class) (galactic_cni_egress_pool_enabled{job="galactic-cni"}) == 1
          for: 10m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "{{ $labels.node }} has fewer active {{ $labels.class }} egress shards than the pool minimum"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticegresspoolbelowminimum"
            description: >-
              {{ $labels.node }} has had {{ $value }} active {{ $labels.class }} egress shards for 10
              minutes, below the GALACTIC_CNI_EGRESS_POOL_MIN_ACTIVE the cluster is configured for. The remaining
              shards carry the metro's whole egress load for that class. galactic_cni_egress_pool_members shows
              which shards are draining or unreachable.
        # Every EgressShard in the cluster is ready but none can translate
        # this class: none has a masquerade address in its family, or none
        # translates this NAT64 prefix. galactic-cni then installs no route
        # for the class, so its traffic has no egress.
        - alert: GalacticEgressClassUnserved
          expr: |
            sum by (node, class) (galactic_cni_egress_pool_members{job="galactic-cni", state=~"active|draining|unreachable"}) == 0
            and on (node, class)
            sum by (node, class) (galactic_cni_egress_pool_members{job="galactic-cni", state="ineligible"}) > 0
          for: 15m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "No egress shard can translate {{ $labels.class }} for {{ $labels.node }}"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticegressclassunserved"
            description: >-
              {{ $labels.node }} is configured for {{ $labels.class }} egress, but none of the cluster's
              EgressShards can translate it: none has a masquerade address in that family, or none translates that
              NAT64 prefix. galactic-cni logs the shards it kept out. Either give a shard that capability or remove
              the prefix from GALACTIC_CNI_NAT64_PREFIX.
        # usid_egress dropped tenant packets bound for a shard group: the
        # group was empty or disabled, its Maglev table named a shard that
        # was not alive, or the packet could not be parsed. Drops in every
        # window for 10 minutes are not a passing rebuild.
        - alert: GalacticEgressShardGroupDropping
          expr: >-
            sum by (node, result) (
              increase(galactic_cni_egress_shard_selections_total{job="galactic-cni", result=~"group_empty|shard_dead|parse_failed"}[5m])
            ) > 0
          for: 10m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "{{ $labels.node }} is dropping tenant egress bound for a shard group ({{ $labels.result }})"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticegressshardgroupdropping"
            description: >-
              usid_egress on {{ $labels.node }} has dropped tenant packets bound for an egress shard group
              ({{ $labels.result }}) in every 5-minute window for 10 minutes, about {{ $value | humanize }} in the
              last one. group_empty means no shard takes tenants; shard_dead means the group was not rebuilt
              after a shard became unreachable, which points at galactic-cni's egress sweep.
        # Hashed mode is configured but galactic-cni has never listed the
        # cluster's EgressShards: RBAC, the API server or the CRD is missing.
        # Its groups keep whatever they last held, and a new node has none.
        - alert: GalacticEgressShardWatchNotSynced
          expr: |
            max by (node) (galactic_cni_egress_mode{job="galactic-cni", mode="hashed"}) == 1
            and on (node)
            max by (node) (galactic_cni_egress_shard_watch_synced{job="galactic-cni"}) == 0
          for: 10m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "galactic-cni on {{ $labels.node }} cannot list EgressShards"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticegressshardwatchnotsynced"
            description: >-
              galactic-cni on {{ $labels.node }} runs hashed egress mode but its EgressShard watch has not listed
              the cluster for 10 minutes. Its shard groups keep their last members, and a node that never
              listed them has no group at all. Check galactic-cni's logs, its get/list/watch permission on
              egressshards, and that the EgressShard CRD is installed.
        # A sweep step keeps failing: publishing a group, reading or rewriting
        # egress_route_table, listing EgressShards, or retiring groups. While
        # it fails, membership and next hops go stale, and a move back to
        # ordered mode does not finish.
        - alert: GalacticEgressSweepFailing
          expr: |
            sum by (node, stage) (increase(galactic_cni_egress_sweep_errors_total{job="galactic-cni"}[10m])) > 0
          for: 15m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "galactic-cni's egress sweep on {{ $labels.node }} keeps failing at {{ $labels.stage }}"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticegresssweepfailing"
            description: >-
              galactic-cni on {{ $labels.node }} has failed its egress sweep at the {{ $labels.stage }} step in
              every 10-minute window for 15 minutes. Shard group membership and next hops are going stale, and a
              switch back to ordered mode leaves routes on the groups until it succeeds.
        - alert: GalacticCNIMetricsDown
          expr: up{job="galactic-cni"} == 0
          for: 5m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "galactic-cni metrics on {{ $labels.node }} cannot be scraped"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticcnimetricsdown"
            description: >-
              Prometheus cannot reach galactic-cni's metrics port on {{ $labels.node }} (9180), so no egress
              shard group alert can fire for it.
    # fabric-api: the looking glass's cell gateway and node sidecars. None of
    # these fire merely because nobody ran a query: each is either a state
    # the components report continuously (availability, credentials,
    # certificate expiry, stale objects, scrapes) or a ratio over executions
    # that actually happened.
    - name: fabric-api
      rules:
        # A gateway with executions in flight that finished none for 10
        # minutes is stuck: every execution is bounded by its 120s lifetime.
        - alert: FabricAPIExecutionStalled
          expr: >-
            max by (namespace, pod) (fabric_api_gateway_executions_in_flight{job="fabric-api-gateway"}) > 0
            unless on (namespace, pod)
            sum by (namespace, pod) (increase(fabric_api_gateway_queries_total{job="fabric-api-gateway"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "fabric-api gateway {{ $labels.pod }} has executions in flight but completes none"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricapiexecutionstalled"
            description: >-
              {{ $labels.pod }} has had fabric queries executing for 20 minutes without finishing any, although each
              is bounded by a 120 second lifetime. Looking-glass queries in this cell will end DeadlineExceeded at
              NSO. Check the gateway's logs and its status-write metrics.
        # The sidecar reports diagnostics unavailable while FRR is
        # unreachable or at an unsupported version, or its certificate is
        # missing. FRR itself may be fine; this is about the looking glass.
        - alert: FabricAPINodeDiagnosticsUnavailable
          expr: fabric_api_node_diagnostics_available{job="fabric-api-node"} == 0
          for: 15m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "fabric-api diagnostics are unavailable on {{ $labels.node }}"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricapinodediagnosticsunavailable"
            description: >-
              The fabric-api sidecar on {{ $labels.node }} has reported diagnostics unavailable for 15 minutes:
              FRR's vty sockets are unreachable, FRR runs a release the sidecar has no parsers for, or its mTLS
              certificate is missing. Queries record this node as failed. Its Info RPC and logs give the reason.
        # Over at least five node calls in 30 minutes, more than half could
        # not reach the node or timed out.
        - alert: FabricAPINodeUnreachable
          expr: >-
            (
              sum by (namespace, pod) (increase(fabric_api_gateway_node_outcomes_total{job="fabric-api-gateway",outcome=~"NodeUnreachable|Timeout"}[30m]))
              /
              sum by (namespace, pod) (increase(fabric_api_gateway_node_outcomes_total{job="fabric-api-gateway"}[30m]))
            ) > 0.5
            and on (namespace, pod)
            sum by (namespace, pod) (increase(fabric_api_gateway_node_outcomes_total{job="fabric-api-gateway"}[30m])) >= 5
          for: 15m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "fabric-api gateway {{ $labels.pod }} cannot reach most node sidecars"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricapinodeunreachable"
            description: >-
              {{ $value | humanizePercentage }} of {{ $labels.pod }}'s node calls in the last 30 minutes failed to
              connect or timed out. Check the sidecars' hostIP listener on port 9344, host firewall rules between
              the gateway and the nodes, and certificate identities.
        - alert: FabricAPIResultsOversized
          expr: sum by (node) (increase(fabric_api_node_requests_total{job="fabric-api-node",outcome="ResponseTooLarge"}[1h])) >= 10
          for: 15m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "fabric-api on {{ $labels.node }} keeps refusing results as too large"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricapiresultsoversized"
            description: >-
              {{ $value | humanize }} queries on {{ $labels.node }} in the last hour failed with ResponseTooLarge:
              FRR's answer exceeded the 4 MiB read cap or could not be shaped into the node's response budget.
              Usually a routing table that grew past what the budgets were sized for.
        - alert: FabricAPICleanupBacklog
          expr: max by (namespace) (fabric_api_gateway_stale_objects{job="fabric-api-gateway"}) > 50
          for: 1h
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "{{ $value }} expired FabricQuery objects are not being cleaned up"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricapicleanupbacklog"
            description: >-
              More than 50 FabricQuery objects in this cell have been past their expiration plus retention and
              cleanup grace for an hour. Neither Karmada nor the fabric-api-janitor CronJob is deleting them;
              check the CronJob's recent jobs and the federation's deletion propagation.
        # Certificates last 24h and renew 8h before expiry, so less than 4h
        # left means renewal has been failing for over 4h.
        - alert: FabricAPICertificateRenewalFailing
          expr: (fabric_api_certificate_expiry_timestamp_seconds{job=~"fabric-api-node|fabric-api-gateway"} - time()) < 4 * 3600
          for: 15m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "fabric-api certificate on {{ $labels.pod }} expires in under 4 hours"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricapicertificaterenewalfailing"
            description: >-
              The mTLS certificate {{ $labels.pod }} has loaded expires in {{ $value | humanizeDuration }} and has not
              been renewed. When it expires the looking glass fails closed for this pod; routing is unaffected.
              Check cert-manager csi-driver and the cell's fabric-api Issuer.
        - alert: FabricAPICredentialsMissing
          expr: fabric_api_credentials_loaded{job=~"fabric-api-node|fabric-api-gateway"} == 0
          for: 15m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "fabric-api on {{ $labels.pod }} has no valid mTLS credentials"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricapicredentialsmissing"
            description: >-
              {{ $labels.pod }} has had no loadable certificate, key and trust bundle for 15 minutes, so every
              fabric-api call to or from it fails. Check the csi-driver volume, the Issuer and the pod's logs.
        # The sidecar's search index follows bgpd's Loc-RIB over BMP; while
        # it is unsynced, AS-path and community searches are refused. Only a
        # node whose index has held routes can fire, so a node whose frr.conf
        # has no fabric-api BMP target never does.
        - alert: FabricAPISearchIndexUnsynced
          expr: >-
            fabric_api_node_search_index_synced{job="fabric-api-node"} == 0
            and on (node)
            max by (node) (fabric_api_node_search_index_routes{job="fabric-api-node"}) > 0
          for: 15m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "fabric-api search index on {{ $labels.node }} is not following bgpd"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricapisearchindexunsynced"
            description: >-
              The fabric-api sidecar on {{ $labels.node }} holds routes but has not been in sync with bgpd's
              Loc-RIB for 15 minutes, so its AS-path and community searches are refused. bgpd's BMP session to
              the sidecar (bmp targets fabric-api, 127.0.0.1:9348) is down or has not completed its initial table.
        - alert: FabricAPIMetricsDown
          expr: up{job=~"fabric-api-node|fabric-api-gateway"} == 0
          for: 10m
          labels:
            severity: warning
            service: galactic
            team: connect
          annotations:
            summary: "{{ $labels.job }} metrics on {{ $labels.pod }} cannot be scraped"
            runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricapimetricsdown"
            description: >-
              Prometheus cannot scrape {{ $labels.job }} on {{ $labels.pod }}, so the other fabric-api alerts cannot
              fire for it.
