# promtool unit tests for ../prometheusrule.yaml. task test:alerts extracts the
# PrometheusRule's spec into rules.yaml beside this file and runs
# `promtool test rules` on it. Series are sampled every 30s, the PodMonitors'
# scrape interval.
rule_files:
  - rules.yaml
evaluation_interval: 30s
tests:
  # Down for 5m fires; administratively shut down does not.
  - interval: 30s
    input_series:
      - series: 'frr_bgp_peer_state{job="fabric-router",node="dfw-worker",peer="10.1.10.1",peer_as="65000",afi="ipv4",safi="unicast"}'
        values: "1x10 0x20"
      - series: 'frr_bgp_peer_state{job="fabric-router",node="dfw-worker",peer="2001:db8:1:10::1",peer_as="65000",afi="ipv6",safi="unicast"}'
        values: "1x10 2x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: FabricBGPSessionDown
        exp_alerts: []
      - eval_time: 11m
        alertname: FabricBGPSessionDown
        exp_alerts:
          - exp_labels:
              severity: critical
              service: galactic
              team: connect
              job: fabric-router
              node: dfw-worker
              peer: 10.1.10.1
              peer_as: "65000"
              afi: ipv4
              safi: unicast
            exp_annotations:
              summary: "Underlay BGP session dfw-worker -> 10.1.10.1 (ipv4) is down"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricbgpsessiondown"
              description: >-
                fabric-router on dfw-worker has not had its ipv4 unicast session to 10.1.10.1 (AS 65000)
                Established for 5 minutes. The BMP collector's Peer Down for this session carries the reason and
                any NOTIFICATION.
      - eval_time: 11m
        alertname: FabricBGPSessionAdminDown
        exp_alerts: []

  # Shut down for an hour fires.
  - interval: 30s
    input_series:
      - series: 'frr_bgp_peer_state{job="fabric-router",node="dfw-worker",peer="10.1.10.1",peer_as="65000",afi="ipv4",safi="unicast"}'
        values: "2x130"
    alert_rule_test:
      - eval_time: 59m
        alertname: FabricBGPSessionAdminDown
        exp_alerts: []
      - eval_time: 61m
        alertname: FabricBGPSessionAdminDown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router
              node: dfw-worker
              peer: 10.1.10.1
              peer_as: "65000"
              afi: ipv4
              safi: unicast
            exp_annotations:
              summary: "Underlay BGP session dfw-worker -> 10.1.10.1 (ipv4) has been shut down for an hour"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricbgpsessionadmindown"
              description: >-
                The neighbor is administratively shut down in fabric-router's running config on dfw-worker.
                Re-enable it, or remove it from that node's fabric-router.<nodename> ConfigMap if the shutdown is
                meant to last.

  # Three re-establishments within 30 minutes fire, even though every one
  # came back before the next scrape; a single one does not.
  - interval: 30s
    input_series:
      - series: 'frr_bgp_peer_uptime_seconds{job="fabric-router",node="sjc-worker",peer="10.1.20.1",afi="ipv4",safi="unicast"}'
        values: "600+30x4 10+30x4 10+30x4 10+30x4"
      - series: 'frr_bgp_peer_uptime_seconds{job="fabric-router",node="sjc-worker",peer="2001:db8:1:20::1",afi="ipv6",safi="unicast"}'
        values: "600+30x4 10+30x14"
    alert_rule_test:
      - eval_time: 9m
        alertname: FabricBGPSessionFlapping
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router
              node: sjc-worker
              peer: 10.1.20.1
              afi: ipv4
              safi: unicast
            exp_annotations:
              summary: "Underlay BGP session sjc-worker -> 10.1.20.1 (ipv4) is flapping"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricbgpsessionflapping"
              description: >-
                The session re-established 3 times in the last 30 minutes. The BMP collector's Peer Down messages
                for it carry the reason for each drop.

  # Falling below half of an hour ago fires after 15m while Established; not
  # while the session is down, and not for a session too new to compare.
  - interval: 30s
    input_series:
      - series: 'frr_bgp_peer_prefixes_received_count_total{job="fabric-router",node="iad-worker2",peer="10.1.30.2",afi="ipv4",safi="unicast"}'
        values: "20x120 5x60"
      - series: 'frr_bgp_peer_state{job="fabric-router",node="iad-worker2",peer="10.1.30.2",afi="ipv4",safi="unicast"}'
        values: "1x180"
      - series: 'frr_bgp_peer_prefixes_received_count_total{job="fabric-router",node="iad-worker2",peer="10.1.31.2",afi="ipv4",safi="unicast"}'
        values: "20x120 5x60"
      - series: 'frr_bgp_peer_state{job="fabric-router",node="iad-worker2",peer="10.1.31.2",afi="ipv4",safi="unicast"}'
        values: "1x120 0x60"
      - series: 'frr_bgp_peer_prefixes_received_count_total{job="fabric-router",node="iad-worker2",peer="10.1.32.2",afi="ipv4",safi="unicast"}'
        values: "_x120 5x60"
      - series: 'frr_bgp_peer_state{job="fabric-router",node="iad-worker2",peer="10.1.32.2",afi="ipv4",safi="unicast"}'
        values: "_x120 1x60"
    alert_rule_test:
      - eval_time: 74m
        alertname: FabricBGPPrefixesDropped
        exp_alerts: []
      - eval_time: 76m
        alertname: FabricBGPPrefixesDropped
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router
              node: iad-worker2
              peer: 10.1.30.2
              afi: ipv4
              safi: unicast
            exp_annotations:
              summary: "iad-worker2 receives under half its usual prefixes from 10.1.30.2 (ipv4)"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricbgpprefixesdropped"
              description: >-
                iad-worker2 now receives 5 ipv4 prefixes from 10.1.30.2, under half what it received an hour ago,
                while the session stays up. Check the peer's export policy and this node's import filters; the BMP
                collector's pre-policy routes show what the peer actually sent.

  - interval: 30s
    input_series:
      - series: 'frr_collector_up{job="fabric-router",node="iad-worker",collector="bgp6"}'
        values: "1x5 0x30"
      - series: 'up{job="fabric-router",node="iad-worker"}'
        values: "1x5 0x30"
    alert_rule_test:
      - eval_time: 13m
        alertname: FabricRouterExporterCollectorFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router
              node: iad-worker
              collector: bgp6
            exp_annotations:
              summary: "frr-exporter's bgp6 collector is failing on iad-worker"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricrouterexportercollectorfailing"
              description: >-
                frr-exporter on iad-worker cannot read the bgp6 data from FRR, usually because a daemon's vty
                socket in /run/frr is missing or unreadable. The other fabric-router alerts on this node are blind
                until it recovers.
      - eval_time: 13m
        alertname: FabricRouterMetricsDown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router
              node: iad-worker
            exp_annotations:
              summary: "fabric-router metrics on iad-worker cannot be scraped"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutermetricsdown"
              description: >-
                Prometheus cannot reach frr-exporter on iad-worker (port 9342). Every other fabric-router alert on
                this node is blind until it recovers.

  # A mapped next hop that lasts 15m fires; one a reset clears inside that
  # does not.
  - interval: 30s
    input_series:
      - series: 'fabric_router_bgp_mapped_nexthop{job="fabric-config-agent",node="edge-1",peer="2001:db8:0:3f::39b"}'
        values: "1x40"
      - series: 'fabric_router_bgp_mapped_nexthop{job="fabric-config-agent",node="edge-1",peer="fd00::ffff:1"}'
        values: "1x2 0x38"
    alert_rule_test:
      - eval_time: 14m
        alertname: FabricBGPMappedNextHop
        exp_alerts: []
      - eval_time: 16m
        alertname: FabricBGPMappedNextHop
        exp_alerts:
          - exp_labels:
              severity: critical
              service: galactic
              team: connect
              job: fabric-config-agent
              node: edge-1
              peer: "2001:db8:0:3f::39b"
            exp_annotations:
              summary: "edge-1 announces an IPv4-mapped next hop to 2001:db8:0:3f::39b"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricbgpmappednexthop"
              description: >-
                fabric-router on edge-1 has announced ::ffff:<router-id> as the IPv6 next hop to
                2001:db8:0:3f::39b for 15 minutes, despite the agent's resets. Receiving routers cannot install
                these routes, so other sites lose their routes to this node's locators and NAT shards. The agent's
                MappedNextHopReset events on the pod show each reset.

  # Uninstalled routes for 10m fire; zero does not; an unreachable agent does.
  - interval: 30s
    input_series:
      - series: 'fabric_router_bgp_uninstalled_routes{job="fabric-config-agent",node="edge-2",afi="ipv6"}'
        values: "2x30"
      - series: 'fabric_router_bgp_uninstalled_routes{job="fabric-config-agent",node="edge-2",afi="ipv4"}'
        values: "0x30"
      - series: 'up{job="fabric-config-agent",node="edge-3"}'
        values: "1x5 0x30"
    alert_rule_test:
      - eval_time: 9m
        alertname: FabricBGPRoutesNotInstalled
        exp_alerts: []
      - eval_time: 11m
        alertname: FabricBGPRoutesNotInstalled
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-config-agent
              node: edge-2
              afi: ipv6
            exp_annotations:
              summary: "2 ipv6 BGP routes on edge-2 are not installed"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricbgproutesnotinstalled"
              description: >-
                zebra on edge-2 holds 2 ipv6 prefixes learned over BGP with no route installed in the kernel for
                10 minutes, usually because the next hop does not resolve. `show ipv6 route` in the frr container
                shows which. An IPv4-mapped next hop from the announcing node (FabricBGPMappedNextHop) is one cause.
      - eval_time: 11m
        alertname: FabricConfigAgentMetricsDown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-config-agent
              node: edge-3
            exp_annotations:
              summary: "fabric-config-agent metrics on edge-3 cannot be scraped"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricconfigagentmetricsdown"
              description: >-
                Prometheus cannot reach fabric-config-agent on edge-3 (port 9343), so FabricBGPMappedNextHop and
                FabricBGPRoutesNotInstalled cannot fire for it.
      - eval_time: 11m
        alertname: FabricRouterMetricsDown
        exp_alerts: []

  # fabric-routing: series from fabric-router-controller's leader. A label
  # set below is one deployment, router or release; `pod` is the replica
  # that exported it. Every series an alert fires on changes leader at
  # 3m30s (1m-interval tests: 7m): frc-1's series goes stale and frc-2's
  # starts after a gap, as when the old leader exits and the new one is
  # first scraped. The alerts must fire through it on time.
  #
  # edge-a reports NoEligibleRecovery from 0 through a leader change: the
  # old leader's last sample is at 2m30s and its series goes stale at 3m,
  # and the new leader's first sample, under another pod, comes at 4m. The
  # rule reads the last value over 2m and aggregates the pod away, so the
  # gap neither resets it nor resolves it: it fires at 5m and still fires
  # at 13m. edge-d fires too, until it is deleted at 10m (stale at 10m30s);
  # it clears within 2m. edge-b's Degraded is a recovered epoch, which a
  # release alert covers, and fires neither. edge-c's checkpoint drifted
  # (ReassertFailed) and fires the generic alert after 15m.
  - interval: 30s
    input_series:
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-a",node="edge-a",type="Degraded",status="True",reason="NoEligibleRecovery"}'
        values: "1x5 stale"
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-2",namespace="galactic-system",deployment="edge-a",node="edge-a",type="Degraded",status="True",reason="NoEligibleRecovery"}'
        values: "_x8 1x40"
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-d",node="edge-d",type="Degraded",status="True",reason="NoEligibleRecovery"}'
        values: "1x5 stale _x1 1x12 stale"
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-b",node="edge-b",type="Degraded",status="True",reason="Recovered"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-c",node="edge-c",type="Degraded",status="True",reason="ReassertFailed"}'
        values: "1x7 stale"
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-2",namespace="galactic-system",deployment="edge-c",node="edge-c",type="Degraded",status="True",reason="ReassertFailed"}'
        values: "_x10 1x40"
    alert_rule_test:
      - eval_time: 4m
        alertname: FabricRoutingNoEligibleRecovery
        exp_alerts: []
      - eval_time: 6m
        alertname: FabricRoutingNoEligibleRecovery
        exp_alerts:
          - exp_labels: &noRecoveryEdgeA
              severity: critical
              service: galactic
              team: connect
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-a
              node: edge-a
            exp_annotations: &noRecoveryEdgeAAnnotations
              summary: "Fabric router edge-a on edge-a failed an activation and cannot recover"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingnoeligiblerecovery"
              description: >-
                The node agent on edge-a failed to activate FabricRouterDeployment galactic-system/edge-a's active
                revision and had no recovery target it may restore, so FRR runs what the failed apply left. The
                deployment's status.epochs[0].detail says why the activation failed. Promote a fixed revision, or
                hand the node back to its ConfigMap.
          - exp_labels:
              severity: critical
              service: galactic
              team: connect
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-d
              node: edge-d
            exp_annotations:
              summary: "Fabric router edge-d on edge-d failed an activation and cannot recover"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingnoeligiblerecovery"
              description: >-
                The node agent on edge-d failed to activate FabricRouterDeployment galactic-system/edge-d's active
                revision and had no recovery target it may restore, so FRR runs what the failed apply left. The
                deployment's status.epochs[0].detail says why the activation failed. Promote a fixed revision, or
                hand the node back to its ConfigMap.
      - eval_time: 13m
        alertname: FabricRoutingNoEligibleRecovery
        exp_alerts:
          - exp_labels: *noRecoveryEdgeA
            exp_annotations: *noRecoveryEdgeAAnnotations
      - eval_time: 14m
        alertname: FabricRoutingDeploymentDegraded
        exp_alerts: []
      - eval_time: 16m
        alertname: FabricRoutingDeploymentDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-c
              node: edge-c
              reason: ReassertFailed
            exp_annotations:
              summary: "Fabric router edge-c on edge-c is degraded (ReassertFailed)"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingdeploymentdegraded"
              description: >-
                FabricRouterDeployment galactic-system/edge-c has reported Degraded with reason ReassertFailed for
                15 minutes: FRR on edge-c does not run the committed checkpoint and the agent could not bring it
                back, or frr.conf could not be rewritten to it. The condition's message names the error.

  # A RecoveryConflict for 10m fires; a deployment whose journal is bound
  # to it (RecoveryConflict False) does not.
  - interval: 30s
    input_series:
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-a",node="edge-a",type="RecoveryConflict",status="True",reason="RecoveryConflict"}'
        values: "1x7 stale"
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-2",namespace="galactic-system",deployment="edge-a",node="edge-a",type="RecoveryConflict",status="True",reason="RecoveryConflict"}'
        values: "_x10 1x30"
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-b",node="edge-b",type="RecoveryConflict",status="False",reason="Bound"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 9m
        alertname: FabricRoutingRecoveryConflict
        exp_alerts: []
      - eval_time: 11m
        alertname: FabricRoutingRecoveryConflict
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-a
              node: edge-a
            exp_annotations:
              summary: "The node agent on edge-a refuses FabricRouterDeployment edge-a"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingrecoveryconflict"
              description: >-
                fabric-config-agent on edge-a has reported RecoveryConflict on galactic-system/edge-a for 10
                minutes: its journal is bound to another deployment UID, or its host state belongs to another Node,
                cluster or machine. It activates nothing until an operator sets spec.rebind or clears the host state
                directory.

  # Heartbeats: edge-a on CRD reports every scrape and never fires. edge-b
  # on Shadow last reported at 0 and fires once that is 5 minutes old and
  # has stayed so for 5 more. edge-d on CRD never reported, and fires after
  # 5m. edge-e asks for its ConfigMap but the agent still honours CRD (a
  # pending handoff), so its stale heartbeat fires too. edge-c, stale on its
  # ConfigMap, and edge-f, a ConfigMap deployment that never reported (no
  # activation Component on its node), do not: nothing waits on them.
  - interval: 30s
    input_series:
      - series: 'galactic_fabric_routing_deployment_info{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-a",node="edge-a",source="CRD",effective_source="CRD"}'
        values: "1x30"
      - series: 'galactic_fabric_routing_deployment_heartbeat_timestamp_seconds{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-a",node="edge-a"}'
        values: "0+30x30"
      - series: 'galactic_fabric_routing_deployment_info{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-b",node="edge-b",source="Shadow",effective_source="Shadow"}'
        values: "1x7 stale"
      - series: 'galactic_fabric_routing_deployment_info{job="fabric-router-controller",pod="frc-2",namespace="galactic-system",deployment="edge-b",node="edge-b",source="Shadow",effective_source="Shadow"}'
        values: "_x10 1x30"
      - series: 'galactic_fabric_routing_deployment_heartbeat_timestamp_seconds{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-b",node="edge-b"}'
        values: "0x7 stale"
      - series: 'galactic_fabric_routing_deployment_heartbeat_timestamp_seconds{job="fabric-router-controller",pod="frc-2",namespace="galactic-system",deployment="edge-b",node="edge-b"}'
        values: "_x10 0x30"
      - series: 'galactic_fabric_routing_deployment_info{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-c",node="edge-c",source="ConfigMap",effective_source="ConfigMap"}'
        values: "1x30"
      - series: 'galactic_fabric_routing_deployment_heartbeat_timestamp_seconds{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-c",node="edge-c"}'
        values: "0x30"
      - series: 'galactic_fabric_routing_deployment_info{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-d",node="edge-d",source="CRD"}'
        values: "1x7 stale"
      - series: 'galactic_fabric_routing_deployment_info{job="fabric-router-controller",pod="frc-2",namespace="galactic-system",deployment="edge-d",node="edge-d",source="CRD"}'
        values: "_x10 1x30"
      - series: 'galactic_fabric_routing_deployment_info{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-e",node="edge-e",source="ConfigMap",effective_source="CRD"}'
        values: "1x30"
      - series: 'galactic_fabric_routing_deployment_heartbeat_timestamp_seconds{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-e",node="edge-e"}'
        values: "0x30"
      - series: 'galactic_fabric_routing_deployment_info{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-f",node="edge-f",source="ConfigMap"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 4m
        alertname: FabricRoutingAgentHeartbeatStale
        exp_alerts: []
      - eval_time: 6m
        alertname: FabricRoutingAgentHeartbeatStale
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-d
              node: edge-d
            exp_annotations: &heartbeatEdgeD
              summary: "The node agent on edge-d has stopped reporting on edge-d"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingagentheartbeatstale"
              description: >-
                FabricRouterDeployment galactic-system/edge-d is on the Shadow or CRD source, but
                fabric-config-agent on edge-d has not written its status for over 10 minutes, or never has. Nothing
                is staged or activated there, and a release promoting it goes Unknown. Check that the node's
                fabric-router pod runs with the activation Component and can reach the API server.
      - eval_time: 11m
        alertname: FabricRoutingAgentHeartbeatStale
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-b
              node: edge-b
            exp_annotations:
              summary: "The node agent on edge-b has stopped reporting on edge-b"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingagentheartbeatstale"
              description: >-
                FabricRouterDeployment galactic-system/edge-b is on the Shadow or CRD source, but
                fabric-config-agent on edge-b has not written its status for over 10 minutes, or never has. Nothing
                is staged or activated there, and a release promoting it goes Unknown. Check that the node's
                fabric-router pod runs with the activation Component and can reach the API server.
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-d
              node: edge-d
            exp_annotations: *heartbeatEdgeD
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-e
              node: edge-e
            exp_annotations:
              summary: "The node agent on edge-e has stopped reporting on edge-e"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingagentheartbeatstale"
              description: >-
                FabricRouterDeployment galactic-system/edge-e is on the Shadow or CRD source, but
                fabric-config-agent on edge-e has not written its status for over 10 minutes, or never has. Nothing
                is staged or activated there, and a release promoting it goes Unknown. Check that the node's
                fabric-router pod runs with the activation Component and can reach the API server.

  # Releases: r2 failed and is outstanding from 0, and fires after 30m;
  # an operator verifies its recovery at 35m and its series goes stale at
  # 36m, so it clears within 2m. r3
  # failed but its recovery was verified, so it exports no outstanding
  # series. r4 is Unknown and fires after 15m; r5 is Started and fires
  # nothing. A cell with no releases exports none of these series at all.
  - interval: 1m
    input_series:
      - series: 'galactic_fabric_routing_release_outstanding{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",release="r2",routing_domain="fabric",type="Release",phase="Failed"}'
        values: "1x7 stale"
      - series: 'galactic_fabric_routing_release_outstanding{job="fabric-router-controller",pod="frc-2",namespace="galactic-system",release="r2",routing_domain="fabric",type="Release",phase="Failed"}'
        values: "_x9 1x26 stale"
      - series: 'galactic_fabric_routing_release_outstanding{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",release="r4",routing_domain="fabric",type="Release",phase="Unknown"}'
        values: "1x7 stale"
      - series: 'galactic_fabric_routing_release_outstanding{job="fabric-router-controller",pod="frc-2",namespace="galactic-system",release="r4",routing_domain="fabric",type="Release",phase="Unknown"}'
        values: "_x9 1x40"
      - series: 'galactic_fabric_routing_release_outstanding{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",release="r5",routing_domain="edge",type="Release",phase="Started"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_releases{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",routing_domain="fabric",phase="Failed",recovery_verified="true"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 29m
        alertname: FabricRoutingReleaseFailed
        exp_alerts: []
      - eval_time: 31m
        alertname: FabricRoutingReleaseFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router-controller
              namespace: galactic-system
              release: r2
              routing_domain: fabric
            exp_annotations:
              summary: "Failed fabric release r2 is blocking routing domain fabric"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingreleasefailed"
              description: >-
                FabricReleaseAuthorization galactic-system/r2 failed over 30 minutes ago and no release in fabric
                can start until its routers report Recovered or an operator confirms them safe
                (`fabric-router-controller release confirm-recovery`). `fabric-router-controller release status r2`
                shows where each router stands.
      - eval_time: 38m
        alertname: FabricRoutingReleaseFailed
        exp_alerts: []
      - eval_time: 14m
        alertname: FabricRoutingReleaseUnknown
        exp_alerts: []
      - eval_time: 16m
        alertname: FabricRoutingReleaseUnknown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router-controller
              namespace: galactic-system
              release: r4
              routing_domain: fabric
            exp_annotations:
              summary: "Fabric release r4 has lost track of a router it promoted"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingreleaseunknown"
              description: >-
                FabricReleaseAuthorization galactic-system/r4 has been Unknown for 15 minutes: a router it promoted
                stopped reporting, so the release can neither complete nor fail, and fabric stays blocked.
                FabricRoutingAgentHeartbeatStale names the router.

  # A handoff that stays pending for 15m fires, as does a retired node asked
  # to leave CRD; a deployment merely waiting for its first promotion
  # (Accepted False, WaitingForPromotion) does not.
  - interval: 30s
    input_series:
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-a",node="edge-a",type="Accepted",status="False",reason="HandoffPending"}'
        values: "1x7 stale"
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-2",namespace="galactic-system",deployment="edge-a",node="edge-a",type="Accepted",status="False",reason="HandoffPending"}'
        values: "_x10 1x40"
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-b",node="edge-b",type="Accepted",status="False",reason="WaitingForPromotion"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-c",node="edge-c",type="Accepted",status="False",reason="ConfigMapRetired"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: FabricRoutingHandoffPending
        exp_alerts: []
      - eval_time: 16m
        alertname: FabricRoutingHandoffPending
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-a
              node: edge-a
              reason: HandoffPending
            exp_annotations:
              summary: "Fabric router edge-a on edge-a is stuck handing back to its ConfigMap"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutinghandoffpending"
              description: >-
                FabricRouterDeployment galactic-system/edge-a asks to leave the CRD source but the agent has kept the
                node on CRD for 15 minutes (HandoffPending). HandoffPending: the spec.sourceHandoff does not name the node's
                ConfigMap as it is now; run `fabric-router-controller source edge-a ConfigMap` again to name the
                current version. ConfigMapRetired: the node runs with the ConfigMap path retired; set the source
                back to CRD, or follow the way back in the runbook before handing the node to a ConfigMap.
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-c
              node: edge-c
              reason: ConfigMapRetired
            exp_annotations:
              summary: "Fabric router edge-c on edge-c is stuck handing back to its ConfigMap"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutinghandoffpending"
              description: >-
                FabricRouterDeployment galactic-system/edge-c asks to leave the CRD source but the agent has kept the
                node on CRD for 15 minutes (ConfigMapRetired). HandoffPending: the spec.sourceHandoff does not name the node's
                ConfigMap as it is now; run `fabric-router-controller source edge-c ConfigMap` again to name the
                current version. ConfigMapRetired: the node runs with the ConfigMap path retired; set the source
                back to CRD, or follow the way back in the runbook before handing the node to a ConfigMap.

  # A candidate rejected on Shadow for 15m fires. edge-b's Staged False is
  # left from before it went back to its ConfigMap and does not; edge-c
  # staged its candidate and does not.
  - interval: 30s
    input_series:
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-a",node="edge-a",type="Staged",status="False",reason="Rejected"}'
        values: "1x7 stale"
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-2",namespace="galactic-system",deployment="edge-a",node="edge-a",type="Staged",status="False",reason="Rejected"}'
        values: "_x10 1x40"
      - series: 'galactic_fabric_routing_deployment_info{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-a",node="edge-a",source="Shadow",effective_source="Shadow"}'
        values: "1x7 stale"
      - series: 'galactic_fabric_routing_deployment_info{job="fabric-router-controller",pod="frc-2",namespace="galactic-system",deployment="edge-a",node="edge-a",source="Shadow",effective_source="Shadow"}'
        values: "_x10 1x40"
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-b",node="edge-b",type="Staged",status="False",reason="Rejected"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_deployment_info{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-b",node="edge-b",source="ConfigMap",effective_source="ConfigMap"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-c",node="edge-c",type="Staged",status="True",reason="Staged"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_deployment_info{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-c",node="edge-c",source="CRD",effective_source="CRD"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: FabricRoutingCandidateRejected
        exp_alerts: []
      - eval_time: 16m
        alertname: FabricRoutingCandidateRejected
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-a
              node: edge-a
              reason: Rejected
            exp_annotations:
              summary: "Fabric router edge-a on edge-a cannot stage its candidate (Rejected)"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingcandidaterejected"
              description: >-
                fabric-config-agent on edge-a has reported Staged False (Rejected) on galactic-system/edge-a for 15
                minutes: the candidate revision fails FRR's validation on this node, or the agent cannot read it. A
                release promoting it would fail here. The condition's message carries FRR's error.

  # A router refused for 15m fires; an accepted one does not, nor one the
  # controller refused for a moment while its references were created.
  - interval: 30s
    input_series:
      - series: 'galactic_fabric_routing_router_accepted{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",router="edge-a",node="edge-a",reason="UnresolvedRef"}'
        values: "0x7 stale"
      - series: 'galactic_fabric_routing_router_accepted{job="fabric-router-controller",pod="frc-2",namespace="galactic-system",router="edge-a",node="edge-a",reason="UnresolvedRef"}'
        values: "_x10 0x40"
      - series: 'galactic_fabric_routing_router_accepted{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",router="edge-b",node="edge-b",reason="Compiled"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_router_accepted{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",router="edge-c",node="edge-c",reason="UnresolvedRef"}'
        values: "0x4 _x36"
      - series: 'galactic_fabric_routing_router_accepted{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",router="edge-c",node="edge-c",reason="Compiled"}'
        values: "_x4 1x36"
    alert_rule_test:
      - eval_time: 14m
        alertname: FabricRoutingRevisionRefused
        exp_alerts: []
      - eval_time: 16m
        alertname: FabricRoutingRevisionRefused
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router-controller
              namespace: galactic-system
              router: edge-a
              node: edge-a
              reason: UnresolvedRef
            exp_annotations:
              summary: "Fabric router edge-a on edge-a does not compile (UnresolvedRef)"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingrevisionrefused"
              description: >-
                fabric-router-controller has refused BGPRouter galactic-system/edge-a's inputs for 15 minutes with
                reason UnresolvedRef, so no revision of the current inputs exists and the router keeps running its
                last one. The router's Accepted condition names each problem.

  # A promotion the agent refuses for 15m fires: for good (PromotionRefused)
  # or because its release never started (NotAuthorized). One it refuses
  # for 3 minutes while its release starts does not, nor does a deployment
  # waiting for its first promotion.
  - interval: 30s
    input_series:
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-a",node="edge-a",type="Accepted",status="False",reason="PromotionRefused"}'
        values: "1x7 stale"
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-2",namespace="galactic-system",deployment="edge-a",node="edge-a",type="Accepted",status="False",reason="PromotionRefused"}'
        values: "_x10 1x40"
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-b",node="edge-b",type="Accepted",status="False",reason="NotAuthorized"}'
        values: "1x5 stale"
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-b",node="edge-b",type="Accepted",status="True",reason="Committed"}'
        values: "_x6 1x34"
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-c",node="edge-c",type="Accepted",status="False",reason="WaitingForPromotion"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_deployment_condition{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-d",node="edge-d",type="Accepted",status="False",reason="NotAuthorized"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: FabricRoutingPromotionRefused
        exp_alerts: []
      - eval_time: 16m
        alertname: FabricRoutingPromotionRefused
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-a
              node: edge-a
              reason: PromotionRefused
            exp_annotations:
              summary: "The node agent on edge-a will not activate edge-a's promotion (PromotionRefused)"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingpromotionrefused"
              description: >-
                fabric-config-agent on edge-a has refused FabricRouterDeployment galactic-system/edge-a's active
                epoch for 15 minutes with reason PromotionRefused: its release authorization does not cover it or
                has not started, or the revision cannot be read. The node keeps running what it ran. The
                deployment's Accepted condition names the release and revision.
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-d
              node: edge-d
              reason: NotAuthorized
            exp_annotations:
              summary: "The node agent on edge-d will not activate edge-d's promotion (NotAuthorized)"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingpromotionrefused"
              description: >-
                fabric-config-agent on edge-d has refused FabricRouterDeployment galactic-system/edge-d's active
                epoch for 15 minutes with reason NotAuthorized: its release authorization does not cover it or
                has not started, or the revision cannot be read. The node keeps running what it ran. The
                deployment's Accepted condition names the release and revision.

  # The leader cannot read deployments from its cache for 10m: fires.
  # Releases fail to read for 3m while the cache syncs, then read: does
  # not. Routers always read: does not.
  - interval: 30s
    input_series:
      - series: 'galactic_fabric_routing_collect_success{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",kind="fabricrouterdeployments"}'
        values: "0x7 stale"
      - series: 'galactic_fabric_routing_collect_success{job="fabric-router-controller",pod="frc-2",namespace="galactic-system",kind="fabricrouterdeployments"}'
        values: "_x10 0x30"
      - series: 'galactic_fabric_routing_collect_success{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",kind="fabricreleaseauthorizations"}'
        values: "0x6 1x24"
      - series: 'galactic_fabric_routing_collect_success{job="fabric-router-controller",pod="frc-1",namespace="galactic-system",kind="bgprouters"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 9m
        alertname: FabricRoutingCollectFailing
        exp_alerts: []
      - eval_time: 11m
        alertname: FabricRoutingCollectFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router-controller
              namespace: galactic-system
              kind: fabricrouterdeployments
            exp_annotations:
              summary: "fabric-router-controller cannot read fabricrouterdeployments for its fleet metrics"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingcollectfailing"
              description: >-
                fabric-router-controller's leader has failed for 10 minutes to read fabricrouterdeployments from
                its cache, so their galactic_fabric_routing_* series are missing and the fabric-routing alerts that
                read them cannot fire. The controller's log names the error.

  # Two clusters, as a central evaluator sees them: every series carries
  # cluster="a" or cluster="b", and both clusters name their deployment
  # edge-a. Cluster a's leader cannot read deployments (through a leader
  # change at 3m30s) while cluster b's can: only cluster a fires. Cluster
  # a's edge-a reports NoEligibleRecovery while cluster b's committed: the
  # alert names cluster a. Cluster a's edge-a on Shadow stopped reporting
  # while cluster b's reports every scrape: only cluster a's is stale.
  # Cluster a's edge-c on Shadow never reported while cluster b's reports:
  # cluster a's fires as never reported, cluster b's report does not hide
  # it. Cluster b's edge-b rejected its candidate on Shadow; cluster a's
  # Staged False is left from before it went back to its ConfigMap, where
  # its agent has also stopped reporting: only cluster b's candidate fires,
  # and cluster a's edge-b is not stale, since nothing waits on it.
  - interval: 30s
    input_series:
      - series: 'galactic_fabric_routing_collect_success{cluster="a",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",kind="fabricrouterdeployments"}'
        values: "0x7 stale"
      - series: 'galactic_fabric_routing_collect_success{cluster="a",job="fabric-router-controller",pod="frc-2",namespace="galactic-system",kind="fabricrouterdeployments"}'
        values: "_x10 0x30"
      - series: 'galactic_fabric_routing_collect_success{cluster="b",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",kind="fabricrouterdeployments"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_deployment_condition{cluster="a",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-a",node="edge-a",type="Degraded",status="True",reason="NoEligibleRecovery"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_deployment_condition{cluster="b",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-a",node="edge-a",type="Degraded",status="False",reason="Committed"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_deployment_info{cluster="a",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-a",node="edge-a",source="Shadow",effective_source="Shadow"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_deployment_heartbeat_timestamp_seconds{cluster="a",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-a",node="edge-a"}'
        values: "0x40"
      - series: 'galactic_fabric_routing_deployment_info{cluster="b",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-a",node="edge-a",source="Shadow",effective_source="Shadow"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_deployment_heartbeat_timestamp_seconds{cluster="b",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-a",node="edge-a"}'
        values: "0+30x40"
      - series: 'galactic_fabric_routing_deployment_info{cluster="a",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-c",node="edge-c",source="Shadow"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_deployment_info{cluster="b",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-c",node="edge-c",source="Shadow",effective_source="Shadow"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_deployment_heartbeat_timestamp_seconds{cluster="b",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-c",node="edge-c"}'
        values: "0+30x40"
      - series: 'galactic_fabric_routing_deployment_info{cluster="a",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-b",node="edge-b",source="ConfigMap",effective_source="ConfigMap"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_deployment_heartbeat_timestamp_seconds{cluster="a",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-b",node="edge-b"}'
        values: "0x40"
      - series: 'galactic_fabric_routing_deployment_condition{cluster="a",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-b",node="edge-b",type="Staged",status="False",reason="Rejected"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_deployment_condition{cluster="b",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-b",node="edge-b",type="Staged",status="False",reason="Rejected"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_deployment_info{cluster="b",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-b",node="edge-b",source="Shadow",effective_source="Shadow"}'
        values: "1x40"
      - series: 'galactic_fabric_routing_deployment_heartbeat_timestamp_seconds{cluster="b",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-b",node="edge-b"}'
        values: "0+30x40"
    alert_rule_test:
      - eval_time: 11m
        alertname: FabricRoutingCollectFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              cluster: a
              job: fabric-router-controller
              namespace: galactic-system
              kind: fabricrouterdeployments
            exp_annotations:
              summary: "fabric-router-controller cannot read fabricrouterdeployments for its fleet metrics"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingcollectfailing"
              description: >-
                fabric-router-controller's leader has failed for 10 minutes to read fabricrouterdeployments from
                its cache, so their galactic_fabric_routing_* series are missing and the fabric-routing alerts that
                read them cannot fire. The controller's log names the error.
      - eval_time: 6m
        alertname: FabricRoutingNoEligibleRecovery
        exp_alerts:
          - exp_labels:
              severity: critical
              service: galactic
              team: connect
              cluster: a
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-a
              node: edge-a
            exp_annotations: *noRecoveryEdgeAAnnotations
      - eval_time: 11m
        alertname: FabricRoutingAgentHeartbeatStale
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              cluster: a
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-a
              node: edge-a
            exp_annotations:
              summary: "The node agent on edge-a has stopped reporting on edge-a"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingagentheartbeatstale"
              description: >-
                FabricRouterDeployment galactic-system/edge-a is on the Shadow or CRD source, but
                fabric-config-agent on edge-a has not written its status for over 10 minutes, or never has. Nothing
                is staged or activated there, and a release promoting it goes Unknown. Check that the node's
                fabric-router pod runs with the activation Component and can reach the API server.
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              cluster: a
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-c
              node: edge-c
            exp_annotations:
              summary: "The node agent on edge-c has stopped reporting on edge-c"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingagentheartbeatstale"
              description: >-
                FabricRouterDeployment galactic-system/edge-c is on the Shadow or CRD source, but
                fabric-config-agent on edge-c has not written its status for over 10 minutes, or never has. Nothing
                is staged or activated there, and a release promoting it goes Unknown. Check that the node's
                fabric-router pod runs with the activation Component and can reach the API server.
      - eval_time: 16m
        alertname: FabricRoutingCandidateRejected
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              cluster: b
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-b
              node: edge-b
              reason: Rejected
            exp_annotations:
              summary: "Fabric router edge-b on edge-b cannot stage its candidate (Rejected)"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingcandidaterejected"
              description: >-
                fabric-config-agent on edge-b has reported Staged False (Rejected) on galactic-system/edge-b for 15
                minutes: the candidate revision fails FRR's validation on this node, or the agent cannot read it. A
                release promoting it would fail here. The condition's message carries FRR's error.

  # Two clusters, the remaining fleet alerts: each fires on a series in
  # cluster a only, and its alert must carry cluster="a".
  - interval: 30s
    input_series:
      - series: 'galactic_fabric_routing_deployment_condition{cluster="a",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-c",node="edge-c",type="Degraded",status="True",reason="ReassertFailed"}'
        values: "1x70"
      - series: 'galactic_fabric_routing_deployment_condition{cluster="a",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-d",node="edge-d",type="RecoveryConflict",status="True",reason="RecoveryConflict"}'
        values: "1x70"
      - series: 'galactic_fabric_routing_deployment_condition{cluster="a",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-e",node="edge-e",type="Accepted",status="False",reason="HandoffPending"}'
        values: "1x70"
      - series: 'galactic_fabric_routing_deployment_condition{cluster="a",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",deployment="edge-f",node="edge-f",type="Accepted",status="False",reason="PromotionRefused"}'
        values: "1x70"
      - series: 'galactic_fabric_routing_router_accepted{cluster="a",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",router="edge-g",node="edge-g",reason="UnresolvedRef"}'
        values: "0x70"
      - series: 'galactic_fabric_routing_release_outstanding{cluster="a",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",release="r7",routing_domain="fabric",type="Release",phase="Failed"}'
        values: "1x70"
      - series: 'galactic_fabric_routing_release_outstanding{cluster="a",job="fabric-router-controller",pod="frc-1",namespace="galactic-system",release="r8",routing_domain="fabric",type="Release",phase="Unknown"}'
        values: "1x70"
    alert_rule_test:
      - eval_time: 31m
        alertname: FabricRoutingDeploymentDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              cluster: a
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-c
              node: edge-c
              reason: ReassertFailed
            exp_annotations:
              summary: "Fabric router edge-c on edge-c is degraded (ReassertFailed)"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingdeploymentdegraded"
              description: "FabricRouterDeployment galactic-system/edge-c has reported Degraded with reason ReassertFailed for 15 minutes: FRR on edge-c does not run the committed checkpoint and the agent could not bring it back, or frr.conf could not be rewritten to it. The condition's message names the error."
      - eval_time: 31m
        alertname: FabricRoutingRecoveryConflict
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              cluster: a
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-d
              node: edge-d
            exp_annotations:
              summary: "The node agent on edge-d refuses FabricRouterDeployment edge-d"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingrecoveryconflict"
              description: "fabric-config-agent on edge-d has reported RecoveryConflict on galactic-system/edge-d for 10 minutes: its journal is bound to another deployment UID, or its host state belongs to another Node, cluster or machine. It activates nothing until an operator sets spec.rebind or clears the host state directory."
      - eval_time: 31m
        alertname: FabricRoutingHandoffPending
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              cluster: a
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-e
              node: edge-e
              reason: HandoffPending
            exp_annotations:
              summary: "Fabric router edge-e on edge-e is stuck handing back to its ConfigMap"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutinghandoffpending"
              description: "FabricRouterDeployment galactic-system/edge-e asks to leave the CRD source but the agent has kept the node on CRD for 15 minutes (HandoffPending). HandoffPending: the spec.sourceHandoff does not name the node's ConfigMap as it is now; run `fabric-router-controller source edge-e ConfigMap` again to name the current version. ConfigMapRetired: the node runs with the ConfigMap path retired; set the source back to CRD, or follow the way back in the runbook before handing the node to a ConfigMap."
      - eval_time: 31m
        alertname: FabricRoutingPromotionRefused
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              cluster: a
              job: fabric-router-controller
              namespace: galactic-system
              deployment: edge-f
              node: edge-f
              reason: PromotionRefused
            exp_annotations:
              summary: "The node agent on edge-f will not activate edge-f's promotion (PromotionRefused)"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingpromotionrefused"
              description: "fabric-config-agent on edge-f has refused FabricRouterDeployment galactic-system/edge-f's active epoch for 15 minutes with reason PromotionRefused: its release authorization does not cover it or has not started, or the revision cannot be read. The node keeps running what it ran. The deployment's Accepted condition names the release and revision."
      - eval_time: 31m
        alertname: FabricRoutingRevisionRefused
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              cluster: a
              job: fabric-router-controller
              namespace: galactic-system
              router: edge-g
              node: edge-g
              reason: UnresolvedRef
            exp_annotations:
              summary: "Fabric router edge-g on edge-g does not compile (UnresolvedRef)"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingrevisionrefused"
              description: "fabric-router-controller has refused BGPRouter galactic-system/edge-g's inputs for 15 minutes with reason UnresolvedRef, so no revision of the current inputs exists and the router keeps running its last one. The router's Accepted condition names each problem."
      - eval_time: 31m
        alertname: FabricRoutingReleaseFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              cluster: a
              job: fabric-router-controller
              namespace: galactic-system
              release: r7
              routing_domain: fabric
            exp_annotations:
              summary: "Failed fabric release r7 is blocking routing domain fabric"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingreleasefailed"
              description: "FabricReleaseAuthorization galactic-system/r7 failed over 30 minutes ago and no release in fabric can start until its routers report Recovered or an operator confirms them safe (`fabric-router-controller release confirm-recovery`). `fabric-router-controller release status r7` shows where each router stands."
      - eval_time: 31m
        alertname: FabricRoutingReleaseUnknown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              cluster: a
              job: fabric-router-controller
              namespace: galactic-system
              release: r8
              routing_domain: fabric
            exp_annotations:
              summary: "Fabric release r8 has lost track of a router it promoted"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutingreleaseunknown"
              description: "FabricReleaseAuthorization galactic-system/r8 has been Unknown for 15 minutes: a router it promoted stopped reporting, so the release can neither complete nor fail, and fabric stays blocked. FabricRoutingAgentHeartbeatStale names the router."

  # A replica unreachable for 5m fires; the other replica stays up.
  - interval: 30s
    input_series:
      - series: 'up{job="fabric-router-controller",namespace="galactic-system",pod="frc-1"}'
        values: "0x20"
      - series: 'up{job="fabric-router-controller",namespace="galactic-system",pod="frc-2"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 4m
        alertname: FabricRouterControllerMetricsDown
        exp_alerts: []
      - eval_time: 6m
        alertname: FabricRouterControllerMetricsDown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-router-controller
              namespace: galactic-system
              pod: frc-1
            exp_annotations:
              summary: "fabric-router-controller metrics on frc-1 cannot be scraped"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricroutercontrollermetricsdown"
              description: >-
                Prometheus cannot reach fabric-router-controller's metrics port on frc-1 (9185). If that pod leads,
                no fabric-routing alert can fire.

  # A station down for 10m fires; one that recovers inside that does not.
  - interval: 30s
    input_series:
      - series: 'galactic_router_bmp_station_up{job="galactic-router-rr",node="iad-worker3",router="galactic-system/galactic-control",station="[fc00:0:8::1]:5000"}'
        values: "1x5 0x30"
      - series: 'galactic_router_bmp_station_up{job="galactic-router",node="dfw-worker",router="galactic-system/galactic-router",station="[fc00:0:8::1]:5000"}'
        values: "1x5 0x10 1x20"
      - series: 'up{job="galactic-router-rr",node="iad-worker3"}'
        values: "1x5 0x30"
    alert_rule_test:
      - eval_time: 14m
        alertname: GalacticRouterBMPStationDown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: galactic-router-rr
              node: iad-worker3
              router: galactic-system/galactic-control
              station: "[fc00:0:8::1]:5000"
            exp_annotations:
              summary: "galactic-system/galactic-control on iad-worker3 is not streaming to BMP collector [fc00:0:8::1]:5000"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticrouterbmpstationdown"
              description: >-
                galactic-router's BMP session to [fc00:0:8::1]:5000 has been down for 10 minutes, or the station's
                name does not resolve. Route history and Peer Down events for this router are not being recorded.
      - eval_time: 14m
        alertname: GalacticRouterMetricsDown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: galactic-router-rr
              node: iad-worker3
            exp_annotations:
              summary: "galactic-router-rr metrics on iad-worker3 cannot be scraped"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticroutermetricsdown"
              description: >-
                Prometheus cannot reach galactic-router's metrics port on iad-worker3 (9179), so
                GalacticRouterBMPStationDown and GalacticRouterRoutesNotInstalled cannot fire for it.

  # Routes failing for 10m fire; a burst during convergence that clears inside
  # that does not.
  - interval: 30s
    input_series:
      - series: 'galactic_router_route_install_failing{job="galactic-router",node="dfw-worker",router="galactic-system/galactic-router",kind="vrf"}'
        values: "0x5 26x30"
      - series: 'galactic_router_route_install_failing{job="galactic-router",node="sjc-worker",router="galactic-system/galactic-router",kind="vrf"}'
        values: "0x5 26x10 0x20"
      - series: 'galactic_router_route_install_failing{job="galactic-router",node="dfw-worker",router="galactic-system/galactic-router",kind="plain"}'
        values: "0x35"
    alert_rule_test:
      - eval_time: 14m
        alertname: GalacticRouterRoutesNotInstalled
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: galactic-router
              node: dfw-worker
              router: galactic-system/galactic-router
              kind: vrf
            exp_annotations:
              summary: "26 vrf routes on dfw-worker are not installed"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticrouterroutesnotinstalled"
              description: >-
                galactic-router on dfw-worker has failed for 10 minutes to install 26 vrf routes it holds a best
                path for, so this node cannot reach those prefixes. The router's "route install failed" log lines
                name each prefix and the error, usually a SID with no route over an SRv6 uplink or an unresolved
                neighbor.

  # A table over 90% full whose oldest row is younger than the TCP timeout
  # fires after 15m. A full table holding only expired rows does not, nor
  # does a half-full one, nor a full one reporting no oldest-row age.
  - interval: 30s
    input_series:
      - series: 'galactic_nat_conns{job="galactic-nat",node="dfw-worker2",family="nat66"}'
        values: "900x40"
      - series: 'galactic_nat_conns{job="galactic-nat",node="dfw-worker2",family="nat64"}'
        values: "50x40"
      - series: 'galactic_nat_conn_table_max_entries{job="galactic-nat",node="dfw-worker2"}'
        values: "1000x40"
      - series: 'galactic_nat_conn_table_oldest_row_age_seconds{job="galactic-nat",node="dfw-worker2"}'
        values: "600x40"
      - series: 'galactic_nat_conns{job="galactic-nat",node="sjc-worker2",family="nat66"}'
        values: "950x40"
      - series: 'galactic_nat_conns{job="galactic-nat",node="sjc-worker2",family="nat64"}'
        values: "0x40"
      - series: 'galactic_nat_conn_table_max_entries{job="galactic-nat",node="sjc-worker2"}'
        values: "1000x40"
      - series: 'galactic_nat_conn_table_oldest_row_age_seconds{job="galactic-nat",node="sjc-worker2"}'
        values: "8000x40"
      - series: 'galactic_nat_conns{job="galactic-nat",node="iad-worker2",family="nat66"}'
        values: "500x40"
      - series: 'galactic_nat_conns{job="galactic-nat",node="iad-worker2",family="nat64"}'
        values: "0x40"
      - series: 'galactic_nat_conn_table_max_entries{job="galactic-nat",node="iad-worker2"}'
        values: "1000x40"
      - series: 'galactic_nat_conn_table_oldest_row_age_seconds{job="galactic-nat",node="iad-worker2"}'
        values: "600x40"
      - series: 'galactic_nat_conns{job="galactic-nat",node="sjc-worker3",family="nat66"}'
        values: "950x40"
      - series: 'galactic_nat_conn_table_max_entries{job="galactic-nat",node="sjc-worker3"}'
        values: "1000x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: GalacticNatSessionTableEvictingLive
        exp_alerts: []
      - eval_time: 16m
        alertname: GalacticNatSessionTableEvictingLive
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              node: dfw-worker2
            exp_annotations:
              summary: "The NAT session table on dfw-worker2 is over 90% full and evicting live sessions"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatsessiontableevictinglive"
              description: >-
                The egress shard on dfw-worker2 has had its session table over 90% full for 15 minutes, with
                its least recently used row younger than the 7440s established-TCP timeout. The table is evicting
                idle sessions that have not expired, so tenants' long-lived connections through this shard break
                when they next send. galactic_nat_sessions shows which family and protocol hold the table.

  # Steady port-exhaustion drops fire once they have lasted 15m, and so do
  # drops 9 minutes apart, since every 10-minute window still holds one. Two
  # bursts 2 minutes apart hold the rule true for just under 12 minutes and
  # never fire: at 16m sjc-worker2 has been true for 11 minutes, so a for of
  # 11m or less would fire it there. The evals at 18m and 20m come after the
  # bursts' windows close and expect only the two steady nodes. Steady drops
  # for another reason never fire. Counters grow every 30s: 10 drops is one
  # every 3 seconds, 200 in 10 minutes.
  - interval: 30s
    input_series:
      - series: 'galactic_nat_drops_total{job="galactic-nat",node="dfw-worker2",reason="nat66_pat_exhausted"}'
        values: "0+10x60"
      - series: 'galactic_nat_drops_total{job="galactic-nat",node="dfw-worker2",reason="nat64_pat_exhausted"}'
        values: "0x60"
      # dfw-worker3: one drop at 0.5m, 9.5m, 18.5m and 27.5m.
      - series: 'galactic_nat_drops_total{job="galactic-nat",node="dfw-worker3",reason="nat64_pat_exhausted"}'
        values: "0 1x17 2x17 3x17 4x6"
      # sjc-worker2: 50 drops at 5m and 50 more at 7m, none after.
      - series: 'galactic_nat_drops_total{job="galactic-nat",node="sjc-worker2",reason="nat66_pat_exhausted"}'
        values: "0x9 50x3 100x47"
      - series: 'galactic_nat_drops_total{job="galactic-nat",node="iad-worker2",reason="nat66_no_return_conn"}'
        values: "0+10x60"
    alert_rule_test:
      - eval_time: 15m
        alertname: GalacticNatPortExhausted
        exp_alerts: []
      - eval_time: 16m
        alertname: GalacticNatPortExhausted
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              node: dfw-worker2
              reason: nat66_pat_exhausted
            exp_annotations:
              summary: "The egress shard on dfw-worker2 is out of masquerade ports (nat66_pat_exhausted)"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatportexhausted"
              description: >-
                The egress shard on dfw-worker2 has dropped new flows for want of a free masquerade port
                (nat66_pat_exhausted) in every 10-minute window for 15 minutes, about 200 in the last
                one. Each drop is a connection a tenant failed to open. Many flows to one destination address and
                port fill its ports first.
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              node: dfw-worker3
              reason: nat64_pat_exhausted
            exp_annotations:
              summary: "The egress shard on dfw-worker3 is out of masquerade ports (nat64_pat_exhausted)"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatportexhausted"
              description: >-
                The egress shard on dfw-worker3 has dropped new flows for want of a free masquerade port
                (nat64_pat_exhausted) in every 10-minute window for 15 minutes, about 1.053 in the last
                one. Each drop is a connection a tenant failed to open. Many flows to one destination address and
                port fill its ports first.
      - eval_time: 18m
        alertname: GalacticNatPortExhausted
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              node: dfw-worker2
              reason: nat66_pat_exhausted
            exp_annotations:
              summary: "The egress shard on dfw-worker2 is out of masquerade ports (nat66_pat_exhausted)"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatportexhausted"
              description: >-
                The egress shard on dfw-worker2 has dropped new flows for want of a free masquerade port
                (nat66_pat_exhausted) in every 10-minute window for 15 minutes, about 200 in the last
                one. Each drop is a connection a tenant failed to open. Many flows to one destination address and
                port fill its ports first.
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              node: dfw-worker3
              reason: nat64_pat_exhausted
            exp_annotations:
              summary: "The egress shard on dfw-worker3 is out of masquerade ports (nat64_pat_exhausted)"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatportexhausted"
              description: >-
                The egress shard on dfw-worker3 has dropped new flows for want of a free masquerade port
                (nat64_pat_exhausted) in every 10-minute window for 15 minutes, about 1.053 in the last
                one. Each drop is a connection a tenant failed to open. Many flows to one destination address and
                port fill its ports first.
      - eval_time: 20m
        alertname: GalacticNatPortExhausted
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              node: dfw-worker2
              reason: nat66_pat_exhausted
            exp_annotations:
              summary: "The egress shard on dfw-worker2 is out of masquerade ports (nat66_pat_exhausted)"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatportexhausted"
              description: >-
                The egress shard on dfw-worker2 has dropped new flows for want of a free masquerade port
                (nat66_pat_exhausted) in every 10-minute window for 15 minutes, about 200 in the last
                one. Each drop is a connection a tenant failed to open. Many flows to one destination address and
                port fill its ports first.
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              node: dfw-worker3
              reason: nat64_pat_exhausted
            exp_annotations:
              summary: "The egress shard on dfw-worker3 is out of masquerade ports (nat64_pat_exhausted)"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatportexhausted"
              description: >-
                The egress shard on dfw-worker3 has dropped new flows for want of a free masquerade port
                (nat64_pat_exhausted) in every 10-minute window for 15 minutes, about 1.053 in the last
                one. Each drop is a connection a tenant failed to open. Many flows to one destination address and
                port fill its ports first.

  # A queue that delivers nothing while discarding is stalled, at any rate.
  # A queue that drops a steady share while it still delivers is lossy once
  # that holds for 30 minutes, and so are two of four; drops spread across
  # every queue (a burst) are not, nor is a single-queue interface, nor a
  # lossy queue receiving 2 packets a second, nor an idle queue. Counters
  # grow every 30s: 3000 packets is 100 a second.
  - interval: 30s
    input_series:
      # dfw-worker2 ens4: queue 2 discards 300 of every 3300 (9.1%),
      # queue 0 none.
      - series: 'galactic_nat_uplink_rx_queue_packets_total{job="galactic-nat",node="dfw-worker2",interface="ens4",driver="bnxt_en",queue="0"}'
        values: "0+3000x80"
      - series: 'galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat",node="dfw-worker2",interface="ens4",driver="bnxt_en",queue="0"}'
        values: "0x80"
      - series: 'galactic_nat_uplink_rx_queue_packets_total{job="galactic-nat",node="dfw-worker2",interface="ens4",driver="bnxt_en",queue="2"}'
        values: "0+3000x80"
      - series: 'galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat",node="dfw-worker2",interface="ens4",driver="bnxt_en",queue="2"}'
        values: "0+300x80"
      # dfw-worker2 ens6: both queues discard alike, a burst.
      - series: 'galactic_nat_uplink_rx_queue_packets_total{job="galactic-nat",node="dfw-worker2",interface="ens6",driver="bnxt_en",queue="0"}'
        values: "0+3000x80"
      - series: 'galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat",node="dfw-worker2",interface="ens6",driver="bnxt_en",queue="0"}'
        values: "0+300x80"
      - series: 'galactic_nat_uplink_rx_queue_packets_total{job="galactic-nat",node="dfw-worker2",interface="ens6",driver="bnxt_en",queue="1"}'
        values: "0+3000x80"
      - series: 'galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat",node="dfw-worker2",interface="ens6",driver="bnxt_en",queue="1"}'
        values: "0+300x80"
      # sjc-worker2 ens4: queue 0 loses half its packets, at 2 a second.
      - series: 'galactic_nat_uplink_rx_queue_packets_total{job="galactic-nat",node="sjc-worker2",interface="ens4",driver="bnxt_en",queue="0"}'
        values: "0+60x80"
      - series: 'galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat",node="sjc-worker2",interface="ens4",driver="bnxt_en",queue="0"}'
        values: "0+60x80"
      # dfw-worker3 ens4: queues 1 and 3 of four both stall alike, queues
      # 0 and 2 are clean.
      - series: 'galactic_nat_uplink_rx_queue_packets_total{job="galactic-nat",node="dfw-worker3",interface="ens4",driver="bnxt_en",queue="0"}'
        values: "0+3000x80"
      - series: 'galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat",node="dfw-worker3",interface="ens4",driver="bnxt_en",queue="0"}'
        values: "0x80"
      - series: 'galactic_nat_uplink_rx_queue_packets_total{job="galactic-nat",node="dfw-worker3",interface="ens4",driver="bnxt_en",queue="1"}'
        values: "0+3000x80"
      - series: 'galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat",node="dfw-worker3",interface="ens4",driver="bnxt_en",queue="1"}'
        values: "0+300x80"
      - series: 'galactic_nat_uplink_rx_queue_packets_total{job="galactic-nat",node="dfw-worker3",interface="ens4",driver="bnxt_en",queue="2"}'
        values: "0+3000x80"
      - series: 'galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat",node="dfw-worker3",interface="ens4",driver="bnxt_en",queue="2"}'
        values: "0x80"
      - series: 'galactic_nat_uplink_rx_queue_packets_total{job="galactic-nat",node="dfw-worker3",interface="ens4",driver="bnxt_en",queue="3"}'
        values: "0+3000x80"
      - series: 'galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat",node="dfw-worker3",interface="ens4",driver="bnxt_en",queue="3"}'
        values: "0+300x80"
      # sjc-worker3 ens4: a single queue drops; it is all of its own queues.
      - series: 'galactic_nat_uplink_rx_queue_packets_total{job="galactic-nat",node="sjc-worker3",interface="ens4",driver="bnxt_en",queue="0"}'
        values: "0+3000x80"
      - series: 'galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat",node="sjc-worker3",interface="ens4",driver="bnxt_en",queue="0"}'
        values: "0+300x80"
      # iad-worker2 ens4: queue 1 has stopped delivering and discards
      # all it receives, 6 a second (#673 as seen on a staging edge), queue 0
      # is clean and queue 2 is idle.
      - series: 'galactic_nat_uplink_rx_queue_packets_total{job="galactic-nat",node="iad-worker2",interface="ens4",driver="bnxt_en",queue="0"}'
        values: "0+3000x80"
      - series: 'galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat",node="iad-worker2",interface="ens4",driver="bnxt_en",queue="0"}'
        values: "0x80"
      - series: 'galactic_nat_uplink_rx_queue_packets_total{job="galactic-nat",node="iad-worker2",interface="ens4",driver="bnxt_en",queue="1"}'
        values: "893462x80"
      - series: 'galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat",node="iad-worker2",interface="ens4",driver="bnxt_en",queue="1"}'
        values: "154352+180x80"
      - series: 'galactic_nat_uplink_rx_queue_packets_total{job="galactic-nat",node="iad-worker2",interface="ens4",driver="bnxt_en",queue="2"}'
        values: "1000x80"
      - series: 'galactic_nat_uplink_rx_queue_discards_total{job="galactic-nat",node="iad-worker2",interface="ens4",driver="bnxt_en",queue="2"}'
        values: "0x80"
    alert_rule_test:
      - eval_time: 10m
        alertname: GalacticNatUplinkRxQueueStalled
        exp_alerts: []
      - eval_time: 11m
        alertname: GalacticNatUplinkRxQueueStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              service: galactic
              team: connect
              job: galactic-nat
              node: iad-worker2
              interface: ens4
              driver: bnxt_en
              queue: "1"
            exp_annotations:
              summary: "Receive queue 1 of ens4 on iad-worker2 has stopped delivering"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatuplinkrxqueuestalled"
              description: >-
                Queue 1 of uplink ens4 (bnxt_en) has delivered nothing
                for 10 minutes while discarding about 6 packets a second. Flows hashed to that
                queue fail on every retry. Bouncing the interface clears it, once its bond partner is confirmed up.
      - eval_time: 11m
        alertname: GalacticNatUplinkRxQueueLossy
        exp_alerts: []
      - eval_time: 30m
        alertname: GalacticNatUplinkRxQueueLossy
        exp_alerts: []
      - eval_time: 31m
        alertname: GalacticNatUplinkRxQueueLossy
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: galactic-nat
              node: dfw-worker2
              interface: ens4
              driver: bnxt_en
              queue: "2"
            exp_annotations:
              summary: "Receive queue 2 of ens4 on dfw-worker2 is losing packets"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatuplinkrxqueuelossy"
              description: >-
                Queue 2 of uplink ens4 (bnxt_en) has discarded 9.091% of its packets for 30 minutes while no
                more than half of the interface's queues have. Flows hashed to that queue are retrying. GalacticNatUplinkRxQueueStalled
                fires if it stops delivering entirely.
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: galactic-nat
              node: dfw-worker3
              interface: ens4
              driver: bnxt_en
              queue: "1"
            exp_annotations:
              summary: "Receive queue 1 of ens4 on dfw-worker3 is losing packets"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatuplinkrxqueuelossy"
              description: >-
                Queue 1 of uplink ens4 (bnxt_en) has discarded 9.091% of its packets for 30 minutes while no
                more than half of the interface's queues have. Flows hashed to that queue are retrying. GalacticNatUplinkRxQueueStalled
                fires if it stops delivering entirely.
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: galactic-nat
              node: dfw-worker3
              interface: ens4
              driver: bnxt_en
              queue: "3"
            exp_annotations:
              summary: "Receive queue 3 of ens4 on dfw-worker3 is losing packets"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatuplinkrxqueuelossy"
              description: >-
                Queue 3 of uplink ens4 (bnxt_en) has discarded 9.091% of its packets for 30 minutes while no
                more than half of the interface's queues have. Flows hashed to that queue are retrying. GalacticNatUplinkRxQueueStalled
                fires if it stops delivering entirely.

  # An unreachable shard for 5m fires; one that comes back inside that does
  # not.
  - interval: 30s
    input_series:
      - series: 'up{job="galactic-nat",node="dfw-worker2"}'
        values: "1x5 0x20"
      - series: 'up{job="galactic-nat",node="sjc-worker2"}'
        values: "1x5 0x5 1x15"
    alert_rule_test:
      - eval_time: 8m
        alertname: GalacticNatMetricsDown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: galactic-nat
              node: dfw-worker2
            exp_annotations:
              summary: "galactic-nat metrics on dfw-worker2 cannot be scraped"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatmetricsdown"
              description: >-
                Prometheus cannot reach galactic-nat's metrics port on dfw-worker2 (9182), so no other
                galactic-nat alert can fire for it.

  # Hashed egress, NAT66 class: the node's only shard becomes unreachable at
  # 5m while tenant routes name the group. GalacticEgressPoolEmpty fires
  # after 2m, BelowMinimum after 10m. The NAT64 class on another node is
  # retired (enabled 0) with no member and no route left, and fires nothing.
  - interval: 30s
    input_series:
      - series: 'galactic_cni_egress_pool_enabled{job="galactic-cni",node="dfw-worker",class="nat66"}'
        values: "1x40"
      - series: 'galactic_cni_egress_group_routes{job="galactic-cni",node="dfw-worker",class="nat66"}'
        values: "3x40"
      - series: 'galactic_cni_egress_pool_min_active{job="galactic-cni",node="dfw-worker"}'
        values: "1x40"
      - series: 'galactic_cni_egress_pool_members{job="galactic-cni",node="dfw-worker",class="nat66",state="active"}'
        values: "1x10 0x30"
      - series: 'galactic_cni_egress_pool_members{job="galactic-cni",node="dfw-worker",class="nat66",state="unreachable"}'
        values: "0x10 1x30"
      - series: 'galactic_cni_egress_pool_members{job="galactic-cni",node="dfw-worker",class="nat66",state="draining"}'
        values: "0x40"
      - series: 'galactic_cni_egress_pool_enabled{job="galactic-cni",node="iad-worker",class="nat64:2001:db8:64::/96"}'
        values: "0x40"
      - series: 'galactic_cni_egress_pool_min_active{job="galactic-cni",node="iad-worker"}'
        values: "1x40"
      - series: 'galactic_cni_egress_pool_members{job="galactic-cni",node="iad-worker",class="nat64:2001:db8:64::/96",state="active"}'
        values: "0x40"
      - series: 'galactic_cni_egress_pool_members{job="galactic-cni",node="iad-worker",class="nat64:2001:db8:64::/96",state="unreachable"}'
        values: "0x40"
      - series: 'galactic_cni_egress_group_routes{job="galactic-cni",node="iad-worker",class="nat64:2001:db8:64::/96"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 6m
        alertname: GalacticEgressPoolEmpty
        exp_alerts: []
      - eval_time: 8m
        alertname: GalacticEgressPoolEmpty
        exp_alerts:
          - exp_labels:
              severity: critical
              service: galactic
              team: connect
              node: dfw-worker
              class: nat66
            exp_annotations:
              summary: "No egress shard takes nat66 traffic from dfw-worker"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticegresspoolempty"
              description: >-
                No egress shard in dfw-worker's nat66 group has taken new tenants for 2
                minutes while routes on that node name the group, so new nat66 egress from that node
                is dropped. galactic_cni_egress_pool_members shows whether its shards are unreachable (no route to their
                SID over an SRv6 uplink) or draining.
      - eval_time: 14m
        alertname: GalacticEgressPoolBelowMinimum
        exp_alerts: []
      - eval_time: 16m
        alertname: GalacticEgressPoolBelowMinimum
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              node: dfw-worker
              class: nat66
            exp_annotations:
              summary: "dfw-worker has fewer active nat66 egress shards than the pool minimum"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticegresspoolbelowminimum"
              description: >-
                dfw-worker has had 0 active nat66 egress shards for 10
                minutes, below the GALACTIC_CNI_EGRESS_POOL_MIN_ACTIVE the cluster is configured for. The remaining
                shards carry the metro's whole egress load for that class. galactic_cni_egress_pool_members shows
                which shards are draining or unreachable.

  # A group with no candidate left but routes still naming it (every
  # EgressShard deleted) fires PoolEmpty: the missing members must not read
  # as an idle pool.
  - interval: 30s
    input_series:
      - series: 'galactic_cni_egress_pool_members{job="galactic-cni",node="sjc-worker",class="nat66",state="active"}'
        values: "0x20"
      - series: 'galactic_cni_egress_pool_members{job="galactic-cni",node="sjc-worker",class="nat66",state="unreachable"}'
        values: "0x20"
      - series: 'galactic_cni_egress_group_routes{job="galactic-cni",node="sjc-worker",class="nat66"}'
        values: "4x20"
    alert_rule_test:
      - eval_time: 3m
        alertname: GalacticEgressPoolEmpty
        exp_alerts:
          - exp_labels:
              severity: critical
              service: galactic
              team: connect
              node: sjc-worker
              class: nat66
            exp_annotations:
              summary: "No egress shard takes nat66 traffic from sjc-worker"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticegresspoolempty"
              description: >-
                No egress shard in sjc-worker's nat66 group has taken new tenants for 2
                minutes while routes on that node name the group, so new nat66 egress from that node
                is dropped. galactic_cni_egress_pool_members shows whether its shards are unreachable (no route to their
                SID over an SRv6 uplink) or draining.

  # An edge node running the cluster's only shard: its own shard is local,
  # never active, and no tenant route names the group. Nothing fires. A
  # second edge node whose only other shard is unreachable but which has no
  # tenant route fires nothing either: an empty pool with nothing to egress
  # is no outage.
  - interval: 30s
    input_series:
      - series: 'galactic_cni_egress_pool_enabled{job="galactic-cni",node="dfw-edge",class="nat66"}'
        values: "1x40"
      - series: 'galactic_cni_egress_pool_min_active{job="galactic-cni",node="dfw-edge"}'
        values: "1x40"
      - series: 'galactic_cni_egress_pool_members{job="galactic-cni",node="dfw-edge",class="nat66",state="active"}'
        values: "0x40"
      - series: 'galactic_cni_egress_pool_members{job="galactic-cni",node="dfw-edge",class="nat66",state="unreachable"}'
        values: "0x40"
      - series: 'galactic_cni_egress_pool_members{job="galactic-cni",node="dfw-edge",class="nat66",state="local"}'
        values: "1x40"
      - series: 'galactic_cni_egress_pool_members{job="galactic-cni",node="dfw-edge",class="nat66",state="ineligible"}'
        values: "1x40"
      - series: 'galactic_cni_egress_group_routes{job="galactic-cni",node="dfw-edge",class="nat66"}'
        values: "0x40"
      - series: 'galactic_cni_egress_pool_enabled{job="galactic-cni",node="iad-edge",class="nat66"}'
        values: "1x40"
      - series: 'galactic_cni_egress_pool_min_active{job="galactic-cni",node="iad-edge"}'
        values: "1x40"
      - series: 'galactic_cni_egress_pool_members{job="galactic-cni",node="iad-edge",class="nat66",state="active"}'
        values: "0x40"
      - series: 'galactic_cni_egress_pool_members{job="galactic-cni",node="iad-edge",class="nat66",state="unreachable"}'
        values: "1x40"
      - series: 'galactic_cni_egress_pool_members{job="galactic-cni",node="iad-edge",class="nat66",state="local"}'
        values: "1x40"
      - series: 'galactic_cni_egress_group_routes{job="galactic-cni",node="iad-edge",class="nat66"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 16m
        alertname: GalacticEgressPoolEmpty
        exp_alerts: []
      - eval_time: 16m
        alertname: GalacticEgressPoolBelowMinimum
        exp_alerts: []
      - eval_time: 16m
        alertname: GalacticEgressClassUnserved
        exp_alerts: []

  # A NAT64 class no shard can translate fires ClassUnserved after 15m, and
  # neither PoolEmpty nor BelowMinimum, which would both be the wrong story.
  - interval: 30s
    input_series:
      - series: 'galactic_cni_egress_pool_enabled{job="galactic-cni",node="dfw-worker",class="nat64:2001:db8:64::/96"}'
        values: "1x40"
      - series: 'galactic_cni_egress_pool_min_active{job="galactic-cni",node="dfw-worker"}'
        values: "1x40"
      - series: 'galactic_cni_egress_pool_members{job="galactic-cni",node="dfw-worker",class="nat64:2001:db8:64::/96",state="active"}'
        values: "0x40"
      - series: 'galactic_cni_egress_pool_members{job="galactic-cni",node="dfw-worker",class="nat64:2001:db8:64::/96",state="ineligible"}'
        values: "2x40"
    alert_rule_test:
      - eval_time: 16m
        alertname: GalacticEgressClassUnserved
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              node: dfw-worker
              class: nat64:2001:db8:64::/96
            exp_annotations:
              summary: "No egress shard can translate nat64:2001:db8:64::/96 for dfw-worker"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticegressclassunserved"
              description: >-
                dfw-worker is configured for nat64:2001:db8:64::/96 egress, but none of the cluster's
                EgressShards can translate it: none has a masquerade address in that family, or none translates that
                NAT64 prefix. galactic-cni logs the shards it kept out. Either give a shard that capability or remove
                the prefix from GALACTIC_CNI_NAT64_PREFIX.
      - eval_time: 16m
        alertname: GalacticEgressPoolEmpty
        exp_alerts: []
      - eval_time: 16m
        alertname: GalacticEgressPoolBelowMinimum
        exp_alerts: []

  # Steady group_empty drops fire after 10m; a single burst of shard_dead
  # drops, the race between a withdrawal and the rebuild, does not.
  - interval: 30s
    input_series:
      - series: 'galactic_cni_egress_shard_selections_total{job="galactic-cni",node="dfw-worker",result="group_empty"}'
        values: "0+4x40"
      - series: 'galactic_cni_egress_shard_selections_total{job="galactic-cni",node="sjc-worker",result="shard_dead"}'
        values: "0x5 20x35"
    alert_rule_test:
      - eval_time: 9m
        alertname: GalacticEgressShardGroupDropping
        exp_alerts: []
      - eval_time: 16m
        alertname: GalacticEgressShardGroupDropping
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              node: dfw-worker
              result: group_empty
            exp_annotations:
              summary: "dfw-worker is dropping tenant egress bound for a shard group (group_empty)"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticegressshardgroupdropping"
              description: >-
                usid_egress on dfw-worker has dropped tenant packets bound for an egress shard group
                (group_empty) in every 5-minute window for 10 minutes, about 40 in the
                last one. group_empty means no shard takes tenants; shard_dead means the group was not rebuilt
                after a shard became unreachable, which points at galactic-cni's egress sweep.

  # Hashed mode with a watch that never syncs fires after 10m; ordered mode
  # with the same unsynced watch does not.
  - interval: 30s
    input_series:
      - series: 'galactic_cni_egress_mode{job="galactic-cni",node="dfw-worker",mode="hashed"}'
        values: "1x30"
      - series: 'galactic_cni_egress_shard_watch_synced{job="galactic-cni",node="dfw-worker"}'
        values: "0x30"
      - series: 'galactic_cni_egress_mode{job="galactic-cni",node="iad-worker",mode="hashed"}'
        values: "0x30"
      - series: 'galactic_cni_egress_shard_watch_synced{job="galactic-cni",node="iad-worker"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 11m
        alertname: GalacticEgressShardWatchNotSynced
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              node: dfw-worker
            exp_annotations:
              summary: "galactic-cni on dfw-worker cannot list EgressShards"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticegressshardwatchnotsynced"
              description: >-
                galactic-cni on dfw-worker runs hashed egress mode but its EgressShard watch has not listed
                the cluster for 10 minutes. Its shard groups keep their last members, and a node that never
                listed them has no group at all. Check galactic-cni's logs, its get/list/watch permission on
                egressshards, and that the EgressShard CRD is installed.

  # Refresh failing in every window fires after 15m; a single failure does
  # not.
  - interval: 30s
    input_series:
      - series: 'galactic_cni_egress_sweep_errors_total{job="galactic-cni",node="dfw-worker",stage="refresh"}'
        values: "0+1x60"
      - series: 'galactic_cni_egress_sweep_errors_total{job="galactic-cni",node="sjc-worker",stage="apply"}'
        values: "0x5 1x55"
    alert_rule_test:
      - eval_time: 26m
        alertname: GalacticEgressSweepFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              node: dfw-worker
              stage: refresh
            exp_annotations:
              summary: "galactic-cni's egress sweep on dfw-worker keeps failing at refresh"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticegresssweepfailing"
              description: >-
                galactic-cni on dfw-worker has failed its egress sweep at the refresh step in
                every 10-minute window for 15 minutes. Shard group membership and next hops are going stale, and a
                switch back to ordered mode leaves routes on the groups until it succeeds.

  - interval: 30s
    input_series:
      - series: 'up{job="galactic-cni",node="dfw-worker"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 6m
        alertname: GalacticCNIMetricsDown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: galactic-cni
              node: dfw-worker
            exp_annotations:
              summary: "galactic-cni metrics on dfw-worker cannot be scraped"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticcnimetricsdown"
              description: >-
                Prometheus cannot reach galactic-cni's metrics port on dfw-worker (9180), so no egress
                shard group alert can fire for it.

  # fabric-api: a gateway with executions in flight and no completions for
  # 10m fires; one that keeps completing queries, and one that is idle, do
  # not.
  - interval: 30s
    input_series:
      - series: 'fabric_api_gateway_executions_in_flight{job="fabric-api-gateway",namespace="galactic-system",pod="gw-stuck"}'
        values: "1x60"
      - series: 'fabric_api_gateway_queries_total{job="fabric-api-gateway",namespace="galactic-system",pod="gw-stuck",type="RouteLookup",reason="Succeeded"}'
        values: "5x60"
      - series: 'fabric_api_gateway_executions_in_flight{job="fabric-api-gateway",namespace="galactic-system",pod="gw-busy"}'
        values: "1x60"
      - series: 'fabric_api_gateway_queries_total{job="fabric-api-gateway",namespace="galactic-system",pod="gw-busy",type="RouteLookup",reason="Succeeded"}'
        values: "0+1x60"
      - series: 'fabric_api_gateway_executions_in_flight{job="fabric-api-gateway",namespace="galactic-system",pod="gw-idle"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 9m
        alertname: FabricAPIExecutionStalled
        exp_alerts: []
      - eval_time: 11m
        alertname: FabricAPIExecutionStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              namespace: galactic-system
              pod: gw-stuck
            exp_annotations:
              summary: "fabric-api gateway gw-stuck has executions in flight but completes none"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricapiexecutionstalled"
              description: >-
                gw-stuck has had fabric queries executing for 20 minutes without finishing any, although each
                is bounded by a 120 second lifetime. Looking-glass queries in this cell will end DeadlineExceeded at
                NSO. Check the gateway's logs and its status-write metrics.

  # Diagnostics unavailable for 15m fires; a brief outage does not.
  - interval: 30s
    input_series:
      - series: 'fabric_api_node_diagnostics_available{job="fabric-api-node",node="dfw-worker",pod="fabric-router-a"}'
        values: "1x10 0x40"
      - series: 'fabric_api_node_diagnostics_available{job="fabric-api-node",node="dfw-worker2",pod="fabric-router-b"}'
        values: "1x10 0x10 1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: FabricAPINodeDiagnosticsUnavailable
        exp_alerts: []
      - eval_time: 21m
        alertname: FabricAPINodeDiagnosticsUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-api-node
              node: dfw-worker
              pod: fabric-router-a
            exp_annotations:
              summary: "fabric-api diagnostics are unavailable on dfw-worker"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricapinodediagnosticsunavailable"
              description: >-
                The fabric-api sidecar on dfw-worker has reported diagnostics unavailable for 15 minutes:
                FRR's vty sockets are unreachable, FRR runs a release the sidecar has no parsers for, or its mTLS
                certificate is missing. Queries record this node as failed. Its Info RPC and logs give the reason.

  # Most node calls failing fires; a gateway whose calls mostly succeed,
  # and one that made no calls at all, do not.
  - interval: 30s
    input_series:
      - series: 'fabric_api_gateway_node_outcomes_total{job="fabric-api-gateway",namespace="galactic-system",pod="gw-a",outcome="NodeUnreachable"}'
        values: "0+1x60"
      - series: 'fabric_api_gateway_node_outcomes_total{job="fabric-api-gateway",namespace="galactic-system",pod="gw-a",outcome="OK"}'
        values: "0x60"
      - series: 'fabric_api_gateway_node_outcomes_total{job="fabric-api-gateway",namespace="galactic-system",pod="gw-b",outcome="Timeout"}'
        values: "0+1x60"
      - series: 'fabric_api_gateway_node_outcomes_total{job="fabric-api-gateway",namespace="galactic-system",pod="gw-b",outcome="OK"}'
        values: "0+4x60"
      - series: 'fabric_api_gateway_node_outcomes_total{job="fabric-api-gateway",namespace="galactic-system",pod="gw-c",outcome="OK"}'
        values: "7x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: FabricAPINodeUnreachable
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              namespace: galactic-system
              pod: gw-a
            exp_annotations:
              summary: "fabric-api gateway gw-a cannot reach most node sidecars"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricapinodeunreachable"
              description: >-
                100% of gw-a's node calls in the last 30 minutes failed to
                connect or timed out. Check the sidecars' hostIP listener on port 9344, host firewall rules between
                the gateway and the nodes, and certificate identities.

  # Repeated ResponseTooLarge fires.
  - interval: 30s
    input_series:
      - series: 'fabric_api_node_requests_total{job="fabric-api-node",node="dfw-worker",type="QUERY_TYPE_AS_PATH",outcome="ResponseTooLarge"}'
        values: "0+1x60"
      - series: 'fabric_api_node_requests_total{job="fabric-api-node",node="dfw-worker2",type="QUERY_TYPE_AS_PATH",outcome="OK"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: FabricAPIResultsOversized
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              node: dfw-worker
            exp_annotations:
              summary: "fabric-api on dfw-worker keeps refusing results as too large"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricapiresultsoversized"
              description: >-
                60 queries on dfw-worker in the last hour failed with ResponseTooLarge:
                FRR's answer exceeded the 4 MiB read cap or could not be shaped into the node's response budget.
                Usually a routing table that grew past what the budgets were sized for.

  # A stale-object backlog for an hour fires; a small one does not.
  - interval: 30s
    input_series:
      - series: 'fabric_api_gateway_stale_objects{job="fabric-api-gateway",namespace="galactic-system",pod="gw-a"}'
        values: "60x150"
      - series: 'fabric_api_gateway_stale_objects{job="fabric-api-gateway",namespace="other",pod="gw-x"}'
        values: "10x150"
    alert_rule_test:
      - eval_time: 59m
        alertname: FabricAPICleanupBacklog
        exp_alerts: []
      - eval_time: 61m
        alertname: FabricAPICleanupBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              namespace: galactic-system
            exp_annotations:
              summary: "60 expired FabricQuery objects are not being cleaned up"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricapicleanupbacklog"
              description: >-
                More than 50 FabricQuery objects in this cell have been past their expiration plus retention and
                cleanup grace for an hour. Neither Karmada nor the fabric-api-janitor CronJob is deleting them;
                check the CronJob's recent jobs and the federation's deletion propagation.

  # A certificate within 4h of expiry fires; a fresh one does not. Times are
  # seconds since promtool's epoch.
  - interval: 30s
    input_series:
      - series: 'fabric_api_certificate_expiry_timestamp_seconds{job="fabric-api-node",node="dfw-worker",pod="fabric-router-a"}'
        values: "7200x60"
      - series: 'fabric_api_certificate_expiry_timestamp_seconds{job="fabric-api-gateway",namespace="galactic-system",pod="gw-a"}'
        values: "86400x60"
    alert_rule_test:
      - eval_time: 16m
        alertname: FabricAPICertificateRenewalFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-api-node
              node: dfw-worker
              pod: fabric-router-a
            exp_annotations:
              summary: "fabric-api certificate on fabric-router-a expires in under 4 hours"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricapicertificaterenewalfailing"
              description: >-
                The mTLS certificate fabric-router-a has loaded expires in 1h 44m 0s and has not
                been renewed. When it expires the looking glass fails closed for this pod; routing is unaffected.
                Check cert-manager csi-driver and the cell's fabric-api Issuer.

  # Missing credentials for 15m fire.
  - interval: 30s
    input_series:
      - series: 'fabric_api_credentials_loaded{job="fabric-api-gateway",namespace="galactic-system",pod="gw-a"}'
        values: "0x40"
      - series: 'fabric_api_credentials_loaded{job="fabric-api-node",node="dfw-worker",pod="fabric-router-a"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 16m
        alertname: FabricAPICredentialsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-api-gateway
              namespace: galactic-system
              pod: gw-a
            exp_annotations:
              summary: "fabric-api on gw-a has no valid mTLS credentials"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricapicredentialsmissing"
              description: >-
                gw-a has had no loadable certificate, key and trust bundle for 15 minutes, so every
                fabric-api call to or from it fails. Check the csi-driver volume, the Issuer and the pod's logs.

  - interval: 30s
    input_series:
      - series: 'up{job="fabric-api-node",node="dfw-worker",pod="fabric-router-a"}'
        values: "0x30"
      - series: 'up{job="fabric-api-gateway",namespace="galactic-system",pod="gw-a"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 11m
        alertname: FabricAPIMetricsDown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-api-node
              node: dfw-worker
              pod: fabric-router-a
            exp_annotations:
              summary: "fabric-api-node metrics on fabric-router-a cannot be scraped"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricapimetricsdown"
              description: >-
                Prometheus cannot scrape fabric-api-node on fabric-router-a, so the other fabric-api alerts cannot
                fire for it.

  # An index that held routes and lost sync for 15m fires; one that never
  # had a BMP session (no routes) does not.
  - interval: 30s
    input_series:
      - series: 'fabric_api_node_search_index_synced{job="fabric-api-node",node="dfw-worker",pod="fabric-router-a"}'
        values: "1x10 0x40"
      - series: 'fabric_api_node_search_index_routes{job="fabric-api-node",node="dfw-worker",pod="fabric-router-a",afi="ipv4"}'
        values: "100x50"
      - series: 'fabric_api_node_search_index_synced{job="fabric-api-node",node="dfw-worker2",pod="fabric-router-b"}'
        values: "0x50"
      - series: 'fabric_api_node_search_index_routes{job="fabric-api-node",node="dfw-worker2",pod="fabric-router-b",afi="ipv4"}'
        values: "0x50"
    alert_rule_test:
      - eval_time: 21m
        alertname: FabricAPISearchIndexUnsynced
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: fabric-api-node
              node: dfw-worker
              pod: fabric-router-a
            exp_annotations:
              summary: "fabric-api search index on dfw-worker is not following bgpd"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#fabricapisearchindexunsynced"
              description: >-
                The fabric-api sidecar on dfw-worker holds routes but has not been in sync with bgpd's
                Loc-RIB for 15 minutes, so its AS-path and community searches are refused. bgpd's BMP session to
                the sidecar (bmp targets fabric-api, 127.0.0.1:9348) is down or has not completed its initial table.

  # Turned on and unprogrammed for 10m fires. A turned-off shard and a
  # programmed one do not.
  - interval: 30s
    input_series:
      - series: 'galactic_nat_datapath_enabled{job="galactic-nat",node="dfw-worker2"}'
        values: "1x30"
      - series: 'galactic_nat_programmed{job="galactic-nat",node="dfw-worker2"}'
        values: "0x30"
      - series: 'galactic_nat_datapath_enabled{job="galactic-nat",node="dfw-worker3"}'
        values: "0x30"
      - series: 'galactic_nat_programmed{job="galactic-nat",node="dfw-worker3"}'
        values: "0x30"
      - series: 'galactic_nat_datapath_enabled{job="galactic-nat",node="sjc-worker2"}'
        values: "1x30"
      - series: 'galactic_nat_programmed{job="galactic-nat",node="sjc-worker2"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 8m
        alertname: GalacticNatNotProgrammed
        exp_alerts: []
      - eval_time: 12m
        alertname: GalacticNatNotProgrammed
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: galactic-nat
              node: dfw-worker2
            exp_annotations:
              summary: "The egress shard on dfw-worker2 is running but not programmed"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatnotprogrammed"
              description: >-
                galactic-nat on dfw-worker2 has been turned on for 10 minutes without an EgressShard identity
                to translate with, so it claims no packet. Check that an EgressShard targets the node and what its
                status conditions say.

  # One uplink uncovered for 10m fires; the covered one does not.
  - interval: 30s
    input_series:
      - series: 'galactic_nat_uplink_covered{job="galactic-nat",node="dfw-worker2",interface="eth1"}'
        values: "1x30"
      - series: 'galactic_nat_uplink_covered{job="galactic-nat",node="dfw-worker2",interface="eth2"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 12m
        alertname: GalacticNatUplinkUncovered
        exp_alerts:
          - exp_labels:
              severity: critical
              service: galactic
              team: connect
              job: galactic-nat
              node: dfw-worker2
              interface: eth2
            exp_annotations:
              summary: "The egress shard on dfw-worker2 does not translate on uplink eth2"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatuplinkuncovered"
              description: >-
                galactic-nat on dfw-worker2 has not covered uplink eth2 for 10 minutes, so
                packets arriving on it leave untranslated. The shard's log names why it cannot attach there.

  # dfw-worker2 drops 2 packets a second against 100 translated, about 2%,
  # and fires after 15m. sjc-worker2 drops half of a trickle, under the
  # volume floor. iad-worker2 drops many unsolicited return packets, which are
  # not tenant traffic, and fires nothing.
  - interval: 30s
    input_series:
      - series: 'galactic_nat_packets_total{job="galactic-nat",node="dfw-worker2",family="nat66",direction="outbound",action="redirect"}'
        values: "0+3000x60"
      - series: 'galactic_nat_drops_total{job="galactic-nat",node="dfw-worker2",reason="nat66_pat_exhausted"}'
        values: "0+60x60"
      - series: 'galactic_nat_packets_total{job="galactic-nat",node="sjc-worker2",family="nat66",direction="outbound",action="redirect"}'
        values: "0+30x60"
      - series: 'galactic_nat_drops_total{job="galactic-nat",node="sjc-worker2",reason="nat66_malformed_forward"}'
        values: "0+30x60"
      - series: 'galactic_nat_packets_total{job="galactic-nat",node="iad-worker2",family="nat66",direction="outbound",action="redirect"}'
        values: "0+3000x60"
      - series: 'galactic_nat_drops_total{job="galactic-nat",node="iad-worker2",reason="nat66_no_return_conn"}'
        values: "0+3000x60"
    alert_rule_test:
      - eval_time: 12m
        alertname: GalacticNatForwardDropRatio
        exp_alerts: []
      - eval_time: 27m
        alertname: GalacticNatForwardDropRatio
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              node: dfw-worker2
            exp_annotations:
              summary: "The egress shard on dfw-worker2 drops 1.961% of its traffic"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatforwarddropratio"
              description: >-
                galactic-nat on dfw-worker2 has dropped 1.961% of the packets it
                owned, tenant traffic and replies to it, for 15 minutes. galactic_nat_drops_total by reason shows
                which check refuses them.

  # Compute nodes send to dfw-worker2's shard SID throughout, but it translates
  # nothing outbound, and fires after 10m. sjc-worker2's shard translates what
  # it is sent.
  - interval: 30s
    input_series:
      - series: 'galactic_nat_info{job="galactic-nat",node="dfw-worker2",shard_sid="fc00:1:2::",nat64_prefix="",xdp_attach="dispatch",version="v1"}'
        values: "1x50"
      - series: 'galactic_nat_packets_total{job="galactic-nat",node="dfw-worker2",family="nat66",direction="outbound",action="redirect"}'
        values: "0x50"
      - series: 'galactic_cni_egress_shard_packets_total{job="galactic-cni",node="dfw-worker",shard_sid="fc00:1:2::",class="nat66"}'
        values: "0+300x50"
      - series: 'galactic_nat_info{job="galactic-nat",node="sjc-worker2",shard_sid="fc00:2:2::",nat64_prefix="",xdp_attach="dispatch",version="v1"}'
        values: "1x50"
      - series: 'galactic_nat_packets_total{job="galactic-nat",node="sjc-worker2",family="nat66",direction="outbound",action="redirect"}'
        values: "0+300x50"
      - series: 'galactic_cni_egress_shard_packets_total{job="galactic-cni",node="sjc-worker",shard_sid="fc00:2:2::",class="nat66"}'
        values: "0+300x50"
    alert_rule_test:
      - eval_time: 22m
        alertname: GalacticNatNotTranslating
        exp_alerts:
          - exp_labels:
              severity: critical
              service: galactic
              team: connect
              node: dfw-worker2
              shard_sid: "fc00:1:2::"
            exp_annotations:
              summary: "The egress shard on dfw-worker2 translates nothing while tenants send to it"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatnottranslating"
              description: >-
                Compute nodes have encapsulated tenant traffic toward fc00:1:2:: for 10 minutes, but the
                shard on dfw-worker2 translated none of it outbound. Check galactic_nat_uplink_covered,
                galactic_nat_datapath_attached and the shard's XDP attachment.

  # dfw-worker2's busiest destination holds 15400 of 28000 UDP ports (55%)
  # for 10m and fires. sjc-worker2's holds 40% and does not.
  - interval: 30s
    input_series:
      - series: 'galactic_nat_masquerade_destination_ports_max{job="galactic-nat",node="dfw-worker2",family="nat66",address="2001:db8:9966::1",proto="udp"}'
        values: "15400x30"
      - series: 'galactic_nat_masquerade_port_range{job="galactic-nat",node="dfw-worker2"}'
        values: "28000x30"
      - series: 'galactic_nat_masquerade_destination_ports_max{job="galactic-nat",node="sjc-worker2",family="nat66",address="2001:db8:9967::1",proto="udp"}'
        values: "11200x30"
      - series: 'galactic_nat_masquerade_port_range{job="galactic-nat",node="sjc-worker2"}'
        values: "28000x30"
    alert_rule_test:
      - eval_time: 12m
        alertname: GalacticNatPortsNearExhaustion
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              node: dfw-worker2
              family: nat66
              address: "2001:db8:9966::1"
              proto: udp
            exp_annotations:
              summary: "Masquerade udp ports on 2001:db8:9966::1 are 55% used toward one destination"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatportsnearexhaustion"
              description: >-
                The egress shard on dfw-worker2 holds 55% of the udp
                ports on 2001:db8:9966::1 toward a single destination for 10 minutes. New flows to that destination
                start failing as this approaches 100%, with GalacticNatPortExhausted.

  # dfw-worker2 renews every 10s until 5m, then every renewal fails, 3 errors
  # per 30s. Expiring fires once no renewal has succeeded for 2m; failing
  # fires after 5m of more than two errors per window. sjc-worker2 keeps
  # renewing and has one transient error, which fires neither.
  - interval: 30s
    input_series:
      - series: 'galactic_nat_dispatch_lease_renewals_total{job="galactic-nat",node="dfw-worker2",slot="nat",result="error"}'
        values: "0x10 0+3x20"
      - series: 'galactic_nat_dispatch_lease_renewals_total{job="galactic-nat",node="dfw-worker2",slot="nat",result="success"}'
        values: "0+3x10 30x20"
      - series: 'galactic_nat_dispatch_lease_renewals_total{job="galactic-nat",node="sjc-worker2",slot="nat",result="error"}'
        values: "0x10 1x20"
      - series: 'galactic_nat_dispatch_lease_renewals_total{job="galactic-nat",node="sjc-worker2",slot="nat",result="success"}'
        values: "0+3x30"
    alert_rule_test:
      - eval_time: 6m
        alertname: GalacticNatDispatchLeaseExpiring
        exp_alerts: []
      - eval_time: 8m
        alertname: GalacticNatDispatchLeaseExpiring
        exp_alerts:
          - exp_labels:
              severity: critical
              service: galactic
              team: connect
              job: galactic-nat
              node: dfw-worker2
              slot: nat
              result: success
            exp_annotations:
              summary: "The egress shard's XDP dispatcher lease on dfw-worker2 has lapsed or is about to"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatdispatchleaseexpiring"
              description: >-
                galactic-nat on dfw-worker2 has not renewed its nat slot lease for two minutes,
                so the 120-second lease has lapsed or is about to. The dispatcher skips a lapsed slot, so the shard's
                uplinks pass tenant traffic untranslated.
      - eval_time: 12m
        alertname: GalacticNatDispatchLeaseFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: galactic-nat
              node: dfw-worker2
              slot: nat
              result: error
            exp_annotations:
              summary: "The egress shard on dfw-worker2 cannot renew its XDP dispatcher lease"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticnatdispatchleasefailing"
              description: >-
                galactic-nat on dfw-worker2 has failed to renew its nat slot's lease in the XDP
                dispatcher more than twice in every 5-minute window for 5 minutes. Once the lease expires the
                dispatcher skips the slot and tenant traffic leaves untranslated. The shard's log names the error.

  # Repeated failures alert; a rollout burst and idle or disabled routing do not.
  - interval: 30s
    input_series:
      - series: 'galactic_service_route_route_operations_total{job="galactic-router",node="failing",operation="apply",result="error"}'
        values: "0+1x60"
      - series: 'galactic_service_route_route_operations_total{job="galactic-router",node="recovering",operation="apply",result="error"}'
        values: "0+1x5 5x55"
      - series: 'galactic_service_route_route_operations_total{job="galactic-router",node="idle",operation="apply",result="error"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 10m
        alertname: GalacticServiceRouteProgrammingFailing
        exp_alerts: []
      - eval_time: 25m
        alertname: GalacticServiceRouteProgrammingFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: galactic-router
              node: failing
            exp_annotations:
              summary: "Private service routing on failing keeps failing"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticservicerouteprogrammingfailing"
              description: >-
                Private service routes have repeatedly failed to apply or remove on failing.
                Consumers can lose access even when the router Pod is ready and policies are accepted.
                Check the router's service policy errors, attachment host interfaces, and node programming acknowledgments.

  # Attachments stuck in Programming fire per provider and reason, the max of
  # both replicas; a short Pending blip and Active attachments do not.
  - interval: 30s
    input_series:
      - series: 'galactic_edge_foundation_attachments{job="galactic-controller",pod="gc-0",provider="alpha",state="Programming",reason="NamespaceUnavailable"}'
        values: "3x40"
      - series: 'galactic_edge_foundation_attachments{job="galactic-controller",pod="gc-1",provider="alpha",state="Programming",reason="NamespaceUnavailable"}'
        values: "2x40"
      - series: 'galactic_edge_foundation_attachments{job="galactic-controller",pod="gc-0",provider="beta",state="Programming",reason="Pending"}'
        values: "1x4 0x36"
      - series: 'galactic_edge_foundation_attachments{job="galactic-controller",pod="gc-0",provider="beta",state="Active",reason=""}'
        values: "9x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: GalacticEdgeAttachmentNotProgrammed
        exp_alerts: []
      - eval_time: 18m
        alertname: GalacticEdgeAttachmentNotProgrammed
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              provider: alpha
              reason: NamespaceUnavailable
            exp_annotations:
              summary: "Edge attachments of alpha are not programmed (NamespaceUnavailable)"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticedgeattachmentnotprogrammed"
              description: >-
                3 attachments of provider alpha have been admitted and allocated for 15
                minutes without their node programming them, reason NamespaceUnavailable. Their providers have no
                tenant connectivity. The Programming Warning Events on the attachments name the node, pod and error.

  # An unresolved service policy fires after 10m; a resolved one does not.
  - interval: 30s
    input_series:
      - series: 'galactic_edge_foundation_services{job="galactic-controller",pod="gc-0",provider="alpha",policy="Unresolved",reason="NotFound"}'
        values: "1x30"
      - series: 'galactic_edge_foundation_services{job="galactic-controller",pod="gc-0",provider="beta",policy="Resolved",reason=""}'
        values: "4x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: GalacticEdgeServicePolicyUnresolved
        exp_alerts: []
      - eval_time: 12m
        alertname: GalacticEdgeServicePolicyUnresolved
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              provider: alpha
              reason: NotFound
            exp_annotations:
              summary: "Edge services of alpha have no resolvable traffic policy"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticedgeservicepolicyunresolved"
              description: >-
                1 EdgeServices of provider alpha have reported TrafficPolicyResolved
                False (NotFound) for 10 minutes. Their attachments carry nothing but neighbor discovery.
                The Policy Warning Event on each service names the missing or invalid policy.

  # A lost scope that persists fires; one a restart clears does not.
  - interval: 30s
    input_series:
      - series: 'galactic_edge_foundation_scopes_lost{job="galactic-edge",node="edge-1"}'
        values: "0x2 1x20"
      - series: 'galactic_edge_foundation_scopes_lost{job="galactic-edge",node="edge-2"}'
        values: "0x2 1x4 0x16"
    alert_rule_test:
      - eval_time: 8m
        alertname: GalacticEdgeScopeLost
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: galactic-edge
              node: edge-1
            exp_annotations:
              summary: "galactic-edge on edge-1 lost 1 VPC ownership scopes"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticedgescopelost"
              description: >-
                Another writer has taken 1 VPC scopes from galactic-edge on edge-1, which no
                longer programs or releases attachments in them. Its scope-ownership health check fails, so the
                kubelet restarts it; this alert means the restart has not resolved it.

  # Cleanup failing in every window fires; a single failed pass does not.
  - interval: 30s
    input_series:
      - series: 'galactic_edge_foundation_cleanup_failures_total{job="galactic-edge",node="edge-1"}'
        values: "0+1x80"
      - series: 'galactic_edge_foundation_cleanup_failures_total{job="galactic-edge",node="edge-2"}'
        values: "0x5 1x75"
    alert_rule_test:
      - eval_time: 10m
        alertname: GalacticEdgeCleanupFailing
        exp_alerts: []
      - eval_time: 35m
        alertname: GalacticEdgeCleanupFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: galactic-edge
              node: edge-1
            exp_annotations:
              summary: "galactic-edge on edge-1 keeps failing to release host state"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticedgecleanupfailing"
              description: >-
                galactic-edge on edge-1 has failed more than twice in every 15-minute window for 15 minutes
                to release an attachment's host state or sweep expired gates. Deleted attachments stay held by their
                finalizer and their addresses stay allocated. The agent's log names the error.

  # Either job's scrape down fires; other jobs do not.
  - interval: 30s
    input_series:
      - series: 'up{job="galactic-edge",pod="galactic-edge-abcde"}'
        values: "0x20"
      - series: 'up{job="galactic-controller",pod="gc-0"}'
        values: "1x20"
      - series: 'up{job="galactic-nat",pod="galactic-nat-xyz"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 6m
        alertname: GalacticEdgeMetricsDown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: galactic
              team: connect
              job: galactic-edge
              pod: galactic-edge-abcde
            exp_annotations:
              summary: "galactic-edge metrics on galactic-edge-abcde cannot be scraped"
              runbook_url: "https://github.com/datum-cloud/infra/blob/main/docs/runbooks/galactic/README.md#galacticedgemetricsdown"
              description: >-
                Prometheus cannot scrape galactic-edge on galactic-edge-abcde, so the other Galactic Edge alerts
                cannot fire for it.
