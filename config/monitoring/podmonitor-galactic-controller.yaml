# Scrapes galactic-controller --role=cell's metrics port (metrics, 9184). It
# serves whether each running instance's VPC attachments are programmed, and
# with --edge also the Galactic Edge foundation's state: attachments, routes
# and services by provider, state and reason, and core's admission,
# allocation, policy and route failures. Every replica reads the state from
# its cache, so rules aggregate the replicas with max.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: galactic-controller
  labels:
    app.kubernetes.io/name: galactic-controller
spec:
  # job="galactic-controller", which the alert rules match on.
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: galactic-controller
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
