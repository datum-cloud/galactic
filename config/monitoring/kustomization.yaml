# Prometheus Operator resources for the BGP control and data planes, the
# NAT egress shards, fabric routing through the API and the fabric-api
# looking glass: scrape config for fabric-router's frr-exporter and
# config agent (and its opt-in fabric-api sidecar), fabric-router-controller,
# galactic-router's metrics port, galactic-nat's metrics port and the
# fabric-api gateway, galactic-controller's and galactic-edge's Galactic Edge
# state, and the alert rules built on them. Requires the Prometheus Operator CRDs
# (monitoring.coreos.com), which this repo does not install, so it is not
# part of config/kustomization.yaml's default resources.
#
# The rules' expressions are unit-tested with promtool: task test:alerts.
#
# A deployment may scrape these PodMonitors in one place and evaluate the
# rules in another. See prometheusrule.yaml's header.
namespace: galactic-system
resources:
  - podmonitor-fabric-api-gateway.yaml
  - podmonitor-fabric-router.yaml
  - podmonitor-fabric-router-controller.yaml
  - podmonitor-galactic-cni.yaml
  - podmonitor-galactic-controller.yaml
  - podmonitor-galactic-edge.yaml
  - podmonitor-galactic-nat.yaml
  - podmonitor-galactic-router.yaml
  - prometheusrule.yaml
