# Prometheus Operator resources for the BGP control and data planes: scrape
# config for fabric-router's frr-exporter and galactic-router's metrics port,
# and the alert rules built on them. Requires the Prometheus Operator CRDs
# (monitoring.coreos.com), which this repo does not install, so it is not
# part of config/kustomization.yaml's default resources.
#
# The rules' expressions are unit-tested with promtool: task test:alerts.
namespace: galactic-system
resources:
  - podmonitor-fabric-router.yaml
  - podmonitor-galactic-router.yaml
  - prometheusrule.yaml
