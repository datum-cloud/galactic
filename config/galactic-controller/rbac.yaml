apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: galactic-controller
rules:
  # TrafficPolicy: validated by the webhook, its Accepted status written
  # here, and the reserved default-deny-all created in each tenant namespace.
  - apiGroups: [galactic.datumapis.com]
    resources: [trafficpolicies]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [galactic.datumapis.com]
    resources: [trafficpolicies/status, trafficpolicybindings/status]
    verbs: [get, patch]
  - apiGroups: [galactic.datumapis.com]
    resources: [trafficpolicybindings]
    verbs: [get, list, watch]
  - apiGroups: [galactic.datumapis.com]
    resources: [vpcattachments]
    verbs: [get, list, watch]
  - apiGroups: [galactic.datumapis.com]
    resources: [vpcattachments/status]
    verbs: [get, update, patch]
  - apiGroups: [galactic.datumapis.com]
    resources: [bgpadvertisements, bgprouters]
    verbs: [get, list, watch]
  - apiGroups: [networking.datumapis.com]
    resources: [networkinterfaceclaims, networkinterfaces]
    verbs: [get, list, watch]
  - apiGroups: [networking.datumapis.com]
    resources: [networkinterfaceclaims/status, networkinterfaces/status]
    verbs: [get, update, patch]
  - apiGroups: [compute.datumapis.com]
    resources: [instances]
    verbs: [get, list, watch]
  - apiGroups: [k8s.cni.cncf.io]
    resources: [network-attachment-definitions]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # The webhook allows the namespace controller to delete default-deny-all
  # while its namespace is being torn down.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  # Galactic Edge (--edge): admission reads providers, grants, instances,
  # pods, VPCs and nodes; allocation and the Admitted condition are in
  # EdgeService status; the finalizer, drain deletion and lifecycle
  # conditions are on EdgeAttachment.
  - apiGroups: [galactic.datumapis.com]
    resources: [edgeproviders, edgeservices, edgeinstances, vpcs]
    verbs: [get, list, watch]
  - apiGroups: [galactic.datumapis.com]
    resources: [edgeservices/status]
    verbs: [get, update, patch]
  # Per approved provider: a binding of the galactic-edge-provider policy
  # and RoleBindings of the galactic-edge-provider ClusterRole, both owned
  # by the EdgeProvider.
  # The finalizer on EdgeProvider withdraws them before it goes; the
  # galactic-edge-controller-rolebindings policy (config/galactic-edge)
  # holds the RoleBinding writes to the provider role.
  - apiGroups: [galactic.datumapis.com]
    resources: [edgeproviders]
    verbs: [update, patch]
  - apiGroups: [galactic.datumapis.com]
    resources: [edgeproviders/finalizers]
    verbs: [update]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicybindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames: [galactic-edge-provider]
  - apiGroups: [galactic.datumapis.com]
    resources: [edgeattachments]
    verbs: [get, list, watch, update, patch, delete]
  - apiGroups: [galactic.datumapis.com]
    resources: [edgeattachments/status]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  # events.k8s.io for the provisioning-conflict events; core events for the
  # leader election records controller-runtime writes.
  - apiGroups: [events.k8s.io, ""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: galactic-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: galactic-controller
subjects:
  - kind: ServiceAccount
    name: galactic-controller
    namespace: galactic-system
---
# Leader election, in the controller's own namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: galactic-controller-leader-election
  namespace: galactic-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: galactic-controller-leader-election
  namespace: galactic-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: galactic-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: galactic-controller
    namespace: galactic-system
