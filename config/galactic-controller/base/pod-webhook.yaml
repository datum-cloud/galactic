apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: galactic-controller-pod-interfaces
  annotations:
    cert-manager.io/inject-ca-from: galactic-system/galactic-controller-webhook
webhooks:
  - name: pod-interfaces.galactic.datumapis.com
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    objectSelector:
      matchLabels:
        networking.datumapis.com/inject-interfaces: "true"
    clientConfig:
      service:
        name: galactic-controller-webhook
        namespace: galactic-system
        path: /mutate-v1-pod
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
