apiVersion: apps/v1
kind: Deployment
metadata:
  name: galactic-controller
  namespace: galactic-system
  labels:
    app.kubernetes.io/name: galactic-controller
spec:
  # Two replicas: the webhook fails closed, so a single replica would block
  # every TrafficPolicy write during a restart.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: galactic-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: galactic-controller
    spec:
      serviceAccountName: galactic-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: galactic-controller
      containers:
        - name: controller
          image: ghcr.io/datum-cloud/galactic-controller:latest
          args:
            - --role=cell
            # Override in Hypervisor and HypervisorDeclared cells.
            - --attachment-mode=Netns
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: webhook
              containerPort: 9443
              protocol: TCP
            - name: metrics
              containerPort: 9184
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          # Keep serving while the endpoint is withdrawn: the webhook fails
          # closed, so a request reaching a pod that stopped listening is a
          # refused write.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            secretName: galactic-controller-webhook-tls
