# galactic-nat on a node that also runs galactic-gateway (labeled
# galactic.datumapis.com/gateway=enabled as well as .../nat=enabled).
# The gateway already holds the native XDP hook on every uplink, and an
# interface takes one native program, so the shard installs itself in the
# gateway's pinned xdp_chain slot instead of attaching. It waits for that
# map at startup, so the gateway must run on this node too. Like ../../base/,
# this is not applied as-is; see ../../kustomization.yaml.
resources:
  - ../../base
patches:
  - path: daemonset-patch.yaml
    target:
      kind: DaemonSet
      name: galactic-nat
