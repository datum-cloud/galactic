# The sharded egress translation datapath control plane. Unlike
# config/galactic-router/'s equivalent kustomization.yaml, this
# deliberately does NOT include base/. A shard's identity -- its SID and
# per-family masquerade addresses -- comes from its EgressShard's spec, and
# its uplinks are auto-detected, so base/daemonset.yaml no longer needs any
# per-node value to start. But auto-detection attaches native XDP to every
# interface carrying the IPv6 default route or a BGP-learned route, and on a
# node where that includes a management NIC the deployer has to name the
# fabric uplinks with GALACTIC_NAT_UPLINK_INTERFACES instead, which only
# they know. config/galactic-gateway/ and config/fabric-router/ have the
# same exemption.
#
# serviceaccount.yaml/rbac.yaml have no such per-node uniqueness problem --
# they're safe and idempotent to apply cluster-wide regardless of how many
# shard nodes exist or which ones -- so this kustomization covers only
# those two. Apply with `kubectl apply -k config/galactic-nat/`, once,
# before applying any per-node overlay of ../base. This whole directory is
# deliberately NOT part of the root config/kustomization.yaml's default
# resource list: this role is not "batteries included" cluster bring-up.
resources:
  - serviceaccount.yaml
  - rbac.yaml
