# The sharded egress translation datapath control plane. Unlike
# config/galactic-router/'s equivalent kustomization.yaml, this
# deliberately does NOT include base/: base/daemonset.yaml's
# galactic-nat container has no generic default for
# GALACTIC_NAT_UPLINK_INTERFACES or _SHARD_SID (both required, and the
# shard SID must be unique per shard node). Applying it as shipped here
# would produce a crash-looping container. The IPv6 masquerade address is
# not among the missing values: it is assigned in EgressShard
# spec.shardAddressIPv6 rather than configured here, and a shard with none
# assigned starts fine and reports Programmed=False/AddressUnassigned.
# config/galactic-gateway/ and config/fabric-router/ have the same
# exemption for the same reason.
#
# serviceaccount.yaml/rbac.yaml have no such per-node uniqueness problem --
# they're safe and idempotent to apply cluster-wide regardless of how many
# shard nodes exist or which ones -- so this kustomization covers only
# those two. Apply with `kubectl apply -k config/galactic-nat/`, once,
# before applying any per-node overlay of ../base. This whole directory is
# deliberately NOT part of the root config/kustomization.yaml's default
# resource list: this role is not "batteries included" cluster bring-up.
resources:
  - serviceaccount.yaml
  - rbac.yaml
