# The single-container egress translation shard pod's shared base -- see
# ../kustomization.yaml for why this isn't applied as-is: a deployer whose
# nodes' uplinks auto-detection cannot pick out applies it through an
# overlay setting GALACTIC_NAT_UPLINK_INTERFACES. The shard's identity is
# never set here; it comes from each node's EgressShard spec. The overlay
# shape mirrors config/galactic-gateway/base/kustomization.yaml's identical
# per-node overlay pattern (see
# deploy/containerlab/resources/galactic-gateway/ for a worked example of
# that pattern applied to a sibling component).
resources:
  - daemonset.yaml
