apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fabric-router
  namespace: galactic-system
  labels:
    app.kubernetes.io/name: fabric-router
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fabric-router
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fabric-router
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      # FRR here establishes the underlay eBGP session to the physical fabric
      # and brings up the node's lo address, both of which galactic-router
      # depends on before it can start — so this must tolerate NotReady the
      # same way a CNI plugin does, or it never gets scheduled early enough.
      # It must also tolerate the route-reflector role's own
      # galactic.datumapis.com/node=control:NoSchedule taint -- the affinity
      # below already targets that label, but without this toleration the
      # matching taint silently keeps this DaemonSet off the node entirely,
      # so the route reflector's lo address (and BGP_LOCAL_ADDRESS
      # auto-detection) never gets configured and galactic-router-control
      # crashloops forever.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoSchedule
        - key: galactic.datumapis.com/node
          operator: Equal
          value: control
          effect: NoSchedule
      # Opt-in only, same as galactic-cni and galactic-router: runs on every
      # node labeled either for regular tenant traffic or for the
      # galactic-router route-reflector role, since both need underlay
      # connectivity; new node types (GPU, monitoring, etc.) don't
      # automatically get fabric.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: galactic.datumapis.com/node
                    operator: In
                    values:
                      - edge
                      - control
      initContainers:
        - name: frr-init
          # ":latest" is a placeholder only: no such tag is ever pushed to
          # GHCR. CI resolves and stamps a real version tag here when it
          # publishes the ghcr.io/datum-cloud/galactic-kustomize OCI bundle
          # (see .github/workflows/publish.yaml); applying this manifest
          # directly from a git checkout will fail to pull the image unless
          # you override the tag first — see the README's "Production
          # Deployment" section.
          image: ghcr.io/datum-cloud/fabric-router:latest
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - sh
            - -c
            - |
              cp /etc/frr-defaults/* /etc/frr/
              cp /tmp/frr-config/daemons /tmp/frr-config/vtysh.conf /etc/frr/
              cp "/tmp/frr-config/frr.conf.${NODE_NAME}" /etc/frr/frr.conf
              install -d -o frr -g frr -m 775 /run/frr
              install -d -o frr -g frr -m 775 /var/log/frr
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - name: frr-config-source
              mountPath: /tmp/frr-config
              readOnly: true
            - name: frr-etc
              mountPath: /etc/frr
            - name: frr-run
              mountPath: /run/frr
            - name: frr-log
              mountPath: /var/log/frr
      containers:
        - name: frr
          image: ghcr.io/datum-cloud/fabric-router:latest
          lifecycle:
            preStop:
              exec:
                command:
                  - /usr/lib/frr/frrinit.sh
                  - stop
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - vtysh -d zebra -c "show version" && vtysh -d bgpd -c "show version"
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - vtysh -d zebra -c "show version" && vtysh -d bgpd -c "show version"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: frr-etc
              mountPath: /etc/frr
            - name: frr-run
              mountPath: /run/frr
            - name: frr-log
              mountPath: /var/log/frr
      volumes:
        # fabric-config is NOT generated by this kustomization — the deployer
        # must create it themselves with a site-specific frr.conf per node
        # (interface addresses, remote-AS, etc. for the local underlay
        # fabric). There is no generic default that peers correctly
        # everywhere, and BGP underlay config inherently differs per
        # physical node — so this DaemonSet's nodeAffinity can match more
        # than one node per cluster, and the ConfigMap must carry one
        # frr.conf.<nodename> key per matching node (frr-init selects the
        # right one via the pod's NODE_NAME downward-API env var) rather
        # than a single shared frr.conf. See the README's "Production
        # Deployment" section.
        - name: frr-config-source
          configMap:
            name: fabric-config
        - name: frr-etc
          emptyDir: {}
        - name: frr-run
          emptyDir:
            medium: Memory
        - name: frr-log
          emptyDir: {}
