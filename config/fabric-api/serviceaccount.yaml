apiVersion: v1
kind: ServiceAccount
metadata:
  name: fabric-api-gateway
  namespace: galactic-system
---
# The janitor's own identity, so delete access to FabricQuery never reaches
# the gateway, which only executes queries and writes their status.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fabric-api-janitor
  namespace: galactic-system
