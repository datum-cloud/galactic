# The gateway reads the service switch, and nothing else among the
# namespace's ConfigMaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fabric-api-gateway-service
  namespace: galactic-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["fabric-api-service"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fabric-api-gateway-service
  namespace: galactic-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fabric-api-gateway-service
subjects:
  - kind: ServiceAccount
    name: fabric-api-gateway
    namespace: galactic-system
