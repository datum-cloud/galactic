# The operator debug service. ClusterIP only and mTLS-authenticated: neither
# the Service nor a port-forward bypasses the gateway's identity checks.
apiVersion: v1
kind: Service
metadata:
  name: fabric-api-gateway
  namespace: galactic-system
  labels:
    app.kubernetes.io/name: fabric-api-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fabric-api-gateway
  ports:
    - name: debug
      port: 9346
      targetPort: debug
      protocol: TCP
