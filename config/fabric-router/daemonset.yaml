apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fabric-router
  namespace: galactic-system
  labels:
    app.kubernetes.io/name: fabric-router
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fabric-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fabric-router
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # FRR here establishes the underlay eBGP session to the physical fabric
      # and brings up the node's lo address, both of which galactic-router
      # depends on before it can start — so this must tolerate NotReady the
      # same way a CNI plugin does, or it never gets scheduled early enough.
      # Blanket-tolerate all taints, same as every other DaemonSet in
      # config/ (galactic-cni, galactic-router, galactic-gateway).
      # Placement is controlled entirely by the node affinity
      # below (the galactic.datumapis.com/fabric label) — tolerations don't need to be
      # scoped, and scoping them risks silently blocking fabric-router if
      # an unenumerated taint (a new role taint, a maintenance taint, etc.)
      # ever lands on an eligible node: the route reflector's lo address
      # (and BGP_LOCAL_ADDRESS auto-detection) or the gateway node's
      # underlay session would never come up and galactic-router-rr/
      # galactic-gateway would crashloop forever per their dependency on
      # this DaemonSet.
      tolerations:
        - operator: Exists
      # Opt-in only, same as galactic-cni and galactic-router: runs on every
      # node labeled galactic.datumapis.com/fabric=router, independent of
      # galactic.datumapis.com/node's role value (compute, edge) and of
      # the separate galactic.datumapis.com/galactic flag -- rather than
      # enumerating every role that happens to need underlay connectivity
      # today, this lets any *current or future* role opt in by adding
      # one label, with no matching edit ever required here again. (This
      # replaced an earlier version that did enumerate roles via `In` --
      # which meant a role like nat66 was never added to the list and so
      # silently never got fabric, even though NAT66 shards need underlay
      # BGP to advertise their own SID just as much as any other role.)
      # "router" (not a bare boolean) mirrors galactic.datumapis.com/galactic's
      # own router/control pair: "control" is the underlay's own route
      # reflector (distinct from galactic-router-rr's EVPN reflector, which
      # lives on galactic.datumapis.com/galactic=control instead), and the
      # two values are mutually exclusive by construction the same way.
      # It runs the identical fabric-router image -- the reflector-vs-plain
      # distinction lives entirely in the per-node frr.conf infra's own
      # renderer produces (a route-reflector-client peer-group vs. the four
      # canonical ones), not in this manifest or this binary. The gateway
      # role's own XDP datapath attaches to this same interface (see
      # internal/gateway's doc.go) and depends on FRR having already
      # brought it up and established the eBGP underlay session. New node
      # types (GPU, monitoring, etc.) don't automatically get fabric.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: galactic.datumapis.com/fabric
                    operator: In
                    values:
                      - router
                      - control
      # fabric-config-agent reads this node's own fabric-router.<nodename>
      # ConfigMap from the API (a DaemonSet can't vary a volume's ConfigMap
      # name per node), so the pod needs a ServiceAccount; see rbac.yaml.
      serviceAccountName: fabric-router
      initContainers:
        - name: frr-init
          # ":latest" is a placeholder only: no such tag is ever pushed to
          # GHCR. CI resolves and stamps a real version tag here when it
          # publishes the ghcr.io/datum-cloud/galactic-kustomize OCI bundle
          # (see .github/workflows/publish.yaml); applying this manifest
          # directly from a git checkout will fail to pull the image unless
          # you override the tag first — see the README's "Production
          # Deployment" section.
          image: ghcr.io/datum-cloud/fabric-router:latest
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          # Installs this node's frr.conf from ConfigMap
          # fabric-router.<nodename> (daemons/vtysh.conf come from the
          # image's /etc/frr-defaults unless that ConfigMap overrides them),
          # after validating it with `vtysh -C`. A missing or invalid
          # ConfigMap holds the pod in Init -- with a ConfigMissing/Rejected
          # event on the pod or ConfigMap saying why -- rather than starting
          # FRR with no underlay config. Falls back, with a
          # DeprecatedConfigSource warning, to key frr.conf.<nodename> of the
          # legacy shared fabric-config ConfigMap when the node has no
          # ConfigMap of its own.
          command:
            - sh
            - -ec
            - |
              install -d -o frr -g frr -m 775 /run/frr
              install -d -o frr -g frr -m 775 /var/log/frr
              exec fabric-config-agent init
          volumeMounts:
            - name: frr-etc
              mountPath: /etc/frr
            - name: frr-run
              mountPath: /run/frr
            - name: frr-log
              mountPath: /var/log/frr
      containers:
        - name: frr
          image: ghcr.io/datum-cloud/fabric-router:latest
          # Documentation only (hostNetwork: true, so this doesn't change
          # behavior): the standard BGP port, opened by bgpd itself once
          # this node's frr.conf (installed by frr-init above) enables it --
          # nothing here actually declares or gates it, this just makes it
          # visible without reading FRR's own config.
          ports:
            - name: bgp
              containerPort: 179
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command:
                  - /usr/lib/frr/frrinit.sh
                  - stop
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - vtysh -d zebra -c "show version" && vtysh -d bgpd -c "show version"
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - vtysh -d zebra -c "show version" && vtysh -d bgpd -c "show version"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: frr-etc
              mountPath: /etc/frr
            - name: frr-run
              mountPath: /run/frr
            - name: frr-log
              mountPath: /var/log/frr
        # Watches this node's fabric-router.<nodename> ConfigMap and applies
        # each change to the running FRR with frr-reload.py, which pushes
        # only the difference, so an edit to one node's config neither
        # restarts this pod nor touches any other node. A change that fails
        # `vtysh -C` is rejected (Rejected event on the ConfigMap) and the
        # running config is kept; an applied one raises an Applied event
        # carrying its hash. A change to `daemons` can't be applied live and
        # raises RestartRequired instead.
        - name: config-agent
          image: ghcr.io/datum-cloud/fabric-router:latest
          command:
            - fabric-config-agent
            - watch
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: frr-etc
              mountPath: /etc/frr
            # vtysh (used by frr-reload.py) reaches the daemons over the
            # sockets in /run/frr.
            - name: frr-run
              mountPath: /run/frr
      volumes:
        # No ConfigMap volume: each node's config lives in its own
        # fabric-router.<nodename> ConfigMap, which this kustomization does
        # NOT generate -- the deployer must create one per node matching the
        # affinity above, with a frr.conf key holding that node's
        # site-specific underlay config (interface addresses, remote-AS,
        # etc.), and optionally daemons/vtysh.conf keys to override the
        # image defaults. See the README's "Production Deployment" section.
        - name: frr-etc
          emptyDir: {}
        - name: frr-run
          emptyDir:
            medium: Memory
        - name: frr-log
          emptyDir: {}
