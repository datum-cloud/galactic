apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fabric-router
  namespace: galactic-system
  labels:
    app.kubernetes.io/name: fabric-router
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fabric-router
  # Unlike every other DaemonSet in config/ (galactic-cni, galactic-router,
  # galactic-gateway, vmtap-cni), this one owns the eBGP session to the
  # physical fabric switch, not an in-cluster control-plane relationship.
  # Bouncing FRR here drops the node's only underlay path, so every overlay
  # SRv6/EVPN path riding on it blackholes until the eBGP session
  # re-establishes and reconverges -- and galactic-router-control/
  # galactic-gateway crash-loop per the toleration comment below if it
  # doesn't come back. The startupProbe/livenessProbe below only check that
  # zebra/bgpd answer vtysh (the daemon is alive), not that the eBGP
  # session to the fabric peer has reconverged, so a RollingUpdate would
  # let the DaemonSet controller advance to the next node on that same
  # shallow signal -- too early for a component this foundational.
  # OnDelete puts pod recreation under explicit control (a human or a
  # future automated rollout runbook, one node at a time, verifying
  # reconvergence in between) instead of the controller auto-advancing.
  # This also matches how fabric-config changes already work today: there's
  # no checksum annotation on the pod template, so editing the fabric-config
  # ConfigMap doesn't trigger a rollout either -- both config and image
  # updates require a deliberate pod bounce.
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fabric-router
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # FRR here establishes the underlay eBGP session to the physical fabric
      # and brings up the node's lo address, both of which galactic-router
      # depends on before it can start — so this must tolerate NotReady the
      # same way a CNI plugin does, or it never gets scheduled early enough.
      # Blanket-tolerate all taints, same as every other DaemonSet in
      # config/ (galactic-cni, galactic-router, galactic-gateway,
      # vmtap-cni). Placement is controlled entirely by the node affinity
      # below (edge/control/gateway roles) — tolerations don't need to be
      # scoped, and scoping them risks silently blocking fabric-router if
      # an unenumerated taint (a new role taint, a maintenance taint, etc.)
      # ever lands on an eligible node: the route reflector's lo address
      # (and BGP_LOCAL_ADDRESS auto-detection) or the gateway node's
      # underlay session would never come up and galactic-router-control/
      # galactic-gateway would crashloop forever per their dependency on
      # this DaemonSet.
      tolerations:
        - operator: Exists
      # Opt-in only, same as galactic-cni and galactic-router: runs on every
      # node labeled for regular tenant traffic, the galactic-router
      # route-reflector role, or the edge XDP NAT+LB gateway role
      # (config/galactic-gateway/base/, a separate galactic-gateway binary), since
      # all three need underlay connectivity -- the gateway role's own XDP
      # datapath attaches to
      # this same interface (see internal/gateway's doc.go) and depends on
      # FRR having already brought it up and established the eBGP
      # underlay session. New node types (GPU, monitoring, etc.) don't
      # automatically get fabric.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: galactic.datumapis.com/node
                    operator: In
                    values:
                      - edge
                      - control
                      - gateway
      initContainers:
        - name: frr-init
          # ":latest" is a placeholder only: no such tag is ever pushed to
          # GHCR. CI resolves and stamps a real version tag here when it
          # publishes the ghcr.io/datum-cloud/galactic-kustomize OCI bundle
          # (see .github/workflows/publish.yaml); applying this manifest
          # directly from a git checkout will fail to pull the image unless
          # you override the tag first — see the README's "Production
          # Deployment" section.
          image: ghcr.io/datum-cloud/fabric-router:latest
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - sh
            - -c
            - |
              cp /etc/frr-defaults/* /etc/frr/
              cp /tmp/frr-config/daemons /tmp/frr-config/vtysh.conf /etc/frr/
              cp "/tmp/frr-config/frr.conf.${NODE_NAME}" /etc/frr/frr.conf
              install -d -o frr -g frr -m 775 /run/frr
              install -d -o frr -g frr -m 775 /var/log/frr
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - name: frr-config-source
              mountPath: /tmp/frr-config
              readOnly: true
            - name: frr-etc
              mountPath: /etc/frr
            - name: frr-run
              mountPath: /run/frr
            - name: frr-log
              mountPath: /var/log/frr
      containers:
        - name: frr
          image: ghcr.io/datum-cloud/fabric-router:latest
          # Documentation only (hostNetwork: true, so this doesn't change
          # behavior): the standard BGP port, opened by bgpd itself once
          # the per-node frr.conf.<nodename> (see fabric-config's
          # frr-init above) enables it -- nothing here actually declares
          # or gates it, this just makes it visible without reading FRR's
          # own config.
          ports:
            - name: bgp
              containerPort: 179
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command:
                  - /usr/lib/frr/frrinit.sh
                  - stop
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - vtysh -d zebra -c "show version" && vtysh -d bgpd -c "show version"
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - vtysh -d zebra -c "show version" && vtysh -d bgpd -c "show version"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: frr-etc
              mountPath: /etc/frr
            - name: frr-run
              mountPath: /run/frr
            - name: frr-log
              mountPath: /var/log/frr
      volumes:
        # fabric-config is NOT generated by this kustomization — the deployer
        # must create it themselves with a site-specific frr.conf per node
        # (interface addresses, remote-AS, etc. for the local underlay
        # fabric). There is no generic default that peers correctly
        # everywhere, and BGP underlay config inherently differs per
        # physical node — so this DaemonSet's nodeAffinity can match more
        # than one node per cluster, and the ConfigMap must carry one
        # frr.conf.<nodename> key per matching node (frr-init selects the
        # right one via the pod's NODE_NAME downward-API env var) rather
        # than a single shared frr.conf. See the README's "Production
        # Deployment" section.
        - name: frr-config-source
          configMap:
            name: fabric-config
        - name: frr-etc
          emptyDir: {}
        - name: frr-run
          emptyDir:
            medium: Memory
        - name: frr-log
          emptyDir: {}
