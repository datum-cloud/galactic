apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fabric-router
  namespace: galactic-system
  labels:
    app.kubernetes.io/name: fabric-router
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fabric-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fabric-router
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # FRR here establishes the underlay eBGP session to the physical fabric
      # and brings up the node's lo address, both of which galactic-router
      # depends on before it can start — so this must tolerate NotReady the
      # same way a CNI plugin does, or it never gets scheduled early enough.
      # Blanket-tolerate all taints, same as every other DaemonSet in
      # config/ (galactic-cni, galactic-router, galactic-gateway).
      # Placement is controlled entirely by the node affinity
      # below (the galactic.datumapis.com/fabric label) — tolerations don't need to be
      # scoped, and scoping them risks silently blocking fabric-router if
      # an unenumerated taint (a new role taint, a maintenance taint, etc.)
      # ever lands on an eligible node: the route reflector's lo address
      # (and BGP_LOCAL_ADDRESS auto-detection) or the gateway node's
      # underlay session would never come up and galactic-router-rr/
      # galactic-gateway would crashloop forever per their dependency on
      # this DaemonSet.
      tolerations:
        - operator: Exists
      # Opt-in only, same as galactic-cni and galactic-router: runs on every
      # node labeled galactic.datumapis.com/fabric=router, independent of
      # galactic.datumapis.com/node's role value (compute, edge) and of
      # the separate galactic.datumapis.com/galactic flag -- rather than
      # enumerating every role that happens to need underlay connectivity
      # today, this lets any *current or future* role opt in by adding
      # one label, with no matching edit ever required here again. (This
      # replaced an earlier version that did enumerate roles via `In` --
      # which meant a role like nat66 was never added to the list and so
      # silently never got fabric, even though NAT66 shards need underlay
      # BGP to advertise their own SID just as much as any other role.)
      # "router" (not a bare boolean) mirrors galactic.datumapis.com/galactic's
      # own router/control pair: "control" is reserved for fabric-router-rr
      # (the underlay's own route reflector, future, not yet implemented --
      # distinct from galactic-router-rr's EVPN reflector, which lives on
      # galactic.datumapis.com/galactic=control instead), and the two values
      # are mutually exclusive by construction the same way. The gateway
      # role's own XDP datapath attaches to this same interface (see
      # internal/gateway's doc.go) and depends on FRR having already
      # brought it up and established the eBGP underlay session. New node
      # types (GPU, monitoring, etc.) don't automatically get fabric.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: galactic.datumapis.com/fabric
                    operator: In
                    values:
                      - router
      initContainers:
        - name: frr-init
          # ":latest" is a placeholder only: no such tag is ever pushed to
          # GHCR. CI resolves and stamps a real version tag here when it
          # publishes the ghcr.io/datum-cloud/galactic-kustomize OCI bundle
          # (see .github/workflows/publish.yaml); applying this manifest
          # directly from a git checkout will fail to pull the image unless
          # you override the tag first — see the README's "Production
          # Deployment" section.
          image: ghcr.io/datum-cloud/fabric-router:latest
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - sh
            - -c
            - |
              cp /etc/frr-defaults/* /etc/frr/
              cp /tmp/frr-config/daemons /tmp/frr-config/vtysh.conf /etc/frr/
              cp "/tmp/frr-config/frr.conf.${NODE_NAME}" /etc/frr/frr.conf
              install -d -o frr -g frr -m 775 /run/frr
              install -d -o frr -g frr -m 775 /var/log/frr
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - name: frr-config-source
              mountPath: /tmp/frr-config
              readOnly: true
            - name: frr-etc
              mountPath: /etc/frr
            - name: frr-run
              mountPath: /run/frr
            - name: frr-log
              mountPath: /var/log/frr
      containers:
        - name: frr
          image: ghcr.io/datum-cloud/fabric-router:latest
          # Documentation only (hostNetwork: true, so this doesn't change
          # behavior): the standard BGP port, opened by bgpd itself once
          # the per-node frr.conf.<nodename> (see fabric-config's
          # frr-init above) enables it -- nothing here actually declares
          # or gates it, this just makes it visible without reading FRR's
          # own config.
          ports:
            - name: bgp
              containerPort: 179
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command:
                  - /usr/lib/frr/frrinit.sh
                  - stop
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - vtysh -d zebra -c "show version" && vtysh -d bgpd -c "show version"
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - vtysh -d zebra -c "show version" && vtysh -d bgpd -c "show version"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: frr-etc
              mountPath: /etc/frr
            - name: frr-run
              mountPath: /run/frr
            - name: frr-log
              mountPath: /var/log/frr
      volumes:
        # fabric-config is NOT generated by this kustomization — the deployer
        # must create it themselves with a site-specific frr.conf per node
        # (interface addresses, remote-AS, etc. for the local underlay
        # fabric). There is no generic default that peers correctly
        # everywhere, and BGP underlay config inherently differs per
        # physical node — so this DaemonSet's nodeAffinity can match more
        # than one node per cluster, and the ConfigMap must carry one
        # frr.conf.<nodename> key per matching node (frr-init selects the
        # right one via the pod's NODE_NAME downward-API env var) rather
        # than a single shared frr.conf. See the README's "Production
        # Deployment" section.
        - name: frr-config-source
          configMap:
            name: fabric-config
        - name: frr-etc
          emptyDir: {}
        - name: frr-run
          emptyDir:
            medium: Memory
        - name: frr-log
          emptyDir: {}
