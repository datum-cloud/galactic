# fabric-config-agent's RBAC (both the frr-init init container and the
# config-agent sidecar in daemonset.yaml). Namespaced, not cluster-wide.
#
# events: the agent raises Applied/Rejected/ReloadFailed/RestartRequired
# events on the node's ConfigMap and ConfigMissing/DeprecatedConfigSource
# on its own Pod, and the sidecar's next-hop check raises
# MappedNextHopReset on its own Pod, via the events.k8s.io/v1 API. The Pod
# events remain once the ConfigMap path is retired, so this Role stays.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fabric-router
  namespace: galactic-system
rules:
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fabric-router
  namespace: galactic-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fabric-router
subjects:
  - kind: ServiceAccount
    name: fabric-router
    namespace: galactic-system
---
# The ConfigMap path: the agent reads its own node's fabric-router.<nodename>
# ConfigMap (plus, during the migration off it, the legacy shared
# fabric-config), both in galactic-system. A Role of its own, so
# components/configmap-retired removes it whole once every node runs from
# the CRD source.
#
# RBAC can't scope resourceNames to "whichever node this pod landed on"
# without listing every node's ConfigMap name here, so read access is
# namespace-wide. list/watch are needed for the sidecar's single-object
# informer (a metadata.name field-selector watch).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fabric-router-configmaps
  namespace: galactic-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fabric-router-configmaps
  namespace: galactic-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fabric-router-configmaps
subjects:
  - kind: ServiceAccount
    name: fabric-router
    namespace: galactic-system
