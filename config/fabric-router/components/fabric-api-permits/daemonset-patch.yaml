apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fabric-router
  namespace: galactic-system
spec:
  template:
    spec:
      containers:
        - name: fabric-api
          args:
            - node
            - --probe-permits
          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
