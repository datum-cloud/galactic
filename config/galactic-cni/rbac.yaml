apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: galactic-cni
rules:
  - apiGroups: ["galactic.datumapis.com"]
    resources:
      - bgprouters
    verbs: ["get", "list"]
  - apiGroups: ["galactic.datumapis.com"]
    resources:
      - bgpadvertisements
      - bgpvrfinstances
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # egressshards (read only): in hashed egress mode, galactic-cni run spreads
  # tenant egress across every EgressShard in the cluster and watches them for
  # membership and drain changes. See internal/installer/egressgroup.go.
  - apiGroups: ["galactic.datumapis.com"]
    resources:
      - egressshards
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8s.cni.cncf.io"]
    resources:
      - network-attachment-definitions
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["get"]
  # discovery.k8s.io/endpointslices: galactic-bgp's per-pod EndpointSlice
  # publish (ADD), delete (DEL), and CHECK, and galactic-cni run's repair of
  # a missing one.
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # pods (read only): get to look up the owning Pod's UID and set it as the
  # EndpointSlice's ownerReference, so the k8s garbage collector reclaims
  # a force-deleted/never-DEL'd pod's EndpointSlice as a backstop; list for
  # the EndpointSlice repair. RBAC cannot scope list to a node, so this grants
  # listing every pod; the repair asks only for its own node's (field
  # selector spec.nodeName). This SA never writes a Pod.
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: galactic-cni
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: galactic-cni
subjects:
  - kind: ServiceAccount
    name: galactic-cni
    namespace: galactic-system
