apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-cni
  namespace: galactic-system
  labels:
    app.kubernetes.io/name: galactic-cni
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: galactic-cni
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: galactic-cni
    spec:
      serviceAccountName: galactic-cni
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # galactic-cni is more fundamental than any other node component: if
      # evicted under node pressure, no pod (including the CNI's own peers)
      # can schedule on this node at all.
      priorityClassName: system-node-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
      # galactic-cni runs on both compute and edge nodes -- it's the one
      # per-node component every primary role needs (see
      # docs/node-labels.md), so it's opt-in via the independent
      # galactic.datumapis.com/galactic=router flag rather than
      # galactic.datumapis.com/node's primary-role value, the same reason
      # galactic-router (config/galactic-router/overlays/router/
      # daemonset-patch.yaml) keys off the identical flag: enumerating
      # galactic.datumapis.com/node's values here would need editing again
      # every time a new primary role is added, exactly the class of bug
      # galactic.datumapis.com/fabric was already introduced to avoid (see
      # config/fabric-router/daemonset.yaml's own affinity comment).
      # Control-plane nodes are excluded outright since galactic-cni has
      # nothing to do there regardless of this flag.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: galactic.datumapis.com/galactic
                    operator: In
                    values:
                      - router
      initContainers:
        - name: install-cni
          # ":latest" is a placeholder only: no such tag is ever pushed to
          # GHCR. CI resolves and stamps a real version tag here when it
          # publishes the ghcr.io/datum-cloud/galactic-kustomize OCI bundle
          # (see .github/workflows/publish.yaml); applying this manifest
          # directly from a git checkout will fail to pull the image unless
          # you override the tag first — see the README's "Production
          # Deployment" section.
          image: ghcr.io/datum-cloud/galactic-cni:latest
          command: ["/galactic-cni", "init"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: cni-bin-dir
              mountPath: /host/opt/cni/bin
            - name: cni-net-dir
              mountPath: /host/etc/cni/net.d
            - name: galactic-etc
              mountPath: /host/var/lib/galactic
            - name: galactic-log
              mountPath: /host/var/log/galactic
      containers:
        - name: credential-refresh
          # See the install-cni initContainer above: ":latest" is a
          # placeholder, not a published tag.
          image: ghcr.io/datum-cloud/galactic-cni:latest
          command: ["/galactic-cni", "run"]
          # Documentation only: hostNetwork: true means these are the
          # process's actual listen ports on the node, not something
          # Kubernetes publishes -- containerPort here doesn't change
          # behavior, it just makes both ports (--grpc-health-port/
          # --metrics-port defaults) visible to `kubectl describe pod`
          # instead of only the gRPC one showing up via the probes below.
          ports:
            - name: grpc-health
              containerPort: 5180
              protocol: TCP
            - name: metrics
              containerPort: 9180
              protocol: TCP
          # The BPF/PERFMON/NET_ADMIN/NET_RAW grant and the bpf-fs
          # volumeMount below are required unconditionally by the eBPF
          # uSID datapath's control daemon this container hosts -- see
          # config/galactic-cni/README.md for the per-capability rationale.
          securityContext:
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add:
                - BPF
                - PERFMON
                - NET_ADMIN
                - NET_RAW
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: cni-net-dir
              mountPath: /host/etc/cni/net.d
              readOnly: true
            - name: galactic-etc
              mountPath: /host/var/lib/galactic
            - name: galactic-log
              mountPath: /host/var/log/galactic
            - name: bpf-fs
              mountPath: /sys/fs/bpf
            # radv's DefaultStateDir, shared with galactic-tap on the host --
            # see config/galactic-cni/README.md. Writable: the run daemon
            # removes the record of a tap that has gone missing.
            - name: radv-state-dir
              mountPath: /var/lib/cni/ra
          # BPF map creation under load (image pull + verifier work on a
          # slow node) can outrun readinessProbe/livenessProbe's short
          # initialDelaySeconds, risking a liveness-triggered restart loop
          # before the process finishes initializing. startupProbe reuses
          # the same gRPC health check with a much longer failureThreshold
          # so liveness doesn't start counting until this succeeds once.
          startupProbe:
            grpc:
              port: 5180
              service: ebpf-datapath
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            grpc:
              port: 5180
              service: ebpf-datapath
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 5180
              service: ebpf-datapath
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: cni-bin-dir
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: cni-net-dir
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: galactic-etc
          hostPath:
            path: /var/lib/galactic
            type: DirectoryOrCreate
        - name: galactic-log
          hostPath:
            path: /var/log/galactic
            type: DirectoryOrCreate
        # Backs radv's DefaultStateDir -- see the radv-state-dir volumeMount
        # comment above. DirectoryOrCreate (unlike bpf-fs): a node with no tap
        # attachment yet may not have galactic-tap's /var/lib/cni/ra created
        # at all. Only this subdirectory is mounted, so the rest of the host's
        # CNI state under /var/lib/cni stays out of the container.
        - name: radv-state-dir
          hostPath:
            path: /var/lib/cni/ra
            type: DirectoryOrCreate
        - name: bpf-fs
          # Host bpffs for pinned-map continuity; `Directory` (not
          # DirectoryOrCreate) and its SECURITY NOTE are documented in
          # config/galactic-cni/README.md.
          hostPath:
            path: /sys/fs/bpf
            type: Directory
