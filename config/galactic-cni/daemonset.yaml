apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-cni
  namespace: galactic-system
  labels:
    app.kubernetes.io/name: galactic-cni
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: galactic-cni
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: galactic-cni
    spec:
      serviceAccountName: galactic-cni
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # galactic-cni is more fundamental than any other node component: if
      # evicted under node pressure, no pod (including the CNI's own peers)
      # can schedule on this node at all.
      priorityClassName: system-node-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
      # galactic-cni runs on both compute and edge nodes -- it's the one
      # per-node component every primary role needs (see
      # docs/node-labels.md), so it's opt-in via the independent
      # galactic.datumapis.com/galactic=router flag rather than
      # galactic.datumapis.com/node's primary-role value, the same reason
      # galactic-router (config/galactic-router/overlays/router/
      # daemonset-patch.yaml) keys off the identical flag: enumerating
      # galactic.datumapis.com/node's values here would need editing again
      # every time a new primary role is added, exactly the class of bug
      # galactic.datumapis.com/fabric was already introduced to avoid (see
      # config/fabric-router/daemonset.yaml's own affinity comment).
      # Control-plane nodes are excluded outright since galactic-cni has
      # nothing to do there regardless of this flag.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: galactic.datumapis.com/galactic
                    operator: In
                    values:
                      - router
      initContainers:
        - name: install-cni
          # ":latest" is a placeholder only: no such tag is ever pushed to
          # GHCR. CI resolves and stamps a real version tag here when it
          # publishes the ghcr.io/datum-cloud/galactic-kustomize OCI bundle
          # (see .github/workflows/publish.yaml); applying this manifest
          # directly from a git checkout will fail to pull the image unless
          # you override the tag first — see the README's "Production
          # Deployment" section.
          image: ghcr.io/datum-cloud/galactic-cni:latest
          command: ["/galactic-cni", "init"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: cni-bin-dir
              mountPath: /host/opt/cni/bin
            - name: cni-net-dir
              mountPath: /host/etc/cni/net.d
            - name: galactic-etc
              mountPath: /host/var/lib/galactic
            - name: galactic-log
              mountPath: /host/var/log/galactic
      containers:
        - name: credential-refresh
          # See the install-cni initContainer above: ":latest" is a
          # placeholder, not a published tag.
          image: ghcr.io/datum-cloud/galactic-cni:latest
          command: ["/galactic-cni", "run"]
          # Documentation only: hostNetwork: true means these are the
          # process's actual listen ports on the node, not something
          # Kubernetes publishes -- containerPort here doesn't change
          # behavior, it just makes both ports (--grpc-health-port/
          # --metrics-port defaults) visible to `kubectl describe pod`
          # instead of only the gRPC one showing up via the probes below.
          ports:
            - name: grpc-health
              containerPort: 5180
              protocol: TCP
            - name: metrics
              containerPort: 9180
              protocol: TCP
          # This container hosts the eBPF/TC-BPF uSID datapath's
          # load/attach/pin control daemon (design plan
          # .local/plan-ebpf-xdp-usid-datapath.md §5.4 option (a), §9
          # "Privileges"). BPF/NET_ADMIN below and the bpf-fs volumeMount
          # are required unconditionally by the binary's BPF loader
          # dependencies: the datapath is unconditional (Run's own doc
          # comment calls it "the only forwarding path") -- there is no
          # flag to gate this grant behind, so it takes effect on every
          # node running this manifest.
          #
          # NET_RAW is for internal/plumbing/radv.RunActor: it opens a raw
          # ICMPv6 socket (mdlayher/ndp's Listen, over ip6:ipv6-icmp) to send
          # Router Advertisements and receive Router Solicitations on each
          # tap attachment. Without it, ndp.Listen fails "operation not
          # permitted" for every attachment on every node -- confirmed live,
          # continuously retried and continuously failing, on staging infra.
          securityContext:
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add:
                - BPF
                - NET_ADMIN
                - NET_RAW
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: cni-net-dir
              mountPath: /host/etc/cni/net.d
              readOnly: true
            - name: galactic-etc
              mountPath: /host/var/lib/galactic
            - name: galactic-log
              mountPath: /host/var/log/galactic
            - name: bpf-fs
              mountPath: /sys/fs/bpf
            # internal/plumbing/radv.DefaultStateDir ("/var/lib/cni/ra") is
            # read unprefixed by this container's own Run loop
            # (reconcileRadvActors), unlike HostBinDir/HostConflist/HostEtcDir
            # above which are all deliberately under /host/... -- radv's
            # constant is shared with galactic-tap, a separate binary invoked
            # directly on the host by the kubelet's own CNI exec (never
            # inside this or any other container), so it has to stay the
            # real host-absolute path galactic-tap itself sees. Mirrors
            # bpf-fs below: mount the hostPath at its own literal path
            # instead of relocating it under /host/. Without this mount,
            # reconcileRadvActors always lists an empty/missing directory --
            # every tap attachment galactic-tap records on the host is
            # invisible to it, so no RunActor ever starts and no guest gets
            # an RA or a Router Solicitation reply, silently, on every node.
            - name: radv-state-dir
              mountPath: /var/lib/cni
              readOnly: true
          # BPF map creation under load (image pull + verifier work on a
          # slow node) can outrun readinessProbe/livenessProbe's short
          # initialDelaySeconds, risking a liveness-triggered restart loop
          # before the process finishes initializing. startupProbe reuses
          # the same gRPC health check with a much longer failureThreshold
          # so liveness doesn't start counting until this succeeds once.
          startupProbe:
            grpc:
              port: 5180
              service: ebpf-datapath
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            grpc:
              port: 5180
              service: ebpf-datapath
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 5180
              service: ebpf-datapath
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: cni-bin-dir
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: cni-net-dir
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: galactic-etc
          hostPath:
            path: /var/lib/galactic
            type: DirectoryOrCreate
        - name: galactic-log
          hostPath:
            path: /var/log/galactic
            type: DirectoryOrCreate
        # Backs internal/plumbing/radv.DefaultStateDir ("/var/lib/cni/ra") --
        # see the radv-state-dir volumeMount comment on credential-refresh
        # above. DirectoryOrCreate, same reasoning as cni-bin-dir/cni-net-dir/
        # galactic-etc/galactic-log: a node with no tap attachment yet may not
        # have galactic-tap's /var/lib/cni/ra subdirectory created at all.
        - name: radv-state-dir
          hostPath:
            path: /var/lib/cni
            type: DirectoryOrCreate
        - name: bpf-fs
          # The host's bpffs mount (design plan §4.4/§9: "All maps pinned
          # under /sys/fs/bpf/galactic/"). credential-refresh pins the
          # eBPF uSID datapath's maps under a galactic/ subdirectory of
          # this mount so a container restart reuses the maps already
          # pinned there instead of recreating them empty (pinned-map
          # continuity). `Directory` (not DirectoryOrCreate): bpffs must
          # already be mounted at this path by the host/kubelet node setup
          # for pinning to actually work -- creating a plain directory
          # here if it were missing would silently produce a regular
          # filesystem path instead of a real bpf filesystem, and pinning
          # would then fail at load time with a real, actionable error
          # instead of appearing to succeed.
          #
          # SECURITY NOTE: this mounts the host's entire /sys/fs/bpf, not
          # just the galactic/ subtree this container actually uses --
          # a Kubernetes hostPath volume can't mount a subdirectory that
          # doesn't exist yet (galactic/ is created by this container on
          # first pin, not present beforehand), so this container has
          # read/write visibility into every other pinned BPF object any
          # other process on this host has placed under bpffs, not just
          # its own. This is an accepted, largely inherent tradeoff of
          # bpffs pinning on this platform, not an oversight -- call it
          # out explicitly to a security reviewer rather than let it pass
          # as a footnote.
          hostPath:
            path: /sys/fs/bpf
            type: Directory
