# The provider pods run as masque-provider. galactic-controller --edge binds
# the Galactic Edge provider role and admission policy to it once the
# EdgeProvider is approved, so it needs no RBAC of its own here. The grant
# authority runs as masque-authority and holds no provider token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: masque-provider
  namespace: masque-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: masque-authority
  namespace: masque-system
