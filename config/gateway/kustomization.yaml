# The edge XDP NAT+LB gateway control plane. Unlike config/router/'s
# equivalent kustomization.yaml, this deliberately does NOT include base/
# — the same
# exemption config/fabric/ and (formerly) config/router/gateway/ document
# in root CLAUDE.md, for the same reason: base/daemonset.yaml's
# galactic-gateway container has no generic default for
# GALACTIC_GATEWAY_PUBLIC_INTERFACE/_SRV6_ADDRESS (both required —
# config.GatewayConfig.Validate — and the SRv6 address must be unique per
# gateway node), so applying it as shipped here would produce a
# crash-looping container.
#
# serviceaccount.yaml/rbac.yaml have no such per-node uniqueness problem —
# they're safe and idempotent to apply cluster-wide regardless of how many
# gateway nodes exist or which ones — so this kustomization covers only
# those two. Apply with `kubectl apply -k config/gateway/`, once, before
# applying any per-node overlay of ../base. Like config/router/gateway/
# before it, this whole directory is deliberately NOT part of the root
# config/kustomization.yaml's default resource list: this role is not
# "batteries included" cluster bring-up.
resources:
  - serviceaccount.yaml
  - rbac.yaml
