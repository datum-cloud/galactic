apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-edge
  namespace: galactic-system
  labels:
    app.kubernetes.io/name: galactic-edge
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: galactic-edge
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: galactic-edge
    spec:
      # Opt-in only: a galactic.datumapis.com/node=edge node an operator has
      # labeled galactic.datumapis.com/edge=enabled. Edge attachments join a
      # VPC's canonical host VRF and uSID registration, so the node also
      # needs galactic-cni (galactic.datumapis.com/galactic=router).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: galactic.datumapis.com/node
                    operator: In
                    values:
                      - edge
                  - key: galactic.datumapis.com/edge
                    operator: In
                    values:
                      - enabled
      serviceAccountName: galactic-edge
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
      containers:
        - name: galactic-edge
          # ":latest" is a placeholder: CI stamps the published tag into the
          # galactic-kustomize bundle (.github/workflows/publish.yaml).
          image: ghcr.io/datum-cloud/galactic-edge:latest
          command:
            - /galactic-edge
          args:
            # The fabric's tenant MTU; an overlay sets the real value.
            - --mtu=1500
            - --proc-sys-path=/host/proc/sys
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 9186
              protocol: TCP
            - name: health
              containerPort: 9187
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9187
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9187
            periodSeconds: 10
          # NET_ADMIN for links, addresses, routes and tc attach; SYS_ADMIN
          # to enter provider pods' network namespaces; BPF for the pinned
          # uSID maps.
          securityContext:
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add:
                - NET_ADMIN
                - SYS_ADMIN
                - BPF
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: ownership
              mountPath: /var/lib/galactic-edge/ownership
            - name: cri
              mountPath: /run/containerd/containerd.sock
            # Pod network namespaces the runtime pins, read through the
            # paths CRI reports; HostToContainer so new pods' appear.
            - name: netns
              mountPath: /var/run/netns
              mountPropagation: HostToContainer
            - name: proc-sys
              mountPath: /host/proc/sys
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        # The write-fence records must outlive every writer; never delete
        # or restore this directory while a writer is alive.
        - name: ownership
          hostPath:
            path: /var/lib/galactic-edge/ownership
            type: DirectoryOrCreate
        - name: cri
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: netns
          hostPath:
            path: /var/run/netns
            type: DirectoryOrCreate
        - name: proc-sys
          hostPath:
            path: /proc/sys
            type: Directory
