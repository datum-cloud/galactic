# The node agent reads every EdgeAttachment and writes only status;
# galactic-edge-attachment-status (policies.yaml) limits those writes to its
# own node's attachments and to the Programmed and Released conditions and
# device names. It never creates, updates or deletes an attachment, so it
# cannot remove the finalizer that holds one until it reports Released. It
# reads routes, instances and their leases, services and providers to decide
# each forwarding gate, and writes only a route's closedEpoch, which
# galactic-edge-route-status limits to routes accepted on its own node. It
# records a Warning Event on an attachment it fails to program and on a route
# whose open forwarding gate it closes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: galactic-edge
rules:
  - apiGroups: [galactic.datumapis.com]
    resources: [edgeattachments]
    verbs: [get, list, watch]
  - apiGroups: [galactic.datumapis.com]
    resources: [edgeattachments/status]
    verbs: [get, patch]
  - apiGroups: [galactic.datumapis.com]
    resources: [edgeroutes, edgeinstances, edgeservices, edgeproviders]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch]
  - apiGroups: [galactic.datumapis.com]
    resources: [edgeroutes/status]
    verbs: [get, patch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: galactic-edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: galactic-edge
subjects:
  - kind: ServiceAccount
    name: galactic-edge
    namespace: galactic-system
---
# On a node where an attachment's VPC has no workload, the node agent creates
# the VPC's node state as CNI ADD does: it lists the BGPRouters to find its
# node's, and creates or updates the node's BGPVRFInstance for the VPC under
# the node's Argument lock. Only in the namespace the cell's BGP objects live
# in, which --bgp-namespace names; an agent given another namespace needs this
# Role and RoleBinding there instead. It never deletes one; galactic-router GC
# does.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: galactic-edge-vpc-state
  namespace: galactic-system
rules:
  - apiGroups: [galactic.datumapis.com]
    resources: [bgprouters]
    verbs: [list]
  - apiGroups: [galactic.datumapis.com]
    resources: [bgpvrfinstances]
    verbs: [get, list, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: galactic-edge-vpc-state
  namespace: galactic-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: galactic-edge-vpc-state
subjects:
  - kind: ServiceAccount
    name: galactic-edge
    namespace: galactic-system
