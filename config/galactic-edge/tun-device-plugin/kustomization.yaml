# Kubernetes gives no unprivileged pod /dev/net/tun, and a provider gets no
# hostPath or capability to reach it, so a packet-access provider pod needs
# a device plugin that hands it the device as a resource. This runs
# squat/generic-device-plugin (Apache-2.0) on the nodes that run
# galactic-edge, advertising devic.es/tun; a provider pod requests one
# devic.es/tun.
#
# Needs the galactic-system namespace (config/galactic-system) and the
# kernel's tun driver on each node. The plugin runs privileged, with the
# host's /dev and the kubelet's device-plugin directory. Not part of
# ../kustomization.yaml: only a cell with a PacketAccess provider needs it.
resources:
  - daemonset.yaml
