# Galactic Edge's cell-wide prerequisites, safe and idempotent to apply in
# any cell that has the edge CRDs (config/crd): the node agent's
# ServiceAccount and RBAC, the edge role galactic-controller --edge needs,
# the galactic-edge-provider ClusterRole, and the Galactic Edge
# ValidatingAdmissionPolicies. The policies bind every provider write to
# the pod its token was issued for, every galactic-edge status write to its
# own node, and galactic-controller's RoleBinding writes to the provider
# role; galactic-controller --edge binds the provider policy and role per
# approved provider. Apply this before enabling --edge.
#
# Deliberately NOT included: base/, the node agent DaemonSet. It needs a
# per-cell MTU. Deploy it only where galactic-router from the same release
# or later already runs with the edge-ownership mount
# (config/galactic-router/base): an older router's garbage collection deletes
# the VRFs edge attachments use, and nothing in the agent detects that.
#
# Not part of the root config/kustomization.yaml: Galactic Edge is opt-in.
resources:
  - serviceaccount.yaml
  - rbac.yaml
  - controller-rbac.yaml
  - policies.yaml
