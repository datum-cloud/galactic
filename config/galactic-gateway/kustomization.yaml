# The edge XDP DSR load-balancer control plane. Unlike config/galactic-router/'s
# equivalent kustomization.yaml, this deliberately does NOT include base/:
# base/daemonset.yaml's galactic-gateway container has no generic default
# for GALACTIC_GATEWAY_PUBLIC_INTERFACE (required by
# config.GatewayConfig.Validate, and the uplink name differs per node), so
# applying it as shipped here would produce a crash-looping container.
# GALACTIC_GATEWAY_SRV6_ADDRESS needs no per-node value: left unset, the
# gateway derives it from its node's BGPRouter. config/fabric-router/ has
# the same exemption for the same reason.
#
# serviceaccount.yaml/rbac.yaml have no such per-node uniqueness problem —
# they're safe and idempotent to apply cluster-wide regardless of how many
# gateway nodes exist or which ones — so this kustomization covers only
# those two. Apply with `kubectl apply -k config/galactic-gateway/`, once,
# before applying any per-node overlay of ../base. This whole directory is
# deliberately NOT part of the root config/kustomization.yaml's default
# resource list: this role is not "batteries included" cluster bring-up.
resources:
  - serviceaccount.yaml
  - rbac.yaml
