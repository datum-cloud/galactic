apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-gateway
  namespace: galactic-system
  labels:
    app.kubernetes.io/name: galactic-gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: galactic-gateway
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: galactic-gateway
    spec:
      # Dedicated gateway-role nodes only, opt-in, matching every other
      # role's pattern (config/galactic-router/overlays/default,
      # config/galactic-router/overlays/rr). "edge" here means the actual
      # network edge -- the ingress/egress boundary this gateway sits on --
      # not a per-node compute role (see docs/node-labels.md). Excludes
      # control-plane outright for the same reason those do. See
      # ../kustomization.yaml for why this base is meant to be
      # instantiated once per gateway node rather than applied as-is.
      #
      # Single-container pod: galactic-router used to run here as a
      # second container (see git history prior to this file), so a crash
      # in either binary could take the other's pod down with it despite
      # them already being separate binaries. galactic-router now runs on
      # edge nodes as its own standalone DaemonSet instead, opted in via
      # galactic.datumapis.com/galactic=router alongside this node's
      # galactic.datumapis.com/node=edge (see config/galactic-router/
      # overlays/default/daemonset-patch.yaml) -- fully decoupled at the
      # pod level, not just the binary level.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: galactic.datumapis.com/node
                    operator: In
                    values:
                      - edge
      serviceAccountName: galactic-gateway
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Loss of galactic-gateway blackholes edge traffic through this
      # node, so the scheduler/kubelet must never preempt it for ordinary
      # workloads under node pressure.
      priorityClassName: system-node-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
      containers:
        - name: galactic-gateway
          # ":latest" is a placeholder only: no such tag is ever pushed to
          # GHCR. CI resolves and stamps a real version tag here when it
          # publishes the ghcr.io/datum-cloud/galactic-kustomize OCI bundle
          # (see .github/workflows/publish.yaml); applying this manifest
          # directly from a git checkout will fail to pull the image
          # unless you override the tag first.
          image: ghcr.io/datum-cloud/galactic-gateway:latest
          command:
            - /galactic-gateway
          env:
            - name: GALACTIC_GATEWAY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GALACTIC_GATEWAY_GRPC_HEALTH_PORT
              value: "5181"
            # GALACTIC_GATEWAY_PUBLIC_INTERFACE/_SRV6_ADDRESS are
            # intentionally left unset here: the interface name is
            # deployment-specific and the SRv6 address must be unique per
            # gateway node (no in-cluster mechanism yet derives it
            # automatically — see internal/controller/
            # networkgateway_controller.go's publishSelfAddress doc
            # comment). config.GatewayConfig.Validate requires both —
            # applying this base as-is produces a crash-looping container.
            # The deployer's per-node overlay must set both; see
            # deploy/containerlab/resources/galactic-gateway/ for a
            # worked example (two instances, iad-gateway1/iad-gateway2).
          ports:
            - name: metrics
              containerPort: 8081
              protocol: TCP
            - name: grpc-health
              containerPort: 5181
              protocol: TCP
          # The eBPF XDP loader (map creation/attach) has the same
          # slow-cold-start shape as galactic-cni's — see that manifest's
          # startupProbe comment.
          startupProbe:
            grpc:
              port: 5181
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            grpc:
              port: 5181
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            grpc:
              port: 5181
            initialDelaySeconds: 5
            periodSeconds: 10
          # This container needs CAP_BPF for the bpf() syscalls themselves
          # (program/map creation) on top of NET_ADMIN for the netlink XDP
          # attach — the same pair config/galactic-cni/daemonset.yaml's eBPF-loading
          # container already uses for its own (TC-BPF) program. PERFMON is
          # additionally required: the verifier only allows pointer+scalar
          # arithmetic on packet data/data_end (edgenat.c's DNAT/SNAT
          # header rewrites) when the loading process is perfmon_capable()
          # — without it the verifier falls back to its unprivileged-BPF
          # ruleset and rejects the program with "pointer arithmetic ...
          # prohibited for !root" even though the container runs as root.
          securityContext:
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add:
                - NET_ADMIN
                - BPF
                - PERFMON
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            # edgeattach.PinDir pins every edgenat map under
            # /sys/fs/bpf/galactic-edge, same convention config/galactic-cni/
            # daemonset.yaml's bpf-fs mount documents: bpffs must already be
            # mounted at this host path by the node itself (type: Directory,
            # not DirectoryOrCreate — creating a plain directory here if
            # bpffs weren't mounted would silently produce a regular
            # filesystem path instead of a real bpf filesystem, masking the
            # failure instead of surfacing it at load time). The
            # galactic-edge/ subdirectory itself is created by this
            # container on first pin.
            - name: bpf-fs
              mountPath: /sys/fs/bpf
      volumes:
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
