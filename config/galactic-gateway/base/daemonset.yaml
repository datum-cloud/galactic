apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: galactic-gateway
  namespace: galactic-system
  labels:
    app.kubernetes.io/name: galactic-gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: galactic-gateway
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: galactic-gateway
    spec:
      # Opt-in only: runs on a galactic.datumapis.com/node=edge node an
      # operator has explicitly labeled
      # galactic.datumapis.com/gateway=enabled, and nowhere else. Nothing
      # deploys it automatically -- see ../kustomization.yaml for why this
      # base is meant to be instantiated once per gateway node rather than
      # applied as-is. It is independent of galactic-nat: a node can carry
      # either label or both; on a node with both, each runs from its own
      # slot of the node's shared XDP dispatcher.
      #
      # It shares the edge node with galactic-vrf, whose sidecar pods are
      # placed on galactic.datumapis.com/node=edge nodes too. Compute nodes
      # (node=compute), unlabeled nodes and control-plane nodes never run
      # it. See docs/node-labels.md.
      #
      # Single-container pod: galactic-router used to run here as a
      # second container (see git history prior to this file), so a crash
      # in either binary could take the other's pod down with it despite
      # them already being separate binaries. galactic-router now runs as
      # its own standalone DaemonSet instead, opted in via
      # galactic.datumapis.com/galactic=router, which a gateway node may
      # carry too (see config/galactic-router/overlays/router/
      # daemonset-patch.yaml) -- fully decoupled at the pod level, not just
      # the binary level.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: galactic.datumapis.com/node
                    operator: In
                    values:
                      - edge
                  - key: galactic.datumapis.com/gateway
                    operator: In
                    values:
                      - enabled
      serviceAccountName: galactic-gateway
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Loss of galactic-gateway blackholes edge traffic through this
      # node, so the scheduler/kubelet must never preempt it for ordinary
      # workloads under node pressure.
      priorityClassName: system-node-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
      containers:
        - name: galactic-gateway
          # ":latest" is a placeholder only: no such tag is ever pushed to
          # GHCR. CI resolves and stamps a real version tag here when it
          # publishes the ghcr.io/datum-cloud/galactic-kustomize OCI bundle
          # (see .github/workflows/publish.yaml); applying this manifest
          # directly from a git checkout will fail to pull the image
          # unless you override the tag first.
          image: ghcr.io/datum-cloud/galactic-gateway:latest
          command:
            - /galactic-gateway
          env:
            - name: GALACTIC_GATEWAY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GALACTIC_GATEWAY_GRPC_HEALTH_PORT
              value: "5181"
            # An unprivileged container gets /proc/sys read-only, so the
            # forwarding sysctls the datapath's FIB lookup needs are written
            # through the host's /proc/sys/net, mounted below. hostNetwork
            # makes those writes land in the node's own network namespace.
            # A sysctl that still does not read 1 fails startup rather than
            # leaving a datapath that drops every packet (#586).
            - name: GALACTIC_GATEWAY_PROC_SYS_PATH
              value: /host/proc/sys
            # GALACTIC_GATEWAY_INTERNAL_INTERFACES is also left unset,
            # for the same deployment-specific reason. It names the
            # compute-facing interfaces, comma-separated, whose
            # VIP-sourced replies this node forwards before netfilter:
            # where the compute tier routes through this node, a
            # backend's reply crosses it as ordinary forwarded traffic
            # that connection tracking has no forward half to judge
            # against, and kube-proxy's KUBE-FORWARD chain drops it as
            # invalid. Unlike the two below it is optional — a node with
            # no compute tier behind it leaves it unset and attaches no
            # return program.
            #
            # GALACTIC_GATEWAY_XDP_ATTACH is left at its default,
            # "dispatch": the programs run from the node's shared, pinned
            # XDP dispatcher, so a restart detaches nothing and the egress
            # shard can share the uplinks. "direct" attaches them
            # unpinned instead. GALACTIC_GATEWAY_DATAPATH_ENABLED, default
            # "true", turns the datapath off and withdraws this node's VIPs
            # without removing the pod. See internal/config/gateway.go.
            #
            # GALACTIC_GATEWAY_PUBLIC_INTERFACE is intentionally left unset
            # here: the interface name is deployment-specific, and
            # config.GatewayConfig.Validate requires it, so applying this
            # base as-is produces a crash-looping container. The deployer's
            # per-node overlay must set it; see
            # deploy/containerlab/resources/galactic-gateway/ for a worked
            # example (four instances, one per edge node).
            #
            # GALACTIC_GATEWAY_SRV6_ADDRESS is left unset too, but needs no
            # per-node value: the gateway derives this node's SRv6
            # encapsulation source from its BGPRouter at startup. Set it
            # only to override that.
          ports:
            - name: metrics
              containerPort: 8081
              protocol: TCP
            - name: grpc-health
              containerPort: 5181
              protocol: TCP
          # The eBPF XDP loader (map creation/attach) has the same
          # slow-cold-start shape as galactic-cni's — see that manifest's
          # startupProbe comment. Startup also covers the wait for this
          # node's BGPRouter, when GALACTIC_GATEWAY_SRV6_ADDRESS is unset
          # (#707), including retries of a failed BGPRouter list (#797),
          # so the threshold allows 10 minutes rather than the
          # loader's few seconds. Past that, the container restarts and
          # waits again.
          startupProbe:
            grpc:
              port: 5181
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            grpc:
              port: 5181
            initialDelaySeconds: 15
            periodSeconds: 20
          # Readiness is its own gRPC health service: it also requires the
          # datapath on every interface it resolves, which can change after
          # startup. Liveness stays on the overall service so a missing
          # interface takes the pod out of ready without restarting it.
          readinessProbe:
            grpc:
              port: 5181
              service: readiness
            initialDelaySeconds: 5
            periodSeconds: 10
          # This container needs CAP_BPF for the bpf() syscalls themselves
          # (program/map creation) on top of NET_ADMIN for the netlink XDP
          # attach — the same pair config/galactic-cni/daemonset.yaml's
          # eBPF-loading container already uses for its own (TC-BPF) program.
          # PERFMON is additionally required: the verifier only allows
          # pointer+scalar arithmetic on packet data/data_end (edgedsr.c's
          # header parsing and its data_end - data byte count) when the
          # loading process is perfmon_capable(). Without it the verifier
          # falls back to its unprivileged-BPF ruleset and rejects the program
          # with "pointer arithmetic ... prohibited for !root" even though the
          # container runs as root.
          securityContext:
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add:
                - NET_ADMIN
                - BPF
                - PERFMON
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            # edgeattach.PinDir pins every edge map under
            # /sys/fs/bpf/galactic-edge, same convention config/galactic-cni/
            # daemonset.yaml's bpf-fs mount documents: bpffs must already be
            # mounted at this host path by the node itself (type: Directory,
            # not DirectoryOrCreate — creating a plain directory here if
            # bpffs weren't mounted would silently produce a regular
            # filesystem path instead of a real bpf filesystem, masking the
            # failure instead of surfacing it at load time). The
            # galactic-edge/ subdirectory itself is created by this
            # container on first pin.
            - name: bpf-fs
              mountPath: /sys/fs/bpf
            # The host's net sysctls, writable, for the forwarding settings
            # galactic-gateway sets. Only net.*: the rest of /proc/sys stays
            # read-only.
            - name: host-proc-sys-net
              mountPath: /host/proc/sys/net
      volumes:
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: host-proc-sys-net
          hostPath:
            path: /proc/sys/net
            type: Directory
