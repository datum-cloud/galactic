# The gateway pod's shared base — see ../kustomization.yaml
# for why this isn't applied as-is: this is meant to be instantiated once
# per gateway node by a further overlay that pins it to one node
# (kubernetes.io/hostname) and sets that node's own
# GALACTIC_GATEWAY_PUBLIC_INTERFACE/_SRV6_ADDRESS values. See
# deploy/containerlab/resources/galactic-gateway/ for a worked example
# (four instances, one per edge node, each overlay named for its node).
resources:
  - daemonset.yaml
