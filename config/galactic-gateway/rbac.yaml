# The edge XDP NAT+LB gateway control plane's own RBAC. This ClusterRole
# covers only what NetworkGatewayReconciler/NetworkRuleReconciler
# (internal/controller/networkgateway_controller.go,
# internal/controller/networkrule_controller.go) actually touch.
#
# bgprouters (get/list/watch) is included even though neither reconciler
# imports internal/runtime or internal/reconcile (this binary needs no
# BGP client of its own): internal/controller/usidresolver.go's
# buildBackendSIDIndex lists BGPRouter CRDs directly
# (alongside BGPAdvertisement) to resolve a NetworkRule backend's SRv6
# uSID. "No BGP client" and "no BGPRouter read access needed" are
# different claims — only the first is true.
#
# galactic-gateway is a single-container pod (config/galactic-gateway/base/
# daemonset.yaml) -- galactic-router runs alongside it on edge nodes as its
# own standalone DaemonSet with its own ServiceAccount/ClusterRole
# (config/galactic-router/rbac.yaml), not co-located in this pod, so this
# ClusterRole doesn't need to carry any of galactic-router's permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: galactic-gateway
rules:
  - apiGroups: ["network.datumapis.com"]
    resources:
      - networkgateways
      - networkrules
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["network.datumapis.com"]
    resources:
      - networkgateways/status
      - networkrules/status
    verbs: ["get", "update", "patch"]
  # Full CRUD: NetworkGatewayReconciler creates one BGPAdvertisement per VIP
  # address family per NetworkRule it serves plus one for its own
  # SRv6Address, and NetworkRuleReconciler deletes them on rule teardown
  # (internal/controller/networkgateway_controller.go,
  # internal/controller/networkrule_controller.go).
  - apiGroups: ["network.datumapis.com"]
    resources:
      - bgpadvertisements
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["network.datumapis.com"]
    resources:
      - bgprouters
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: galactic-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: galactic-gateway
subjects:
  - kind: ServiceAccount
    name: galactic-gateway
    namespace: galactic-system
