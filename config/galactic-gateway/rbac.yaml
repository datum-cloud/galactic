# The edge XDP NAT+LB gateway control plane's own RBAC. This ClusterRole
# covers only what NetworkGatewayReconciler/NetworkRuleReconciler
# (internal/controller/networkgateway_controller.go,
# internal/controller/networkrule_controller.go) actually touch.
#
# bgprouters (get/list/watch) is included even though neither reconciler
# imports internal/runtime or internal/reconcile (this binary needs no
# BGP client of its own): internal/controller/usidresolver.go's
# buildBackendSIDIndex lists BGPRouter CRDs directly
# (alongside BGPAdvertisement) to resolve a NetworkRule backend's SRv6
# uSID. "No BGP client" and "no BGPRouter read access needed" are
# different claims — only the first is true.
#
# One Kubernetes Pod has exactly one ServiceAccount identity, so the
# two-container gateway pod (galactic-router + galactic-gateway,
# config/galactic-gateway/base/daemonset.yaml) cannot literally run one container
# per ServiceAccount the way two separate DaemonSets could. The
# ClusterRoleBinding below therefore binds the galactic-gateway
# ServiceAccount to *both* this ClusterRole and the BGP-only galactic-router
# ClusterRole from config/galactic-router/rbac.yaml — the smallest deviation
# from a literal per-container RBAC split that Kubernetes allows.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: galactic-gateway
rules:
  - apiGroups: ["network.datumapis.com"]
    resources:
      - networkgateways
      - networkrules
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["network.datumapis.com"]
    resources:
      - networkgateways/status
      - networkrules/status
    verbs: ["get", "update", "patch"]
  # Full CRUD: NetworkGatewayReconciler creates one BGPAdvertisement per VIP
  # address family per NetworkRule it serves plus one for its own
  # SRv6Address, and NetworkRuleReconciler deletes them on rule teardown
  # (internal/controller/networkgateway_controller.go,
  # internal/controller/networkrule_controller.go).
  - apiGroups: ["network.datumapis.com"]
    resources:
      - bgpadvertisements
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["network.datumapis.com"]
    resources:
      - bgprouters
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: galactic-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: galactic-gateway
subjects:
  - kind: ServiceAccount
    name: galactic-gateway
    namespace: galactic-system
---
# See this file's header comment: the galactic-gateway ServiceAccount also
# needs the BGP-only galactic-router ClusterRole, since the
# galactic-router container co-located in the same two-container pod
# (config/galactic-gateway/base/daemonset.yaml) runs under this same pod-level
# identity. Requires config/galactic-router/rbac.yaml to be applied too — true of
# every gateway node deployment already, since a bare galactic-gateway
# container with no co-located galactic-router container advertising this
# node's tenant BGP session is not a supported configuration.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: galactic-gateway-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: galactic-router
subjects:
  - kind: ServiceAccount
    name: galactic-gateway
    namespace: galactic-system
